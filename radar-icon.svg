<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="70%" cy="28%" r="85%">
      <stop offset="0" stop-color="#1d3312"/><stop offset=".45" stop-color="#0b120d"/><stop offset="1" stop-color="#05070a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9dff2e" stop-opacity=".55"/><stop offset=".5" stop-color="#9dff2e" stop-opacity=".16"/><stop offset="1" stop-color="#9dff2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="can" x1="0" x2="1">
      <stop offset="0" stop-color="#050505"/><stop offset=".3" stop-color="#2e3136"/><stop offset=".45" stop-color="#0d0e10"/><stop offset="1" stop-color="#050505"/>
