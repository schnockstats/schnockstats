  <g stroke="#1b120c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M352 196 C350 180 360 174 372 176 L412 184 C426 188 430 200 426 214 L420 240 C416 252 404 256 392 254 L364 248 C352 246 346 236 348 224 Z" fill="#f4c7aa"/>
