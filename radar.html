/* ==========================================================================
   Rockstar Radar: Bühne. Schwarz und Gold mit Sternen in allen Sortenfarben,
   schwenkenden Scheinwerfern und einem Equalizer als Bühnenkante.
   "Original": Schwarz, Gold. "Punched": Beerenrot, Pink und Gelb.
   ========================================================================== */

html.radar-rockstar {
  --mr-bg: #070707;
  --mr-panel: #111110;
  --mr-panel-2: #181816;
  --mr-card-a: #161614;
  --mr-line: #2a2823;
  --mr-line-strong: #454036;
  --mr-fg: #f7f3e6;
  --mr-strong: #ffffff;
  --mr-dim: #b3ab96;
  --mr-faint: #7f7867;
  --mr-claim: #e8e0c8;
  --mr-desc: #c7bfa8;
  --mr-street: #f2ecd9;
  --mr-accent: #f7c600;
  --mr-accent-soft: #ffdb4d;
  --mr-on-accent: #0a0a0a;
  --rs-gold: #f7c600;
  --rs-gold-dark: #9c7a00;
  --rs-lime: #8dff2a;
  --rs-orange: #ff7a00;
  --rs-pink: #ff2d87;
  --rs-blue: #2ec5ff;
  --rs-violet: #9b5bff;
  --mr-tiles: invert(1) hue-rotate(180deg) grayscale(.6) sepia(.35) brightness(.78) contrast(.95);
}
html.radar-rockstar[data-mr="ultra"] {
  color-scheme: dark;
  --mr-bg: #1a0512;
  --mr-panel: #240a1a;
  --mr-panel-2: #2e0d22;
  --mr-card-a: #2b0c20;
  --mr-line: #4a1636;
  --mr-line-strong: #6b2150;
  --mr-fg: #ffeef7;
  --mr-strong: #ffffff;
  --mr-dim: #dcaec8;
  --mr-faint: #a57a93;
  --mr-claim: #ffd9ec;
  --mr-desc: #ecc3d9;
  --mr-street: #ffe6f2;
  --mr-accent: #ff2d87;
  --mr-accent-soft: #ff6fab;
  --mr-on-accent: #ffffff;
  --rs-gold: #ffe600;
  --rs-gold-dark: #ff2d87;
  --mr-tiles: invert(1) hue-rotate(150deg) brightness(.72) contrast(.95) saturate(.8);
}

html.radar-rockstar .nrg-hero,
html.radar-rockstar[data-mr="ultra"] .nrg-hero {
  background:
    radial-gradient(70% 55% at 50% 118%, color-mix(in srgb, var(--rs-gold) 30%, transparent), transparent 70%),
    linear-gradient(180deg, color-mix(in srgb, var(--mr-bg) 70%, #000) 0%, var(--mr-bg) 100%);
  border-bottom: 0;
  box-shadow: none;
  padding-bottom: 140px;
}
html.radar-rockstar[data-mr="ultra"] .nrg-hero {
  background:
    radial-gradient(70% 55% at 50% 118%, rgba(255, 45, 135, .35), transparent 70%),
    radial-gradient(40% 60% at 95% 0%, rgba(255, 230, 0, .16), transparent 70%),
    linear-gradient(180deg, #0f020a 0%, #1a0512 100%);
}
html.radar-rockstar[data-mr="ultra"] .nrg-hero::before { content: none; }
html.radar-rockstar .nrg-grid,
html.radar-rockstar[data-mr="ultra"] .nrg-grid {
  background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--rs-gold) 6%, transparent) 0 1px, transparent 1px 38px);
  transform: none; animation: none;
}
/* Schriftzug: Gold mit Kante, die zweite Zeile flackert wie ein Bühnenschild */
html.radar-rockstar .nrg-title span:first-child,
html.radar-rockstar[data-mr="ultra"] .nrg-title span:first-child { color: #ffffff; text-shadow: 0 3px 0 #000, 0 0 18px rgba(255,255,255,.15); }
html.radar-rockstar .nrg-title span:last-child,
html.radar-rockstar[data-mr="ultra"] .nrg-title span:last-child {
  color: var(--rs-gold);
  text-shadow: 0 4px 0 var(--rs-gold-dark), 0 0 34px color-mix(in srgb, var(--rs-gold) 60%, transparent);
}
html.radar-rockstar .energy .nrg-title span:last-child { animation: slamIn 520ms cubic-bezier(.16,1.1,.3,1) 130ms backwards, neonFlicker 6s steps(1) 1s infinite; }
@keyframes neonFlicker { 0%, 100% { opacity: 1; } 91% { opacity: .35; } 92% { opacity: 1; } 94% { opacity: .5; } 95% { opacity: 1; } }
html.radar-rockstar .nrg-title, html.radar-rockstar .nrg-claim, html.radar-rockstar .nrg-offline { z-index: 3; }
html.radar-rockstar .nrg-bigprice,
html.radar-rockstar[data-mr="ultra"] .nrg-bigprice { -webkit-text-stroke-color: color-mix(in srgb, var(--rs-gold) 45%, transparent); z-index: 2; }

/* Scheinwerfer: zwei Lichtkegel schwenken von oben über die Bühne */
.nrg-stage { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.nrg-stage .beam {
  position: absolute; top: -20px; width: 46%; height: 150%;
  background: conic-gradient(from 168deg at 50% 0%, transparent 0deg, color-mix(in srgb, var(--c) 30%, transparent) 10deg, color-mix(in srgb, var(--c) 12%, transparent) 18deg, transparent 24deg);
  transform-origin: 50% 0%;
  mix-blend-mode: screen;
  animation: beamSwing var(--d) ease-in-out var(--delay) infinite alternate;
}
.nrg-stage .beam.b1 { left: -8%; --c: var(--rs-gold); --d: 5.5s; --delay: 0s; --from: -28deg; --to: 18deg; }
.nrg-stage .beam.b2 { right: -8%; --c: var(--rs-pink); --d: 6.5s; --delay: -2s; --from: 26deg; --to: -20deg; }
.nrg-stage .beam.b3 { left: 27%; --c: var(--rs-blue); --d: 7.5s; --delay: -4s; --from: -16deg; --to: 16deg; opacity: .75; }
@keyframes beamSwing { from { transform: rotate(var(--from)); } to { transform: rotate(var(--to)); } }

/* Sterne in allen Sortenfarben: blitzen auf, drehen sich und verglühen */
.nrg-stage .st {
  position: absolute; left: var(--x); top: var(--y);
  width: var(--s); height: var(--s);
  background: var(--c);
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  filter: drop-shadow(0 0 6px var(--c));
  opacity: 0;
  animation: starFlash var(--d) ease-in-out var(--delay) infinite;
}
@keyframes starFlash {
  0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); }
  18% { opacity: 1; transform: scale(1.15) rotate(72deg); }
  30% { opacity: .9; transform: scale(1) rotate(100deg); }
  55% { opacity: 0; transform: scale(.4) rotate(200deg) translateY(12px); }
}

/* Equalizer als Bühnenkante */
.nrg-eq {
  position: absolute; left: 0; right: 0; bottom: 0; height: 92px; z-index: 1;
  display: flex; align-items: flex-end; gap: 4px; padding: 0 4px;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}
.nrg-eq i {
  flex: 1; height: 100%; border-radius: 3px 3px 0 0;
  background: linear-gradient(0deg, var(--rs-gold-dark), var(--rs-gold) 55%, #fff6c2);
  transform-origin: 50% 100%;
  animation: eqBounce var(--d) ease-in-out var(--delay) infinite alternate;
  opacity: .9;
}
.nrg-eq i:nth-child(7n+3) { background: linear-gradient(0deg, #7a1040, var(--rs-pink)); }
.nrg-eq i:nth-child(9n+5) { background: linear-gradient(0deg, #2d6a00, var(--rs-lime)); }
.nrg-eq i:nth-child(11n+8) { background: linear-gradient(0deg, #7a3a00, var(--rs-orange)); }
.nrg-eq i:nth-child(13n+1) { background: linear-gradient(0deg, #0b4a66, var(--rs-blue)); }
@keyframes eqBounce { from { transform: scaleY(var(--lo)); } to { transform: scaleY(var(--hi)); } }

/* ---------- Laufband: Gold mit schwarzer Schrift, bei Punched Pink ---------- */
html.radar-rockstar .nrg-ticker { background: linear-gradient(90deg, #c99a00, #ffd500 30%, #fff1a0 50%, #ffd500 70%, #c99a00); color: #0a0a0a; border-bottom-color: #000; }
html.radar-rockstar[data-mr="ultra"] .nrg-ticker { background: linear-gradient(90deg, #ff2d87, #ff6a3d 50%, #ffe600); color: #1a0512; border-bottom-color: #1a0512; }

/* ---------- Karten: schwarzes Case mit goldener Kante und Sternen ---------- */
html.radar-rockstar .can,
html.radar-rockstar[data-mr="ultra"] .can { border-top: 3px solid var(--rs-gold); box-shadow: none; }
html.radar-rockstar .can.is-top,
html.radar-rockstar[data-mr="ultra"] .can.is-top { border-color: var(--rs-gold); box-shadow: 0 0 0 1px color-mix(in srgb, var(--rs-gold) 45%, transparent), 0 18px 44px color-mix(in srgb, var(--rs-gold) 16%, transparent); }
html.radar-rockstar .can-claw { top: 18px; right: 104px; gap: 5px; opacity: .9; align-items: center; }
html.radar-rockstar .can-claw i,
html.radar-rockstar[data-mr="ultra"] .can-claw i,
html.radar-rockstar[data-mr="ultra"] .can.is-top .can-claw i {
  width: 16px; height: 16px; transform: none; background: var(--rs-gold);
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  animation: cardStar 3s ease-in-out infinite;
}
html.radar-rockstar .can-claw i:nth-child(2) { width: 22px; height: 22px; background: var(--rs-pink) !important; animation-delay: .4s; }
html.radar-rockstar .can-claw i:nth-child(3) { width: 12px; height: 12px; background: var(--rs-lime) !important; animation-delay: .8s; }
@keyframes cardStar { 0%, 100% { transform: rotate(0) scale(1); } 50% { transform: rotate(36deg) scale(1.15); } }
html.radar-rockstar .can-top span { background: var(--rs-gold); color: #0a0a0a; }
html.radar-rockstar[data-mr="ultra"] .can-top span { background: var(--rs-pink); color: #fff; }
html.radar-rockstar .can-price { text-shadow: 0 0 22px color-mix(in srgb, var(--rs-gold) 40%, transparent); }
html.radar-rockstar .nrg-section h3 { border-left-color: var(--rs-gold); }
html.radar-rockstar[data-mr="ultra"] .nrg-section h3 { border-left-color: var(--rs-pink); }
html.radar-rockstar .mr-switch button[data-mr-theme="original"][aria-pressed="true"] { background: #f7c600; color: #0a0a0a; box-shadow: 0 0 0 2px rgba(247, 198, 0, .35); }
html.radar-rockstar .mr-switch button[data-mr-theme="ultra"][aria-pressed="true"] { background: linear-gradient(90deg, #ff2d87, #ff6a3d); color: #fff; box-shadow: 0 0 0 2px rgba(255, 45, 135, .35); }

@media (max-width: 740px) {
  html.radar-rockstar .nrg-hero, html.radar-rockstar[data-mr="ultra"] .nrg-hero { padding-bottom: 112px; }
  .nrg-eq { height: 70px; gap: 3px; }
  .nrg-eq i:nth-child(n+25) { display: none; }
  .nrg-stage .st:nth-of-type(n+12) { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .nrg-stage .beam, .nrg-eq i, html.radar-rockstar .can-claw i, html.radar-rockstar .energy .nrg-title span:last-child { animation: none; }
  .nrg-stage .st { display: none; }
}

/* ==========================================================================
   Red Bull Radar: Blau und Silber im Rautenmuster der Dose, eine gelbe Sonne
   geht hinter dem Schriftzug auf, Flügelstriche fliegen schräg nach oben.
   "Original": Nachtblau, Silber, Rot, Gelb. "Sugarfree": helles Himmelblau.

html.radar-redbull {
  --mr-bg: #0a1633;
  --mr-panel: #0f1e42;
  --mr-panel-2: #14264f;
  --mr-card-a: #13244d;

  --mr-line-strong: #34508b;
  --mr-fg: #eef3fb;
  --mr-strong: #ffffff;
  --mr-dim: #a9b8d4;
  --mr-faint: #7688ab;
  --mr-claim: #d8e2f3;
  --mr-desc: #b9c7df;
  --mr-street: #e8eef9;
  --mr-accent: #ffc906;
  --mr-accent-soft: #ffdc5c;
  --mr-on-accent: #0a1633;
  --rb-red: #e21b4d;

html.radar-redbull[data-mr="ultra"] {

  --mr-panel: #ffffff;

  --mr-card-a: #ffffff;
  --mr-line: #c8dcec;
  --mr-line-strong: #a7c3db;
  --mr-fg: #0c1d3d;
  --mr-strong: #07142e;
  --mr-dim: #4a5f80;
  --mr-faint: #7d8fab;
  --mr-claim: #1f3357;
  --mr-desc: #3a4e70;
  --mr-street: #0c1d3d;
  --mr-accent: #1685d6;
  --mr-accent-soft: #5cb0ec;
  --mr-on-accent: #ffffff;
  --rb-red: #d4143f;
  --rb-sun: #ffbf00;
  --rb-blue: #1685d6;
  --rb-silver: #8fa1b8;

}

html.radar-redbull .nrg-hero {
  background:

}
html.radar-redbull[data-mr="ultra"] .nrg-hero {
  background:
    radial-gradient(40% 70% at 88% 22%, rgba(255, 191, 0, .3), transparent 70%),

html.radar-redbull .nrg-grid,
html.radar-redbull[data-mr="ultra"] .nrg-grid {

  animation-duration: 30s;
}
html.radar-redbull[data-mr="ultra"] .nrg-hero::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0;

}
/* Schriftzug: Silber und Rot mit gelbem Rand, wie das Etikett ohne Logo */
html.radar-redbull .nrg-title span:first-child { color: var(--rb-silver); text-shadow: 0 3px 0 #06102a; }
html.radar-redbull[data-mr="ultra"] .nrg-title span:first-child { color: #0a1633; text-shadow: 0 3px 0 rgba(255,255,255,.8); }
html.radar-redbull .nrg-title span:last-child,
html.radar-redbull[data-mr="ultra"] .nrg-title span:last-child {
  color: var(--rb-red);
  text-shadow: 0 4px 0 var(--rb-sun), 0 0 26px rgba(226, 27, 77, .35);
}
html.radar-redbull .nrg-title, html.radar-redbull .nrg-claim, html.radar-redbull .nrg-offline { z-index: 3; }
html.radar-redbull .nrg-bigprice,
html.radar-redbull[data-mr="ultra"] .nrg-bigprice { -webkit-text-stroke-color: color-mix(in srgb, var(--rb-sun) 45%, transparent); z-index: 2; }

/* Sonne mit kreisenden Strahlen */
.nrg-sun {
  position: absolute; z-index: 1; pointer-events: none;
  right: max(-40px, calc(50vw - 700px)); top: 30px;
  width: 300px; height: 300px;
  animation: sunRise 1.4s cubic-bezier(.2, .9, .3, 1) backwards;
}
.nrg-sun::before {
  content: ""; position: absolute; inset: -40%;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rb-sun) 26%, transparent) 0 6deg, transparent 6deg 18deg);
  -webkit-mask-image: radial-gradient(circle, #000 30%, transparent 68%);
  mask-image: radial-gradient(circle, #000 30%, transparent 68%);
  animation: spin 60s linear infinite;
}
.nrg-sun::after {
  content: ""; position: absolute; inset: 22%; border-radius: 50%;
  background: radial-gradient(circle at 40% 38%, #fff3b0 0 12%, var(--rb-sun) 45%, #ff9d00 100%);
  box-shadow: 0 0 60px color-mix(in srgb, var(--rb-sun) 70%, transparent), 0 0 140px color-mix(in srgb, var(--rb-sun) 35%, transparent);
  animation: sunPulse 4s ease-in-out infinite;
}
@keyframes sunRise { from { transform: translateY(120px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sunPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* Flügelstriche: zwei geschwungene Federn je Flug, schräg nach oben */
.nrg-wings { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.nrg-wings i {
  position: absolute; left: var(--x); bottom: -40px;
  width: var(--w); height: 26px; opacity: 0;

.nrg-wings i::before, .nrg-wings i::after {

  background: linear-gradient(90deg, transparent, var(--c) 40%, #ffffff);

.nrg-wings i::before { top: 4px; }
.nrg-wings i::after { top: 14px; left: 22%; }
@keyframes wingFly {
  0%   { opacity: 0; transform: translate(0, 0) rotate(-24deg) scaleX(.4); }
  12%  { opacity: 1; transform: translate(40px, -40px) rotate(-24deg) scaleX(1); }

/* ==========================================================================
   Monster neu: Radarschirm mit Filial-Blips, Krallenriss quer über den Kopf
   und ein Glitch im Schriftzug, alles im selben 7-Sekunden-Takt wie der Blitz.
   ========================================================================== */
.nrg-scope {
  position: absolute; z-index: 1; pointer-events: none;
  top: max(58px, calc(env(safe-area-inset-top) + 40px));
  right: max(-40px, calc(50vw - 690px));
  width: 300px; height: 300px; border-radius: 50%;
  background:
    radial-gradient(circle, transparent 0 calc(25% - 1px), color-mix(in srgb, var(--mr-accent) 30%, transparent) 25% calc(25% + 1px), transparent calc(25% + 1.5px) calc(50% - 1px), color-mix(in srgb, var(--mr-accent) 30%, transparent) 50% calc(50% + 1px), transparent calc(50% + 1.5px)),
    linear-gradient(90deg, transparent calc(50% - .5px), color-mix(in srgb, var(--mr-accent) 22%, transparent) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(0deg, transparent calc(50% - .5px), color-mix(in srgb, var(--mr-accent) 22%, transparent) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)),
    radial-gradient(circle, color-mix(in srgb, var(--mr-accent) 8%, transparent), transparent 70%);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--mr-accent) 45%, transparent), 0 0 40px color-mix(in srgb, var(--mr-accent) 18%, transparent), inset 0 0 50px color-mix(in srgb, var(--mr-accent) 12%, transparent);
  animation: scopeIn 900ms cubic-bezier(.2, .9, .3, 1.2) backwards;
}
@keyframes scopeIn { from { transform: scale(.4) rotate(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
.nrg-scope .sweep {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0 290deg, color-mix(in srgb, var(--mr-accent) 12%, transparent) 320deg, color-mix(in srgb, var(--mr-accent) 55%, transparent) 359deg, var(--mr-accent) 360deg);
  animation: spin 4s linear infinite;
}
.nrg-scope .sweep::after {
  content: ""; position: absolute; left: calc(50% - 1px); top: 0; width: 2px; height: 50%;
  background: linear-gradient(0deg, transparent, #ffffff); box-shadow: 0 0 10px var(--mr-accent);
}
.nrg-scope .blip {
  position: absolute; left: var(--bx); top: var(--by);
  width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
  background: #ffffff; box-shadow: 0 0 0 3px var(--mr-accent), 0 0 16px var(--mr-accent);
  opacity: 0;
  animation: blip 4s ease-out var(--bd) infinite;
}
@keyframes blip {
  0%   { opacity: 1; transform: scale(1.5); box-shadow: 0 0 0 3px var(--mr-accent), 0 0 22px 4px var(--mr-accent); }
  12%  { transform: scale(1); }
  70%  { opacity: .25; }
  100% { opacity: 0; transform: scale(.8); }
}
.nrg-scope .scope-label {
  position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%);
  font: italic 13px/1 "Anton", system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap;
  color: var(--mr-accent); text-shadow: 0 0 10px color-mix(in srgb, var(--mr-accent) 60%, transparent);
}

/* Krallenriss: drei gezackte Schlitze reißen quer über den Kopf und verglühen */
.nrg-claws { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.nrg-claws svg { width: 100%; height: 100%; }
.nrg-claws path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1600; stroke-dashoffset: 1600; }
.nrg-claws .cg { stroke: var(--mr-accent); stroke-width: 22; filter: blur(7px); opacity: .7; }
.nrg-claws .cc { stroke: #ffffff; stroke-width: 5; }
.nrg-claws path { animation: clawRip 7s cubic-bezier(.2, .8, .2, 1) 1.5s infinite; }
.nrg-claws .k2 { animation-delay: 1.58s; }
.nrg-claws .k3 { animation-delay: 1.66s; }
@keyframes clawRip {
  0%       { stroke-dashoffset: 1600; opacity: 1; }
  4%       { stroke-dashoffset: 0; opacity: 1; }
  22%      { stroke-dashoffset: 0; opacity: .85; }
  34%      { stroke-dashoffset: 0; opacity: 0; }
  34.1%, 100% { stroke-dashoffset: 1600; opacity: 0; }
}
html.radar-monster .nrg-hero::after { animation: clawFlash 7s ease-out 1.5s infinite; }
@keyframes clawFlash { 0% { opacity: 0; } 2% { opacity: 1; } 5% { opacity: .15; } 7% { opacity: .6; } 14%, 100% { opacity: 0; } }
/* Schriftzug zuckt beim Riss und zerfällt kurz in Farbkanäle */
html.radar-monster .energy .nrg-title { animation: clawShake 7s linear 1.5s infinite; }
@keyframes clawShake {
  0%, 7%, 100% { transform: none; }
  1% { transform: translate(-6px, 3px) skewX(-4deg); }
  2% { transform: translate(5px, -2px); }
  3% { transform: translate(-3px, 1px) skewX(3deg); }
  4.5% { transform: translate(2px, 0); }
}
html.radar-monster .nrg-title span:first-child { animation: slamIn 520ms cubic-bezier(.16,1.1,.3,1) backwards, glitchSplit 7s steps(1) 1.5s infinite; }
@keyframes glitchSplit {
  0%, 8%, 100% { text-shadow: none; clip-path: none; }
  1% { text-shadow: -5px 0 #ff2bd6, 5px 0 #00f0ff; clip-path: inset(10% 0 45% 0); }
  2% { text-shadow: 4px 0 #ff2bd6, -4px 0 #00f0ff; clip-path: inset(55% 0 5% 0); }
  3% { text-shadow: -3px 0 #ff2bd6, 3px 0 #00f0ff; clip-path: none; }
  5% { text-shadow: 2px 0 color-mix(in srgb, var(--mr-accent) 80%, transparent); }
}
html.radar-monster[data-mr="ultra"] .nrg-claws .cc { stroke: #0b5f86; }
html.radar-monster[data-mr="ultra"] .nrg-claws .cg { opacity: .45; }

  .nrg-scope { width: 170px; height: 170px; right: -34px; top: max(70px, calc(env(safe-area-inset-top) + 56px)); opacity: .8; }
  .nrg-scope .scope-label { display: none; }

/* ==========================================================================
   Pepsi neu: rollender Globus mit Pulsringen und ein Kronkorken, der
   regelmäßig mit einer Perlenfontäne aus den Wellen knallt.
   ========================================================================== */
.nrg-globe {
  position: absolute; z-index: 1; pointer-events: none;
  top: max(84px, calc(env(safe-area-inset-top) + 66px));
  right: max(10px, calc(50vw - 660px));
  width: 250px; height: 250px;
  animation: globeIn 1s cubic-bezier(.2, .9, .3, 1.15) backwards;
}
@keyframes globeIn { from { transform: translateY(80px) scale(.5) rotate(-120deg); opacity: 0; } to { transform: none; opacity: 1; } }
.nrg-globe .gl-ball { position: absolute; inset: 0; animation: globeBob 5s ease-in-out infinite; }
.nrg-globe svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 12px 30px rgba(42, 115, 255, .45)); }
.nrg-globe .gl-roll { animation: globeRoll 5s linear infinite; }
@keyframes globeRoll { from { transform: translateX(0); } to { transform: translateX(-200px); } }
@keyframes globeBob { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-12px) rotate(4deg); } }
.nrg-globe .gl-ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid var(--mr-accent); opacity: 0;
  animation: globePulse 3.6s ease-out infinite;
}
.nrg-globe .gl-ring:nth-child(2) { animation-delay: 1.2s; border-color: var(--pp-red); }
.nrg-globe .gl-ring:nth-child(3) { animation-delay: 2.4s; border-color: #ffffff; }
@keyframes globePulse { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.7); opacity: 0; } }
html.radar-pepsi[data-mr="ultra"] .nrg-globe .gl-ring:nth-child(3) { border-color: #9aa6b8; }
html.radar-pepsi[data-mr="ultra"] .nrg-globe svg { filter: drop-shadow(0 10px 22px rgba(10, 79, 196, .25)); }

/* Kronkorken-Knall */
.nrg-cap { position: absolute; left: var(--cx, 22%); bottom: 34px; z-index: 2; pointer-events: none; width: 0; height: 0; }
.nrg-cap .cap {
  position: absolute; left: -17px; top: -17px; width: 34px; height: 34px; border-radius: 50%;
  background:
    radial-gradient(circle, #ffffff 0 22%, var(--pp-red) 23% 38%, #ffffff 39% 44%, var(--mr-accent) 45% 64%, transparent 65%),
    repeating-conic-gradient(#dfe5ee 0 10deg, #9aa6b8 10deg 20deg);
  box-shadow: 0 4px 10px rgba(0, 0, 0, .35);
  opacity: 0;
  animation: capPop 6s cubic-bezier(.25, .7, .4, 1) 2s infinite;
}
@keyframes capPop {
  0%, 1%  { opacity: 0; transform: translate(0, 20px) rotate(0) scale(.6); }
  2%      { opacity: 1; transform: translate(0, 0) rotate(40deg) scale(1); }
  18%     { transform: translate(70px, -210px) rotate(700deg) scaleY(.6); }
  24%     { transform: translate(90px, -225px) rotate(820deg) scaleY(-.6); }
  40%     { opacity: 1; transform: translate(130px, -60px) rotate(1180deg) scaleY(.7); }
  46%, 100% { opacity: 0; transform: translate(145px, 30px) rotate(1300deg) scaleY(.4); }
}
.nrg-cap b {
  position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%;
  border: 1.5px solid rgba(220, 234, 255, .9); background: rgba(255, 255, 255, .35);
  opacity: 0;
  animation: capBurst 6s ease-out 2s infinite;
}
@keyframes capBurst {
  0%, 1.5% { opacity: 0; transform: translate(0, 0) scale(.3); }
  3%       { opacity: 1; }
  20%, 100% { opacity: 0; transform: translate(var(--bx), var(--by)) scale(var(--bs)); }

html.radar-rockstar[data-mr="ultra"] .nrg-title span:last-child { color: #e0006b; text-shadow: 0 4px 0 #ffb800, 0 8px 0 #1c0210; }
html.radar-rockstar[data-mr="ultra"] .nrg-stage .st { filter: drop-shadow(0 2px 3px rgba(28, 2, 16, .35)); }
html.radar-rockstar[data-mr="ultra"] .nrg-ticker { background: linear-gradient(90deg, #e0006b, #ff5a36 50%, #ffb800); color: #ffffff; border-bottom-color: #1c0210; }
html.radar-rockstar[data-mr="ultra"] .nrg-ticker span { text-shadow: 0 1px 0 rgba(0,0,0,.3); }
html.radar-rockstar[data-mr="ultra"] .can { box-shadow: 0 10px 26px rgba(122, 10, 69, .08); border-top-color: #e0006b; }
html.radar-rockstar[data-mr="ultra"] .can.is-top { border-color: #e0006b; box-shadow: 6px 6px 0 #ffb800, 0 16px 36px rgba(224, 0, 107, .14); }
html.radar-rockstar[data-mr="ultra"] .can-price { text-shadow: 3px 3px 0 rgba(255, 184, 0, .45); }
html.radar-rockstar[data-mr="ultra"] .cs-open.is-open { color: #1f8a3a; }
html.radar-rockstar[data-mr="ultra"] .cs-open.is-open::before { background: #1f8a3a; box-shadow: none; }
html.radar-rockstar .mr-switch button[data-mr-theme="ultra"][aria-pressed="true"] { background: linear-gradient(90deg, #ffe3ee, #ffd27a); color: #b3004f; box-shadow: inset 0 0 0 1px #eaa9c2, 0 0 0 2px rgba(224, 0, 107, .3); }

/* ==========================================================================
   Gönrgy Radar: Livestream. G steht für Gönnen.
   Oben der LIVE-Knopf mit Zuschauerzahl, rechts läuft der Chat durch,
   unten fährt der Hype-Train in allen Sortenfarben, dazwischen schweben
   G-Münzen. "Live" dunkel, "Gönn dir" hell.
   ========================================================================== */
html.radar-goenrgy {
  --mr-bg: #0c0914;
  --mr-panel: #14101f;
  --mr-panel-2: #1b1529;
  --mr-card-a: #191327;
  --mr-line: #2c2340;
  --mr-line-strong: #43365f;
  --mr-fg: #f1ecff;
  --mr-strong: #ffffff;
  --mr-dim: #ab9fcc;
  --mr-faint: #7b6f9b;
  --mr-claim: #e1d9fa;
  --mr-desc: #c3b8e2;
  --mr-street: #ece6ff;
  --mr-accent: #19f0c4;
  --mr-accent-soft: #7df7de;
  --mr-on-accent: #0c0914;
  --gn-violet: #a45bff;
  --gn-jam: #8e2de2;
  --gn-lemon: #ffe14d;
  --gn-blue: #2f7bff;
  --gn-tropic: #ff8a00;
  --gn-rasp: #ff2e7e;
  --gn-peach: #ffb89a;
  --gn-cherry: #e0103a;
  --gn-live: #ff1f4b;
  --mr-tiles: invert(1) hue-rotate(200deg) brightness(.75) contrast(.95) saturate(.7);
}
html.radar-goenrgy[data-mr="ultra"] {
  color-scheme: light;
  --mr-bg: #fff7ee;
  --mr-panel: #ffffff;
  --mr-panel-2: #fff0df;
  --mr-card-a: #ffffff;
  --mr-line: #f1dcc4;
  --mr-line-strong: #e2bf99;
  --mr-fg: #1d1030;
  --mr-strong: #120822;
  --mr-dim: #66557f;
  --mr-faint: #978aac;
  --mr-claim: #2e1c47;
  --mr-desc: #4a3a63;
  --mr-street: #1d1030;
  --mr-accent: #7b2ff7;
  --mr-accent-soft: #a372ff;
  --mr-on-accent: #ffffff;
  --gn-violet: #7b2ff7;
  --gn-lemon: #ffcc00;
  --mr-tiles: grayscale(.4) sepia(.3) brightness(1.04) contrast(.94);
}
html.radar-goenrgy .nrg-hero {
  background:
    radial-gradient(50% 70% at 92% 10%, rgba(164, 91, 255, .35), transparent 70%),
    radial-gradient(45% 65% at 0% 100%, rgba(25, 240, 196, .18), transparent 70%),
    linear-gradient(180deg, #0a0712 0%, #120c1f 100%);
  border-bottom: 0; box-shadow: none; padding-bottom: 176px;
}
html.radar-goenrgy[data-mr="ultra"] .nrg-hero {
  background:
    radial-gradient(50% 70% at 92% 10%, rgba(255, 138, 0, .25), transparent 70%),
    radial-gradient(45% 65% at 0% 100%, rgba(123, 47, 247, .16), transparent 70%),
    linear-gradient(180deg, #fff1df 0%, #fff7ee 100%);
}
html.radar-goenrgy[data-mr="ultra"] .nrg-hero::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; z-index: 4;
  height: env(safe-area-inset-top); background: linear-gradient(90deg, #3b0f8a, #7b2ff7, #ff2e7e);
}
/* Scanlinien wie ein Stream-Overlay */
html.radar-goenrgy .nrg-grid,
html.radar-goenrgy[data-mr="ultra"] .nrg-grid {
  inset: 0; transform: none;
  background: repeating-linear-gradient(0deg, color-mix(in srgb, var(--gn-violet) 7%, transparent) 0 1px, transparent 1px 4px);
  animation: scan 8s linear infinite;
}
@keyframes scan { to { background-position: 0 120px; } }

/* Schriftzug: dicker Regenbogen-Stapel in den Sortenfarben */
html.radar-goenrgy .nrg-title span:first-child { color: #ffffff; text-shadow: 3px 3px 0 var(--gn-rasp), 6px 6px 0 var(--gn-violet); }
html.radar-goenrgy[data-mr="ultra"] .nrg-title span:first-child { color: #120822; text-shadow: 3px 3px 0 var(--gn-lemon), 6px 6px 0 var(--gn-rasp); }
html.radar-goenrgy .nrg-title span:last-child,
html.radar-goenrgy[data-mr="ultra"] .nrg-title span:last-child {
  color: var(--mr-accent);
  text-shadow: 0 4px 0 var(--gn-lemon), 0 8px 0 var(--gn-tropic), 0 12px 0 var(--gn-rasp);
}
html.radar-goenrgy .nrg-title, html.radar-goenrgy .nrg-claim, html.radar-goenrgy .nrg-offline { z-index: 3; }
html.radar-goenrgy .nrg-bigprice { display: none; }

/* LIVE-Knopf mit Zuschauern */
.nrg-live {
  position: relative; z-index: 3; display: inline-flex; align-items: center; gap: 8px;
  margin: 0 0 14px; padding: 5px 10px 5px 8px; border-radius: 6px;
  font: 700 12.5px/1 "Archivo", system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase;
  background: color-mix(in srgb, var(--mr-panel) 70%, transparent); border: 1px solid var(--mr-line-strong);
  color: var(--mr-strong);
}
.nrg-live .dot { background: var(--gn-live); color: #fff; padding: 3px 7px; border-radius: 4px; display: inline-flex; align-items: center; gap: 6px; }
.nrg-live .dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: livePulse 1.2s ease-in-out infinite; }
@keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.nrg-live .eye { color: var(--mr-dim); font-weight: 600; letter-spacing: .02em; text-transform: none; font-variant-numeric: tabular-nums; }

/* Chat läuft durch */
.nrg-chat {
  position: absolute; z-index: 2; pointer-events: none;
  right: max(22px, calc(50vw - 620px + 22px)); bottom: 62px;
  width: min(330px, 44vw); height: 210px; overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 30%);
  mask-image: linear-gradient(180deg, transparent, #000 30%);
}
.nrg-chat ul { list-style: none; margin: 0; padding: 0; animation: chatScroll var(--d) linear infinite; }
@keyframes chatScroll { from { transform: translateY(0); } to { transform: translateY(-50%); } }
.nrg-chat li {
  display: flex; gap: 6px; align-items: baseline;
  margin: 0 0 6px; padding: 5px 9px; border-radius: 8px;
  font-size: 13px; line-height: 1.3; color: var(--mr-fg);
  background: color-mix(in srgb, var(--mr-panel) 72%, transparent);
  border-left: 3px solid var(--c);
}
.nrg-chat li b { color: var(--c); font-weight: 700; white-space: nowrap; }
.nrg-chat li.is-sub { background: linear-gradient(90deg, color-mix(in srgb, var(--gn-violet) 40%, transparent), color-mix(in srgb, var(--gn-rasp) 30%, transparent)); color: #fff; font-weight: 700; }
html.radar-goenrgy[data-mr="ultra"] .nrg-chat li.is-sub { color: #120822; }

/* G-Münzen schweben und drehen sich */
.nrg-coins { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.nrg-coins i {
  position: absolute; left: var(--x); bottom: -60px;
  width: var(--s); height: var(--s); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font: italic var(--fs) / 1 "Anton", system-ui, sans-serif; font-style: normal; color: #ffffff;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.55) 0 14%, transparent 15%), var(--c);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.35), 0 0 16px color-mix(in srgb, var(--c) 60%, transparent);
  animation: coinFloat var(--d) linear var(--delay) infinite;
}
@keyframes coinFloat {
  0%   { opacity: 0; transform: translateY(0) rotateY(0); }
  10%  { opacity: .95; }
  80%  { opacity: .8; }
  100% { opacity: 0; transform: translateY(-420px) rotateY(720deg); }
}

/* Hype-Train unten */
.nrg-hype {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; height: 44px;
  padding: 0 max(16px, calc(50vw - 620px + 22px));
  display: flex; align-items: center; gap: 12px;
  background: color-mix(in srgb, var(--mr-panel) 85%, transparent);
  border-top: 1px solid var(--mr-line-strong);
  pointer-events: none;
}
.nrg-hype .hy-label { font: italic 13px/1 "Anton", system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--mr-strong); white-space: nowrap; }
.nrg-hype .hy-label em { font-style: normal; color: var(--mr-accent); margin-left: 4px; }
.nrg-hype .hy-bar { flex: 1; height: 14px; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--mr-line) 80%, transparent); position: relative; }
.nrg-hype .hy-bar i {
  position: absolute; inset: 0; transform-origin: 0 50%;
  background: linear-gradient(90deg, var(--gn-jam), var(--gn-blue), var(--mr-accent), var(--gn-lemon), var(--gn-tropic), var(--gn-rasp), var(--gn-cherry), var(--gn-jam)) 0 0 / 200% 100%;
  animation: hypeFill 9s cubic-bezier(.3, .1, .3, 1) infinite, hypeFlow 3s linear infinite;
}
.nrg-hype .hy-bar i::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(120deg, rgba(255,255,255,.25) 0 6px, transparent 6px 14px); animation: hypeStripes .8s linear infinite; }
@keyframes hypeFill { 0% { transform: scaleX(.05); } 85% { transform: scaleX(1); } 92% { transform: scaleX(1); opacity: 1; } 96% { opacity: .2; } 100% { transform: scaleX(.05); opacity: 1; } }
@keyframes hypeFlow { to { background-position: 200% 0; } }
@keyframes hypeStripes { to { background-position: 16px 0; } }
.nrg-hype .hy-train { font-size: 20px; line-height: 1; animation: trainHop .5s ease-in-out infinite alternate; }
@keyframes trainHop { to { transform: translateY(-3px) rotate(-4deg); } }

/* ---------- Laufband, Karten ---------- */
html.radar-goenrgy .nrg-ticker { background: linear-gradient(90deg, var(--gn-jam), var(--gn-rasp) 35%, var(--gn-tropic) 65%, var(--gn-lemon)); color: #ffffff; border-bottom-color: var(--mr-bg); }
html.radar-goenrgy .nrg-ticker span { text-shadow: 0 1px 0 rgba(0,0,0,.35); }
html.radar-goenrgy .can { border-left: 4px solid var(--mr-accent); }
html.radar-goenrgy[data-mr="ultra"] .can { box-shadow: 0 10px 26px rgba(29, 16, 48, .07); }
html.radar-goenrgy .can.is-top,
html.radar-goenrgy[data-mr="ultra"] .can.is-top { border-color: var(--mr-accent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--mr-accent) 45%, transparent), 0 16px 40px color-mix(in srgb, var(--gn-violet) 22%, transparent); }
html.radar-goenrgy .can-claw { top: 18px; right: 104px; gap: 3px; opacity: 1; align-items: flex-end; height: 22px; }
html.radar-goenrgy .can-claw i,
html.radar-goenrgy[data-mr="ultra"] .can-claw i,
html.radar-goenrgy[data-mr="ultra"] .can.is-top .can-claw i {
  width: 5px; height: 22px; border-radius: 2px; transform-origin: 50% 100%;
  background: var(--gn-rasp); animation: eqBounce .6s ease-in-out infinite alternate; --lo: .3; --hi: 1;
}
html.radar-goenrgy .can-claw i:nth-child(2) { background: var(--gn-lemon) !important; animation-duration: .45s; }
html.radar-goenrgy .can-claw i:nth-child(3) { background: var(--mr-accent) !important; animation-duration: .7s; }
html.radar-goenrgy .can-top span { background: var(--gn-live); color: #fff; }
html.radar-goenrgy .can-price { text-shadow: 3px 3px 0 color-mix(in srgb, var(--gn-violet) 55%, transparent); }
html.radar-goenrgy .nrg-section h3 { border-left-color: var(--gn-rasp); }
html.radar-goenrgy[data-mr="ultra"] .cs-open.is-open { color: #1f8a3a; }
html.radar-goenrgy[data-mr="ultra"] .cs-open.is-open::before { background: #1f8a3a; box-shadow: none; }
html.radar-goenrgy .mr-switch button[data-mr-theme="original"][aria-pressed="true"] { background: #0c0914; color: #19f0c4; box-shadow: inset 0 0 0 1px #a45bff, 0 0 0 2px rgba(25, 240, 196, .3); }
html.radar-goenrgy .mr-switch button[data-mr-theme="ultra"][aria-pressed="true"] { background: linear-gradient(90deg, #ffe14d, #ff8a00, #ff2e7e); color: #120822; box-shadow: 0 0 0 2px rgba(123, 47, 247, .3); }

@media (max-width: 740px) {
  html.radar-goenrgy .nrg-hero { padding-bottom: 196px; }
  .nrg-chat { left: 16px; right: 16px; width: auto; height: 112px; bottom: 54px; }
  .nrg-chat li { font-size: 12.5px; }
  .nrg-chat li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nrg-coins i:nth-child(n+7) { display: none; }
  .nrg-hype { height: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  .nrg-chat ul, .nrg-hype .hy-bar i, .nrg-hype .hy-bar i::after, .nrg-hype .hy-train, .nrg-live .dot::before, html.radar-goenrgy .can-claw i, html.radar-goenrgy .nrg-grid { animation: none; }
  .nrg-coins { display: none; }
}

html.no-anim .nrg-claws, html.no-anim .nrg-scope .blip, html.no-anim .nrg-cap, html.no-anim .nrg-globe .gl-ring,
html.no-anim .nrg-coins, html.no-anim .nrg-dew b { display: none !important; }

html.radar-goenrgy .can-clock.is-upcoming { color: #19f0c4; box-shadow: inset 0 0 0 2px #19f0c4; }
html.radar-goenrgy[data-mr="ultra"] .can-clock.is-upcoming { color: #6a1fe0; box-shadow: inset 0 0 0 2px #6a1fe0; }

html.radar-rockstar[data-mr="ultra"] .can-clock.is-upcoming { color: #c2005c; box-shadow: inset 0 0 0 2px #c2005c; }

/* ==========================================================================
   Cola neu: Kondenswasser auf kaltem Glas und ein rot-weißer Strohhalm,
   der langsam im Glas rührt. Eiswürfel und Perlen bleiben.
   ========================================================================== */
.nrg-dew { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.nrg-dew i, .nrg-dew b {
  position: absolute; left: var(--x); top: var(--y);
  width: var(--s); height: calc(var(--s) * 1.12);
  border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9) 0 14%, rgba(255,255,255,.18) 30%, rgba(255,255,255,.04) 62%);
  box-shadow: inset 0 -1px 2px rgba(255,255,255,.35), 0 1px 2px rgba(0,0,0,.45);
  border: 1px solid rgba(255,255,255,.18);
}
.nrg-dew i { animation: dewShimmer 6s ease-in-out var(--delay) infinite; }
@keyframes dewShimmer { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
/* Läufer: wächst an, reißt ab, rinnt nach unten und hinterlässt eine Spur */
.nrg-dew b { animation: dewRun var(--d) cubic-bezier(.5, 0, .75, .4) var(--delay) infinite; opacity: 0; }
.nrg-dew b span {
  position: absolute; left: 50%; bottom: 60%; width: 38%; margin-left: -19%;
  height: var(--fall); border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.3) 60%, rgba(255,255,255,.5));
  transform-origin: 50% 100%; transform: scaleY(0);
  animation: dewTrail var(--d) cubic-bezier(.5, 0, .75, .4) var(--delay) infinite;
}
@keyframes dewRun {
  0%   { opacity: 0; transform: translateY(0) scale(.3); }
  8%   { opacity: 1; }
  45%  { transform: translateY(0) scale(1); }
  52%  { transform: translateY(6px) scale(1, 1.15); }
  80%  { opacity: 1; transform: translateY(var(--fall)) scale(.85, 1.2); }
  92%, 100% { opacity: 0; transform: translateY(var(--fall)) scale(.6); }
}
@keyframes dewTrail {
  0%, 50% { transform: translateY(0) scaleY(0); opacity: 1; }
  80%     { transform: translateY(var(--fall)) scaleY(1); opacity: 1; }
  100%    { transform: translateY(var(--fall)) scaleY(1); opacity: 0; }
}
html.radar-cola[data-mr="ultra"] .nrg-dew i, html.radar-cola[data-mr="ultra"] .nrg-dew b {
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95) 0 16%, rgba(160,170,182,.22) 34%, rgba(120,130,140,.08) 64%);
  box-shadow: inset 0 -1px 2px rgba(255,255,255,.6), 0 1px 2px rgba(60,64,70,.35);
  border-color: rgba(255,255,255,.55);
}
html.radar-cola[data-mr="ultra"] .nrg-dew b span { background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.5) 70%, rgba(255,255,255,.75)); }

/* Strohhalm: steht im Glas, das Glas liegt davor und verdeckt das untere Ende */
.nrg-straw {
  position: absolute; z-index: 1; pointer-events: none;
  right: max(16%, calc(50vw - 520px)); bottom: 40px;
  width: 18px; height: 230px;
  transform-origin: 50% 100%;
  animation: strawStir 7s ease-in-out infinite;
}
.nrg-straw i {

/* ==========================================================================

  position: absolute; left: var(--x); bottom: -40px;

/* Umlaufbahnen: jedes ausgewählte Getränk kreist als Farbpunkt */
.hd-orbit {
  position: absolute; z-index: 1; pointer-events: none;
  right: max(40px, calc(50vw - 620px + 60px)); top: 50%;
  width: 0; height: 0;
}
.ho-ring { position: absolute; left: 0; top: 0; width: var(--w); height: var(--w); margin: calc(var(--w) / -2) 0 0 calc(var(--w) / -2); border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--mr-fg) 22%, transparent); }
.ho-ring.r1 { --w: 124px; }
.ho-ring.r2 { --w: 184px; animation: spin 40s linear infinite reverse; }
.ho-ring.r3 { --w: 244px; animation: spin 60s linear infinite; }
.ho-core {
  position: absolute; left: 0; top: 0; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--mr-bg);
  box-shadow: 0 0 40px rgba(164, 91, 255, .35);
  animation: corePulse 3s ease-in-out infinite;
}
.ho-core::before {
  content: ""; position: absolute; inset: -5px; z-index: -1; border-radius: 50%;
  background: conic-gradient(#9dff2e, #19f0c4, #2a73ff, #a45bff, #ff2d87, #f40009, #ff8a00, #ffc906, #9dff2e);
  animation: spin 6s linear infinite;
}
.ho-core::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 50%; background: var(--mr-bg); }
@keyframes corePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.ho-core b { font: italic 30px/1 "Anton", system-ui, sans-serif; color: var(--mr-strong); }
.ho-core small { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--mr-dim); }
.hd-orbit .dock-dot {
  position: absolute; left: -9px; top: -9px; width: 18px; height: 18px;
  animation: orbit var(--d) linear infinite;
}
@keyframes orbit {
  from { transform: rotate(var(--a)) translateX(var(--r)) rotate(calc(var(--a) * -1)); }
  to   { transform: rotate(calc(var(--a) + 360deg)) translateX(var(--r)) rotate(calc(var(--a) * -1 - 360deg)); }
}

/* Karten je Getränk in dessen Farbe */
.hd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.hd-card {
  --dc: var(--mr-accent);
  position: relative; overflow: hidden; cursor: pointer;
  padding: 16px 18px 16px 20px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--dc) 14%, var(--mr-card-a)) 0%, var(--mr-panel) 60%);
  border: 1px solid color-mix(in srgb, var(--dc) 35%, var(--mr-line));
  border-radius: 16px;
  animation: canIn 420ms ease-out backwards; animation-delay: calc(var(--i, 0) * 60ms);
  transition: transform 180ms ease, box-shadow 180ms ease;
}
.hd-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--dc); }

}

/* Kartenfarben: in hellen Designs dunklere Töne, damit Preise lesbar bleiben */

/* ==========================================================================
   Spaßgetränke Radar: Wechselleiste unten und Farbwisch beim Umschalten.
   Nur auf radar.html eingebunden.
   ========================================================================== */

main { padding-bottom: calc(env(safe-area-inset-bottom) + 110px) !important; }

.radar-dock {
  position: fixed;

.dock-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }

/* Farbwisch: schräge Fläche in der Markenfarbe fegt über den Bildschirm */

@keyframes productWipe {
  0%   { clip-path: polygon(-30% 0, -10% 0, -30% 100%, -50% 100%); }
  45%  { clip-path: polygon(-30% 0, 130% 0, 110% 100%, -50% 100%); }
  55%  { clip-path: polygon(-30% 0, 130% 0, 110% 100%, -50% 100%); }
  100% { clip-path: polygon(130% 0, 150% 0, 130% 100%, 110% 100%); }
}

/* Viele Getränke: Leiste scrollt seitlich, auf dem Handy tragen nur das gewählte

  .radar-dock { gap: 2px; padding: 4px; max-width: calc(100vw - 20px); }
  .radar-dock button { padding: 8px 9px 8px 8px; font-size: 12.5px; gap: 6px; }
  .radar-dock { bottom: calc(env(safe-area-inset-bottom) + 10px); }
}
@media (prefers-reduced-motion: reduce) {
  .product-wipe { display: none; }
}

/* Wischen nach rechts: der Farbwisch läuft von rechts nach links */
.product-wipe.wipe-rev { animation-name: productWipeRev; }
@keyframes productWipeRev {
  0%   { clip-path: polygon(130% 0, 150% 0, 130% 100%, 110% 100%); }
  45%  { clip-path: polygon(-30% 0, 150% 0, 130% 100%, -50% 100%); }
  55%  { clip-path: polygon(-30% 0, 150% 0, 130% 100%, -50% 100%); }
  100% { clip-path: polygon(-30% 0, -10% 0, -30% 100%, -50% 100%); }
}

</style>
</head>
<body>
<div class="mr-switch" role="group" aria-label="Design wählen">
  <button type="button" data-mr-theme="original">Original</button>
  <button type="button" data-mr-theme="ultra">Ultra White</button>
</div>
<main id="app"></main>
<script>
/* Konfiguration steht im Kopf */
</script>
<script>
/* Radar – eigenständige Angebotsseite, für mehrere Produkte konfigurierbar */
(function () {
  'use strict';

  const DAY = 86400000;

  /* Produktkonfiguration. Jede Radar-Seite setzt window.RADAR_CONFIG, Monster ist der Standard. */
  const RADAR_DEFAULTS = {
    key: 'monster', name: 'Monster', title: ['Monster', 'Radar'],
    offers: 'monster.json', history: 'history.json',
    metric: 'unit',                 // 'unit' = Preis je Dose, 'litre' = Preis je Liter
    unitWord: 'Dose',
    themeKey: 'monsterradar:theme', baseColor: '#05070a', altColor: '#eef1f4',
    emoji: '⚡', job: 'Radar-Angebote', fallbackDesc: 'Monster Energy',
    sparks: true, fizz: false, swirl: false, slices: false, glass: false, pop: false, stage: false, sun: false, claws: false, scope: false, globe: false, stream: false, dew: false, lava: false, home: false, sharePage: null
  };
  // Einzelseiten setzen window.RADAR_CONFIG. Der Spaßgetränke Radar setzt
  // zusätzlich window.RADAR_PRODUCTS und wechselt zur Laufzeit zwischen ihnen.
  let RADAR = Object.assign({}, RADAR_DEFAULTS, window.RADAR_CONFIG || {});
  let LITRE = RADAR.metric === 'litre';
  // Großmärkte nur für Gewerbekunden: für Privatleute nutzlos, deshalb überall ausgeblendet
  const WHOLESALE = /handelshof|\bmetro\b|selgros|transgourmet|c\s*[+&]\s*c|cash\s*(&|and)?\s*carry/i;
  const isWholesale = (...names) => WHOLESALE.test(names.filter(Boolean).join(' '));
  const valueOf = (o) => (LITRE ? o.pricePerLitre : o.price);
  const fmtV = (v) => (v == null ? '–' : dec(v, 2) + (LITRE ? ' €/l' : ' €'));
  const fmtL = (l) => String(Math.round(l * 1000) / 1000).replace('.', ',') + ' l';
  const ANGEBOTE_DIR = 'data/angebote';
  const dec = (x, d) => (x == null || isNaN(x) ? '–' : x.toFixed(d == null ? 2 : d).replace('.', ','));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function fmtTime(ts) { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function fmtDate(ts, withYear) {
    const d = new Date(ts);
    const s = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.';
    return withYear ? s + String(d.getFullYear()).slice(2) : s;
  }
  /* ---------- Öffnungszeiten (OpenStreetMap-Format) ----------
     Unterstützt die Formen, die in den Daten vorkommen:
     "Mo-Sa 07:00-22:00", "Mo-Fr 08:00-20:00; Sa 08:00-18:00", "Su,PH off", "24/7".
     Spätere Regeln überschreiben frühere für denselben Tag, wie in OSM üblich.
     Feiertage (PH) werden mangels Kalender ignoriert. */
  const DAY_IDX = { mo: 0, tu: 1, we: 2, th: 3, fr: 4, sa: 5, su: 6 };
  const DAY_SHORT = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

  function parseHours(str) {
    if (!str || typeof str !== 'string') return null;
    const sched = [null, null, null, null, null, null, null];
    let understood = false;
    // Manche Einträge trennen Regeln mit Komma statt Semikolon:
    // "Mo-Fr 07:00-20:00, Sa 07:00-18:00". Ein Komma nach einer Uhrzeit oder
    // nach "off", gefolgt von einem Tag, beginnt deshalb eine neue Regel.
    str = str.replace(/(\d|off|closed)\s*,\s*(?=(?:Mo|Tu|We|Th|Fr|Sa|Su|PH|SH)\b)/gi, '$1; ');
    for (let rule of str.split(';')) {
      rule = rule.trim();
      if (!rule) continue;
      if (/^24\/7$/.test(rule)) { for (let d = 0; d < 7; d++) sched[d] = [[0, 1440]]; understood = true; continue; }
      const m = rule.match(/^((?:[A-Za-z]{2}(?:\s*-\s*[A-Za-z]{2})?\s*,?\s*)+)\s+(.+)$/);
      let days, times;
      if (m) { days = m[1]; times = m[2].trim(); } else { days = 'Mo-Su'; times = rule; }
      const targets = [];
      for (let tok of days.split(',')) {
        tok = tok.trim().toLowerCase();
        if (!tok) continue;
        const r = tok.split('-').map((x) => x.trim());
        if (r.length === 2 && r[0] in DAY_IDX && r[1] in DAY_IDX) {
          let a = DAY_IDX[r[0]]; const b = DAY_IDX[r[1]];
          for (let i = 0; i < 7; i++) { targets.push(a); if (a === b) break; a = (a + 1) % 7; }
        } else if (tok in DAY_IDX) targets.push(DAY_IDX[tok]);
        // PH, SH und Unbekanntes werden übergangen
      }
      if (!targets.length) continue;
      let intervals = [];
      if (/^(off|closed)$/i.test(times)) intervals = [];
      else {
        for (const part of times.split(',')) {
          const t = part.trim().replace(/\+$/, '').match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
          if (!t) { intervals = null; break; }
          const s = +t[1] * 60 + +t[2];
          let e = +t[3] * 60 + +t[4];
          if (e <= s) e += 1440;   // über Mitternacht
          intervals.push([s, e]);
        }
        if (intervals === null) continue;
      }
      for (const d of targets) sched[d] = intervals;
      understood = true;
    }
    return understood ? sched : null;
  }

  const hhmm = (min) => { const m = ((min % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

  function openStatus(str, now) {
    const sched = parseHours(str);
    if (!sched) return null;
    now = now || new Date();
    const today = (now.getDay() + 6) % 7;
    const cur = now.getHours() * 60 + now.getMinutes();
    if (sched.every((d) => d && d.length === 1 && d[0][0] === 0 && d[0][1] >= 1440)) return { open: true, text: 'Rund um die Uhr geöffnet' };
    // Noch offen von gestern (über Mitternacht)?
    const yest = sched[(today + 6) % 7] || [];
    for (const [s, e] of yest) if (e > 1440 && cur < e - 1440) return { open: true, text: `Geöffnet bis ${hhmm(e)}` };
    for (const [s, e] of (sched[today] || [])) {
      if (cur >= s && cur < e) return { open: true, text: `Geöffnet bis ${hhmm(e)}`, soon: e - cur <= 60 };
    }
    for (const [s] of (sched[today] || [])) if (s > cur) return { open: false, text: `Öffnet heute um ${hhmm(s)}` };
    for (let k = 1; k <= 7; k++) {
      const d = (today + k) % 7;
      const list = sched[d];
      if (list && list.length) {
        const first = Math.min(...list.map((x) => x[0]));
        return { open: false, text: k === 1 ? `Öffnet morgen um ${hhmm(first)}` : `Öffnet ${DAY_SHORT[d]} um ${hhmm(first)}` };
      }
    }
    return null;
  }


  const FROM_CACHE = {};
  async function fetchJSON(url, opts) {
    const res = await fetch(url, Object.assign({ headers: { Accept: 'application/json' } }, opts || {}));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    FROM_CACHE[url.split('?')[0]] = res.headers.get('x-radar-cache') === '1';
    return res.json();
  }

  /* ---------- Monster: Angebote im Umkreis ---------- */

  const MONSTER = { data: null, error: null, loading: false, map: null, clock: null, cache: {} };

  /* Was genau wird verkauft? Gebinde, Mehrweg oder Einweg, Pfand, Kundenkartenpreis.
     Die Pfandhöhe verrät das Gebinde: 0,25 € je Einheit ist Einweg (Dose oder PET),
     0,08 oder 0,15 € ist Mehrweg-Glas. Beim Kasten steckt im Pfand noch der Kasten selbst. */
  function packDetails(o) {
    const t = String(o.description || '') + ' ' + String(o.unit || '');
    const low = t.toLowerCase();
    const num = (x) => parseFloat(String(x).replace(',', '.'));
    let deposit = null;
    const pm = low.match(/pfand\s*:?\s*(\d+[.,]\d{1,2})/) || low.match(/(\d+[.,]\d{1,2})\s*(?:€\s*)?pfand/);
    if (pm) deposit = num(pm[1]);
    const n = o.packSize || 1;
    const perUnit = deposit != null ? (n > 1 && deposit > 0.3 ? deposit / n : deposit) : null;
    let container = /dose/.test(low) ? 'Dose' : /flasche|\bfl\./.test(low) ? 'Flasche' : null;
    let returnable = null;
    if (perUnit != null) {
      if (Math.abs(perUnit - 0.25) < 0.02) returnable = false;
      else if (perUnit < 0.2) returnable = true;
    }
    if (!container && returnable === true) container = 'Glasflasche';
    if (container === 'Flasche' && returnable === true) container = 'Glasflasche';
    const crate = n > 1 && (/kasten|kiste/.test(low) || (returnable === true && n >= 12));
    const cm = t.match(/card[^0-9]{0,30}(\d+[.,]\d{2})/i);
    return {
      pack: n > 1 ? (crate ? 'Kasten' : n + 'er-Pack') : null,
      container,
      returnable,
      deposit: deposit != null && deposit > 0 ? deposit : null,
      card: cm ? num(cm[1]) : null,
      cardName: cm ? (String(o.retailer || '') + ' Card') : null
    };
  }

  function packLine(o) {
    const p = packDetails(o);
    const chips = [];
    if (p.container) chips.push(p.container);
    if (p.returnable === true) chips.push('Mehrweg');
    if (p.returnable === false) chips.push('Einweg');
    if (p.deposit) chips.push(`+ ${dec(p.deposit, 2)} € Pfand`);
    if (p.card != null) chips.push(`mit ${esc(p.cardName)} ${dec(p.card, 2)} €`);
    const size = o.litres ? ` × ${fmtL(o.litres)}` : '';
    return `${p.pack ? `<div class="can-only">Nur ${p.pack === 'Kasten' ? 'im Kasten' : 'im ' + p.pack}: ${o.packSize}${size} für ${dec(o.packPrice, 2)} €</div>` : ''}
      ${chips.length ? `<div class="can-chips">${chips.map((c) => `<span>${c}</span>`).join('')}</div>` : ''}`;
  }

  /* Lebensmittel mit gleichem Namen aussortieren (etwa Monster Munch, ein 75-g-Chipsbeutel):
     Gewichtsangaben, Beutel und Chips sind keine Getränke. */
  function isNotADrink(o) {
    const u = String(o.unit || '').trim().toLowerCase();
    if (['kg', 'g', '100 g', '100g', '1 kg'].includes(u)) return true;
    const t = [o.brand, o.description].filter(Boolean).join(' ').toLowerCase();
    return /\d+\s*-?\s*g\b|\bbeutel\b|\bchips\b|\bsnack|\bmunch\b|\blorenz\b/.test(t);
  }

  function cleanData(d) {
    if (!d) return;
    d.offers = (d.offers || []).filter((o) => !isWholesale(o.retailer, o.advertiser) && !isNotADrink(o));
    d.stores = (d.stores || []).filter((st) => !isWholesale(st.name, st.retailer));
    for (const o of d.offers) if (o.description) o.description = o.description.replace(/\u00ad\s*/g, '');
    // Ältere Daten nachbessern: ausgeschriebenes "Liter" erkennen, Literpreis ergänzen
    if (LITRE) {
      for (const o of d.offers) {
        if (o.litres == null) {
          const m = String(o.description || '').replace(/,/g, '.').match(/(\d+(?:\.\d+)?)\s*-?\s*(?:l|i|ltr|liter)\b/i);
          const l = m ? parseFloat(m[1]) : null;
          if (l && l >= 0.1 && l <= 3) o.litres = l;
        }
        if (o.pricePerLitre == null && o.litres && o.price != null) o.pricePerLitre = Math.round(o.price / o.litres * 100) / 100;
      }
    }
    // Gleiches Angebot mit leicht anderem Text nur einmal zeigen
    const seen = new Set();
    d.offers = d.offers.filter((o) => {
      const k = [o.retailer, o.price, o.from, o.to].join('|');
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }
  function cleanHistory(h) {
    if (!h || !h.weeks) return;
    for (const wk of Object.values(h.weeks)) {
      for (const name of Object.keys(wk.shops || {})) if (isWholesale(name)) delete wk.shops[name];
    }
  }

  async function loadMonster() {
    if (MONSTER.data || MONSTER.loading) return;
    const key = RADAR.key, cfg = RADAR;
    MONSTER.loading = true;
    let data = null, history = null, error = null;
    try {
      data = await fetchJSON(`${ANGEBOTE_DIR}/${cfg.offers}`, { cache: 'no-cache' });
      try { history = await fetchJSON(`${ANGEBOTE_DIR}/${cfg.history}`, { cache: 'no-cache' }); }
      catch (e) { history = null; }
    } catch (e) {
      error = e;
    }
    // Wurde inzwischen gewechselt? Dann nur für später merken, nicht anzeigen.
    const wasLitre = LITRE; LITRE = cfg.metric === 'litre';
    if (data) { cleanData(data); cleanHistory(history); MONSTER.cache[key] = { data, history, at: Date.now() }; }
    LITRE = wasLitre;
    if (RADAR.key !== key) return;
    MONSTER.loading = false;
    MONSTER.data = data; MONSTER.history = history; MONSTER.error = error;
    MONSTER.offline = !!FROM_CACHE[`${ANGEBOTE_DIR}/${cfg.offers}`];
    draw();
  }

  function daysLeft(to) {
    if (!to) return null;
    const end = new Date(to + 'T23:59:59').getTime();
    return Math.ceil((end - Date.now()) / DAY);
  }

  function fmtDay(iso) {
    const d = new Date(iso + 'T12:00:00');
    return ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][d.getDay()] + ' ' + fmtDate(d.getTime());
  }

  function spanText(diff) {
    const d = Math.floor(diff / DAY); diff -= d * DAY;
    const h = Math.floor(diff / 3600000); diff -= h * 3600000;
    const m = Math.floor(diff / 60000);
    const sec = Math.floor((diff - m * 60000) / 1000);
    return d > 0 ? `${d} T ${h} Std ${m} Min` : `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  /* Bevorstehend: bis zum Start zählen (Tagesbeginn). Laufend: bis zum Ende des letzten Tages. */
  function clockText(o) {
    const now = Date.now();
    if (o.from) {
      const start = new Date(o.from + 'T00:00:00').getTime();
      if (start > now) return 'Startet in ' + spanText(start - now);
    }
    if (!o.to) return '';
    const end = new Date(o.to + 'T23:59:59').getTime();
    return end > now ? 'Noch ' + spanText(end - now) : 'abgelaufen';
  }

  function countdownText(to) {
    if (!to) return null;
    const end = new Date(to + 'T23:59:59').getTime();
    let diff = end - Date.now();
    if (diff <= 0) return 'abgelaufen';
    const d = Math.floor(diff / DAY); diff -= d * DAY;
    const h = Math.floor(diff / 3600000); diff -= h * 3600000;
    const m = Math.floor(diff / 60000);
    const sec = Math.floor((diff - m * 60000) / 1000);
    return d > 0 ? `${d} T ${h} Std ${m} Min` : `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  const NORM = (x) => (x || '').toLowerCase().replace(/[^a-zäöüß]/g, '');
  const GENERIC_SHOP = /^(getränkemarkt|getraenkemarkt|getränke|supermarkt|verbrauchermarkt|discounter|markt)$/i;

  function storesFor(retailer) {
    const all = (MONSTER.data && MONSTER.data.stores) || [];
    const key = NORM(retailer);
    if (!key) return [];
    // Sammelname wie "Getränkemarkt": alle Getränkemärkte der Umgebung zeigen
    if (GENERIC_SHOP.test((retailer || '').trim())) {
      return all.filter((st) => /getränke|trinkgut|fristo|dursty|hol ab/i.test(st.name + ' ' + st.retailer));
    }
    const hit = all.filter((st) => {
      const a = NORM(st.retailer), b = NORM(st.name);
      return a === key || b === key || (key.length >= 4 && (a.indexOf(key) >= 0 || b.indexOf(key) >= 0 || key.indexOf(a) >= 0));
    });
    return hit;
  }

  function storeList(o) {
    const list = storesFor(o.retailer);
    const mapSearch = (q) => `https://www.google.com/maps/search/${encodeURIComponent(q)}`;
    if (!list.length) {
      return `<div class="can-stores">
        <div class="cs-head">Filiale finden</div>
        <p class="cs-none">${((MONSTER.data && MONSTER.data.stores) || []).length
          ? `Zu ${esc(o.retailer)} ist in den Kartendaten kein Markt im Umkreis eingetragen.`
          : 'Die Filialdaten fehlen beim letzten Lauf.'}
          <a href="${mapSearch(o.retailer + ' Monheim am Rhein')}" target="_blank" rel="noopener">In Monheim suchen</a> ·
          <a href="${mapSearch(o.retailer + ' Langenfeld')}" target="_blank" rel="noopener">In Langenfeld suchen</a></p>
      </div>`;
    }
    const shown = list.slice(0, 4);
    return `<div class="can-stores">
      <div class="cs-head">${list.length} ${list.length === 1 ? 'Filiale' : 'Filialen'} in der Nähe</div>
      <ul class="cs-list">${shown.map((st) => `<li>
        <a href="https://www.google.com/maps/search/?api=1&query=${st.lat},${st.lon}" target="_blank" rel="noopener" data-store="${esc(JSON.stringify(st))}">
          <span class="cs-street">${esc(st.street || st.name)}</span>
          <span class="cs-city">${esc(st.zip ? st.zip + ' ' : '')}${esc(st.city || st.near)}</span>
          ${(() => { const o = openStatus(st.hours); return o ? `<span class="cs-open${o.open ? ' is-open' : ''}${o.soon ? ' is-soon' : ''}" data-hours="${esc(st.hours)}">${esc(o.text)}</span>` : ''; })()}
        </a>
        <span class="cs-dist">${dec(st.dist, 1)} km</span>
      </li>`).join('')}</ul>
      ${list.length > shown.length ? `<div class="cs-more">und ${list.length - shown.length} weitere</div>` : ''}
    </div>`;
  }

  function allStoresBlock() {
    const all = (MONSTER.data && MONSTER.data.stores) || [];
    if (!all.length) {
      return `<section class="nrg-section"><h3>Alle Märkte im Umkreis</h3>
        <div class="nrg-empty nrg-empty-soft"><p>Die Filialdaten konnten beim letzten Lauf nicht geladen werden.
        Der Kartendienst hat die Anfrage abgelehnt. Mit dem nächsten Lauf des Jobs „${RADAR.job}“ sollte die Liste wieder da sein.</p></div></section>`;
    }
    const groups = new Map();
    for (const st of all) {
      const key = st.retailer || st.name;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(st);
    }
    const ordered = Array.from(groups.entries()).sort((a, b) => a[1][0].dist - b[1][0].dist);
    return `<section class="nrg-section"><h3>Alle Märkte im Umkreis</h3>
      <p class="nrg-sub">${all.length} Supermärkte und Getränkemärkte rund um beide Orte, nach Kette sortiert, mit Adresse und Entfernung.</p>
      <details class="nrg-all">
        <summary><span>Alle Märkte anzeigen</span><b>${all.length}</b></summary>
        <div class="nrg-all-grid">${ordered.map(([name, list]) => `<div class="nas-group">
          <div class="nas-name">${esc(name)}<span>${list.length}</span></div>
          <ul class="cs-list">${list.slice(0, 8).map((st) => `<li>
            <a href="https://www.google.com/maps/search/?api=1&query=${st.lat},${st.lon}" target="_blank" rel="noopener" data-store="${esc(JSON.stringify(st))}">
              <span class="cs-street">${esc(st.street || st.name)}</span>
              <span class="cs-city">${esc(st.zip ? st.zip + ' ' : '')}${esc(st.city || st.near)}</span>
              ${(() => { const o = openStatus(st.hours); return o ? `<span class="cs-open${o.open ? ' is-open' : ''}${o.soon ? ' is-soon' : ''}" data-hours="${esc(st.hours)}">${esc(o.text)}</span>` : ''; })()}
            </a><span class="cs-dist">${dec(st.dist, 1)} km</span></li>`).join('')}</ul>
          ${list.length > 8 ? `<div class="cs-more">und ${list.length - 8} weitere</div>` : ''}
        </div>`).join('')}</div>
      </details>
    </section>`;
  }


  /* ---------- Preisverlauf ---------- */

  const SHOP_COLORS = ['#ff7a45', '#ffd23f', '#3ddc97', '#4cc9f0', '#b388ff', '#ff5d8f', '#9aa4ae', '#f4a261', '#2ec4b6', '#e76f51'];
  function shopColor(name, all) {
    const i = all.indexOf(name);
    return SHOP_COLORS[(i < 0 ? 0 : i) % SHOP_COLORS.length];
  }
  function weekLabel(key) { return 'KW ' + parseInt(key.split('-W')[1], 10); }

  /* Gleiche Wochenregel wie im Job: Mitte des Angebotszeitraums */
  function isoWeekKey(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const day = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    const wk = Math.ceil(((d - y0) / DAY + 1) / 7);
    return d.getUTCFullYear() + '-W' + String(wk).padStart(2, '0');
  }
  function offerDay(o) {
    const a = o.from ? new Date(o.from + 'T12:00:00') : null;
    const b = o.to ? new Date(o.to + 'T12:00:00') : null;
    if (a && b && b >= a) return new Date(a.getTime() + Math.floor((b - a) / DAY / 2) * DAY);
    return a || b || new Date();
  }

  /* Gespeicherter Verlauf plus die Angebote, die gerade geladen sind.
     So steht die laufende Woche sofort da, auch vor dem nächsten Lauf. */
  function mergedHistory() {
    const weeks = {};
    const put = (key, name, v) => {
      const slot = weeks[key] || (weeks[key] = { shops: {} });
      const cur = slot.shops[name];
      if (!cur || v.price < cur.price) slot.shops[name] = v;
    };
    const stored = (MONSTER.history && MONSTER.history.weeks) || {};
    for (const wk of Object.values(stored)) {
      for (const [name, v] of Object.entries(wk.shops || {})) {
        if (v.price == null) continue;
        put(isoWeekKey(offerDay(v)), name, v);
      }
    }
    for (const o of (MONSTER.data && MONSTER.data.offers) || []) {
      const v = valueOf(o);
      if (v == null || o.packUnclear) continue;
      put(isoWeekKey(offerDay(o)), o.retailer, { price: v, from: o.from, to: o.to });
    }
    return { weeks };
  }

  function historyStats(h) {
    const keys = Object.keys((h && h.weeks) || {}).sort();
    const weeks = keys.map((k) => {
      const shops = Object.entries(h.weeks[k].shops || {}).map(([name, v]) => ({ name, price: v.price, from: v.from, to: v.to }))
        .filter((x) => x.price != null).sort((a, b) => a.price - b.price);
      return { key: k, monday: h.weeks[k].monday, shops, best: shops[0] || null };
    }).filter((w) => w.best);
    const perShop = new Map();
    for (const w of weeks) {
      for (const sh of w.shops) {
        if (!perShop.has(sh.name)) perShop.set(sh.name, { name: sh.name, prices: [], bestWeeks: 0 });
        perShop.get(sh.name).prices.push(sh.price);
      }
      const cheapest = w.best.price;
      for (const sh of w.shops) if (sh.price === cheapest) perShop.get(sh.name).bestWeeks++;
    }
    const shops = Array.from(perShop.values()).map((x) => ({
      name: x.name,
      weeks: x.prices.length,
      bestWeeks: x.bestWeeks,
      min: Math.min(...x.prices),
      max: Math.max(...x.prices),
      avg: x.prices.reduce((a, b) => a + b, 0) / x.prices.length
    })).sort((a, b) => b.bestWeeks - a.bestWeeks || a.min - b.min);
    // "Bisher" heißt: nur Wochen, die schon begonnen haben. Angekündigtes zählt erst ab Start.
    const nowKey = isoWeekKey(new Date());
    const started = weeks.filter((w) => w.key <= nowKey);
    let allTime = null;
    for (const w of (started.length ? started : weeks)) if (!allTime || w.best.price < allTime.price) allTime = { ...w.best, key: w.key };
    return { weeks, shops, allTime, names: shops.map((x) => x.name).sort() };
  }

  function historyChart(st) {
    const weeks = st.weeks.slice(-26);
    const W = 800, H = 240, L = 54, R = 18, T = 20, B = 34;
    // Skala über alle Preise, nicht nur die Bestpreise, damit jeder Punkt sichtbar ist
    const all = [];
    for (const w of weeks) for (const sh of w.shops) all.push(sh.price);
    let lo = Math.min(...all), hi = Math.max(...all);
    lo = Math.floor((lo - 0.05) * 10) / 10;
    hi = Math.ceil((hi + 0.05) * 10) / 10;
    if (hi - lo < 0.3) { const mid = (hi + lo) / 2; lo = Math.floor((mid - 0.15) * 10) / 10; hi = Math.ceil((mid + 0.15) * 10) / 10; }
    const x = (i) => weeks.length === 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (weeks.length - 1);
    const y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
    const pts = weeks.map((w, i) => [x(i), y(w.best.price)]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = weeks.length > 1 ? `${line} L ${pts[pts.length - 1][0].toFixed(1)} ${H - B} L ${pts[0][0].toFixed(1)} ${H - B} Z` : '';
    // Glatte Achsenwerte: 10-Cent-Schritte, bei großer Spanne 20 oder 50 Cent
    const span = hi - lo;
    const stepV = span <= 0.45 ? 0.1 : span <= 0.9 ? 0.2 : 0.5;
    lo = Math.floor(lo / stepV + 1e-9) * stepV;
    hi = Math.ceil(hi / stepV - 1e-9) * stepV;
    const ticks = [];
    for (let v = lo; v <= hi + 1e-9; v += stepV) ticks.push(Math.round(v * 100) / 100);
    const grid = ticks.map((v) => `<g class="hc-grid"><line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>
      <text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmtV(v)}</text></g>`).join('');
    const step = Math.max(1, Math.ceil(weeks.length / 8));
    const xlabels = weeks.map((w, i) => (i % step === 0 || i === weeks.length - 1)
      ? `<text class="hc-x" x="${x(i)}" y="${H - 10}" text-anchor="middle">${weekLabel(w.key)}</text>` : '').join('');
    // Übrige Ketten als kleine Punkte; bei gleichem Preis leicht versetzt, damit keiner verschwindet
    const others = weeks.map((w, i) => {
      // Gleiche Preise nebeneinander statt übereinander, der Bestpreis bleibt in der Mitte
      const seen = { [w.best.price.toFixed(2)]: 1 };
      return w.shops.slice(1).map((sh) => {
        const k = sh.price.toFixed(2);
        const n = seen[k] || 0;
        seen[k] = n + 1;
        const dx = n === 0 ? 0 : (n % 2 ? 1 : -1) * Math.ceil(n / 2) * 11;
        return `<circle class="hc-dot hc-other" cx="${x(i) + dx}" cy="${y(sh.price)}" r="4.5" style="--c:${shopColor(sh.name, st.names)}">
          <title>${esc(weekLabel(w.key))}: ${fmtV(sh.price)} bei ${esc(sh.name)}</title></circle>`;
      }).join('');
    }).join('');
    const dots = weeks.map((w, i) => `<circle class="hc-dot" cx="${pts[i][0]}" cy="${pts[i][1]}" r="6.5" style="--c:${shopColor(w.best.name, st.names)}">
      <title>${esc(weekLabel(w.key))}: Bestpreis ${fmtV(w.best.price)} bei ${esc(w.best.name)}</title></circle>`).join('');
    return `<svg class="hist-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Angebotspreise je Woche, Bestpreis als Linie">
      ${grid}
      ${area ? `<path class="hc-area" d="${area}"/>` : ''}
      ${weeks.length > 1 ? `<path class="hc-line" d="${line}" pathLength="1"/>` : ''}
      ${others}${dots}${xlabels}
    </svg>`;
  }

  /* Legende und Marktvergleich in einem: je Kette Farbe, Bestpreis-Wochen und Preisspanne */
  function historyLegend(st) {
    return `<div class="hist-legend">${st.shops.map((x) => `<div class="hl">
      <i style="background:${shopColor(x.name, st.names)}"></i>
      <span class="hl-name">${esc(x.name)}</span>
      <span class="hl-best${x.bestWeeks ? '' : ' is-zero'}">${x.bestWeeks ? x.bestWeeks + '× vorn' : 'nie vorn'}</span>
      <span class="hl-range">${x.min === x.max ? fmtV(x.min) : dec(x.min, 2) + '–' + fmtV(x.max)}</span>
    </div>`).join('')}</div>`;
  }

  /* Deal-Bewertung: aktueller Preis gegen die Bestpreise der Vorwochen */
  function dealInfo(o) {
    const value = valueOf(o);
    if (value == null || o.packUnclear) return null;
    const st = historyStats(mergedHistory());
    const own = isoWeekKey(offerDay(o));
    const prior = st.weeks.filter((w) => w.key < own);
    if (prior.length < 2) return null;
    const prices = prior.map((w) => w.best.price);
    const avg = prices.reduce((a, b) => a + b, 0) / prices.length;
    const min = Math.min(...prices);
    let since = 0;
    for (let i = prior.length - 1; i >= 0 && prior[i].best.price > value; i--) since++;
    const diff = (value - avg) / avg;
    const base = { avg, weeks: prior.length };
    if (value < min) return { ...base, tier: 'top', label: 'Tiefster Preis bisher' };
    if (since >= 3) return { ...base, tier: 'good', label: `Bester Preis seit ${since} Wochen` };
    if (diff <= -0.05) return { ...base, tier: 'good', label: `${Math.round(-diff * 100)} % unter dem Schnitt` };
    if (diff >= 0.05) return { ...base, tier: 'meh', label: `${Math.round(diff * 100)} % über dem Schnitt` };
    return { ...base, tier: 'ok', label: 'Üblicher Angebotspreis' };
  }

  function dealBadge(o) {
    const d = dealInfo(o);
    if (!d) return '';
    return `<div class="can-deal is-${d.tier}" title="Schnitt der Bestpreise aus ${d.weeks} Wochen: ${fmtV(d.avg)}">${esc(d.label)}</div>`;
  }

  /* Teilen: Systemmenü des Handys, sonst Text in die Zwischenablage */
  const SHARE = [];
  function shareText(o) {
    const d = dealInfo(o);
    const until = o.to ? ` bis ${['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][new Date(o.to + 'T12:00:00').getDay()]} ${fmtDate(Date.parse(o.to + 'T12:00:00'))}` : '';
    const starts = o.from && o.from > new Date().toISOString().slice(0, 10) ? ` ab ${fmtDate(Date.parse(o.from + 'T12:00:00'))}` : '';
    const good = d && (d.tier === 'top' || d.tier === 'good') ? ' (' + d.label + ')' : '';
    if (LITRE) {
      const what = o.packSize ? `${o.packSize} x ${fmtL(o.litres)} für ${dec(o.packPrice, 2)} €` : (o.litres ? `${fmtL(o.litres)} für ${dec(o.price, 2)} €` : `${dec(o.price, 2)} €`);
      return `${RADAR.emoji} ${RADAR.name} bei ${o.retailer}: ${what}${o.pricePerLitre ? ' (' + fmtV(o.pricePerLitre) + ')' : ''}${starts || until}${good}`;
    }
    const pack = o.packSize ? ` je ${RADAR.unitWord} im ${o.packSize}er-Pack (${dec(o.packPrice, 2)} €)` : '';
    return `${RADAR.emoji} ${RADAR.name} bei ${o.retailer} für ${dec(o.price, 2)} €${pack}${starts || until}${good}`;
  }
  function toast(msg) {
    let el = document.querySelector('.nrg-toast');
    if (!el) { el = document.createElement('div'); el.className = 'nrg-toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = msg;
    el.classList.remove('is-on'); void el.offsetWidth; el.classList.add('is-on');
    clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('is-on'), 2400);
  }
  async function shareOffer(i) {
    const o = SHARE[i];
    if (!o) return;
    const text = shareText(o);
    const url = RADAR.sharePage ? new URL(RADAR.sharePage, location.href).href : location.href.split('#')[0] + (window.RADAR_PRODUCTS ? '#' + RADAR.key : '');
    if (navigator.share) {
      try { await navigator.share({ title: RADAR.title.join(' '), text, url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(text + '\n' + url); toast('Kopiert, jetzt einfach einfügen'); }
    catch (e) { toast(text); }
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-share]');
    if (b) shareOffer(+b.dataset.share);
  });

  function historyBlock() {
    const st = historyStats(mergedHistory());
    if (!st.weeks.length) {
      return `<section class="nrg-section"><h3>Preisverlauf</h3>
        <div class="nrg-empty nrg-empty-soft"><p>Sobald ein Angebot vorliegt, beginnt hier der Verlauf und wächst jede Woche um einen Eintrag.</p></div></section>`;
    }
    const few = st.weeks.length < 3;
    const recent = st.weeks.slice(-8).reverse();
    return `<section class="nrg-section"><h3>Preisverlauf</h3>
      <div class="hist-kpis">
        <div class="hk"><b>${fmtV(st.allTime.price)}</b><span>Tiefster Preis bisher</span><small>${esc(st.allTime.name)}, ${esc(weekLabel(st.allTime.key))}</small></div>
        <div class="hk"><b>${esc(st.shops[0].name)}</b><span>Am häufigsten am günstigsten</span><small>${st.shops[0].bestWeeks} von ${st.weeks.length} ${st.weeks.length === 1 ? 'Woche' : 'Wochen'}</small></div>
        <div class="hk"><b>${st.weeks.length}</b><span>${st.weeks.length === 1 ? 'Woche' : 'Wochen'} erfasst</span><small>seit ${esc(weekLabel(st.weeks[0].key))}</small></div>
      </div>
      <div class="hist-card">
        <div class="hist-card-head"><h4>Angebotspreise je Woche</h4><span>Große Punkte mit Linie = Bestpreis der Woche, kleine Punkte = weitere Angebote</span></div>
        ${historyChart(st)}
        ${historyLegend(st)}
        ${few ? '<p class="nrg-note">Der Verlauf ist noch jung und wächst jede Woche um einen Punkt.</p>' : ''}
      </div>
      <details class="hist-card hist-recent">
        <summary><h4>Die letzten Wochen</h4><span>${Math.min(8, st.weeks.length)} ${Math.min(8, st.weeks.length) === 1 ? 'Woche' : 'Wochen'}</span></summary>
        <ul class="hist-weeks">${recent.map((w) => `<li>
          <span class="hw-week">${esc(weekLabel(w.key))}</span>
          <span class="hw-best"><i class="dot" style="background:${shopColor(w.best.name, st.names)}"></i>${esc(w.best.name)}</span>
          <b>${fmtV(w.best.price)}</b>
          ${w.shops.length > 1 ? `<small>${w.shops.slice(1).map((s2) => esc(s2.name) + ' ' + fmtV(s2.price)).join(', ')}</small>` : ''}
        </li>`).join('')}</ul>
      </details>
    </section>`;
  }

  /* Pepsi-Kopf: aufsteigende Kohlensäure und wogende Oberfläche.
     Zufallswerte aus einem festen Startwert, damit die Perlen beim Neuzeichnen nicht springen. */
  function fizzLayer() {
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const bubbles = [];
    for (let i = 0; i < 34; i++) {
      const size = 8 + Math.round(rnd() * 26);
      bubbles.push(`<i style="--x:${(rnd() * 100).toFixed(1)}%;--s:${size}px;--d:${(5 + rnd() * 7).toFixed(1)}s;--delay:-${(rnd() * 12).toFixed(1)}s;--drift:${Math.round(rnd() * 40 - 20)}px"></i>`);
    }
    return `<div class="nrg-fizz" aria-hidden="true">${bubbles.join('')}</div>`;
  }
  function waveLayer() {
    const wave = (cls) => `<svg class="${cls}" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 60 C 180 20 360 100 540 60 S 900 20 1080 60 S 1260 100 1440 60 L 1440 120 L 0 120 Z"/><path transform="translate(1440 0)" d="M0 60 C 180 20 360 100 540 60 S 900 20 1080 60 S 1260 100 1440 60 L 1440 120 L 0 120 Z"/></svg>`;
    return `<div class="nrg-waves" aria-hidden="true">${wave('w-back')}${wave('w-front')}</div>`;
  }

  /* Monster-Kopf: aufsteigende Funken und eine flackernde Stromlinie wie ein Lichtbogen */
  function sparkLayer() {
    let seed = 11;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const sparks = [];
    for (let i = 0; i < 30; i++) {
      sparks.push(`<i style="--x:${(rnd() * 100).toFixed(1)}%;--h:${10 + Math.round(rnd() * 26)}px;--d:${(2.4 + rnd() * 3.2).toFixed(1)}s;--delay:-${(rnd() * 6).toFixed(1)}s;--drift:${Math.round(rnd() * 60 - 20)}px"></i>`);
    }
    return `<div class="nrg-sparks" aria-hidden="true">${sparks.join('')}</div>`;
  }
  function voltLayer() {
    let seed = 23;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const arc = () => {
      let d = 'M0 34';
      for (let x = 30; x <= 1440; x += 30 + Math.round(rnd() * 30)) d += ` L${x} ${Math.round(12 + rnd() * 44)}`;
      return d + ' L1440 34';
    };
    return `<div class="nrg-volt" aria-hidden="true"><svg viewBox="0 0 1440 68" preserveAspectRatio="none">
      <path class="v-glow" d="${arc()}"/><path class="v1" d="${arc()}"/><path class="v2" d="${arc()}"/><path class="v3" d="${arc()}"/>
    </svg></div>`;
  }

  /* Cola-Kopf: abstrakter Blick ins Glas. Flüssigkeitsschichten in Cola-Braun und Karamell
     wogen gegeneinander, oben eine Schaumkante, darin Eiswürfel und aufsteigende Perlen. */
  function glassLayer() {
    let seed = 31337;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const layer = (cls, y, amp) => {
      const d = `M0 ${y} C 180 ${y - amp} 360 ${y + amp} 540 ${y} S 900 ${y - amp} 1080 ${y} S 1260 ${y + amp} 1440 ${y} L 1440 160 L 0 160 Z`;
      return `<svg class="${cls}" viewBox="0 0 1440 160" preserveAspectRatio="none"><path d="${d}"/><path transform="translate(1440 0)" d="${d}"/></svg>`;
    };
    const ice = [];
    for (let i = 0; i < 5; i++) {
      // Gleichmäßig über den Zyklus verteilt, damit immer mal wieder einer ins Glas fällt
      const d = 14 + rnd() * 6;
      ice.push(`<i style="--x:${(8 + rnd() * 80).toFixed(1)}%;--s:${Math.round(26 + rnd() * 18)}px;--d:${d.toFixed(1)}s;--delay:-${((i / 5 + rnd() * .08) * d).toFixed(1)}s;--r:${Math.round(rnd() * 40 - 20)}deg;--dx:${Math.round((rnd() > .5 ? 1 : -1) * (30 + rnd() * 60))}px"></i>`);
    }
    const bubbles = [];
    for (let i = 0; i < 18; i++) {
      bubbles.push(`<b style="--x:${(rnd() * 100).toFixed(1)}%;--s:${Math.round(3 + rnd() * 6)}px;--d:${(2.5 + rnd() * 3).toFixed(1)}s;--delay:-${(rnd() * 5).toFixed(1)}s"></b>`);
    }
    return `<div class="nrg-glass" aria-hidden="true">
      ${layer('g-foam', 40, 10)}${layer('g-caramel', 52, 16)}${layer('g-cola', 66, 14)}${layer('g-deep', 92, 10)}
      <div class="g-bubbles">${bubbles.join('')}</div><div class="g-ice">${ice.join('')}</div></div>`;
  }

  /* Monster-Kopf: kleine Energy-Dosen schweben taumelnd nach oben (Stil des App-Symbols) */
  function canLayer() {
    let seed = 777777;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
