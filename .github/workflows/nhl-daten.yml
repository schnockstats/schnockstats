name: NHL-Daten aktualisieren

on:
  schedule:
    # 06:30 und 14:30 UTC, also nach den Nachtspielen und am Nachmittag
    - cron: "30 6,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-daten
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten holen
        run: python3 tools/nhl_fetch.py --out data/nhl --seasons 3

      - name: Änderungen einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nhl
          if git diff --staged --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "NHL-Daten aktualisiert ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
