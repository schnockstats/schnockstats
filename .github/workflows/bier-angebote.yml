name: Lecker-Bierchen-Angebote

on:
  schedule:
    # 05:10 UTC, nach dem Lauf für den Spaßgetränke Radar
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-angebote
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bier-Angebote holen
        # Schlägt eine Sorte fehl, laufen die anderen trotzdem weiter
        run: |
          for bier in augustiner veltins paulanerhell peroni corona desperados; do
            echo "::group::$bier"
            python3 tools/angebote_fetch.py --product "$bier" --out data/bier || echo "::warning::$bier fehlgeschlagen"
            echo "::endgroup::"
          done

      - name: Änderungen einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bier
          if git diff --staged --quiet; then
            echo "Keine neuen Angebote."
          else
            git commit -m "Bier-Angebote aktualisiert ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase
            git push
          fi
