name: Radar-Angebote (Monster und Pepsi)

on:
  schedule:
    # 04:40 UTC, also früh genug für die neuen Wochenprospekte
    - cron: "40 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-angebote
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Monster-Angebote holen
        run: python3 tools/angebote_fetch.py --product monster --out data/angebote

      - name: Pepsi-Angebote holen
        # Schlägt Pepsi fehl, bleiben die Monster-Daten trotzdem erhalten
        continue-on-error: true
        run: python3 tools/angebote_fetch.py --product pepsi --out data/angebote

      - name: Änderungen einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/angebote
          if git diff --staged --quiet; then
            echo "Keine neuen Angebote."
          else
            git commit -m "Angebote aktualisiert ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
