    { id: '1X', label: 'Heimteam verliert nicht', col: '1X', group: 'Ergebnis' },
    { id: 'X2', label: 'Auswärtsteam verliert nicht', col: 'X2', group: 'Ergebnis' },
    { id: 'ht05', label: 'Tor in der 1. Halbzeit', col: 'Tor 1. HZ', group: 'Halbzeit' },
    { id: 'ht15', label: 'Über 1.5 Tore in der 1. Halbzeit', col: 'Ü 1.5 HZ', group: 'Halbzeit' }
  ];

  // Tipps, Top-Tipp und Kombis nur aus Tor-Ereignissen: Dort helfen die Saisonzahlen
  // wirklich. Sieg und Doppelte Chance bleiben Info in den Details, denn bei klaren
  // Favoriten (Elfenbeinküste gegen Somalia) zahlt der Buchmacher 1,00 bis 1,04, und
  // das Modell ist bei solchen Außenseitern eher zu vorsichtig als zu mutig.
  // "Unter X Tore" bewusst ausgelassen: Der Nutzer möchte solche Empfehlungen nicht sehen.
  const FOOT_HIGH = ['o15', 'o25', 'o35', 'btts', 'h15', 'a15', 'ht05', 'ht15'];
  // Eishockey: "beide treffen" oder Ü 3.5 passieren fast immer, die Quoten sind
  // entsprechend wertlos. Interessant wird es ab Ü 4.5 und bei den Teamtoren.
  const HOCK_HIGH = ['o45', 'o55', 'o65', 'h25', 'a25', 'h35', 'a35'];
  // Obergrenze je Baustein: sicherere Ereignisse haben beim Buchmacher Quoten nahe 1
  // und bringen in einer Kombi nichts. Der Top-Tipp braucht mindestens faire Quote 1,30.
  const MAX_TIP_P = { fussball: 0.8, eishockey: 0.8 };
  const TOP_TIP_MIN_ODDS = 1.3;
  const MARKET_MIN_ODDS = 1.2;
  function tipOk(v, m, id) {
    if (v == null || isNaN(v) || v > MAX_TIP_P[S.sport]) return false;
    // Liegt eine echte Marktquote vor und ist sie mickrig, taugt der Tipp nicht
    if (m && id === 'o25' && m.o25 != null && m.o25 < MARKET_MIN_ODDS) return false;
    return true;
  }
  const FOOT_DETAIL = ['o05', 'o15', 'o25', 'o35', 'o45', 'g13', 'btts', 'hs', 'h15', 'as', 'a15', 'ht05', 'ht15', '1X', 'X2'];
  const HOCK_DETAIL = ['o45', 'o55', 'o65', 'btts', 'h25', 'h35', 'a25', 'a35', 'win1', 'win2', 'reg1', 'reg2', 'ot', 'hpl', 'apl'];

  const SPORTS = {
    fussball: {
      id: 'fussball', label: 'Fußball', brand: 'Schnockstats', title: 'Schnockstats – Fußballstatistik',
      markets: FOOT_MARKETS, detail: FOOT_DETAIL, high: FOOT_HIGH, multiLeague: true
    },
    eishockey: {
      id: 'eishockey', label: 'Eishockey', short: 'Hockey', brand: 'SchnockHockey', title: 'SchnockHockey – NHL-Statistik',
      markets: H.MARKETS, detail: HOCK_DETAIL, high: HOCK_HIGH, multiLeague: true
    }
  };
  for (const sp of Object.values(SPORTS)) sp.market = Object.fromEntries(sp.markets.map((m) => [m.id, m]));


  const BRAND_MARK = {
    // Fußball: Mittelkreis und Mittellinie
    fussball: '<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="13" y1="1.5" x2="13" y2="24.5" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="13" r="2.6" fill="var(--floodlight)"/></svg>',
    // Eishockey: Puck von der Seite
    eishockey: '<svg viewBox="0 0 26 26"><ellipse cx="13" cy="9.5" rx="10.5" ry="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 9.5v6a10.5 4.5 0 0 0 21 0v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><ellipse cx="13" cy="9.5" rx="4" ry="1.6" fill="var(--floodlight)"/></svg>'
  };
  const FAVICON = { fussball: '⚽', eishockey: '🏒' };

  const newStore = () => ({ ds: null, dataTime: 0, stale: false, error: null, models: new Map(), analyses: new Map(), meta: null, loading: false });

  const S = {
    theme: 'dark',
    sport: 'fussball',
    view: 'spiele',
    stores: { fussball: newStore(), eishockey: newStore() },
    day: null,
    allDays: false,
    leagues: null,          // null = noch nicht gesetzt, nach dem Laden sind alle Ligen an
    leaguesPref: false,
    hLeagues: null,         // Eishockey-Ligen, null = alle
    pickerOpen: false,
    stat: { fussball: { s1: 'o25', s2: 'btts', top: 'o25' }, eishockey: { s1: 'o55', s2: 'win1', top: 'o55' } },
    mode: 'model',
    open: new Set(),
    h2h: new Map(),
    tableLeague: 'bl1',
    tableSort: { key: 'pos', dir: 1 },
    check: { fussball: null, eishockey: null },
    kombi: { scope: 'tag', legs: 4, minOdds: 1 },
    goalShown: false,
    goalLegs: 4,
    goalMinOdds: 1.3,
    checkRunning: false,
    checkProgress: ''
  };

  const sport = () => SPORTS[S.sport];
  const store = () => S.stores[S.sport];
  const isHockey = () => S.sport === 'eishockey';
  const stat = () => S.stat[S.sport];

  /* ---------- Hilfen ---------- */

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const pct = (p) => (p == null || isNaN(p) ? '–' : Math.round(p * 100) + '\u202F%');
  const dec = (x, d) => (x == null || isNaN(x) ? '–' : x.toFixed(d == null ? 2 : d).replace('.', ','));
  const fairOdds = (p) => (p == null || p <= 0.001 ? '–' : dec(1 / p, 2));
  const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

  function dayStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function addDays(ts, n) { const d = new Date(ts); d.setDate(d.getDate() + n); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function fmtTime(ts) { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function fmtDate(ts, withYear) {
    const d = new Date(ts);
    const s = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.';
    return withYear ? s + String(d.getFullYear()).slice(2) : s;
  }
  function fmtDay(ts) { return WD[new Date(ts).getDay()] + ' ' + fmtDate(ts); }
  function seasonLabel(y) { return isHockey() ? String(y).slice(0, 4) + '/' + String(y).slice(6) : y + '/' + String(y + 1).slice(2); }
  function currentSeason() { const d = new Date(); return d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1; }

  const LEAGUE = { nhl: Object.assign({ country: 'Nordamerika', tier: 1, order: 0, sport: 'eishockey' }, H.LEAGUE) };
  // Europäische Eishockey-Ligen, Kürzel für die Plaketten
  const HOCKEY_SHORT = { del: 'DEL', ice: 'ICE', nl: 'NL', elh: 'ELH', shl: 'SHL', liiga: 'LIIGA' };
  function registerHockeyLeagues(list) {
    (list || []).forEach((l, i) => {
      LEAGUE[l.id] = { id: l.id, name: l.name, short: HOCKEY_SHORT[l.id] || l.id.toUpperCase(), country: l.country,
        tier: 1, rank: 1, order: 1 + i, kind: 'league', sport: 'eishockey' };
    });
  }
  for (const l of M.LEAGUES) LEAGUE[l.id] = Object.assign({ country: 'Deutschland', tier: l.rank, order: l.rank }, l);
  const GERMAN = ['bl1', 'bl2', 'bl3'];
  // Weitere Ligen, die OpenLigaDB live pflegt. Nur die laufende Saison, damit
  // der Start schnell bleibt; fehlt eine Liga, wird sie still übersprungen.
  const OLDB_EXTRA = [
    { id: 'BLÖ', name: 'Bundesliga', country: 'Österreich', tier: 1 },
    { id: 'dfb', name: 'DFB-Pokal', country: 'Deutschland', tier: 1, kind: 'cup' },
    { id: 'ucl2026', name: 'Champions League', country: 'Europa', tier: 1, kind: 'euro', fallback: true },
    { id: 'uel2026', name: 'Europa League', country: 'Europa', tier: 1, kind: 'euro', fallback: true },
    { id: 'ffb1', name: 'Frauen-Bundesliga', country: 'Deutschland', tier: 1 }
  ];
  const isGerman = (lg) => GERMAN.indexOf(lg) >= 0;

  // Auf dem deutschen Markt nicht tippbar, deshalb ausgeblendet (auch wenn ältere Daten sie noch enthalten)
  const HIDDEN_LEAGUES = new Set(['NOR2', 'DNK3', 'rlno', 'rln', 'regio-bayern']);

  function registerLeagues(list) {
    const meta = {};
    (list || []).filter((l) => !HIDDEN_LEAGUES.has(l.id)).forEach((l, i) => {
      const kind = l.kind || 'league';
      const cc = l.country.slice(0, 3).toUpperCase();
      const short = l.short || (kind === 'euro' ? l.id.replace(/\d+$/, '').toUpperCase()
        : kind === 'intl' ? 'NAT' : kind === 'cup' ? cc + ' P' : cc + (l.tier > 1 ? ' ' + l.tier : ''));
      // Reihenfolge: Länderspiele und Europapokal oben, Pokale hinter den Ligen
      const order = (kind === 'intl' ? 10 : kind === 'euro' ? 20 : kind === 'cup' ? 600 : 100) + i;
      LEAGUE[l.id] = { id: l.id, name: l.country + ' – ' + l.name, short, country: l.country, tier: l.tier, rank: l.tier, order, kind };
      meta[l.id] = { country: l.country, tier: l.tier, kind, pool: kind === 'intl' ? 'INT' : null };
    });
    M.setLeagueMeta(meta);
  }
  const leagueOrder = (lg) => (LEAGUE[lg] ? LEAGUE[lg].order : 999);
  const footballLeagues = () => Object.values(LEAGUE).filter((l) => l.sport !== 'eishockey').sort((a, b) => a.order - b.order);
  const hockeyLeagues = () => Object.values(LEAGUE).filter((l) => l.sport === 'eishockey').sort((a, b) => a.order - b.order);
  const sportLeagues = () => (isHockey() ? hockeyLeagues() : footballLeagues());
  // Auswahl je Sportart getrennt
  const selSet = () => (isHockey() ? S.hLeagues : S.leagues);
  function setSel(set) { if (isHockey()) S.hLeagues = set; else { S.leagues = set; S.leaguesPref = true; } }

  function team(id) { const ds = store().ds; return (ds && ds.teams[id]) || { n: 'Team ' + id, s: 'Team ' + id, i: '' }; }
  function teamName(id, cls) {
    const t = team(id);
    const icon = t.i ? `<img class="crest" src="${esc(t.i)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<span class="crest crest-empty" aria-hidden="true"></span>';
    return `<span class="team-name ${cls || ''}">${icon}<span class="full">${esc(t.n)}</span><span class="short">${esc(t.s)}</span></span>`;
  }

  function readJSON(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function writeJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } }

  function savePrefs() {
    // "known": alle Ligen, die es beim Speichern gab. Neue Wettbewerbe werden später automatisch mit ausgewählt.
    const known = S.stores.fussball.ds ? footballLeagues().map((l) => l.id) : (S.knownLeagues ? Array.from(S.knownLeagues) : null);
    writeJSON(PREFS, { theme: S.theme, sport: S.sport, stat: S.stat, mode: S.mode, leagues: S.leagues ? Array.from(S.leagues) : null, known, hleagues: S.hLeagues ? Array.from(S.hLeagues) : null, allDays: S.allDays, tsSound: !!S.tsSound, kombi: S.kombi, goalLegs: S.goalLegs, goalMinOdds: S.goalMinOdds });
  }
  function loadPrefs() {
    const p = readJSON(PREFS);
    if (!p) return;
    if (SPORTS[p.sport]) S.sport = p.sport;
    if (p.theme === 'light') S.theme = 'light';
    if (p.stat) {
      for (const k of ['fussball', 'eishockey']) {
        const src = p.stat[k], sp = SPORTS[k];
        if (!src) continue;
        for (const f of ['s1', 's2', 'top']) if (src[f] && sp.market[src[f]]) S.stat[k][f] = src[f];
      }
    }
    if (p.mode === 'model' || p.mode === 'hist') S.mode = p.mode;
    if (Array.isArray(p.leagues) && p.leagues.length) { S.leagues = new Set(p.leagues.filter((l) => l !== 'nhl')); S.leaguesPref = true; }
    if (Array.isArray(p.known)) S.knownLeagues = new Set(p.known);
    if (Array.isArray(p.hleagues) && p.hleagues.length) S.hLeagues = new Set(p.hleagues);
    S.allDays = !!p.allDays;
    S.tsSound = !!p.tsSound;
    if (p.goalLegs >= 3 && p.goalLegs <= 6) S.goalLegs = p.goalLegs;
    if (p.goalMinOdds >= 1.1 && p.goalMinOdds <= 2) S.goalMinOdds = p.goalMinOdds;
    if (p.kombi && p.kombi.legs >= 2 && p.kombi.legs <= 8) S.kombi = { scope: p.kombi.scope || 'tag', legs: p.kombi.legs, minOdds: +p.kombi.minOdds || 1 };
  }

  /* ---------- Daten: Fußball ---------- */

  async function fetchJSON(url, opts) {
    const res = await fetch(url, Object.assign({ headers: { Accept: 'application/json' } }, opts || {}));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function loadFootballSeason(lg, season, force) {
    const key = CACHE + lg + ':' + season;
    const cached = readJSON(key);
    const ttl = season >= currentSeason() ? CURRENT_TTL : 7 * DAY;
    if (cached && !force && Date.now() - cached.at < ttl) return cached;
    try {
      const raw = await fetchJSON(`${OLDB}/getmatchdata/${lg}/${season}`);
      const list = Array.isArray(raw) ? raw : [];
      const data = { at: Date.now(), teams: M.extractTeams(list), matches: list.map(M.normalizeMatch) };
      writeJSON(key, data);
      return data;
    } catch (err) {
      if (cached) { cached.stale = true; return cached; }
      throw err;
    }
  }

  const at = (r, i) => (i == null || r[i] === undefined ? null : r[i]);

  async function loadFootball(force) {
    const st = S.stores.fussball;
    const cur = currentSeason();
    const jobs = [];
    for (const lg of ['bl1', 'bl2', 'bl3']) for (const s of [cur - 2, cur - 1, cur]) jobs.push({ lg, s });
    let done = 0;
    setLoading(`Lade Spieldaten (0 von ${jobs.length})`);
    const results = [];
    let failures = 0, stale = false;
    const queue = jobs.slice();
    async function worker() {
      while (queue.length) {
        const job = queue.shift();
        try {
          const d = await loadFootballSeason(job.lg, job.s, force && job.s === cur);
          if (d.stale) stale = true;
          results.push(d);
        } catch (e) { failures++; }
        done++;
        setLoading(`Lade Spieldaten (${done} von ${jobs.length})`);
      }
    }
    await Promise.all([worker(), worker(), worker()]);
    const teams = {};
    const matches = [];
    for (const r of results) { Object.assign(teams, r.teams); for (const m of r.matches) matches.push(m); }
    // Zusatzligen von OpenLigaDB, laufende Saison
    const oldbExtra = [];
    await Promise.all(OLDB_EXTRA.map(async (l) => {
      try {
        const d = await loadFootballSeason(l.id, cur, force);
        if (!d.matches || d.matches.length < 10) return;
        Object.assign(teams, d.teams);
        for (const m of d.matches) matches.push(m);
        oldbExtra.push(l);
      } catch (e) { /* Liga fehlt, wird übersprungen */ }
    }));
    if (oldbExtra.length) registerLeagues(oldbExtra);

    let extra = null;
    try {
      setLoading('Lade internationale Ligen');
      const meta = await fetchJSON(`${FUSS_DIR}/meta.json`, { cache: 'no-cache' });
      const v = encodeURIComponent(meta.generated || '');
      const [leagues, extraTeams, data] = await Promise.all([
        fetchJSON(`${FUSS_DIR}/leagues.json?v=${v}`),
        fetchJSON(`${FUSS_DIR}/teams.json?v=${v}`),
        fetchJSON(`${FUSS_DIR}/matches.json?v=${v}`)
      ]);
      registerLeagues(leagues);
      // Europapokal lieber aus ESPN (alle Teams zugeordnet); OpenLigaDB nur als Ersatz
      if (leagues.some((l) => l.kind === 'euro')) {
        for (const l of OLDB_EXTRA) if (l.fallback && LEAGUE[l.id]) {
          delete LEAGUE[l.id];
          for (let i = matches.length - 1; i >= 0; i--) if (matches[i].lg === l.id) matches.splice(i, 1);
        }
      }
      Object.assign(teams, extraTeams);
      const c = data.cols;
      const idx = Object.fromEntries(c.map((name, i) => [name, i]));
      for (const r of data.rows) {
        if (HIDDEN_LEAGUES.has(r[idx.lg])) continue;
        const hg = r[idx.hg], ag = r[idx.ag];
        matches.push({
          id: r[idx.id], lg: r[idx.lg], season: r[idx.season], t: r[idx.t],
          md: null, mdName: '', h: r[idx.h], a: r[idx.a],
          fin: hg != null && ag != null, hg, ag,
          hh: r[idx.hh], ha: r[idx.ha], goals: [],
          oh: idx.oh != null ? r[idx.oh] : null, od: idx.od != null ? r[idx.od] : null,
          oa: idx.oa != null ? r[idx.oa] : null, o25: idx.o25 != null ? r[idx.o25] : null,
          neu: at(r, idx.neu) ? 1 : 0
        });
      }
      extra = meta;
        } catch (err) {
      extra = null;
    }
    if (!matches.length) throw new Error('keine Daten');
    st.meta = extra;
    st.ds = M.buildDataset(matches, teams);
    st.dataTime = Date.now();
    st.stale = stale || failures > 0;
    st.models.clear(); st.analyses.clear();
    const allIds = footballLeagues().map((l) => l.id);
    if (!S.leaguesPref || !S.leagues) S.leagues = new Set(allIds);
    else {
      for (const lg of Array.from(S.leagues)) if (!LEAGUE[lg]) S.leagues.delete(lg);
      // Neu hinzugekommene Wettbewerbe (z. B. Pokale, Länderspiele) gleich mit anzeigen
      for (const lg of allIds) if (!S.knownLeagues || !S.knownLeagues.has(lg)) S.leagues.add(lg);
      S.knownLeagues = new Set(allIds);
      if (!S.leagues.size) S.leagues = new Set(allIds);
    }
  }

  /* ---------- Daten: Eishockey ---------- */

  async function loadHockey() {
    const st = S.stores.eishockey;
    setLoading('Lade NHL-Daten');
    const meta = await fetchJSON(`${NHL_DIR}/meta.json`, { cache: 'no-cache' });
    const v = encodeURIComponent(meta.generated || '');
    const teams = await fetchJSON(`${NHL_DIR}/teams.json?v=${v}`);
    const matches = [];
    let done = 0;
    for (const season of meta.seasons) {
      setLoading(`Lade NHL-Daten (${++done} von ${meta.seasons.length})`);
      const games = await fetchJSON(`${NHL_DIR}/season-${season}.json?v=${v}`);
      for (const m of H.normalizeGames(games, 'nhl')) matches.push(m);
    }
    // Europäische Ligen (DEL, ICE, National League, Extraliga, SHL, Liiga)
    try {
      setLoading('Lade europäische Ligen');
      const em = await fetchJSON(`${HOCKEY_DIR}/meta.json`, { cache: 'no-cache' });
      const ev = encodeURIComponent(em.generated || '');
      const [eTeams, eGames] = await Promise.all([
        fetchJSON(`${HOCKEY_DIR}/teams.json?v=${ev}`), fetchJSON(`${HOCKEY_DIR}/games.json?v=${ev}`)
      ]);
      registerHockeyLeagues(em.leagues);
      Object.assign(teams, eTeams);
      for (const m of H.normalizeGames(eGames)) matches.push(m);
    } catch (e) { /* nur NHL */ }
    st.ds = M.buildDataset(matches, teams);
    st.meta = meta;
    st.dataTime = Date.now();
    st.stale = false;
    st.models.clear(); st.analyses.clear();
  }

  function setLoading(text) { const el = $('#status'); if (el) el.textContent = text; }

  /* ---------- Analyse ---------- */

  function cutoffFor(ts) { return Math.min(dayStart(ts), store().dataTime); }

  function getModel(lg, cutoff) {
    const st = store();
    const key = (isHockey() ? lg : (M.poolOf(lg) || lg)) + '|' + cutoff;
    if (!st.models.has(key)) st.models.set(key, isHockey() ? H.fit(st.ds, cutoff, null, lg) : M.fitLeague(st.ds, lg, cutoff));
    return st.models.get(key);
  }

  /* Pokal und Europapokal: Die Teams kommen aus verschiedenen Ligen und spielen
     dort selten gegeneinander. Jedes Team bekommt deshalb seine Stärke aus seiner
     eigenen Liga, dazu eine grobe Stärke der Liga selbst (Land und Spielklasse). */
  const CROSS_KINDS = { cup: 1, euro: 1 };
  const isCross = (lg) => !!(LEAGUE[lg] && CROSS_KINDS[LEAGUE[lg].kind]);
  // log-Skala, 0 = England; eine Spielklasse tiefer kostet TIER_STEP
  const COUNTRY_STRENGTH = {
    England: 0, Spanien: -0.05, Deutschland: -0.08, Italien: -0.08, Frankreich: -0.18,
    Portugal: -0.3, Niederlande: -0.3, Belgien: -0.38, 'Türkei': -0.42, Tschechien: -0.48,
    Griechenland: -0.5, 'Österreich': -0.48, Schweiz: -0.5, 'Dänemark': -0.5, Schottland: -0.52,
    Norwegen: -0.55, Polen: -0.58, Kroatien: -0.58, Serbien: -0.62, Israel: -0.65, Zypern: -0.65,
    Ukraine: -0.58, Schweden: -0.6, 'Rumänien': -0.68, Russland: -0.55, Irland: -0.9, Finnland: -0.9
  };
  const TIER_STEP = 0.3;
  const leagueStrength = (lg) => {
    const L = LEAGUE[lg];
    const c = COUNTRY_STRENGTH[L.country];
    return (c == null ? -0.8 : c) - TIER_STEP * ((L.tier || 1) - 1);
  };
  function homeLeagueOf(tid, cutoff) {
    const list = store().ds.byTeam.get(tid) || [];
    let best = null;
    for (const m of list) {
      const L = LEAGUE[m.lg];
      if (!L || (L.kind && L.kind !== 'league')) continue;
      if (m.t < cutoff) best = m;
      else { if (!best) best = m; break; }
    }
    return best ? best.lg : null;
  }
  function crossModel(m, cutoff) {
    const side = (tid) => {
      const lg = homeLeagueOf(tid, cutoff);
      if (!lg) return null;
      const mod = getModel(lg, cutoff);
      const r = M.teamRating(mod, tid);
      return { lg, mod, A: r.A, D: r.D, games: r.games, s: leagueStrength(lg), g: Math.sqrt(mod.bh * mod.ba), adv: Math.sqrt(mod.bh / mod.ba) };
    };
    // Teams ohne Ligadaten (Amateure im Pokal, Exoten im Europapokal): deutlich schwächer als der Gegner
    const unknown = (ref) => ({ lg: null, mod: ref ? ref.mod : null, A: 0.9, D: 1.1, games: 0,
      s: ref ? Math.min(ref.s, -0.5) - 2 * TIER_STEP : -1, g: ref ? ref.g : 1.35, adv: ref ? ref.adv : 1.12 });
    let h = side(m.h), a = side(m.a);
    if (!h && !a) { h = unknown(null); a = unknown(null); }
    else if (!h) h = unknown(a);
    else if (!a) a = unknown(h);
    const d = h.s - a.s;
    const g = Math.sqrt(h.g * a.g), adv = m.neu ? 1 : h.adv;
    const ref = h.mod || a.mod;
    return {
      cross: true, lg: m.lg, cutoff, season: ref ? ref.season : null,
      bh: g * adv * Math.exp(d), ba: g / adv * Math.exp(-d), bn: g,
      rho: ref ? ref.rho : -0.05, idx: new Map([[m.h, 0], [m.a, 1]]),
      A: [h.A, a.A], D: [h.D, a.D], games: [h.games, a.games], stats: null,
      nMatches: (h.mod ? h.mod.nMatches : 0) + (a.mod ? a.mod.nMatches : 0),
      htFrac: ref ? ref.htFrac : 0.44, ogRate: ref ? ref.ogRate : 0.03, avgGoals: 2 * g,
      options: ref ? ref.options : { maxGoals: 10 }, homeLg: h.lg, awayLg: a.lg
    };
  }

  function analyze(m) {
    const st = store();
    if (st.analyses.has(m.id)) return st.analyses.get(m.id);
    const cutoff = cutoffFor(m.t);
    const model = !isHockey() && isCross(m.lg) ? crossModel(m, cutoff) : getModel(m.lg, cutoff);
    let an;
    if (isHockey()) {
      const pred = H.predict(model, m.h, m.a);
      const hH = H.teamHistory(st.ds, m.h, cutoff, 10);
      const hA = H.teamHistory(st.ds, m.a, cutoff, 10);
      an = { cutoff, model, pred, hH, hA, hist: H.historyMatch(hH, hA) };
    } else {
      // Beim Pokalmodell stecken Heimvorteil und Ligastärke schon in den Basiswerten
      const pred = M.predictMatch(model, m.h, m.a, !model.cross && m.neu);
      const hH = M.teamHistory(st.ds, m.h, cutoff, 10);
      const hA = M.teamHistory(st.ds, m.a, cutoff, 10);
      an = { cutoff, model, pred, hH, hA, hist: M.historyMatch(hH, hA) };
    }
    st.analyses.set(m.id, an);
    return an;
  }

  const outcomeOf = (m, id) => (isHockey() ? H.outcome(m, id) : M.outcome(m, id));
  const finalScore = (m) => (isHockey() ? [m.hgF, m.agF] : [m.hg, m.ag]);

  function valueOf(an, id, mode) {
    const src = (mode || S.mode) === 'model' ? an.pred.p : an.hist;
    return src ? src[id] : null;
  }

  /* ---------- Bausteine ---------- */

  function heatStyle(v, market) {
    if (v == null) return '';
    const x = market && market.value
      ? (market.heat ? clamp((v - market.heat[0]) / market.heat[1], 0, 1) : clamp((v - (isHockey() ? 4.5 : 2)) / 2.5, 0, 1))
      : clamp((v - 0.3) / 0.65, 0, 1);
    const p = Math.round(Math.pow(x, 1.15) * 88);
    return ` style="--heat:${p}%" data-hot="${p > 52 ? 1 : 0}"`;
  }

  function statPill(an, m, id, mode) {
    const market = sport().market[id];
    const v = valueOf(an, id, mode);
    if (v == null || !market) return '<span class="pill pill-empty">–</span>';
    const text = market.value ? dec(v, 2) : pct(v);
    let mark = '';
    if (m.fin && !market.value) {
      const oc = outcomeOf(m, id);
      if (oc === true) mark = '<span class="mark hit" title="Eingetreten">✓</span>';
      else if (oc === false) mark = '<span class="mark miss" title="Nicht eingetreten">✗</span>';
    }
    return `<span class="pill"${heatStyle(v, market)}>${text}${mark}</span>`;
  }

  function formDots(form) {
    return `<span class="dots" aria-hidden="true">${form.map((f) => `<i class="r-${f.r}"></i>`).join('')}</span>`;
  }

  function formCell(h) {
    if (!h.n) return '<td class="form"><span class="muted">–</span></td>';
    return `<td class="form"><b>${dec(h.ppg, 2)}</b>${formDots(h.form)}</td>`;
  }

  function marketSelect(id, value, label) {
    const groups = {};
    for (const mk of sport().markets) (groups[mk.group] = groups[mk.group] || []).push(mk);
    const opts = Object.entries(groups).map(([g, list]) =>
      `<optgroup label="${esc(g)}">${list.map((mk) => `<option value="${mk.id}"${mk.id === value ? ' selected' : ''}>${esc(mk.label)}</option>`).join('')}</optgroup>`).join('');
    return `<label class="select"><span>${esc(label)}</span><select id="${id}">${opts}</select></label>`;
  }

  function modeSwitch() {
    return `<div class="segmented" role="group" aria-label="Berechnung">
      <button data-mode="model" aria-pressed="${S.mode === 'model'}">Modell</button>
      <button data-mode="hist" aria-pressed="${S.mode === 'hist'}">Letzte 10</button>
    </div>`;
  }

  function leagueChips() {
    const all = sportLeagues();
    const sel = activeLeagues();
    const byCountry = new Map();
    for (const l of all) {
      if (!byCountry.has(l.country)) byCountry.set(l.country, []);
      byCountry.get(l.country).push(l);
    }
    const groups = Array.from(byCountry.entries()).map(([country, list]) =>
      `<fieldset><legend>${esc(country)}</legend>${list.map((l) => `<label class="lg-opt">
        <input type="checkbox" data-league="${l.id}"${sel.has(l.id) ? ' checked' : ''}>
        <span>${esc(l.name.replace(country + ' – ', ''))}</span></label>`).join('')}</fieldset>`).join('');
    const picked = all.filter((l) => sel.has(l.id));
    const label = picked.length === 1 ? picked[0].name : `${picked.length} von ${all.length} Ligen`;
    return `<details class="leaguepicker"${S.pickerOpen ? ' open' : ''}>
      <summary><span class="lp-label">${esc(label)}</span></summary>
      <div class="lp-panel">
        <div class="lp-head"><b>${isHockey() ? 'Ligen wählen' : 'Wettbewerbe wählen'}</b><button type="button" class="btn" data-action="picker-close">Fertig</button></div>
        <div class="lp-actions">
          ${isHockey() ? `<button class="btn-quiet btn-sm" data-pick="nhl">Nur NHL</button>
          <button class="btn-quiet btn-sm" data-pick="eu">Nur Europa</button>` : `<button class="btn-quiet btn-sm" data-pick="de">Nur Deutschland</button>
          <button class="btn-quiet btn-sm" data-pick="top">Große Ligen</button>`}
          <button class="btn-quiet btn-sm" data-pick="all">Alle</button>
        </div>
        <div class="lp-groups">${groups}</div>
      </div></details>`;
  }
  const TOP_LEAGUES = ['bl1', 'bl2', 'bl3', 'E0', 'SP1', 'I1', 'F1', 'N1', 'dfb', 'UCL', 'UEL', 'UECL', 'UNL', 'FAC', 'CDR'];

  const activeLeagues = () => selSet() || new Set(sportLeagues().map((l) => l.id));

  function dataNotice() {
    if (isHockey()) return '';
    const st = store();
    if (!st.meta) {
      return `<p class="notice">Zurzeit sind nur die deutschen Ligen geladen. Die internationalen Ligen liegen im Ordner <code>data/fussball</code> und werden vom Actions-Job „Fußball-Daten aktualisieren“ erzeugt. Starte ihn einmal von Hand, dann erscheinen sie hier automatisch.</p>`;
    }
    const now = Date.now();
    const lgs = activeLeagues();
    const missing = [];
    for (const l of footballLeagues()) {
      if (!lgs.has(l.id) || isGerman(l.id)) continue;
      // Nur Ligen melden, die gerade laufen: zuletzt gespielt, aber ohne Ansetzungen
      let recent = false, upcoming = false;
      for (const m of st.ds.matches) {
        if (m.lg !== l.id) continue;
        if (m.fin && now - m.t < 21 * DAY) recent = true;
        else if (!m.fin && m.t > now && m.t < addDays(now, 21)) { upcoming = true; break; }
      }
      if (recent && !upcoming) missing.push(l.name);
    }
    if (!missing.length) return '';
    const names = missing.length > 5 ? `${missing.length} Ligen` : missing.join(', ');
    const fx = st.meta.fixtures || {};
    let why = '';
    if (typeof fx.main === 'number') {
      why = fx.main > 0
        ? ` Die wöchentliche Spielplan-Datei hat zuletzt ${fx.main} Partien geliefert.`
        : ' Die wöchentliche Spielplan-Datei der Quelle kam beim letzten Lauf leer an, deshalb fehlen die Ansetzungen.';
    }
    return `<p class="notice">Für ${esc(names)} liegt gerade kein Spielplan vor, dort siehst du nur gespielte Partien. Ergebnisse, Tabellen und Statistiken sind vorhanden.${why} Ligen in der Saisonpause sind nicht mitgezählt.</p>`;
  }

  /* ---------- Ansicht: Spiele ---------- */

  function matchesInRange(from, to) {
    const ds = store().ds;
    const lgs = activeLeagues();
    return ds.matches.filter((m) => lgs.has(m.lg) && m.t >= from && m.t < to);
  }

  function pickDefaultDay() {
    const today = dayStart(Date.now());
    for (let off = 0; off <= 5; off++) if (matchesInRange(addDays(today, off), addDays(today, off + 1)).length) return off;
    return 0;
  }

  function renderSpiele() {
    const today = dayStart(Date.now());
    if (S.day == null) S.day = pickDefaultDay();
    const tabs = [];
    for (let off = -1; off <= 5; off++) {
      const start = addDays(today, off);
      const count = matchesInRange(start, addDays(today, off + 1)).length;
      const label = off === -1 ? 'Gestern' : off === 0 ? 'Heute' : off === 1 ? 'Morgen' : fmtDay(start);
      tabs.push(`<button class="day" data-day="${off}" aria-pressed="${!S.allDays && S.day === off}"${count ? '' : ' data-empty="1"'}>
        <span>${esc(label)}</span><small>${count ? count + ' Spiele' : 'keine Spiele'}</small></button>`);
    }

    let from, to;
    if (S.allDays) { from = addDays(today, -1); to = addDays(today, 6); }
    else { from = addDays(today, S.day); to = addDays(today, S.day + 1); }
    const list = matchesInRange(from, to).sort((a, b) => a.t - b.t || (leagueOrder(a.lg) - leagueOrder(b.lg)));

    const groups = new Map();
    for (const m of list) {
      const key = (S.allDays ? dayStart(m.t) + '|' : '') + m.lg;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(m);
    }

    const s = stat();
    const c1 = sport().market[s.s1], c2 = sport().market[s.s2];
    let body = '';
    for (const key of Array.from(groups.keys())) {
      const ms = groups.get(key);
      const lg = ms[0].lg;
      const mds = Array.from(new Set(ms.map((m) => m.mdName).filter(Boolean)));
      const dayLabel = S.allDays ? fmtDay(ms[0].t) + ', ' : '';
      body += `<tbody class="league-group"><tr class="group-row"><th colspan="7" scope="colgroup">
        <span class="lg-badge lg-${lg}">${esc(LEAGUE[lg].short)}</span>${esc(dayLabel)}${esc(LEAGUE[lg].name)}<span class="muted">${esc(mds.join(', '))}</span></th></tr>`;
      for (const m of ms) body += matchRow(m);
      body += '</tbody>';
    }

    const lgs = activeLeagues();
    const next = store().ds.matches.find((m) => lgs.has(m.lg) && !m.fin && m.t >= Date.now());
    const empty = `<div class="empty"><p>Für diesen Tag sind keine Spiele angesetzt.${next
      ? ` Das nächste Spiel ist am ${fmtDay(next.t)} um ${fmtTime(next.t)} Uhr.`
      : ''}</p>${next && dayStart(next.t) <= addDays(today, 5) ? '<button class="btn" data-action="next-day">Nächsten Spieltag anzeigen</button>' : ''}</div>`;

    return `
      ${stageHtml(list)}
      ${dataNotice()}
      <div class="daybar" role="group" aria-label="Tag wählen">${tabs.join('')}</div>
      <div class="toolbar">
        ${leagueChips()}
        <div class="toolbar-right">
          ${marketSelect('stat1', s.s1, '1. Statistik')}
          ${marketSelect('stat2', s.s2, '2. Statistik')}
          ${modeSwitch()}
          <label class="check"><input type="checkbox" id="allDays"${S.allDays ? ' checked' : ''}> Alle Tage zusammen</label>
        </div>
      </div>
      ${list.length ? `<div class="table-wrap"><table class="matches">
        <colgroup><col class="c-time"><col class="c-team"><col class="c-form"><col class="c-stat"><col class="c-stat"><col class="c-form"><col class="c-team"></colgroup>
        <thead><tr>
          <th scope="col">Zeit</th><th scope="col" class="t-right">Heim</th><th scope="col" class="form">Form</th>
          <th scope="col" class="stat">${esc(c1.col)}</th><th scope="col" class="stat">${esc(c2.col)}</th>
          <th scope="col" class="form">Form</th><th scope="col">Auswärts</th>
        </tr></thead>${body}</table></div>` : empty}
      <p class="legend">Form = Punkte pro Spiel aus den letzten 5 Partien${isHockey() ? ' (Sieg 2, Niederlage nach Verlängerung 1)' : ''}. ${S.mode === 'model'
        ? 'Werte aus dem Modell: Teamstärke in Angriff und Abwehr, Heimvorteil, jüngere Spiele zählen stärker.'
        : 'Werte aus den letzten 10 Spielen beider Teams, ohne Gewichtung nach Gegner.'} Ein Klick auf ein Spiel zeigt alle Details.</p>`;
  }

  /* Bühne oben auf der Spiele-Seite: Flutlicht über dem Rasen (bzw. Eisfläche),
     die wichtigsten Zahlen des Tages und der sicherste Einzeltipp. */
  function stageHtml(list) {
    const today = dayStart(Date.now());
    const label = S.allDays ? 'Diese Woche' : S.day === 0 ? 'Heute' : S.day === 1 ? 'Morgen' : S.day === -1 ? 'Gestern' : fmtDay(addDays(today, S.day));
    const leagues = new Set(list.map((m) => m.lg)).size;
    const open = list.filter((m) => !m.fin && m.t > Date.now() - 2 * 3600000);
    let best = null, sumAvg = 0, nAvg = 0, strong = 0;
    for (const m of list) {
      const an = analyze(m);
      if (an.pred.p.avg != null) { sumAvg += an.pred.p.avg; nAvg++; }
      if (m.fin) continue;
      for (const id of sport().high) {
        const v = an.pred.p[id];
        if (!tipOk(v, m, id)) continue;
        if (v >= 0.75) strong++;
        if (1 / v < TOP_TIP_MIN_ODDS) continue;
        if (!best || v > best.p) best = { m, id, p: v };
      }
    }
    const pitch = isHockey()
      ? '<rect x="4" y="4" width="992" height="192" rx="60"/><path class="l2" d="M500 4v192M330 4v192M670 4v192"/><circle class="l3" cx="500" cy="100" r="34"/><circle class="l3" cx="190" cy="60" r="26"/><circle class="l3" cx="810" cy="140" r="26"/>'
      : '<rect x="4" y="4" width="992" height="192"/><path class="l2" d="M500 4v192M4 45h120v110H4M996 45H876v110h120"/><circle class="l3" cx="500" cy="100" r="42"/>';
    const ball = isHockey()
      ? '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="11" ry="6" fill="#0b0f16"/><ellipse cx="12" cy="10.5" rx="11" ry="5" fill="#23262d"/></svg>'
      : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff"/><path d="M12 6.5l4.2 3-1.6 5H9.4l-1.6-5z" fill="#111"/><path d="M12 1v5.5M3 9l4.8.5M21 9l-4.8.5M6.5 20.5l2.9-6M17.5 20.5l-2.9-6" stroke="#111" stroke-width="1.2"/></svg>';
    const mk = best ? sport().market[best.id] : null;
    return `<section class="stage" aria-label="Überblick">
      <svg class="stage-lines" viewBox="0 0 1000 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${pitch}</svg>
      <i class="stage-beam b1" aria-hidden="true"></i><i class="stage-beam b2" aria-hidden="true"></i>
      <div class="stage-ball" aria-hidden="true">${ball}</div>
      <h2>${esc(label)}: <em><span data-countup="${list.length}">${list.length}</span> ${list.length === 1 ? 'Spiel' : 'Spiele'}</em></h2>
      <p class="stage-sub">${list.length ? `in ${leagues} ${leagues === 1 ? 'Liga' : 'Ligen'}, davon ${open.length} noch offen` : 'Keine Spiele an diesem Tag.'}</p>
      ${list.length ? `<div class="stage-kpis">
        <div class="kpi"><b data-countup="${nAvg ? (sumAvg / nAvg).toFixed(2) : 0}" data-countup-decimals="2">${nAvg ? dec(sumAvg / nAvg, 2) : '–'}</b><small>⌀ erwartete Tore</small></div>
        <div class="kpi"><b data-countup="${strong}">${strong}</b><small>Werte ab 75 %</small></div>
        <div class="kpi"><b data-countup="${leagues}">${leagues}</b><small>${leagues === 1 ? 'Liga' : 'Ligen'}</small></div>
      </div>` : ''}
      ${best ? `<div class="tip-card" data-tip="${best.m.id}" role="button" tabindex="0">
        <span class="tip-p">${pct(best.p)}</span>
        <span class="tip-t"><b>${esc(mk.label)}</b><span>${esc(team(best.m.h).s)} – ${esc(team(best.m.a).s)}, ${fmtTime(best.m.t)} Uhr · faire Quote ${fairOdds(best.p)}</span></span>
        <span class="tip-tag">Top-Tipp</span></div>` : ''}
    </section>`;
  }

  function matchRow(m) {
    const an = analyze(m);
    const open = S.open.has(m.id);
    const s = stat();
    const [hg, ag] = finalScore(m);
    const otTag = isHockey() && m.otType && m.otType !== 'REG' ? (m.otType === 'SO' ? 'n. P.' : 'n. V.') : 'Ende';
    const time = m.fin
      ? `<span class="score">${hg}:${ag}</span><small>${otTag}</small>`
      : (m.t < Date.now() - 3 * 3600000 ? `<span class="time">${fmtTime(m.t)}</span><small>kein Ergebnis</small>`
        : m.t < Date.now() ? `<span class="time">${fmtTime(m.t)}</span><small class="live">läuft</small>`
          : m.t < Date.now() + 2 * 3600000 ? `<span class="time">${fmtTime(m.t)}</span><small class="soon"><i></i>gleich</small>`
            : `<span class="time">${fmtTime(m.t)}</span>`);
    const row = `<tr class="match${open ? ' is-open' : ''}" data-match="${m.id}" tabindex="0" aria-expanded="${open}">
      <td class="kick">${time}</td>
      <td class="home">${teamName(m.h, 'home')}</td>
      ${formCell(an.hH)}
      <td class="stat">${statPill(an, m, s.s1)}</td>
      <td class="stat">${statPill(an, m, s.s2)}</td>
      ${formCell(an.hA)}
      <td class="away">${teamName(m.a, 'away')}</td>
    </tr>`;
    return open ? row + `<tr class="detail-row"><td colspan="7">${renderDetail(m, an)}</td></tr>` : row;
  }

  /* ---------- Spieldetails ---------- */

  function renderDetail(m, an) {
    const p = an.pred.p, h = an.hist || {};
    const th = team(m.h), ta = team(m.a);
    const mk = sport().market;

    const three = isHockey()
      ? [[p.reg1, 'tw-1', th.s], [p.ot, 'tw-x', 'Verlängerung'], [p.reg2, 'tw-2', ta.s]]
      : [[p['1'], 'tw-1', th.s], [p.X, 'tw-x', 'Remis'], [p['2'], 'tw-2', ta.s]];
    const threeWay = `<div class="threeway">${three.map(([v, cls]) => `<span class="${cls}" style="flex:${v}"><b>${pct(v)}</b></span>`).join('')}</div>
      <div class="tw-labels">${three.map(([, , lab]) => `<span>${esc(lab)}</span>`).join('')}</div>
      ${isHockey() ? `<p class="small">Inklusive Verlängerung und Penaltyschießen: ${esc(th.s)} ${pct(p.win1)}, ${esc(ta.s)} ${pct(p.win2)}</p>` : ''}
      ${!isHockey() && m.oh != null ? `<p class="small">Marktquote (Ø Wettanbieter): ${dec(m.oh, 2)} / ${dec(m.od, 2)} / ${dec(m.oa, 2)}</p>` : ''}`;

    const marketOdds = !isHockey() && (m.oh != null || m.o25 != null)
      ? { '1': m.oh, X: m.od, '2': m.oa, o25: m.o25 } : null;
    const mkTable = `<table class="mini">
      <thead><tr><th scope="col">Ereignis</th><th scope="col" class="num">Modell</th><th scope="col" class="num">Letzte 10</th><th scope="col" class="num">Faire Quote</th>${marketOdds ? '<th scope="col" class="num">Marktquote</th>' : ''}</tr></thead>
      <tbody>${sport().detail.filter((id) => p[id] != null || h[id] != null).map((id) => {
        const label = mk[id] ? mk[id].label : id === 'o05' ? 'Über 0.5 Tore' : id === 'o45' ? 'Über 4.5 Tore' : id;
        const oc = m.fin ? outcomeOf(m, id) : null;
        const mark = oc === true ? ' <span class="mark hit">✓</span>' : oc === false ? ' <span class="mark miss">✗</span>' : '';
        const mo = marketOdds ? marketOdds[id] : null;
        return `<tr><th scope="row">${esc(label)}${mark}</th>
          <td class="num"><span class="bar" style="--w:${Math.round((p[id] || 0) * 100)}%"></span>${pct(p[id])}</td>
          <td class="num muted-num">${pct(h[id])}</td><td class="num">${fairOdds(p[id])}</td>${marketOdds ? `<td class="num">${mo != null ? dec(mo, 2) : '–'}</td>` : ''}</tr>`;
      }).join('')}</tbody></table>`;

    const top = `<ol class="scores">${an.pred.top.map((c) => `<li><b>${c.h}:${c.a}</b><span>${pct(c.p)}</span></li>`).join('')}</ol>`;

    const formList = (hist) => {
      if (!hist.n) return '<p class="muted">Keine früheren Spiele in den Daten.</p>';
      return `<ul class="formlist">${hist.form.slice().reverse().map((f) => {
        const opp = f.home ? f.m.a : f.m.h;
        return `<li><span class="res r-${f.r}">${f.r}</span><span class="fl-date">${fmtDate(f.m.t, true)}</span>
          <span class="fl-opp">${f.home ? 'vs.' : 'bei'} ${esc(team(opp).s)}</span><b>${f.f}:${f.a}</b></li>`;
      }).join('')}</ul>
      <p class="small">Letzte 10: ${dec(hist.gf, 1)} Tore erzielt, ${dec(hist.ga, 1)} kassiert pro Spiel</p>`;
    };

    const [hgF, agF] = finalScore(m);
    const resultExtra = isHockey()
      ? (m.otType && m.otType !== 'REG' ? ` (${m.otType === 'SO' ? 'nach Penaltyschießen' : 'nach Verlängerung'}, regulär ${m.hg}:${m.ag})` : '')
      : (m.hh != null ? ` (Halbzeit ${m.hh}:${m.ha})` : '');
    const result = m.fin ? `<p class="result-line">Endstand <b>${hgF}:${agF}</b>${resultExtra}. Die Prognose nutzt nur Spiele vor diesem Tag.</p>` : '';

    let h2hHtml;
    if (isHockey() || !isGerman(m.lg)) {
      const list = (store().ds.byTeam.get(m.h) || []).filter((x) => x.fin && (x.h === m.a || x.a === m.a)).sort((a, b) => b.t - a.t).slice(0, 8);
      h2hHtml = list.length
        ? `<ul class="formlist">${list.map((x) => `<li><span class="fl-date">${fmtDate(x.t, true)}</span>
            <span class="fl-opp">${esc(team(x.h).s)} – ${esc(team(x.a).s)}</span><b>${isHockey() ? x.hgF : x.hg}:${isHockey() ? x.agF : x.ag}</b></li>`).join('')}</ul>`
        : '<p class="muted">Keine früheren Duelle in den geladenen Saisons.</p>';
    } else {
      const key = Math.min(m.h, m.a) + '-' + Math.max(m.h, m.a);
      const h2h = S.h2h.get(key);
      if (!h2h) { h2hHtml = '<p class="muted">Wird geladen …</p>'; loadH2H(m, key); }
      else if (h2h.error) h2hHtml = '<p class="muted">Der direkte Vergleich konnte nicht geladen werden.</p>';
      else if (!h2h.list.length) h2hHtml = '<p class="muted">Keine früheren Duelle gefunden.</p>';
      else h2hHtml = `<ul class="formlist">${h2h.list.map((x) => `<li><span class="fl-date">${fmtDate(x.t, true)}</span>
          <span class="fl-opp">${esc(team(x.h).s)} – ${esc(team(x.a).s)}</span><b>${x.hg}:${x.ag}</b></li>`).join('')}</ul>
          <p class="small">${h2h.summary}</p>`;
    }

    return `<div class="detail">
      <div class="detail-head">
        <div><h3>${esc(th.n)} – ${esc(ta.n)}</h3>
          <p class="small">${esc(LEAGUE[m.lg].name)}${m.mdName ? ', ' + esc(m.mdName) : ''}, ${fmtDay(m.t)} ${fmtTime(m.t)} Uhr</p>
          ${result}</div>
        <div class="xg"><span class="xg-num">${dec(an.pred.lh, 2)}</span><span class="xg-sep">:</span><span class="xg-num">${dec(an.pred.la, 2)}</span>
          <small>erwartete Tore${isHockey() ? ', reguläre Zeit' : ''}</small></div>
      </div>
      <div class="detail-grid">
        <section class="d-result"><h4>Ausgang</h4>${threeWay}<h4>Wahrscheinlichste Ergebnisse</h4>${top}</section>
        <section class="d-markets"><h4>Ereignisse</h4><div class="table-wrap">${mkTable}</div>
          ${marketOdds ? '<p class="small">Marktquote = Durchschnitt vieler Wettanbieter zum Zeitpunkt des letzten Datenabrufs, keine Empfehlung.</p>' : ''}</section>
        ${whyHtml(m, an)}
        <section class="d-form"><h4>Form ${esc(th.s)}</h4>${formList(an.hH)}<h4>Form ${esc(ta.s)}</h4>${formList(an.hA)}</section>
        <section class="d-h2h"><h4>Direkter Vergleich</h4><div>${h2hHtml}</div></section>
      </div>
    </div>`;
  }

  /* ---------- Torprofil und Begründung ----------
     Alles, was zu einer Tor-Prognose führt, aus der laufenden Saison bzw. den
     letzten Monaten: Ligaschnitt, Angriff und Abwehr beider Teams, daraus die
     erwarteten Tore und die Wahrscheinlichkeit je Linie. */
  const PROFILE_DAYS = 150;
  function goalProfile(tid, cutoff, venue) {
    const hk = isHockey();
    const line = hk ? 5.5 : 2.5, teamLine = hk ? 2.5 : 1.5;
    const list = (store().ds.byTeam.get(tid) || []).filter((x) => x.fin && x.t < cutoff && cutoff - x.t < PROFILE_DAYS * DAY);
    const P = { n: 0, gf: 0, ga: 0, over: 0, btts: 0, scored: 0, team2: 0, conc2: 0, cs: 0, vn: 0, vgf: 0, vga: 0, vover: 0, last: [], line, teamLine };
    for (const x of list) {
      const home = x.h === tid;
      const f = hk ? (home ? x.hgF : x.agF) : (home ? x.hg : x.ag);
      const a = hk ? (home ? x.agF : x.hgF) : (home ? x.ag : x.hg);
      P.n++; P.gf += f; P.ga += a;
      if (f + a > line) P.over++;
      if (f > 0 && a > 0) P.btts++;
      if (f > 0) P.scored++;
      if (a === 0) P.cs++;
      if (f > teamLine) P.team2++;
      if (a > teamLine) P.conc2++;
      if ((venue === 'h') === home) { P.vn++; P.vgf += f; P.vga += a; if (f + a > line) P.vover++; }
    }
    P.last = list.slice(-5).map((x) => { const home = x.h === tid; return hk ? (home ? [x.hgF, x.agF] : [x.agF, x.hgF]) : (home ? [x.hg, x.ag] : [x.ag, x.hg]); });
    return P;
  }
  const perGame = (sum, n) => (n ? dec(sum / n, 2) : '–');
  const share = (k, n) => (n ? `${k}/${n} <span class="muted">(${Math.round(k / n * 100)} %)</span>` : '–');

  function whyHtml(m, an) {
    const th = team(m.h), ta = team(m.a), mod = an.model, hk = isHockey();
    const H = goalProfile(m.h, an.cutoff, 'h'), A = goalProfile(m.a, an.cutoff, 'a');
    const rh = M.teamRating(mod, m.h), ra = M.teamRating(mod, m.a);
    const base = mod.cross ? null : { h: mod.bh, a: mod.ba };
    const lh = an.pred.lh, la = an.pred.la;
    const pc = (x) => Math.round(x * 100);
    const steps = [];
    if (base) steps.push(`<li><b>Ligaschnitt</b> der letzten Monate: ${dec(base.h + base.a, 2)} Tore pro Spiel, Heimteams ${dec(base.h, 2)}, Gäste ${dec(base.a, 2)}.</li>`);
    else steps.push(`<li><b>Pokal/Europapokal:</b> beide Teams mit ihren Werten aus der eigenen Liga, dazu die Stärke der Liga (${esc(LEAGUE[mod.homeLg] ? LEAGUE[mod.homeLg].name : 'unbekannt')} gegen ${esc(LEAGUE[mod.awayLg] ? LEAGUE[mod.awayLg].name : 'unbekannt')}).</li>`);
    steps.push(`<li><b>${esc(th.s)}</b> trifft ${pc(rh.A)} % des Ligaschnitts, <b>${esc(ta.s)}</b> lässt ${pc(ra.D)} % zu → <b>${dec(lh, 2)}</b> erwartete Tore${hk ? ' (reguläre Zeit)' : ''}.</li>`);
    steps.push(`<li><b>${esc(ta.s)}</b> trifft ${pc(ra.A)} % des Ligaschnitts, <b>${esc(th.s)}</b> lässt ${pc(rh.D)} % zu → <b>${dec(la, 2)}</b> erwartete Tore.</li>`);
    const p = an.pred.p;
    steps.push(hk
      ? `<li>Zusammen <b>${dec(lh + la, 2)}</b> Tore. Die Verteilung der Ergebnisse daraus ergibt Über 5.5 ${pct(p.o55)}, Über 4.5 ${pct(p.o45)}, ${esc(th.s)} über 2.5 ${pct(p.h25)}.</li>`
      : `<li>Zusammen <b>${dec(lh + la, 2)}</b> Tore. Die Verteilung der Ergebnisse daraus ergibt Über 2.5 ${pct(p.o25)}, beide treffen ${pct(p.btts)}, ${esc(th.s)} über 1.5 ${pct(p.h15)}.</li>`);
    const row = (label, a, b) => `<tr><th scope="row">${label}</th><td class="num">${a}</td><td class="num">${b}</td></tr>`;
    const last = (P) => P.last.length ? P.last.map(([f, a]) => `<span class="gl ${f > a ? 'w' : f < a ? 'l' : 'd'}">${f}:${a}</span>`).join('') : '–';
    const table = `<table class="mini why-table"><thead><tr><th scope="col">Letzte ${PROFILE_DAYS} Tage</th><th scope="col" class="num">${esc(th.s)}</th><th scope="col" class="num">${esc(ta.s)}</th></tr></thead><tbody>
      ${row('Spiele', H.n, A.n)}
      ${row('Tore pro Spiel', perGame(H.gf, H.n), perGame(A.gf, A.n))}
      ${row('Gegentore pro Spiel', perGame(H.ga, H.n), perGame(A.ga, A.n))}
      ${row('Tore : Gegentore ' + '(zu Hause / auswärts)', H.vn ? `${perGame(H.vgf, H.vn)} : ${perGame(H.vga, H.vn)}` : '–', A.vn ? `${perGame(A.vgf, A.vn)} : ${perGame(A.vga, A.vn)}` : '–')}
      ${row(`Spiele mit über ${hk ? '5.5' : '2.5'} Toren`, share(H.over, H.n), share(A.over, A.n))}
      ${row('Beide trafen', share(H.btts, H.n), share(A.btts, A.n))}
      ${row(`Mind. ${hk ? 3 : 2} eigene Tore`, share(H.team2, H.n), share(A.team2, A.n))}
      ${row(`Mind. ${hk ? 3 : 2} Gegentore`, share(H.conc2, H.n), share(A.conc2, A.n))}
      ${row('Letzte 5 (eigene:Gegentore)', `<span class="gl-row">${last(H)}</span>`, `<span class="gl-row">${last(A)}</span>`)}
    </tbody></table>`;
    return `<section class="d-why"><h4>So kommt der Wert zustande</h4>
      <div class="why-grid"><ol class="why-steps">${steps.join('')}</ol><div class="table-wrap">${table}</div></div>
      <p class="small">Angriff und Abwehr sind zeitlich gewichtet: Ein Spiel von vor ${hlText(mod)} zählt halb so viel wie eines von heute, ältere Spielzeiten fallen praktisch heraus.</p></section>`;
  }
  function hlText(mod) {
    const d = (mod && mod.options && mod.options.halfLife) || 90;
    return d >= 60 ? `${String(Math.round(d / 30 * 2) / 2).replace('.', ',')} Monaten` : `${d} Tagen`;
  }

  async function loadH2H(m, key) {
    if (S.h2h.has(key)) return;
    S.h2h.set(key, null);
    try {
      const raw = await fetchJSON(`${OLDB}/getmatchdata/${m.h}/${m.a}`);
      const list = (Array.isArray(raw) ? raw : []).map(M.normalizeMatch).filter((x) => x.fin).sort((a, b) => b.t - a.t).slice(0, 8);
      let wh = 0, d = 0, wa = 0;
      for (const x of list) {
        const gh = x.h === m.h ? x.hg : x.ag, ga = x.h === m.h ? x.ag : x.hg;
        if (gh > ga) wh++; else if (gh === ga) d++; else wa++;
      }
      const siege = (n) => n + (n === 1 ? ' Sieg' : ' Siege');
      S.h2h.set(key, { list, summary: list.length ? `${esc(team(m.h).s)} ${siege(wh)}, ${d} Remis, ${esc(team(m.a).s)} ${siege(wa)}` : '' });
    } catch (e) { S.h2h.set(key, { error: true }); }
    render();
  }

  /* ---------- Ansicht: Statistiken ---------- */

  function renderStatistiken() {
    const now = Date.now();
    const mkId = stat().top;
    const mk = sport().market[mkId];
    const list = matchesInRange(now - 2 * 3600000, addDays(now, 8)).filter((m) => !m.fin);
    const rows = list.map((m) => { const an = analyze(m); return { m, an, v: an.pred.p[mkId], hv: an.hist ? an.hist[mkId] : null }; });
    rows.sort((a, b) => b.v - a.v);
    const body = rows.map(({ m, an, v, hv }) => `<tr class="linkrow" data-goto="${m.id}" tabindex="0">
      <td class="nowrap">${fmtDay(m.t)} <span class="muted">${fmtTime(m.t)}</span></td>
      ${sport().multiLeague ? `<td><span class="lg-badge lg-${m.lg}">${esc(LEAGUE[m.lg].short)}</span></td>` : ''}
      <td class="pairing">${teamName(m.h)}<span class="vs">–</span>${teamName(m.a)}</td>
      <td class="num">${statPill(an, m, mkId, 'model')}</td>
      <td class="num muted-num">${mk.value ? dec(hv, 2) : pct(hv)}</td>
      <td class="num">${mk.value ? '–' : fairOdds(v)}</td>
    </tr>`).join('');
    return `
      <div class="page-head"><h2>Statistiken</h2><p>Alle anstehenden Spiele der nächsten 7 Tage, sortiert nach Wahrscheinlichkeit.</p></div>
      <div class="toolbar">
        ${leagueChips()}
        <div class="toolbar-right">${marketSelect('statMarket', mkId, 'Ereignis')}</div>
      </div>
      ${rows.length ? `<div class="table-wrap"><table class="list">
        <thead><tr><th scope="col">Anstoß</th>${sport().multiLeague ? '<th scope="col">Liga</th>' : ''}<th scope="col">Begegnung</th>
        <th scope="col" class="num">Modell</th><th scope="col" class="num">Letzte 10</th><th scope="col" class="num">Faire Quote</th></tr></thead>
        <tbody>${body}</tbody></table></div>`
      : '<div class="empty"><p>In den nächsten 7 Tagen sind keine Spiele angesetzt.</p></div>'}
      <p class="legend">Faire Quote = 1 geteilt durch die Wahrscheinlichkeit, also die Quote ohne Buchmacher-Marge.</p>`;
  }

  /* ---------- Ansicht: Ligen ---------- */

  function leagueTabs(active, attr, only) {
    const list = (only || sportLeagues()).filter((l) => !l.kind || l.kind === 'league');
    if (list.length <= 4) {
      return `<div class="tabs" role="group" aria-label="Liga">${list.map((l) =>
        `<button class="tab" ${attr}="${l.id}" aria-pressed="${active === l.id}">${esc(l.name)}</button>`).join('')}</div>`;
    }
    const groups = new Map();
    for (const l of list) {
      if (!groups.has(l.country)) groups.set(l.country, []);
      groups.get(l.country).push(l);
    }
    return `<label class="select select-wide"><span>Liga</span><select ${attr}-select>${
      Array.from(groups.entries()).map(([country, ls]) => `<optgroup label="${esc(country)}">${ls.map((l) =>
        `<option value="${l.id}"${l.id === active ? ' selected' : ''}>${esc(l.name.replace(country + ' – ', ''))}</option>`).join('')}</optgroup>`).join('')
    }</select></label>`;
  }

  function renderLigen() {
    const st = store();
    const lg = isHockey() ? (LEAGUE[S.hTableLeague] ? S.hTableLeague : 'nhl') : (LEAGUE[S.tableLeague] ? S.tableLeague : 'bl1');
    const season = isHockey() ? st.meta.current : M.seasonAt(st.ds, lg, st.dataTime);
    if (season == null) return leagueTabs(lg, 'data-table') + '<div class="empty"><p>Für diese Liga liegen keine Daten vor.</p></div>';
    const model = getModel(lg, st.dataTime);
    const base = isHockey() ? H.table(st.ds, season, null, lg) : M.leagueTable(st.ds, lg, season);
    const rows = base.map((r) => {
      const rt = M.teamRating(model, r.team);
      return Object.assign({}, r, {
        diff: r.tf - r.tg,
        avg: r.sp ? (r.tf + r.tg) / r.sp : null,
        rate1: r.sp ? (isHockey() ? r.o55 : r.o25) / r.sp : null,
        rate2: r.sp && !isHockey() ? r.btts / r.sp : null,
        csp: r.sp && !isHockey() ? r.cs / r.sp : null,
        att: rt.A * 100, def: 100 / rt.D, name: team(r.team).n
      });
    });
    const { key, dir } = S.tableSort;
    rows.sort((a, b) => {
      const x = a[key], y = b[key];
      if (typeof x === 'string') return dir * x.localeCompare(y);
      return dir * ((x == null ? -1e9 : x) - (y == null ? -1e9 : y)) || a.pos - b.pos;
    });
    const cols = isHockey()
      ? [['pos', '#', 1], ['name', 'Team', 1], ['sp', 'Sp', -1], ['s', 'S', -1], ['otl', 'N n.V.', -1], ['n', 'N', -1],
      ['tf', 'Tore', -1], ['diff', 'Diff', -1], ['pts', 'Pkt', -1], [null, 'Form'],
      ['avg', '⌀ Tore', -1], ['rate1', 'Ü 5.5', -1], ['att', 'Angriff', -1], ['def', 'Abwehr', -1]]
      : [['pos', '#', 1], ['name', 'Verein', 1], ['sp', 'Sp', -1], ['s', 'S', -1], ['u', 'U', -1], ['n', 'N', -1],
      ['tf', 'Tore', -1], ['diff', 'Diff', -1], ['pts', 'Pkt', -1], [null, 'Form'],
      ['avg', '⌀ Tore', -1], ['rate1', 'Ü 2.5', -1], ['rate2', 'BTTS', -1], ['csp', 'Zu Null', -1], ['att', 'Angriff', -1], ['def', 'Abwehr', -1]];
    const head = cols.map(([k, label, d]) => {
      if (!k) return `<th scope="col">${label}</th>`;
      const active = key === k;
      return `<th scope="col" aria-sort="${active ? (dir === 1 ? 'ascending' : 'descending') : 'none'}" class="${k === 'name' ? '' : 'num'}">
        <button class="sort" data-sort="${k}" data-dir="${d}">${label}${active ? (dir === 1 ? ' ▲' : ' ▼') : ''}</button></th>`;
    }).join('');
    const rate = (v) => `<span class="rating" style="--r:${Math.round(clamp((v - 60) / 80, 0, 1) * 55)}%">${Math.round(v)}</span>`;
    const body = rows.map((r) => `<tr>
      <td class="num">${r.pos}</td><td>${teamName(r.team)}</td>
      <td class="num">${r.sp}</td><td class="num">${r.s}</td><td class="num">${isHockey() ? r.otl : r.u}</td><td class="num">${r.n}</td>
      <td class="num nowrap">${r.tf}:${r.tg}</td><td class="num">${r.diff > 0 ? '+' : ''}${r.diff}</td><td class="num"><b>${r.pts}</b></td>
      <td>${formDots(r.form.map((x) => ({ r: x })))}</td>
      <td class="num">${dec(r.avg, 2)}</td><td class="num">${pct(r.rate1)}</td>
      ${isHockey() ? '' : `<td class="num">${pct(r.rate2)}</td><td class="num">${pct(r.csp)}</td>`}
      <td class="num">${rate(r.att)}</td><td class="num">${rate(r.def)}</td>
    </tr>`).join('');
    return `
      <div class="page-head"><h2>${isHockey() ? esc(LEAGUE[lg].name) + '-Tabelle' : 'Ligen'}</h2>
        <p>Saison ${seasonLabel(season)}. Angriff und Abwehr: 100 = Ligaschnitt, höher ist besser.${isHockey() ? (lg === 'nhl' ? ' Punkte: Sieg 2, Niederlage nach Verlängerung 1.' : ' Punkte: Sieg 3, Sieg nach Verlängerung oder Penaltyschießen 2, Niederlage danach 1.') : ''}</p></div>
      ${leagueTabs(lg, 'data-table')}
      <div class="table-wrap"><table class="list table-league"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
      <p class="legend">${isHockey() ? 'Eine Gesamttabelle über die ganze Liga, ohne Divisions- und Conference-Einteilung.' : 'Die Tabelle wird aus den Ergebnissen berechnet. Punktabzüge sind nicht enthalten.'}</p>`;
  }

  /* ---------- Ansicht: Schürfkombi ---------- */

  /* Tore-Kombi: ausschließlich Tor-Ereignisse, jedes Spiel mit mindestens Quote 1,30,
     darunter die höchsten Wahrscheinlichkeiten, die diese Hürde noch nehmen. */
  const GOAL_MARKETS = {
    fussball: ['o15', 'o25', 'o35', 'btts', 'h15', 'a15', 'ht05', 'ht15'],
    eishockey: ['o45', 'o55', 'o65', 'h25', 'a25', 'h35', 'a35']
  };
  const GOAL_MIN_ODDS = 1.30;

  // Nächster Tag mit Spielen, die noch nicht angepfiffen sind (für Kombis)
  function nextOpenDay() {
    const now = Date.now(), today = dayStart(now);
    for (let off = 0; off <= 6; off++) {
      const from = addDays(today, off);
      const list = matchesInRange(from, addDays(today, off + 1)).filter((m) => !m.fin && m.t > now);
      if (list.length) return { off, from, list };
    }
    return null;
  }

  function goalCombo() {
    const pick = nextOpenDay();
    if (!pick) return null;
    const { off, from, list } = pick;

    const maxP = 1 / (S.goalMinOdds || GOAL_MIN_ODDS);
    const legCount = S.goalLegs || 4;
    const cands = [];
    for (const m of list) {
      const an = analyze(m);
      for (const id of GOAL_MARKETS[S.sport]) {
        const v = an.pred.p[id];
        if (v == null || isNaN(v) || v > maxP || v < 0.35) continue;
        cands.push({ m, an, id, p: v });
      }
    }
    cands.sort((a, b) => b.p - a.p);

    const used = new Set();
    const perMarket = new Map();
    const legs = [];
    for (let pass = 0; pass < 2 && legs.length < legCount; pass++) {
      for (const r of cands) {
        if (legs.length >= legCount) break;
        if (used.has(r.m.id)) continue;
        if (pass === 0 && (perMarket.get(r.id) || 0) >= 2) continue;
        used.add(r.m.id);
        perMarket.set(r.id, (perMarket.get(r.id) || 0) + 1);
        legs.push(r);
      }
    }
    if (legs.length < 2) return null;
    const product = legs.reduce((acc, r) => acc / r.p, 1);
    const prob = legs.reduce((acc, r) => acc * r.p, 1);
    return { legs, product, prob, pool: cands, label: off === 0 ? 'heute' : off === 1 ? 'morgen' : fmtDay(from).toLowerCase() };
  }

  /* Begründung aus echten Kennzahlen des Spiels, kein Textbaustein-Zufall */
  function goalReason(r) {
    const { m, an, id } = r;
    const th = esc(team(m.h).s), ta = esc(team(m.a).s);
    const lh = an.pred.lh, la = an.pred.la, tot = lh + la;
    // Saisonzahlen: laufende Saison bzw. die letzten Monate, Heimteam zu Hause, Gast auswärts
    const H = goalProfile(m.h, an.cutoff, 'h'), A = goalProfile(m.a, an.cutoff, 'a');
    const of = (k, n) => (n ? `${k} von ${n}` : 'keinem');
    const avg = (s, n) => (n ? dec(s / n, 1) : '–');
    const parts = [`Erwartet: <b>${dec(tot, 1)} Tore</b> (${dec(lh, 1)} zu ${dec(la, 1)}).`];
    const lineOf = { o15: 1.5, o25: 2.5, o35: 3.5, o45: 4.5, o55: 5.5, o65: 6.5 };
    if (lineOf[id] != null) {
      const ln = lineOf[id];
      const cnt = (P, tid) => (store().ds.byTeam.get(tid) || []).filter((x) => x.fin && x.t < an.cutoff && an.cutoff - x.t < PROFILE_DAYS * DAY
        && (isHockey() ? x.hgF + x.agF : x.hg + x.ag) > ln).length;
      parts.push(`Über ${String(ln).replace('.', ',')} fiel bei ${th} in ${of(cnt(H, m.h), H.n)}, bei ${ta} in ${of(cnt(A, m.a), A.n)} Spielen dieser Saison.`);
      parts.push(`${th} erzielt ${avg(H.gf, H.n)} und kassiert ${avg(H.ga, H.n)} pro Spiel, ${ta} ${avg(A.gf, A.n)} und ${avg(A.ga, A.n)}.`);
    } else if (id === 'btts') {
      parts.push(`${th} traf in ${of(H.scored, H.n)} Spielen, ${ta} in ${of(A.scored, A.n)}. Ohne Gegentor blieb ${th} ${H.cs}-mal, ${ta} ${A.cs}-mal.`);
    } else if (id === 'h15' || id === 'h25' || id === 'h35' || id === 'hs') {
      parts.push(`${th} erzielt zu Hause ${avg(H.vgf, H.vn)} Tore pro Spiel, ${ta} kassiert auswärts ${avg(A.vga, A.vn)}.`);
      parts.push(`Mindestens ${isHockey() ? 3 : 2} Tore: ${th} in ${of(H.team2, H.n)} Spielen, ${ta} ließ so viele in ${of(A.conc2, A.n)} zu.`);
    } else if (id === 'a15' || id === 'a25' || id === 'a35' || id === 'as') {
      parts.push(`${ta} erzielt auswärts ${avg(A.vgf, A.vn)} Tore pro Spiel, ${th} kassiert zu Hause ${avg(H.vga, H.vn)}.`);
      parts.push(`Mindestens ${isHockey() ? 3 : 2} Tore: ${ta} in ${of(A.team2, A.n)} Spielen, ${th} ließ so viele in ${of(H.conc2, H.n)} zu.`);
    } else if (id === 'ht05' || id === 'ht15') {
      parts.push(`Rund 44 Prozent der Tore fallen vor der Pause; bei ${dec(tot, 1)} erwarteten Toren ergibt das ${dec(tot * (an.model.htFrac || 0.44), 1)} in Halbzeit eins.`);
    }
    const mo = !isHockey() && id === 'o25' && m.o25 != null ? ` Der Wettmarkt sieht hier ${dec(m.o25, 2)}, das Modell ${fairOdds(r.p)}.` : '';
    return parts.join(' ') + mo;
  }

  function renderGoalCombo(g, animate) {
    if (!g) return '';
    const rows = g.legs.map((r, k) => `<li style="--leg:${legColor(r.id)}" data-leg="${k}">

      <div class="gc-bar"><span style="width:${Math.round(r.p * 100)}%"></span></div>

    return `<section class="goalcombo${animate ? ' is-new' : ''}">

    </section>`;

  function renderTore() {
    const g = goalCombo();
    const animate = !S.goalShown && !!g;
    if (g) S.goalShown = true;
    S.torShow = g ? { g, autoplay: animate } : null;
    const head = `<div class="tore-hero">
      <div class="tore-hero-text">
        <h2>Tore<em>-Kombi</em></h2>
        <p>Tipps, die nur eines gemeinsam haben: Es muss klingeln. Jedes Spiel mit mindestens Quote ${dec(S.goalMinOdds || GOAL_MIN_ODDS, 2)}, darunter die beste Wahrscheinlichkeit, die der Tag hergibt.</p>
      </div>
      ${g ? '<div class="torshow" id="torshow"></div>' : ''}
    </div>`;
    const controls = `<div class="toolbar">
      ${leagueChips()}
      <div class="toolbar-right">
        <label class="select"><span>Umfang</span><select id="goalLegs">${[3, 4, 5, 6].map((n) =>
          `<option value="${n}"${n === S.goalLegs ? ' selected' : ''}>${n} Tipps</option>`).join('')}</select></label>
        <label class="select"><span>Mindestquote</span><select id="goalOdds">${[1.2, 1.3, 1.45, 1.6].map((v) =>
          `<option value="${v}"${v === S.goalMinOdds ? ' selected' : ''}>ab ${dec(v, 2)}</option>`).join('')}</select></label>
      </div>
    </div>`;
    if (!g) {
      return head + controls + '<div class="empty"><p>Für den nächsten Spieltag findet sich gerade keine Kombination, die diese Hürde nimmt. Senke die Mindestquote oder wähle mehr Ligen.</p></div>';
    }
    return head + controls + renderGoalCombo(g, animate) + renderGoalAlternatives(g);
