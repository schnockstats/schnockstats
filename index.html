      <p class="notice">Zeitraum: Saison ${seasonLabel(S.check.from)} bis heute, ${ev.n} Spiele. Gezeigt wird der Brier-Score: Je kleiner, desto besser. Der beste Wert pro Zeile ist markiert. Treffsicherheit beim Spielausgang (höchste Wahrscheinlichkeit richtig): ${pct(ev.x12.correct)}.</p>
      <section><h3>Alle drei Ligen</h3><div class="table-wrap">${table(ev)}</div></section>
      <section><h3>Kalibrierung</h3><p class="small">Wenn das Modell gut kalibriert ist, liegen beide Balken etwa gleich lang.</p>
        <div class="two-col">${calib('o25')}${calib('btts')}</div></section>
      <section><h3>Nach Liga</h3><div class="three-col">${M.LEAGUES.map((l) => `<div><h4>${esc(l.name)}</h4><div class="table-wrap">${table(S.check.leagues[l.id])}</div></div>`).join('')}</div></section>
      <div class="empty"><button class="btn btn-quiet" data-action="run-check">Neu berechnen</button></div>`;
  }

  /* ---------- Rahmen ---------- */

  const VIEWS = {
    spiele: ['Spiele', renderSpiele],
    statistiken: ['Statistiken', renderStatistiken],
    ligen: ['Ligen', renderLigen],
    torschuetzen: ['Torschützen', renderTorschuetzen],
    check: ['Modell-Check', renderCheck]
  };

  function renderNav() {
    $('#nav').innerHTML = Object.entries(VIEWS).map(([id, [label]]) =>
      `<a href="#${id}" ${S.view === id ? 'aria-current="page"' : ''}>${esc(label)}</a>`).join('');
  }

  function renderStatus() {
    const el = $('#status');
    if (!el) return;
    if (!S.ds) return;
    el.textContent = `Stand ${fmtTime(S.dataTime)} Uhr${S.stale ? ', teils aus dem Zwischenspeicher' : ''}`;
  }

  function render() {
    renderNav();
    renderStatus();
    const main = $('#main');
    if (S.loadError) {
      main.innerHTML = `<div class="empty error"><p>OpenLigaDB ist gerade nicht erreichbar, deshalb konnten keine Spieldaten geladen werden. Prüfe die Internetverbindung und lade die Daten neu.</p>
        <button class="btn" data-action="reload">Daten neu laden</button></div>`;
      return;
    }
    if (!S.ds) { main.innerHTML = '<div class="empty loading"><div class="ball" aria-hidden="true"></div><p>Spieldaten werden geladen …</p></div>'; return; }
    const scroll = window.scrollY;
    main.innerHTML = VIEWS[S.view][1]();
    window.scrollTo(0, scroll);
  }

  /* ---------- Ereignisse ---------- */

  function onClick(e) {
    const t = e.target.closest('button, tr.match, tr.linkrow, a');
    if (!t) return;
    if (t.matches('[data-day]')) { S.day = +t.dataset.day; S.allDays = false; S.open.clear(); savePrefs(); render(); return; }
    if (t.matches('[data-league]')) {
      const lg = t.dataset.league;
      if (S.leagues.has(lg) && S.leagues.size > 1) S.leagues.delete(lg); else S.leagues.add(lg);
      savePrefs(); render(); return;
    }
    if (t.matches('[data-mode]')) { S.mode = t.dataset.mode; savePrefs(); render(); return; }
    if (t.matches('[data-table]')) { S.tableLeague = t.dataset.table; S.tableSort = { key: 'pos', dir: 1 }; render(); return; }
    if (t.matches('[data-scorers]')) { S.scorerLeague = t.dataset.scorers; render(); return; }
    if (t.matches('[data-sort]')) {
      const k = t.dataset.sort;
      S.tableSort = S.tableSort.key === k ? { key: k, dir: -S.tableSort.dir } : { key: k, dir: +t.dataset.dir };
      render(); return;
    }
    if (t.matches('[data-action="next-day"]')) {
      const today = dayStart(Date.now());
      const next = S.ds.matches.find((m) => S.leagues.has(m.lg) && m.t >= addDays(today, S.day + 1));
      if (next) {
        const off = Math.round((dayStart(next.t) - today) / DAY);
        if (off <= 5) { S.day = off; render(); }
        else { S.allDays = false; $('#main').insertAdjacentHTML('afterbegin', `<p class="notice">Das nächste Spiel ist am ${fmtDay(next.t)}.</p>`); }
      }
      return;
    }
    if (t.matches('[data-action="reload"]')) { start(true); return; }
    if (t.matches('[data-action="refresh"]')) { start(true); return; }
    if (t.matches('[data-action="run-check"]')) { runCheck(); return; }
    if (t.matches('tr.match')) { toggleMatch(+t.dataset.match); return; }
    if (t.matches('tr.linkrow')) { gotoMatch(+t.dataset.goto); }
  }

  function toggleMatch(id) {
    if (S.open.has(id)) S.open.delete(id); else S.open.add(id);
    render();
  }

  function gotoMatch(id) {
    const m = S.ds.matches.find((x) => x.id === id);
    if (!m) return;
    const off = Math.round((dayStart(m.t) - dayStart(Date.now())) / DAY);
    S.allDays = off < -1 || off > 5;
    S.day = clamp(off, -1, 5);
    S.leagues.add(m.lg);
    S.open.add(id);
    const scrollToRow = () => {
      const row = document.querySelector(`tr.match[data-match="${id}"]`);
      if (row) { row.scrollIntoView({ block: 'start' }); row.focus({ preventScroll: true }); }
    };
    if (location.hash === '#spiele') { render(); scrollToRow(); }
    else {
      window.addEventListener('hashchange', () => setTimeout(scrollToRow, 0), { once: true });
      location.hash = '#spiele';
    }
  }

  function onChange(e) {
    const t = e.target;
    if (t.id === 'stat1') { S.stat1 = t.value; savePrefs(); render(); }
    if (t.id === 'stat2') { S.stat2 = t.value; savePrefs(); render(); }
    if (t.id === 'statMarket') { S.statMarket = t.value; savePrefs(); render(); }
    if (t.id === 'allDays') { S.allDays = t.checked; savePrefs(); render(); }
  }

  function onKey(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const t = e.target;
    if (t.matches && t.matches('tr.match')) {
      e.preventDefault();
      const id = +t.dataset.match;
      toggleMatch(id);
      const row = document.querySelector(`tr.match[data-match="${id}"]`);
      if (row) row.focus({ preventScroll: true });
    } else if (t.matches && t.matches('tr.linkrow')) {
      e.preventDefault();
      gotoMatch(+t.dataset.goto);
    }
  }

  function onHash() {
    const v = location.hash.replace('#', '');
    S.view = VIEWS[v] ? v : 'spiele';
    render();
  }

  async function start(force) {
    S.loadError = null;
    if (!S.ds) render();
    const btn = $('#refresh');
    if (btn) btn.disabled = true;
    try {
      await loadAll(force);
    } catch (err) {
      if (!S.ds) S.loadError = err;
    }
    if (btn) btn.disabled = false;
    render();
  }

  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  document.addEventListener('error', (e) => {
    if (e.target && e.target.classList && e.target.classList.contains('crest')) e.target.replaceWith(Object.assign(document.createElement('span'), { className: 'crest crest-empty' }));
  }, true);
  window.addEventListener('hashchange', onHash);

  loadPrefs();
  const v = location.hash.replace('#', '');
  S.view = VIEWS[v] ? v : 'spiele';
  start(false);
  setInterval(() => { if (document.visibilityState === 'visible' && S.ds && Date.now() - S.dataTime > CURRENT_TTL) start(false); }, 60000);
})();

</script>
</body>
</html>
