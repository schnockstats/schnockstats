  function renderGoalAlternatives(g) {
    const used = new Set(g.legs.map((r) => r.m.id + '|' + r.id));
    const rest = (g.pool || []).filter((r) => !used.has(r.m.id + '|' + r.id)).slice(0, 12);
    if (!rest.length) return '';
    return `<section><h3>Weitere Tor-Tipps ${esc(g.label)}</h3>
      <div class="table-wrap"><table class="list">
        <thead><tr><th scope="col">Ereignis</th><th scope="col">Begegnung</th><th scope="col">Liga</th>
        <th scope="col" class="num">Chance</th><th scope="col" class="num">Quote</th></tr></thead>
        <tbody>${rest.map((r) => `<tr class="linkrow" data-goto="${r.m.id}" tabindex="0">
          <td><span class="leg-dot" style="--leg:${legColor(r.id)}"></span>${esc(sport().market[r.id].label)}</td>
          <td class="pairing">${esc(team(r.m.h).s)}<span class="vs">–</span>${esc(team(r.m.a).s)}</td>
          <td><span class="lg-badge lg-${r.m.lg}">${esc(LEAGUE[r.m.lg].short)}</span></td>
          <td class="num">${pct(r.p)}</td><td class="num">${fairOdds(r.p)}</td></tr>`).join('')}</tbody>
      </table></div></section>`;
  }

  const LEG_COLORS = {
    o15: '#ffb020', o25: '#ffb020', o35: '#ffb020', o45: '#ffb020', o55: '#ffb020', o65: '#ffb020',
    btts: '#ff3d8a', hs: '#22d3ee', as: '#22d3ee', h25: '#22d3ee', h35: '#22d3ee', a25: '#22d3ee', a35: '#22d3ee',
    ht05: '#a78bfa', g13: '#37d39a'
  };
  const legColor = (id) => LEG_COLORS[id] || 'var(--accent)';

  const HOUSE_TARGET = 4.0;   // angestrebte kombinierte faire Quote
  const HOUSE_BAND = 0.18;    // Toleranz nach oben und unten (relativ)
  const HOUSE_MAX_LEGS = 12;
  const HOUSE_MIN_P = 0.62;   // Untergrenze je Baustein: recht sicher, auch wenn die
                              // kombinierte Quote dadurch öfter unter dem Zielwert bleibt

  function houseCombo() {
    // Immer der nächste Spieltag, unabhängig vom Zeitraum-Regler daneben,
    // und unter den aktuell gewählten Ligen.
    const pick = nextOpenDay();
    if (!pick) return null;
    const { off, from, list } = pick;

    const cands = [];
    for (const m of list) {
      const an = analyze(m);
      for (const id of sport().high) {
        const v = an.pred.p[id];
        // Nur einigermaßen sichere Bausteine, das ist eine Favoriten-Kombi
        if (!tipOk(v, m, id) || v < HOUSE_MIN_P) continue;
        cands.push({ m, an, id, p: v });
      }
    }
    cands.sort((a, b) => b.p - a.p);

    const target = HOUSE_TARGET;
    const upper = target * (1 + HOUSE_BAND);
    const lower = target / (1 + HOUSE_BAND);
    const used = new Set();
    const perMarket = new Map();
    const legs = [];
    let product = 1;

    const tryAdd = (r, capMarket) => {
      if (used.has(r.m.id)) return false;
      if (capMarket && (perMarket.get(r.id) || 0) >= 2) return false;
      const next = product * (1 / r.p);
      if (legs.length >= 2 && next > upper) return false;
      used.add(r.m.id);
      perMarket.set(r.id, (perMarket.get(r.id) || 0) + 1);
      product = next;
      legs.push(r);
      return true;
    };

    for (const r of cands) {
      if (legs.length >= HOUSE_MAX_LEGS || product >= lower) break;
      tryAdd(r, true);
    }
    // Falls die Quote noch zu niedrig ist, notfalls auch ein zweites Ereignis
    // desselben Marktes zulassen, damit die Kombi nicht zu mickrig bleibt.
    if (product < lower) {
      for (const r of cands) {
        if (legs.length >= HOUSE_MAX_LEGS || product >= lower) break;
        tryAdd(r, false);
      }
    }
    if (legs.length < 2) return null;
    const starved = product < lower && !cands.some((r) => !used.has(r.m.id));
    return { legs, product, starved, label: off === 0 ? 'heute' : off === 1 ? 'morgen' : fmtDay(from).toLowerCase() };
  }

  function renderHouseCombo() {
    const h = houseCombo();
    if (!h) return '';
    const rows = h.legs.map((r) => `<li>
      <span class="kl-event">${esc(sport().market[r.id].label)}</span>
      <span class="kl-match">${esc(team(r.m.h).s)} – ${esc(team(r.m.a).s)}<span class="muted"> ${fmtTime(r.m.t)}, Quote ${fairOdds(r.p)}</span></span>
      <span class="kl-p"${heatStyle(r.p)}>${pct(r.p)}</span></li>`).join('');
    const near = Math.abs(h.product - HOUSE_TARGET) <= HOUSE_TARGET * 0.05;
    return `<section class="combo combo-house">
      <div class="combo-head">
        <div><span class="house-badge">Empfehlung des Hauses</span><h3>Tageskombi ${esc(h.label)}</h3></div>
        <div class="combo-num"><b class="count" data-count="${h.product.toFixed(2)}">${dec(h.product, 2)}</b><small>${near ? 'kombinierte faire Quote' : 'kombinierte faire Quote, Zielwert 4,00'}</small></div>
      </div>
      <ol class="combo-list">${rows}</ol>
      <p class="small">${h.legs.length} Tor-Ereignisse mit Wahrscheinlichkeit zwischen ${Math.round(HOUSE_MIN_P * 100)} und ${Math.round(MAX_TIP_P[S.sport] * 100)} Prozent, zusammengestellt auf eine faire Quote nahe 4,00. Rechnerisch: ${h.legs.map((r) => fairOdds(r.p)).join(' × ')} = ${dec(h.product, 2)}.
      ${h.starved ? ' An diesem Tag gab es in den gewählten Ligen nicht genug ausreichend sichere Ereignisse für mehr, deshalb bleibt die Quote unter dem Zielwert.' : ''}</p>
    </section>`;
  }

  function highlightCandidates() {
    const now = Date.now();
    const today = dayStart(now);
    let from, to, label;
    if (S.kombi.scope === 'tag') {
      // Heute, oder der nächste Tag mit Spielen
      let off = 0;
      while (off <= 6 && !matchesInRange(addDays(today, off), addDays(today, off + 1)).length) off++;
      from = addDays(today, Math.min(off, 6));
      to = addDays(today, Math.min(off, 6) + 1);
      label = off === 0 ? 'Heute' : off === 1 ? 'Morgen' : fmtDay(from);
    } else if (S.kombi.scope === 'morgen') {
      from = addDays(today, 1); to = addDays(today, 2); label = 'Morgen';
    } else {
      from = today; to = addDays(today, 7); label = 'Nächste 7 Tage';
    }
    const list = matchesInRange(from, to).filter((m) => !m.fin || m.t > now - 4 * 3600000);
    const out = [];
    for (const m of list) {
      const an = analyze(m);
      for (const id of sport().high) {
        const v = an.pred.p[id];
        if (!tipOk(v, m, id)) continue;
        out.push({ m, an, id, p: v, hist: an.hist ? an.hist[id] : null });
      }
    }
    out.sort((a, b) => b.p - a.p);
    const min = S.kombi.minOdds || 1;
    const filtered = min > 1 ? out.filter((r) => r.p > 0 && 1 / r.p >= min) : out;
    return { rows: filtered, label, from, to, games: list.length, total: out.length };
  }

  const ODDS_STEPS = [
    [1, 'Alle Quoten'], [1.15, 'ab 1,15'], [1.3, 'ab 1,30'], [1.5, 'ab 1,50'],
    [1.75, 'ab 1,75'], [2, 'ab 2,00'], [2.5, 'ab 2,50'], [3, 'ab 3,00']
  ];

  function oddsSelect() {
    return `<label class="select"><span>Faire Quote</span><select id="kombiOdds">${ODDS_STEPS.map(([v, lab]) =>
      `<option value="${v}"${v === (S.kombi.minOdds || 1) ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select></label>`;
  }

  function renderKombi() {
    const { rows, label, games, total } = highlightCandidates();
    const min = S.kombi.minOdds || 1;
    const head = `<div class="page-head"><h2>Schürfkombi</h2>
      <p>Die Ereignisse mit den höchsten Wahrscheinlichkeiten aus ${games} ${games === 1 ? 'Spiel' : 'Spielen'}, ${esc(label.toLowerCase())}${min > 1 ? `, gefiltert auf eine faire Quote ab ${dec(min, 2)}` : ''}.</p></div>`;
    const controls = `<div class="toolbar">
        ${leagueChips()}
        <div class="toolbar-right">
          <div class="segmented" role="group" aria-label="Zeitraum">
            <button data-scope="tag" aria-pressed="${S.kombi.scope === 'tag'}">Nächster Spieltag</button>
            <button data-scope="morgen" aria-pressed="${S.kombi.scope === 'morgen'}">Morgen</button>
            <button data-scope="woche" aria-pressed="${S.kombi.scope === 'woche'}">7 Tage</button>
          </div>
          ${oddsSelect()}
          <label class="select"><span>Kombi-Größe</span><select id="kombiLegs">${[2, 3, 4, 5, 6, 8].map((n) =>
            `<option value="${n}"${n === S.kombi.legs ? ' selected' : ''}>${n} Ereignisse</option>`).join('')}</select></label>
        </div>
      </div>`;
    const house = renderHouseCombo();
    if (!rows.length) {
      return head + house + controls + `<div class="empty"><p>${total
        ? `Kein Ereignis erreicht eine faire Quote von ${dec(min, 2)} oder mehr. Wähle eine kleinere Quote.`
        : 'Für diesen Zeitraum sind keine Spiele angesetzt.'}</p></div>`;
    }
    const mk = sport().market;

    // Kombi: nur ein Ereignis je Spiel, damit die Werte nicht voneinander abhängen
    const used = new Set();
    const perMarket = new Map();
    const cap = Math.max(2, Math.ceil(S.kombi.legs / 3));
    const legs = [];
    for (let pass = 0; pass < 2 && legs.length < S.kombi.legs; pass++) {
      for (const r of rows) {
        if (legs.length >= S.kombi.legs) break;
        if (used.has(r.m.id)) continue;
        // Im ersten Durchgang für Abwechslung sorgen, im zweiten auffüllen
        if (pass === 0 && (perMarket.get(r.id) || 0) >= cap) continue;
        used.add(r.m.id);
        perMarket.set(r.id, (perMarket.get(r.id) || 0) + 1);
        legs.push(r);
      }
    }
    const combo = legs.reduce((acc, r) => acc * r.p, 1);

    const legRows = legs.map((r) => `<li>
      <span class="kl-event">${esc(mk[r.id].label)}</span>
      <span class="kl-match">${esc(team(r.m.h).s)} – ${esc(team(r.m.a).s)}<span class="muted"> ${fmtTime(r.m.t)}, Quote ${fairOdds(r.p)}</span></span>
      <span class="kl-p"${heatStyle(r.p)}>${pct(r.p)}</span></li>`).join('');

    const body = rows.slice(0, 40).map((r) => `<tr class="linkrow" data-goto="${r.m.id}" tabindex="0">
      <td class="nowrap">${fmtTime(r.m.t)}${S.kombi.scope === 'woche' ? `<div class="small">${fmtDay(r.m.t)}</div>` : ''}</td>
      ${sport().multiLeague ? `<td><span class="lg-badge lg-${r.m.lg}">${esc(LEAGUE[r.m.lg].short)}</span></td>` : ''}
      <td class="pairing">${teamName(r.m.h)}<span class="vs">–</span>${teamName(r.m.a)}</td>
      <td>${esc(mk[r.id].label)}</td>
      <td class="num">${statPill(r.an, r.m, r.id, 'model')}</td>
      <td class="num muted-num">${pct(r.hist)}</td>
      <td class="num">${fairOdds(r.p)}</td>
    </tr>`).join('');

    return head + house + controls + `
      <section class="combo">
        <div class="combo-head">
          <h3>Die Kombi ${esc(label.toLowerCase())}</h3>
          <div class="combo-num"><b class="count" data-count="${Math.round(combo * 100)}">${pct(combo)}</b><small>alle ${legs.length} treffen zusammen</small></div>
        </div>
        <ol class="combo-list">${legRows}</ol>
        <p class="small">Rechnerisch: ${legs.map((r) => pct(r.p)).join(' × ')} = ${pct(combo)}. Faire Gesamtquote ${fairOdds(combo)}. Aus jedem Spiel kommt nur ein Ereignis in die Kombi, denn Ereignisse aus derselben Partie hängen voneinander ab.</p>
      </section>

      <section><h3>Alle Highlights</h3>
      <div class="table-wrap"><table class="list">
        <thead><tr><th scope="col">Zeit</th>${sport().multiLeague ? '<th scope="col">Liga</th>' : ''}<th scope="col">Begegnung</th>
        <th scope="col">Ereignis</th><th scope="col" class="num">Modell</th><th scope="col" class="num">Letzte 10</th><th scope="col" class="num">Faire Quote</th></tr></thead>
        <tbody>${body}</tbody></table></div></section>
      <p class="legend">Hohe Wahrscheinlichkeiten heißen kleine Quoten. Ein Wert von 90 Prozent bedeutet auch, dass so ein Ereignis in etwa jedem zehnten Fall ausbleibt.</p>`;
  }

  /* ---------- Ansicht: Modell-Check ---------- */

  const CHECK_LABEL = {
    o15: 'Über 1.5 Tore', o25: 'Über 2.5 Tore', o35: 'Über 3.5 Tore', btts: 'Beide treffen',
    hs: 'Heimteam trifft', as: 'Auswärtsteam trifft', h15: 'Heim über 1.5 Tore', a15: 'Auswärts über 1.5 Tore',
    o45: 'Über 4.5 Tore', o55: 'Über 5.5 Tore', h25: 'Heim über 2.5 Tore', a25: 'Auswärts über 2.5 Tore', ot: 'Verlängerung'
  };

  async function runCheck() {
    if (S.checkRunning) return;
    S.checkRunning = true;
    const st = store();
    if (isHockey()) {
      const from = st.meta.seasons[Math.max(0, st.meta.seasons.length - 2)];
      let preds = [];
      for (const l of hockeyLeagues().filter((x) => activeLeagues().has(x.id))) {
        S.checkProgress = `Rechne ${l.name} …`;
        render();
        await new Promise((r) => setTimeout(r, 30));
        preds = preds.concat(H.backtest(st.ds, from, st.dataTime, null, l.id));
      }
      S.check.eishockey = { total: H.evaluate(preds), leagues: null, from };
    } else {
      const from = M.seasonAt(st.ds, 'bl1', st.dataTime) - 1;
      const ids = Array.from(S.leagues).filter((id) => LEAGUE[id] && (!LEAGUE[id].kind || LEAGUE[id].kind === 'league')).sort((a, b) => leagueOrder(a) - leagueOrder(b)).slice(0, 8);
      const res = { leagues: {}, ids, from };
      let all = [];
      for (const id of ids) {
        S.checkProgress = `Rechne ${LEAGUE[id].name} …`;
        render();
        await new Promise((r) => setTimeout(r, 30));
        const preds = M.backtestLeague(st.ds, id, from, st.dataTime);
        res.leagues[id] = M.evaluate(preds);
        all = all.concat(preds);
      }
      res.total = M.evaluate(all);
      S.check.fussball = res;
    }
    S.checkRunning = false;
    render();
  }

  function renderCheck() {
    const intro = `<div class="page-head"><h2>Modell-Check</h2>
      <p>Hier rechnet die Seite die letzten Spieltage nach, als wären sie noch nicht gespielt: Für jede Woche wird das Modell nur mit den Spielen davor trainiert. So siehst du, wie gut die Prozentwerte wirklich treffen.${isHockey() ? '' : ' Gerechnet werden die gewählten Ligen (ohne Pokale und Länderspiele), höchstens acht auf einmal.'}</p></div>`;
    if (S.checkRunning) return intro + `<div class="empty"><p>${esc(S.checkProgress)}</p></div>`;
    const check = S.check[S.sport];
    if (!check) return intro + '<div class="empty"><button class="btn" data-action="run-check">Rückblick berechnen</button></div>';

    const ev = check.total;
    const row = (label, e) => {
      const vals = [e.model, e.hist || null, e.base];
      const best = Math.min(...vals.filter((v) => v));
      const cell = (v) => `<td class="num${v && Math.abs(v - best) < 1e-9 ? ' best' : ''}">${v ? dec(v, 3) : '–'}</td>`;
      return `<tr><th scope="row">${esc(label)}</th><td class="num">${e.n}</td><td class="num">${e.rate != null ? pct(e.rate) : '–'}</td>${cell(e.model)}${cell(e.hist)}${cell(e.base)}</tr>`;
    };
    const table = (evl) => `<table class="list"><thead><tr><th scope="col">Ereignis</th><th scope="col" class="num">Spiele</th><th scope="col" class="num">Eingetreten</th>
      <th scope="col" class="num">Modell</th><th scope="col" class="num">Letzte 10</th><th scope="col" class="num">Ligaschnitt</th></tr></thead>
      <tbody>${Object.entries(evl.markets).map(([k, e]) => row(CHECK_LABEL[k] || k, e)).join('')}
      ${evl.x12 ? row('Sieg, Remis, Niederlage', { n: evl.x12.n, rate: null, model: evl.x12.model, hist: evl.x12.hist, base: evl.x12.base }) : ''}</tbody></table>`;

    const calib = (k) => {
      const e = ev.markets[k];
      if (!e) return '';
      return `<div class="calib"><h4>${esc(CHECK_LABEL[k] || k)}</h4>
        <table class="list"><thead><tr><th scope="col">Prognose</th><th scope="col" class="num">Spiele</th><th scope="col">Vorhergesagt und tatsächlich</th></tr></thead><tbody>
        ${e.buckets.map((x, i) => x.n < 5 ? '' : `<tr><th scope="row" class="nowrap">${i * 10}–${i * 10 + 10}\u202F%</th><td class="num">${x.n}</td>
          <td><div class="cal"><span class="cal-pred" style="--w:${Math.round(x.p / x.n * 100)}%"></span><span class="cal-real" style="--w:${Math.round(x.hit / x.n * 100)}%"></span></div>
          <span class="small">${pct(x.p / x.n)} vorhergesagt, ${pct(x.hit / x.n)} eingetreten</span></td></tr>`).join('')}
        </tbody></table></div>`;
    };

    const accuracy = isHockey() ? ev.correct : (ev.x12 && ev.x12.correct);
    const perLeague = check.leagues ? `<section><h3>Nach Liga</h3><div class="three-col">${(check.ids || []).map((id) =>
      `<div><h4>${esc(LEAGUE[id] ? LEAGUE[id].name : id)}</h4><div class="table-wrap">${table(check.leagues[id])}</div></div>`).join('')}</div></section>` : '';

    return intro + `
      <p class="notice">Zeitraum: Saison ${seasonLabel(check.from)} bis heute, ${ev.n} Spiele. Gezeigt wird der Brier-Score: Je kleiner, desto besser. Der beste Wert pro Zeile ist markiert.${accuracy != null ? ` Treffsicherheit beim Sieger: ${pct(accuracy)}.` : ''}</p>
      <section><h3>${isHockey() ? 'NHL' : 'Alle gewählten Ligen zusammen'}</h3><div class="table-wrap">${table(ev)}</div></section>
      <section><h3>Kalibrierung</h3><p class="small">Wenn das Modell gut kalibriert ist, liegen beide Balken etwa gleich lang.</p>
        <div class="two-col">${calib(isHockey() ? 'o55' : 'o25')}${calib('btts')}</div></section>
      ${perLeague}
      <div class="empty"><button class="btn btn-quiet" data-action="run-check">Neu berechnen</button></div>`;
  }

  /* ---------- Rahmen ---------- */

  const VIEWS = {
    spiele: ['Spiele', renderSpiele],
    tore: ['Tore-Kombi', renderTore],
    kombi: ['Schürfkombi', renderKombi],
    statistiken: ['Statistiken', renderStatistiken],
    ligen: ['Ligen', renderLigen],
    check: ['Modell-Check', renderCheck]
  };

  const ICONS = {
    spiele: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M12 4.5v15"/><circle cx="12" cy="12" r="3"/><path d="M2.5 9.5h3v5h-3M21.5 9.5h-3v5h3"/></svg>',
    tore: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V6h18v13"/><path d="M3 10h18M3 14h18M7.5 6v13M12 6v13M16.5 6v13" opacity=".45"/><circle cx="17" cy="16.5" r="3.2" fill="currentColor" stroke="none"/></svg>',
    kombi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.8z"/></svg>',
    ligen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>',
    statistiken: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>',
    mehr: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>'
  };
  const TAB_MAIN = ['spiele', 'tore', 'kombi', 'ligen'];

  function renderTabbar() {
    const bar = $('#tabbar');
    if (!bar) return;
    const inMore = TAB_MAIN.indexOf(S.view) < 0;
    const short = { spiele: 'Spiele', tore: 'Tore', kombi: 'Kombi', ligen: 'Ligen' };
    bar.innerHTML = TAB_MAIN.map((id) => `<a href="#${id}"${S.view === id ? ' aria-current="page"' : ''}>${ICONS[id]}<span>${short[id]}</span></a>`).join('')
      + `<button type="button" data-action="more"${inMore ? ' aria-current="page"' : ''}>${ICONS.mehr}<span>${inMore ? esc(VIEWS[S.view][0].split(' ')[0]) : 'Mehr'}</span></button>`;
  }

  function openMore() {
    const el = document.createElement('div');
    el.className = 'more-sheet';
    el.setAttribute('data-action', 'close-more');
    const items = Object.entries(VIEWS).filter(([id]) => TAB_MAIN.indexOf(id) < 0);
    el.innerHTML = `<div class="more-panel" role="dialog" aria-label="Weitere Ansichten">
      ${items.map(([id, [label]]) => `<a href="#${id}" data-action="close-more">${ICONS[id] || ''}${esc(label)}</a>`).join('')}
      <button type="button" data-action="theme">${S.theme === 'light' ? '🌙' : '☀️'}&nbsp; ${S.theme === 'light' ? 'Flutlicht (dunkel)' : 'Tageslicht (hell)'}</button>
      <button type="button" data-action="refresh">↻&nbsp; Daten aktualisieren<small>${esc(($('#status') || {}).textContent || '')}</small></button>
    </div>`;
    document.body.appendChild(el);
  }

  function applyTheme() {
    if (S.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', S.theme === 'light' ? '#eef2f0' : '#070b14');
  }

  function renderChrome() {
    const sp = sport();
    document.documentElement.dataset.sport = S.sport;
    document.documentElement.dataset.view = S.view;
    $('#brand-mark').innerHTML = BRAND_MARK[S.sport];
    $('#brand-name').textContent = sp.brand;
    document.title = sp.title;
    const fav = $('#favicon');
    if (fav) fav.setAttribute('href', `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>${FAVICON[S.sport]}</text></svg>`);
    $('#sportswitch').innerHTML = Object.values(SPORTS).map((x) =>
      `<button data-sport="${x.id}" aria-pressed="${x.id === S.sport}" aria-label="${esc(x.label)}"><span class="sw-long">${esc(x.label)}</span><span class="sw-short" aria-hidden="true">${esc(x.short || x.label)}</span></button>`).join('');
    $('#nav').innerHTML = Object.entries(VIEWS).map(([id, [label]]) =>
      `<a href="#${id}" ${S.view === id ? 'aria-current="page"' : ''}>${esc(label)}</a>`).join('');
    renderTabbar();
    applyTheme();
    const st = store();
    const el = $('#status');
    if (el && st.ds) {
      const gen = isHockey() && st.meta ? Date.parse(st.meta.generated) : null;
      el.textContent = gen
        ? `Daten: ${fmtDate(gen, true)} ${fmtTime(gen)} Uhr`
        : `Stand ${fmtTime(st.dataTime)} Uhr${st.stale ? ', teils aus dem Zwischenspeicher' : ''}`;
    }
    $('#source-note').innerHTML = isHockey()
      ? 'Spieldaten: <a href="https://www.nhl.com" rel="noopener">NHL</a>, über die öffentliche Schnittstelle der Liga. Alle Werte sind statistische Schätzungen aus vergangenen Spielen und keine Garantie für den Ausgang.'
      : 'Spieldaten: <a href="https://www.openligadb.de" rel="noopener">OpenLigaDB</a> (deutsche Ligen, live), <a href="https://www.football-data.co.uk" rel="noopener">football-data.co.uk</a> (Ergebnisse, Quoten, Ecken, Karten, Schüsse), <a href="https://github.com/openfootball" rel="noopener">openfootball</a> (Spielpläne), ESPN (Pokale, Europapokal, Länderspiele, weitere Ligen), <a href="https://www.thesportsdb.com" rel="noopener">TheSportsDB</a> (kleinere Ligen) und <a href="https://github.com/martj42/international_results" rel="noopener">international_results</a> (Länderspiel-Historie). Alle Werte sind statistische Schätzungen aus vergangenen Spielen und keine Garantie für den Ausgang.';
  }

  // Große Kennzahlen zählen beim ersten Erscheinen einmal hoch.
  function runCountUps() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (const el of document.querySelectorAll('[data-count]:not([data-counted])')) {
      const target = parseFloat(el.dataset.count);
      if (isNaN(target)) continue;
      el.dataset.counted = '1';
      const dec2 = el.dataset.count.indexOf('.') >= 0;
      const start = performance.now();
      const dur = 620;
      const step = (now) => {
        const t = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - t, 3);
        const v = target * eased;
        el.textContent = dec2 ? dec(v, 2) : String(Math.round(v));
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
  }

  /* Kleine Aufmerksamkeiten: Zahlen zählen beim ersten Erscheinen hoch,
     Listen bauen sich gestaffelt auf. Beides läuft nur einmal je Element. */
  function animateNumbers() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('[data-countup]').forEach((el) => {
      if (el.dataset.counted) return;
      el.dataset.counted = '1';
      const target = parseFloat(el.dataset.countup);
      if (isNaN(target)) return;
      const decimals = (el.dataset.countupDecimals | 0);
      const suffix = el.dataset.countupSuffix || '';
      const start = performance.now();
      const dur = 620;
      const step = (now) => {
        const t = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - t, 3);
        const v = target * eased;
        el.textContent = (decimals ? v.toFixed(decimals).replace('.', ',') : String(Math.round(v))) + suffix;
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }

  function staggerRows() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const rows = document.querySelectorAll('tbody tr.match:not([data-seen])');
    let i = 0;
    rows.forEach((row) => {
      row.dataset.seen = '1';
      if (i < 14) {
        row.style.animation = `rowIn 320ms ease-out ${i * 22}ms backwards`;
        i++;
      }
    });
  }

  /* Tore-Kombi: Stadion-Animation starten, Tipps beim Torerfolg aufleuchten lassen */
  function mountTorShow() {
    const host = document.getElementById('torshow');
    if (!host || !S.torShow || !window.TorShow) return;
    const { g, autoplay } = S.torShow;
    S.torShow.autoplay = false; // bei jedem weiteren Neuzeichnen gleich den Endstand zeigen
    const items = () => document.querySelectorAll('.gc-list li');
    window.TorShow.mount(host, {
      sport: S.sport, autoplay, sound: !!S.tsSound,
      legs: g.legs.map((r) => ({
        label: sport().market[r.id].label, match: `${team(r.m.h).s} – ${team(r.m.a).s}`,
        odds: fairOdds(r.p), oddsNum: 1 / r.p
      })),
      onGoal: (k, instant) => {
        const li = items()[k];
        if (!li) return;
        li.classList.add('scored');
        if (!instant) { li.classList.add('goal-now'); setTimeout(() => li.classList.remove('goal-now'), 1200); }
      },
      onReset: () => items().forEach((li) => li.classList.remove('scored', 'goal-now')),
      onSound: (on) => { S.tsSound = on; savePrefs(); }
    });
  }

  function render() {
    renderChrome();
    const main = $('#main');
    const st = store();
    if (st.error) {
      main.innerHTML = isHockey()
        ? `<div class="empty error"><p>Die NHL-Daten konnten nicht geladen werden. Sie liegen im Ordner <code>data/nhl</code> und werden vom GitHub-Actions-Job „NHL-Daten aktualisieren“ erzeugt. Starte den Job einmal von Hand (Reiter Actions, dann „Run workflow“).</p>
          <p class="small">${location.protocol === 'file:' ? 'Hinweis: Beim Öffnen per Doppelklick sperrt der Browser lokale Dateien. Der Eishockey-Modus braucht die Seite über GitHub Pages oder einen lokalen Server.' : ''}</p>
          <button class="btn" data-action="reload">Erneut versuchen</button></div>`
        : `<div class="empty error"><p>Die Spieldaten konnten gerade nicht geladen werden. Prüfe die Internetverbindung und lade die Daten neu.</p>
          <button class="btn" data-action="reload">Daten neu laden</button></div>`;
      return;
    }
    if (!st.ds) { main.innerHTML = '<div class="empty loading"><div class="ball" aria-hidden="true"></div><p>Daten werden geladen …</p></div>'; return; }
    const scroll = window.scrollY;
    // Scrollstand der offenen Ligaauswahl merken, sonst springt sie nach jedem Haken nach oben
    const lp = main.querySelector('.leaguepicker[open] .lp-panel');
    const lpScroll = lp ? lp.scrollTop : 0;
    main.innerHTML = VIEWS[S.view][1]();
    window.scrollTo(0, scroll);
    const lp2 = main.querySelector('.leaguepicker[open] .lp-panel');
    if (lp2 && lp) { lp2.style.animation = 'none'; lp2.scrollTop = lpScroll; }
    mountTorShow();
    runCountUps();
    animateNumbers();
    staggerRows();
  }

  /* ---------- Ereignisse ---------- */

  function onClick(e) {
    // Ligaauswahl schließen: Fertig-Knopf oder Tipp auf den abgedunkelten Hintergrund
    const pick = e.target.closest('.leaguepicker');
    if (pick && (e.target === pick || e.target.closest('[data-action="picker-close"]'))) {
      e.preventDefault();
      S.pickerOpen = false; pick.open = false;
      return;
    }
    const act = e.target.closest('[data-action]');
    if (act && act.dataset.action === 'theme') {
      S.theme = S.theme === 'light' ? 'dark' : 'light';
      savePrefs(); applyTheme();
      const sheet = document.querySelector('.more-sheet'); if (sheet) sheet.remove();
      return;
    }
    if (act && act.dataset.action === 'more') { openMore(); return; }
    const sheet = e.target.closest('.more-sheet');
    if (sheet) {
      if (!e.target.closest('a, button')) { if (!e.target.closest('.more-panel')) sheet.remove(); return; }
      sheet.remove();
    }
    const tip = e.target.closest('[data-tip]');
    if (tip) { gotoMatch(+tip.dataset.tip); return; }
    const t = e.target.closest('button, tr.match, tr.linkrow, a');
    if (!t) return;
    if (t.matches('[data-sport]')) { switchSport(t.dataset.sport); return; }
    if (t.closest && t.closest('summary')) { S.pickerOpen = !S.pickerOpen; return; }
    if (t.matches('[data-day]')) { S.day = +t.dataset.day; S.allDays = false; S.open.clear(); savePrefs(); render(); return; }
    if (t.matches('[data-league]')) {
      const lg = t.dataset.league, set = new Set(activeLeagues());
      if (set.has(lg) && set.size > 1) set.delete(lg); else set.add(lg);
      setSel(set);
      savePrefs(); render(); return;
    }
    if (t.matches('[data-pick]')) {
      const mode = t.dataset.pick;
      let ids = mode === 'de' ? GERMAN : mode === 'top' ? TOP_LEAGUES.filter((id) => LEAGUE[id])
        : mode === 'nhl' ? ['nhl'] : mode === 'eu' ? hockeyLeagues().map((l) => l.id).filter((id) => id !== 'nhl')
        : sportLeagues().map((l) => l.id);
      if (!ids.length) ids = sportLeagues().map((l) => l.id);
      setSel(new Set(ids));
      S.pickerOpen = true;
      savePrefs(); render(); return;
    }
    if (t.matches('[data-scope]')) { S.kombi.scope = t.dataset.scope; savePrefs(); render(); return; }
    if (t.matches('[data-mode]')) { S.mode = t.dataset.mode; savePrefs(); render(); return; }
    if (t.matches('[data-table]')) { if (isHockey()) S.hTableLeague = t.dataset.table; else S.tableLeague = t.dataset.table; S.tableSort = { key: 'pos', dir: 1 }; render(); return; }
    if (t.matches('[data-sort]')) {
      const k = t.dataset.sort;
      S.tableSort = S.tableSort.key === k ? { key: k, dir: -S.tableSort.dir } : { key: k, dir: +t.dataset.dir };
      render(); return;
    }
    if (t.matches('[data-action="next-day"]')) {
      const today = dayStart(Date.now());
      const lgs = activeLeagues();
      const next = store().ds.matches.find((m) => lgs.has(m.lg) && m.t >= addDays(today, S.day + 1));
      if (next) {
        const off = Math.round((dayStart(next.t) - today) / DAY);
        if (off <= 5) { S.day = off; render(); }
        else $('#main').insertAdjacentHTML('afterbegin', `<p class="notice">Das nächste Spiel ist am ${fmtDay(next.t)}.</p>`);
      }
      return;
    }
    if (t.matches('[data-action="reload"]') || t.matches('[data-action="refresh"]')) { start(true); return; }
    if (t.matches('[data-action="run-check"]')) { runCheck(); return; }
    if (t.matches('tr.match')) { toggleMatch(+t.dataset.match); return; }
    if (t.matches('tr.linkrow')) gotoMatch(+t.dataset.goto);
  }

  function switchSport(id) {
    if (!SPORTS[id] || id === S.sport) return;
    S.sport = id;
    S.day = null;
    S.open.clear();
    S.tableSort = { key: 'pos', dir: 1 };
    savePrefs();
    if (!store().ds && !store().loading) start(false);
    else render();
  }

  function toggleMatch(id) {
    if (S.open.has(id)) S.open.delete(id); else S.open.add(id);
    render();
  }

  function gotoMatch(id) {
    const m = store().ds.matches.find((x) => x.id === id);
    if (!m) return;
    const off = Math.round((dayStart(m.t) - dayStart(Date.now())) / DAY);
    S.allDays = off < -1 || off > 5;
    S.day = clamp(off, -1, 5);
    S.open.add(id);
    const scrollToRow = () => {
      const row = document.querySelector(`tr.match[data-match="${id}"]`);
      if (row) { row.scrollIntoView({ block: 'start' }); row.focus({ preventScroll: true }); }
    };
    if (location.hash === '#spiele') { render(); scrollToRow(); }
    else {
      window.addEventListener('hashchange', () => setTimeout(scrollToRow, 0), { once: true });
      location.hash = '#spiele';
    }
  }

  function onChange(e) {
    const t = e.target, s = stat();
    if (t.matches && t.matches('input[type="checkbox"][data-league]')) {
      const lg = t.dataset.league, set = new Set(activeLeagues());
      if (t.checked) set.add(lg); else set.delete(lg);
      if (!set.size) { set.add(lg); t.checked = true; }
      setSel(set);
      S.pickerOpen = true;
      savePrefs(); render(); return;
    }
    if (t.matches && t.matches('[data-table-select]')) { if (isHockey()) S.hTableLeague = t.value; else S.tableLeague = t.value; S.tableSort = { key: 'pos', dir: 1 }; render(); return; }
    if (t.id === 'stat1') { s.s1 = t.value; savePrefs(); render(); }
    if (t.id === 'stat2') { s.s2 = t.value; savePrefs(); render(); }
    if (t.id === 'statMarket') { s.top = t.value; savePrefs(); render(); }
    if (t.id === 'allDays') { S.allDays = t.checked; savePrefs(); render(); }
    if (t.id === 'kombiLegs') { S.kombi.legs = +t.value; savePrefs(); render(); }
    if (t.id === 'kombiOdds') { S.kombi.minOdds = +t.value; savePrefs(); render(); }
    if (t.id === 'goalLegs') { S.goalLegs = +t.value; savePrefs(); render(); }
    if (t.id === 'goalOdds') { S.goalMinOdds = +t.value; savePrefs(); render(); }
  }

  function onKey(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const t = e.target;
    if (t.matches && t.matches('tr.match')) {
      e.preventDefault();
      const id = +t.dataset.match;
      toggleMatch(id);
      const row = document.querySelector(`tr.match[data-match="${id}"]`);
      if (row) row.focus({ preventScroll: true });
    } else if (t.matches && t.matches('tr.linkrow')) {
      e.preventDefault();
      gotoMatch(+t.dataset.goto);
    }
  }

  function onHash() {
    const v = location.hash.replace('#', '');
    const prev = S.view;
    S.view = VIEWS[v] ? v : 'spiele';
    render();
    if (prev !== S.view) {
      const main = $('#main');
      main.classList.remove('view-enter'); void main.offsetWidth; main.classList.add('view-enter');
      window.scrollTo(0, 0);
    }
  }

  async function start(force) {
    const st = store();
    st.error = null;
    st.loading = true;
    render();
    const btn = $('#refresh');
    if (btn) { btn.disabled = true; btn.classList.add('is-busy'); }
    try {
      if (isHockey()) await loadHockey();
      else await loadFootball(force);
    } catch (err) {
      if (!st.ds) st.error = err;
    }
    st.loading = false;
    if (btn) { btn.disabled = false; btn.classList.remove('is-busy'); }
    render();
  }

  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  document.addEventListener('error', (e) => {
    if (e.target && e.target.classList && e.target.classList.contains('crest')) {
      e.target.replaceWith(Object.assign(document.createElement('span'), { className: 'crest crest-empty' }));
    }
  }, true);
  window.addEventListener('hashchange', onHash);

  loadPrefs();
  applyTheme();
  // Als App vom Homebildschirm: kurzer Startbildschirm
  if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
    let shown = false;
    try { shown = sessionStorage.getItem('ss:splash') === '1'; sessionStorage.setItem('ss:splash', '1'); } catch (e) {}
    if (!shown) {
      const sp = document.createElement('div');
      sp.className = 'app-splash';
      sp.innerHTML = '<img src="schnockstats-icon-192.png?v=2a5decd8" alt=""><b>Schnockstats</b>';
      document.body.appendChild(sp);
      const t0 = Date.now();
      const hide = () => setTimeout(() => { sp.classList.add('is-leaving'); setTimeout(() => sp.remove(), 450); }, Math.max(0, 900 - (Date.now() - t0)));
      const wait = setInterval(() => { if (store().ds || store().error || Date.now() - t0 > 4000) { clearInterval(wait); hide(); } }, 150);
    }
  }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  const v0 = location.hash.replace('#', '');
  S.view = VIEWS[v0] ? v0 : 'spiele';
  start(false);
  setInterval(() => {
    const st = store();
    if (document.visibilityState === 'visible' && st.ds && !st.loading && Date.now() - st.dataTime > CURRENT_TTL) start(false);
  }, 60000);
})();

</script>
</body>
</html>
