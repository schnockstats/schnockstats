<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Schnockstats – Fußballstatistik</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6f2;
  --surface: #ffffff;
  --surface-2: #eef2ec;
  --ink: #18211d;
  --ink-soft: #56625c;
  --line: #d9e0d8;
  --pitch: #1c4a37;
  --pitch-ink: #f3f7f1;
  --pitch-soft: #2c6149;
  --heat-color: #237a4b;
  --floodlight: #f2b52a;
  --win: #2f8a57;
  --draw: #a3aca6;
  --loss: #c0503f;
  --focus: #f2b52a;
  --bl1: #1c4a37;
  --bl2: #3d6f8f;
  --bl3: #8a6a2f;
  --radius-s: 4px;
  --radius-m: 8px;
  --font: "Barlow", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1613;
    --surface: #151f1a;
    --surface-2: #1b2821;
    --ink: #e4ebe6;
    --ink-soft: #97a59d;
    --line: #2a3832;
    --pitch: #143a2b;
    --pitch-ink: #eaf2ec;
    --pitch-soft: #1f5040;
    --heat-color: #3fae6e;
    --draw: #6f7a74;
    --bl1: #3f9a6f;
    --bl2: #5f97bb;
    --bl3: #c49a4c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1613;
  --surface: #151f1a;
  --surface-2: #1b2821;
  --ink: #e4ebe6;
  --ink-soft: #97a59d;
  --line: #2a3832;
  --pitch: #143a2b;
  --pitch-ink: #eaf2ec;
  --pitch-soft: #1f5040;
  --heat-color: #3fae6e;
  --draw: #6f7a74;
  --bl1: #3f9a6f;
  --bl2: #5f97bb;
  --bl3: #c49a4c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
img { max-width: 100%; }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Kopf */
.masthead {
  background: var(--pitch);
  color: var(--pitch-ink);
  position: relative;
}
.masthead-inner {
  position: relative; z-index: 1;
  max-width: 1180px; margin: 0 auto;
  padding: 10px 20px;
  display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
}
.brand {
  font-family: var(--font-cond);
  font-weight: 700;
  font-size: 30px;
  letter-spacing: .2px;
  line-height: 1;
  text-decoration: none;
  display: flex; align-items: center; gap: 10px;
}
.brand svg { width: 26px; height: 26px; flex: none; }
#nav { display: flex; gap: 2px; flex-wrap: wrap; }
#nav a {
  text-decoration: none;
  padding: 10px 12px 8px;
  font-weight: 600;
  border-bottom: 3px solid transparent;
  color: color-mix(in srgb, var(--pitch-ink) 80%, transparent);
}
#nav a:hover { color: var(--pitch-ink); }
#nav a[aria-current="page"] { color: var(--pitch-ink); border-bottom-color: var(--floodlight); }
.masthead-status { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; }
#status { color: color-mix(in srgb, var(--pitch-ink) 75%, transparent); }
#refresh {
  background: transparent; border: 1px solid color-mix(in srgb, var(--pitch-ink) 40%, transparent);
  color: var(--pitch-ink); border-radius: var(--radius-s); padding: 5px 10px; cursor: pointer;
}
#refresh:hover { background: var(--pitch-soft); }
#refresh:disabled { opacity: .5; cursor: progress; }

main { max-width: 1180px; margin: 0 auto; padding: 18px 20px 40px; }

/* Tage */
.daybar {
  display: grid; grid-template-columns: repeat(7, minmax(92px, 1fr));
  border: 1px solid var(--line); border-radius: var(--radius-m);
  background: var(--surface); overflow-x: auto;
}
.day {
  border: 0; background: transparent; padding: 9px 8px 7px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  border-right: 1px solid var(--line); border-bottom: 3px solid transparent;
  font-weight: 600;
}
.day:last-child { border-right: 0; }
.day span, .day small { white-space: nowrap; }
.day small { font-weight: 400; font-size: 12px; color: var(--ink-soft); }
.day[data-empty] span { color: var(--ink-soft); }
.day:hover { background: var(--surface-2); }
.day[aria-pressed="true"] { border-bottom-color: var(--pitch); background: var(--surface-2); }

/* Werkzeugleiste */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between;
  margin: 14px 0 12px;
}
.toolbar-right { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 12px; cursor: pointer; font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--pitch); border-color: var(--pitch); color: var(--pitch-ink); }
.select { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--ink-soft); }
.select select {
  font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius-s); padding: 6px 8px; min-width: 170px;
}
.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-s); overflow: hidden; background: var(--surface); }
.segmented button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.segmented button + button { border-left: 1px solid var(--line); }
.segmented button[aria-pressed="true"] { background: var(--pitch); color: var(--pitch-ink); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; padding-bottom: 6px; cursor: pointer; }
.check input { accent-color: var(--pitch); width: 16px; height: 16px; }

.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin: 6px 0 14px; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 8px 14px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; color: var(--ink-soft); }
.tab[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--pitch); }

/* Tabellen */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; }
.matches { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); border-collapse: separate; border-spacing: 0; overflow: hidden; min-width: 640px; }
.matches col.c-time { width: 70px; }
.matches col.c-form { width: 76px; }
.matches col.c-stat { width: 96px; }
.matches thead th {
  font-size: 12px; font-weight: 600; color: var(--ink-soft); text-align: left;
  padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.matches th.stat, .matches td.stat { text-align: center; }
.matches th.form, .matches td.form { text-align: center; }
.t-right { text-align: right !important; }
.group-row th {
  text-align: left; font-weight: 600; font-size: 14px;
  padding: 10px 10px 6px; background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.group-row th .muted { margin-left: 10px; font-weight: 400; }
.lg-badge {
  display: inline-block; font-family: var(--font-cond); font-weight: 700; font-size: 13px;
  padding: 1px 6px; border-radius: var(--radius-s); color: #fff; margin-right: 8px; letter-spacing: .2px;
}
.lg-bl1 { background: var(--bl1); } .lg-bl2 { background: var(--bl2); } .lg-bl3 { background: var(--bl3); }

tr.match { cursor: pointer; }
tr.match td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.match:hover td { background: var(--surface-2); }
tr.match.is-open td { background: var(--surface-2); border-bottom-color: transparent; }
td.kick { white-space: nowrap; }
td.kick .time, td.kick .score { font-family: var(--font-cond); font-weight: 600; font-size: 17px; display: block; line-height: 1.1; }
td.kick .score { font-weight: 700; }
td.kick small { font-size: 11px; color: var(--ink-soft); }
td.home { text-align: right; }
.team-name { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.team-name.home { flex-direction: row-reverse; }
.team-name .short { display: none; }
.crest { width: 22px; height: 22px; object-fit: contain; flex: none; }
.crest-empty { display: inline-block; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); }
td.form b { display: block; font-weight: 600; font-size: 14px; line-height: 1.1; }
.dots { display: inline-flex; gap: 2px; margin-top: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 1px; background: var(--draw); display: block; }
.dots i.r-S { background: var(--win); } .dots i.r-N { background: var(--loss); }

/* Die Anzeigetafel: Wahrscheinlichkeiten stehen dort, wo sonst der Spielstand steht */
.pill {
  --heat: 0%;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  min-width: 64px; padding: 5px 8px;
  font-family: var(--font-cond); font-weight: 600; font-size: 17px; line-height: 1;
  border-radius: var(--radius-s);
  background: color-mix(in srgb, var(--heat-color) var(--heat), var(--surface-2));
  border: 1px solid color-mix(in srgb, var(--heat-color) var(--heat), var(--line));
}
.pill[data-hot="1"] { color: #fff; }
.pill-empty { color: var(--ink-soft); }
.mark { font-family: var(--font); font-size: 12px; font-weight: 700; }
.mark.hit { color: var(--win); }
.mark.miss { color: var(--loss); }
.pill[data-hot="1"] .mark.hit, .pill[data-hot="1"] .mark.miss { color: #fff; }

/* Details */
.detail-row > td { padding: 0; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.detail { padding: 6px 16px 18px; }
.detail-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; padding: 8px 0 12px; border-bottom: 1px solid var(--line); }
.detail-head h3 { margin: 0; font-family: var(--font-cond); font-size: 22px; font-weight: 700; }
.xg { text-align: center; font-family: var(--font-cond); }
.xg-num { font-size: 30px; font-weight: 700; }
.xg-sep { font-size: 26px; margin: 0 4px; color: var(--ink-soft); }
.xg small { display: block; font-family: var(--font); font-size: 12px; color: var(--ink-soft); }
.detail-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px 24px; padding-top: 12px; }
.detail-grid section { min-width: 0; }
.d-result { grid-column: span 4; }
.d-markets { grid-column: span 8; }
.d-form { grid-column: span 4; }
.d-scorers { grid-column: span 5; }
.d-h2h { grid-column: span 3; }
.detail h4 { margin: 12px 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.detail h4:first-child { margin-top: 0; }
.result-line { margin: 6px 0 0; }
.goals-line { margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); }

.threeway { display: flex; height: 34px; border-radius: var(--radius-s); overflow: hidden; gap: 2px; }
.threeway span { display: flex; align-items: center; justify-content: center; min-width: 38px; color: #fff; font-family: var(--font-cond); font-size: 16px; }
.tw-1 { background: var(--pitch); } .tw-x { background: var(--draw); } .tw-2 { background: var(--bl2); }
.tw-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
.scores { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.scores li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 5px 8px; display: flex; justify-content: space-between; align-items: baseline; }
.scores b { font-family: var(--font-cond); font-size: 18px; }
.scores span { font-size: 13px; color: var(--ink-soft); }

.mini { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); border-collapse: separate; border-spacing: 0; }
.mini th, .mini td { padding: 4px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
.mini tbody tr:last-child th, .mini tbody tr:last-child td { border-bottom: 0; }
.mini thead th { font-size: 12px; font-weight: 600; color: var(--ink-soft); text-align: left; }
.mini tbody th { text-align: left; font-weight: 500; }
.num { text-align: right !important; white-space: nowrap; }
.mini td.num { position: relative; }
.mini .bar { position: absolute; left: 0; top: 3px; bottom: 3px; width: var(--w); background: color-mix(in srgb, var(--heat-color) 16%, transparent); border-radius: 2px; }
.muted-num { color: var(--ink-soft); }

.formlist { list-style: none; margin: 0; padding: 0; }
.formlist li { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.formlist li:last-child { border-bottom: 0; }
.formlist b { margin-left: auto; font-family: var(--font-cond); font-size: 16px; }
.res { width: 20px; height: 20px; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; flex: none; }
.res.r-S { background: var(--win); } .res.r-U { background: var(--draw); } .res.r-N { background: var(--loss); }
.fl-date { color: var(--ink-soft); font-size: 13px; width: 62px; flex: none; }
.fl-opp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.scorers { list-style: none; margin: 0; padding: 0; }
.scorers li { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name pct" "bar meta"; gap: 0 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.scorers li:last-child { border-bottom: 0; }
.sc-name { grid-area: name; font-weight: 500; }
.scorers b { grid-area: pct; font-family: var(--font-cond); font-size: 16px; text-align: right; }
.sc-meta { grid-area: meta; font-size: 12px; color: var(--ink-soft); text-align: right; }
.bar-inline { grid-area: bar; align-self: center; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar-inline span { display: block; height: 100%; background: var(--heat-color); }

/* Listen */
.page-head { margin: 4px 0 8px; }
.page-head h2 { font-family: var(--font-cond); font-size: 30px; font-weight: 700; margin: 0; line-height: 1.1; }
.page-head p { margin: 4px 0 0; color: var(--ink-soft); max-width: 72ch; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); border-collapse: separate; border-spacing: 0; overflow: hidden; }
.list th, .list td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.list tbody tr:last-child th, .list tbody tr:last-child td { border-bottom: 0; }
.list thead th { font-size: 12px; font-weight: 600; color: var(--ink-soft); background: var(--surface); }
.list tbody th { font-weight: 500; }
.linkrow { cursor: pointer; }
.linkrow:hover td { background: var(--surface-2); }
.pairing { white-space: nowrap; }
.pairing .vs { margin: 0 8px; color: var(--ink-soft); }
.nowrap { white-space: nowrap; }
.sort { border: 0; background: transparent; padding: 0; font-weight: 600; font-size: 12px; color: var(--ink-soft); cursor: pointer; white-space: nowrap; }
.table-league { min-width: 980px; }
.rating { --r: 25%; display: inline-block; min-width: 38px; padding: 2px 6px; border-radius: var(--radius-s); text-align: center; font-weight: 600;
  background: color-mix(in srgb, var(--heat-color) var(--r), var(--surface-2)); }
td.best { font-weight: 700; color: var(--win); }

.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
.three-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; }
.two-col > *, .three-col > * { min-width: 0; }
section h3 { font-family: var(--font-cond); font-size: 21px; font-weight: 700; margin: 18px 0 8px; }
.cal { position: relative; height: 16px; width: 100%; min-width: 160px; }
.cal span { position: absolute; left: 0; height: 7px; width: var(--w); border-radius: 2px; }
.cal-pred { top: 0; background: var(--draw); }
.cal-real { top: 9px; background: var(--heat-color); }

.small { font-size: 12.5px; color: var(--ink-soft); margin: 6px 0 0; }
.muted { color: var(--ink-soft); }
.legend { font-size: 13px; color: var(--ink-soft); margin: 12px 0 0; max-width: 90ch; }
.notice { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--floodlight); padding: 10px 14px; border-radius: var(--radius-s); max-width: 90ch; }
.empty { text-align: center; padding: 40px 20px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius-m); margin-top: 12px; }
.empty p { margin: 0 auto 12px; max-width: 60ch; }
.empty.error { border-style: solid; border-color: var(--loss); }
.btn { background: var(--pitch); color: var(--pitch-ink); border: 0; border-radius: var(--radius-s); padding: 9px 16px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--pitch-soft); }
.btn-quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-quiet:hover { background: var(--surface-2); }

.loading .ball {
  width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%;
  border: 3px solid var(--line); border-top-color: var(--pitch);
  animation: spin 900ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .loading .ball { animation: none; } }

footer { max-width: 1180px; margin: 0 auto; padding: 0 20px 30px; font-size: 12.5px; color: var(--ink-soft); }
footer p { margin: 4px 0; max-width: 100ch; }

@media (max-width: 980px) {
  .d-result, .d-markets, .d-form, .d-scorers, .d-h2h { grid-column: span 12; }
  .d-form, .d-scorers { grid-column: span 6; }
}
@media (max-width: 720px) {
  body { font-size: 14px; }
  .masthead-inner { gap: 6px 16px; padding: 8px 14px; }
  .brand { font-size: 26px; }
  #nav { order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap; }
  #nav a { white-space: nowrap; padding: 8px 10px 6px; }
  .masthead-status { margin-left: auto; }
  #status { display: none; }
  main { padding: 12px 10px 30px; }
  .daybar { grid-template-columns: repeat(7, 92px); }
  .day small { font-size: 11px; }
  .mini th, .mini td { padding: 4px 6px; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .select select { min-width: 0; width: 100%; }
  .toolbar-right > .select { flex: 1 1 140px; }
  .matches { min-width: 0; }
  .matches col.c-form, .matches th.form, .matches td.form { display: none; }
  .matches col.c-stat { width: 70px; }
  .matches col.c-time { width: 50px; }
  tr.match td { padding: 6px 5px; }
  .pill { min-width: 54px; font-size: 15px; padding: 5px 5px; }
  .team-name .full { display: none; }
  .team-name .short { display: inline; }
  .team-name { gap: 5px; }
  .crest { width: 18px; height: 18px; }
  .detail { padding: 4px 10px 14px; }
  .detail-head { flex-direction: column; gap: 6px; }
  .d-form, .d-scorers { grid-column: span 12; }
  .two-col { grid-template-columns: 1fr; }
  .scores { grid-template-columns: repeat(2, 1fr); }
}

</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <a class="brand" href="#spiele">
      <svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="13" y1="1.5" x2="13" y2="24.5" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="13" r="2.6" fill="#f2b52a"/></svg>
      Schnockstats
    </a>
    <nav id="nav" aria-label="Hauptnavigation"></nav>
    <div class="masthead-status">
      <span id="status" aria-live="polite"></span>
      <button id="refresh" data-action="refresh">Daten aktualisieren</button>
    </div>
  </div>
</header>
<main id="main"></main>
<footer>
  <p>Spieldaten: <a href="https://www.openligadb.de" rel="noopener">OpenLigaDB</a>, von einer Community gepflegt. Alle Werte sind statistische Schätzungen aus vergangenen Spielen und keine Garantie für den Ausgang.</p>
</footer>
<script>
/* Schnockstats – Statistikmodell
 * Datenaufbereitung (OpenLigaDB), gewichtetes Poisson-Modell mit Dixon-Coles-Korrektur,
 * Markt-Wahrscheinlichkeiten, historische Quoten, Torschützen, Tabellen und Rückblick.
 */
(function (root) {
  'use strict';

  const DAY = 86400000;
  const LN2 = Math.log(2);

  const LEAGUES = [
    { id: 'bl1', name: '1. Bundesliga', short: '1. BL', rank: 1 },
    { id: 'bl2', name: '2. Bundesliga', short: '2. BL', rank: 2 },
    { id: 'bl3', name: '3. Liga', short: '3. Liga', rank: 3 }
  ];
  const RANK = { bl1: 1, bl2: 2, bl3: 3 };

  const DEFAULTS = {
    halfLife: 240,      // Tage, nach denen ein Spiel nur noch halb zählt
    window: 760,        // Tage Datenfenster
    prior: 5,           // Gewicht der Vorannahme in "Spielen"
    iters: 40,
    maxGoals: 10
  };

  // Vorannahmen für Teams ohne (ausreichende) Daten in dieser Liga
  const PRIORS = {
    neutral: { A: 1.0, D: 1.0 },
    promoted: { A: 0.84, D: 1.16 },
    relegated: { A: 1.1, D: 0.91 },
    newTeam: { A: 0.88, D: 1.12 }
  };

  /* ---------- Datenaufbereitung ---------- */

  function pickResult(results, typeId, namePattern) {
    if (!results || !results.length) return null;
    let r = results.find((x) => x.resultTypeID === typeId);
    if (!r) r = results.find((x) => namePattern.test(x.resultName || ''));
    return r || null;
  }

  function normalizeMatch(m) {
    const t1 = m.team1 || {};
    const t2 = m.team2 || {};
    const results = m.matchResults || [];
    let end = pickResult(results, 2, /end/i);
    if (!end && results.length) {
      end = results.reduce((a, b) => ((b.resultOrderID || 0) > (a.resultOrderID || 0) ? b : a));
    }
    let half = pickResult(results, 1, /halb/i);
    if (half === end) half = null;

    const ts = Date.parse(m.matchDateTimeUTC || '') || Date.parse(m.matchDateTime || '') || 0;

    const goals = [];
    const raw = (m.goals || []).slice().sort((a, b) =>
      ((a.scoreTeam1 || 0) + (a.scoreTeam2 || 0)) - ((b.scoreTeam1 || 0) + (b.scoreTeam2 || 0)) ||
      (a.matchMinute || 0) - (b.matchMinute || 0));
    let p1 = 0, p2 = 0;
    for (const g of raw) {
      const s1 = g.scoreTeam1 == null ? p1 : g.scoreTeam1;
      const s2 = g.scoreTeam2 == null ? p2 : g.scoreTeam2;
      let side = null;
      if (s1 > p1 && s2 === p2) side = 'h';
      else if (s2 > p2 && s1 === p1) side = 'a';
      else if (g.scoringTeamId === t1.teamId) side = 'h';
      else if (g.scoringTeamId === t2.teamId) side = 'a';
      p1 = s1; p2 = s2;
      goals.push({
        m: g.matchMinute == null ? null : g.matchMinute,
        p: g.goalGetterID || 0,
        n: (g.goalGetterName || '').trim(),
        s: side,
        pen: !!g.isPenalty,
        og: !!g.isOwnGoal
      });
    }

    const fin = !!m.matchIsFinished && !!end;
    return {
      id: m.matchID,
      lg: (m.leagueShortcut || '').toLowerCase(),
      season: m.leagueSeason,
      t: ts,
      md: m.group ? m.group.groupOrderID : null,
      mdName: m.group ? m.group.groupName : '',
      h: t1.teamId,
      a: t2.teamId,
      fin,
      hg: fin ? end.pointsTeam1 : null,
      ag: fin ? end.pointsTeam2 : null,
      hh: fin && half ? half.pointsTeam1 : null,
      ha: fin && half ? half.pointsTeam2 : null,
      goals: fin ? goals : []
    };
  }

  function extractTeams(rawMatches, into) {
    const teams = into || {};
    for (const m of rawMatches) {
      for (const t of [m.team1, m.team2]) {
        if (!t || t.teamId == null) continue;
        teams[t.teamId] = {
          n: t.teamName || t.shortName || String(t.teamId),
          s: t.shortName || t.teamName || String(t.teamId),
          i: t.teamIconUrl || ''
        };
      }
    }
    return teams;
  }

  function buildDataset(matches, teams) {
    const seen = new Set();
    const list = [];
    for (const m of matches) {
      if (!m || seen.has(m.id) || !m.t || m.h == null || m.a == null) continue;
      seen.add(m.id);
      list.push(m);
    }
    list.sort((x, y) => x.t - y.t);
    const byTeam = new Map();
    const byLeague = {};
    for (const m of list) {
      if (!byLeague[m.lg]) byLeague[m.lg] = [];
      byLeague[m.lg].push(m);
      for (const tid of [m.h, m.a]) {
        if (!byTeam.has(tid)) byTeam.set(tid, []);
        byTeam.get(tid).push(m);
      }
    }
    return { matches: list, teams: teams || {}, byTeam, byLeague };
  }

  /* ---------- Hilfsfunktionen ---------- */

  function poissonVector(lambda, max) {
    const v = new Array(max + 1);
    v[0] = Math.exp(-lambda);
    for (let k = 1; k <= max; k++) v[k] = v[k - 1] * lambda / k;
    return v;
  }

  function tau(i, j, lh, la, rho) {
    if (i === 0 && j === 0) return 1 - lh * la * rho;
    if (i === 0 && j === 1) return 1 + lh * rho;
    if (i === 1 && j === 0) return 1 + la * rho;
    if (i === 1 && j === 1) return 1 - rho;
    return 1;
  }

  function seasonAt(ds, lg, cutoff) {
    const list = ds.byLeague[lg] || [];
    if (!list.length) return null;
    for (const m of list) if (m.t >= cutoff) return m.season;
    return list[list.length - 1].season;
  }

  function priorFor(ds, teamId, lg, cutoff, curSeason) {
    const list = ds.byTeam.get(teamId) || [];
    let last = null;
    for (let i = list.length - 1; i >= 0; i--) {
      const m = list[i];
      if (m.t < cutoff && m.season < curSeason) { last = m; break; }
    }
    if (!last) {
      const anyBefore = list.some((m) => m.t < cutoff);
      return anyBefore ? PRIORS.neutral : PRIORS.newTeam;
    }
    const r = RANK[last.lg], target = RANK[lg];
    if (r == null || target == null || r === target) return PRIORS.neutral;
    return r > target ? PRIORS.promoted : PRIORS.relegated;
  }

  /* ---------- Modell ---------- */

  function fitLeague(ds, lg, cutoff, options) {
    const o = Object.assign({}, DEFAULTS, options || {});
    const all = ds.byLeague[lg] || [];
    const curSeason = seasonAt(ds, lg, cutoff);

    const train = [];
    for (const m of all) {
      if (m.fin && m.t < cutoff && cutoff - m.t < o.window * DAY) train.push(m);
    }

    // Teams: Trainingsdaten + alle Teams der aktuellen Saison
    const idx = new Map();
    const ids = [];
    const addTeam = (tid) => { if (!idx.has(tid)) { idx.set(tid, ids.length); ids.push(tid); } };
    const activeSet = new Set();
    for (const m of all) {
      if (m.season === curSeason) { addTeam(m.h); addTeam(m.a); activeSet.add(m.h); activeSet.add(m.a); }
    }
    for (const m of train) { addTeam(m.h); addTeam(m.a); }

    const n = ids.length;
    const A = new Float64Array(n), D = new Float64Array(n);
    const A0 = new Float64Array(n), D0 = new Float64Array(n);
    const games = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const pr = priorFor(ds, ids[i], lg, cutoff, curSeason);
      A0[i] = A[i] = pr.A;
      D0[i] = D[i] = pr.D;
    }
    const active = [];
    for (let i = 0; i < n; i++) if (activeSet.has(ids[i])) active.push(i);
    const normIdx = active.length ? active : Array.from({ length: n }, (_, i) => i);

    const M = train.length;
    const hi = new Int32Array(M), ai = new Int32Array(M);
    const hg = new Float64Array(M), ag = new Float64Array(M), w = new Float64Array(M);
    let sw = 0, sGoals = 0, sHt = 0, sFt = 0, sOg = 0, sAllGoals = 0;
    for (let k = 0; k < M; k++) {
      const m = train[k];
      hi[k] = idx.get(m.h); ai[k] = idx.get(m.a);
      hg[k] = m.hg; ag[k] = m.ag;
      const age = (cutoff - m.t) / DAY;
      w[k] = Math.exp(-LN2 * age / o.halfLife);
      sw += w[k];
      sGoals += w[k] * (m.hg + m.ag);
      games[hi[k]] += w[k]; games[ai[k]] += w[k];
      if (m.hh != null) { sHt += w[k] * (m.hh + m.ha); sFt += w[k] * (m.hg + m.ag); }
      if (m.goals.length) { for (const g of m.goals) { if (g.og) sOg += w[k]; } sAllGoals += w[k] * m.goals.length; }
    }
    const eBar = sw > 0 ? sGoals / (2 * sw) : 1.4;
    let bh = 1.6, ba = 1.3;

    const numA = new Float64Array(n), denA = new Float64Array(n);
    const numD = new Float64Array(n), denD = new Float64Array(n);
    const k0 = o.prior * eBar;

    const updateBases = () => {
      let nh = 0, dh = 0, na = 0, da = 0;
      for (let k = 0; k < M; k++) {
        nh += w[k] * hg[k]; dh += w[k] * A[hi[k]] * D[ai[k]];
        na += w[k] * ag[k]; da += w[k] * A[ai[k]] * D[hi[k]];
      }
      if (dh > 0 && nh > 0) bh = nh / dh;
      if (da > 0 && na > 0) ba = na / da;
    };

    if (M > 0) {
      for (let it = 0; it < o.iters; it++) {
        updateBases();
        numA.fill(0); denA.fill(0);
        for (let k = 0; k < M; k++) {
          numA[hi[k]] += w[k] * hg[k]; denA[hi[k]] += w[k] * bh * D[ai[k]];
          numA[ai[k]] += w[k] * ag[k]; denA[ai[k]] += w[k] * ba * D[hi[k]];
        }
        for (let i = 0; i < n; i++) A[i] = (numA[i] + k0 * A0[i]) / (denA[i] + k0);
        numD.fill(0); denD.fill(0);
        for (let k = 0; k < M; k++) {
          numD[ai[k]] += w[k] * hg[k]; denD[ai[k]] += w[k] * bh * A[hi[k]];
          numD[hi[k]] += w[k] * ag[k]; denD[hi[k]] += w[k] * ba * A[ai[k]];
        }
        for (let i = 0; i < n; i++) D[i] = (numD[i] + k0 * D0[i]) / (denD[i] + k0);
        let la = 0, ld = 0;
        for (const i of normIdx) { la += Math.log(A[i]); ld += Math.log(D[i]); }
        const ga = Math.exp(la / normIdx.length), gd = Math.exp(ld / normIdx.length);
        for (let i = 0; i < n; i++) { A[i] /= ga; D[i] /= gd; }
      }
      updateBases();
    }

    // Dixon-Coles rho per Rastersuche
    let rho = 0;
    if (M > 50) {
      let best = -Infinity;
      for (let r = -0.2; r <= 0.1001; r += 0.01) {
        let ll = 0, ok = true;
        for (let k = 0; k < M; k++) {
          if (hg[k] > 1 || ag[k] > 1) continue;
          const lh = bh * A[hi[k]] * D[ai[k]], lA = ba * A[ai[k]] * D[hi[k]];
          const t = tau(hg[k], ag[k], lh, lA, r);
          if (t <= 0) { ok = false; break; }
          ll += w[k] * Math.log(t);
        }
        if (ok && ll > best) { best = ll; rho = r; }
      }
      rho = Math.round(rho * 100) / 100;
    }

    return {
      lg, cutoff, season: curSeason, bh, ba, rho, idx, ids, A, D, A0, D0, games,
      nMatches: M,
      htFrac: sFt > 0 ? Math.min(0.6, Math.max(0.3, sHt / sFt)) : 0.44,
      ogRate: sAllGoals > 0 ? Math.min(0.1, sOg / sAllGoals) : 0.03,
      avgGoals: sw > 0 ? sGoals / sw : 2.9,
      options: o
    };
  }

  function teamRating(model, teamId) {
    const i = model.idx.get(teamId);
    if (i == null) return { A: PRIORS.newTeam.A, D: PRIORS.newTeam.D, games: 0 };
    return { A: model.A[i], D: model.D[i], games: model.games[i] };
  }

  function predictMatch(model, homeId, awayId) {
    const rh = teamRating(model, homeId), ra = teamRating(model, awayId);
    const lh = Math.min(5, Math.max(0.15, model.bh * rh.A * ra.D));
    const la = Math.min(5, Math.max(0.15, model.ba * ra.A * rh.D));
    const N = model.options.maxGoals;
    const ph = poissonVector(lh, N), pa = poissonVector(la, N);
    const mat = [];
    let sum = 0;
    for (let i = 0; i <= N; i++) {
      const row = new Array(N + 1);
      for (let j = 0; j <= N; j++) {
        row[j] = Math.max(0, ph[i] * pa[j] * tau(i, j, lh, la, model.rho));
        sum += row[j];
      }
      mat.push(row);
    }
    const tot = new Array(2 * N + 1).fill(0);
    let pH = 0, pX = 0, pA = 0, btts = 0, hs = 0, as = 0, avg = 0;
    const cells = [];
    for (let i = 0; i <= N; i++) {
      for (let j = 0; j <= N; j++) {
        const p = mat[i][j] / sum;
        if (i > j) pH += p; else if (i === j) pX += p; else pA += p;
        tot[i + j] += p;
        if (i > 0 && j > 0) btts += p;
        if (i > 0) hs += p;
        if (j > 0) as += p;
        avg += (i + j) * p;
        if (i <= 6 && j <= 6) cells.push([i, j, p]);
      }
    }
    const under = (k) => { let s = 0; for (let t = 0; t <= k; t++) s += tot[t]; return s; };
    const x = (lh + la) * model.htFrac;
    const ht05 = 1 - Math.exp(-x);
    const ht15 = 1 - Math.exp(-x) * (1 + x);
    cells.sort((u, v) => v[2] - u[2]);
    const p = {
      '1': pH, X: pX, '2': pA,
      '1X': pH + pX, X2: pX + pA,
      o05: 1 - under(0), o15: 1 - under(1), o25: 1 - under(2), o35: 1 - under(3), o45: 1 - under(4),
      u05: under(0), u15: under(1), u25: under(2), u35: under(3), u45: under(4),
      btts, bttsNo: 1 - btts,
      hs, hc: as, as, ac: hs,
      g13: tot[1] + tot[2] + tot[3],
      ht05, ht15,
      avg
    };
    return { lh, la, p, top: cells.slice(0, 6).map((c) => ({ h: c[0], a: c[1], p: c[2] })) };
  }

  /* ---------- Historische Quoten ---------- */

  function teamHistory(ds, teamId, cutoff, n) {
    const size = n || 10;
    const list = ds.byTeam.get(teamId) || [];
    const recent = [];
    for (let i = list.length - 1; i >= 0 && recent.length < size; i--) {
      const m = list[i];
      if (m.fin && m.t < cutoff) recent.push(m);
    }
    const out = {
      n: recent.length, o05: 0, o15: 0, o25: 0, o35: 0, o45: 0,
      btts: 0, scored: 0, conceded: 0, win: 0, draw: 0, loss: 0, g13: 0,
      ht05: 0, ht15: 0, htN: 0, avg: 0, gf: 0, ga: 0, cs: 0,
      form: [], ppg: null
    };
    if (!recent.length) return out;
    let pts5 = 0, n5 = 0;
    recent.forEach((m, k) => {
      const home = m.h === teamId;
      const f = home ? m.hg : m.ag, a = home ? m.ag : m.hg;
      const total = m.hg + m.ag;
      if (total > 0.5) out.o05++;
      if (total > 1.5) out.o15++;
      if (total > 2.5) out.o25++;
      if (total > 3.5) out.o35++;
      if (total > 4.5) out.o45++;
      if (m.hg > 0 && m.ag > 0) out.btts++;
      if (f > 0) out.scored++;
      if (a > 0) out.conceded++; else out.cs++;
      if (total >= 1 && total <= 3) out.g13++;
      const r = f > a ? 'S' : f === a ? 'U' : 'N';
      if (r === 'S') out.win++; else if (r === 'U') out.draw++; else out.loss++;
      if (m.hh != null) {
        out.htN++;
        const ht = m.hh + m.ha;
        if (ht > 0.5) out.ht05++;
        if (ht > 1.5) out.ht15++;
      }
      out.avg += total; out.gf += f; out.ga += a;
      if (k < 5) {
        n5++; pts5 += r === 'S' ? 3 : r === 'U' ? 1 : 0;
        out.form.push({ r, m, home, f, a });
      }
    });
    const c = recent.length;
    for (const key of ['o05', 'o15', 'o25', 'o35', 'o45', 'btts', 'scored', 'conceded', 'win', 'draw', 'loss', 'g13', 'cs']) out[key] /= c;
    out.ht05 = out.htN ? out.ht05 / out.htN : null;
    out.ht15 = out.htN ? out.ht15 / out.htN : null;
    out.avg /= c; out.gf /= c; out.ga /= c;
    out.ppg = n5 ? pts5 / n5 : null;
    out.form.reverse();
    return out;
  }

  function historyMatch(hH, hA) {
    if (!hH.n || !hA.n) return null;
    const mean = (x, y) => (x == null || y == null ? null : (x + y) / 2);
    return {
      '1': mean(hH.win, hA.loss), X: mean(hH.draw, hA.draw), '2': mean(hA.win, hH.loss),
      '1X': mean(hH.win + hH.draw, hA.loss + hA.draw), X2: mean(hA.win + hA.draw, hH.loss + hH.draw),
      o05: mean(hH.o05, hA.o05), o15: mean(hH.o15, hA.o15), o25: mean(hH.o25, hA.o25),
      o35: mean(hH.o35, hA.o35), o45: mean(hH.o45, hA.o45),
      u05: mean(1 - hH.o05, 1 - hA.o05), u15: mean(1 - hH.o15, 1 - hA.o15), u25: mean(1 - hH.o25, 1 - hA.o25),
      u35: mean(1 - hH.o35, 1 - hA.o35), u45: mean(1 - hH.o45, 1 - hA.o45),
      btts: mean(hH.btts, hA.btts), bttsNo: mean(1 - hH.btts, 1 - hA.btts),
      hs: hH.scored, hc: hH.conceded, as: hA.scored, ac: hA.conceded,
      g13: mean(hH.g13, hA.g13),
      ht05: mean(hH.ht05, hA.ht05), ht15: mean(hH.ht15, hA.ht15),
      avg: mean(hH.avg, hA.avg)
    };
  }

  function outcome(m, key) {
    if (!m.fin) return null;
    const t = m.hg + m.ag;
    switch (key) {
      case '1': return m.hg > m.ag;
      case 'X': return m.hg === m.ag;
      case '2': return m.hg < m.ag;
      case '1X': return m.hg >= m.ag;
      case 'X2': return m.hg <= m.ag;
      case 'o05': return t > 0.5; case 'o15': return t > 1.5; case 'o25': return t > 2.5;
      case 'o35': return t > 3.5; case 'o45': return t > 4.5;
      case 'u05': return t < 0.5; case 'u15': return t < 1.5; case 'u25': return t < 2.5;
      case 'u35': return t < 3.5; case 'u45': return t < 4.5;
      case 'btts': return m.hg > 0 && m.ag > 0;
      case 'bttsNo': return !(m.hg > 0 && m.ag > 0);
      case 'hs': case 'ac': return m.hg > 0;
      case 'hc': case 'as': return m.ag > 0;
      case 'g13': return t >= 1 && t <= 3;
      case 'ht05': return m.hh == null ? null : m.hh + m.ha > 0.5;
      case 'ht15': return m.hh == null ? null : m.hh + m.ha > 1.5;
      default: return null;
    }
  }

  /* ---------- Torschützen ---------- */

  function scorerCandidates(ds, teamId, cutoff, lambdaTeam, ogRate, curSeason, limit) {
    const list = ds.byTeam.get(teamId) || [];
    const players = new Map();
    let teamW = 0, teamSeasonGoals = 0;
    for (let i = list.length - 1; i >= 0; i--) {
      const m = list[i];
      if (!m.fin || m.t >= cutoff) continue;
      const age = (cutoff - m.t) / DAY;
      if (age > 420) break;
      const side = m.h === teamId ? 'h' : 'a';
      const wt = Math.exp(-LN2 * age / 150);
      const goalsFor = side === 'h' ? m.hg : m.ag;
      teamW += wt * goalsFor;
      if (m.season === curSeason) teamSeasonGoals += goalsFor;
      for (const g of m.goals) {
        if (g.og || g.s !== side || !g.n) continue;
        const key = g.p || g.n;
        let pl = players.get(key);
        if (!pl) { pl = { id: key, name: g.n, w: 0, season: 0, pens: 0, last: m.t }; players.set(key, pl); }
        pl.w += wt;
        if (m.season === curSeason) pl.season++;
        if (g.pen) pl.pens++;
        if (m.t > pl.last) pl.last = m.t;
      }
    }
    const out = [];
    for (const pl of players.values()) {
      let share = pl.w / (teamW + 2.5);
      if (pl.season === 0) {
        if ((cutoff - pl.last) / DAY > 300) continue;
        if (teamSeasonGoals >= 6) share *= 0.5;
      }
      const prob = 1 - Math.exp(-lambdaTeam * (1 - ogRate) * share);
      out.push({ id: pl.id, name: pl.name, share, season: pl.season, pens: pl.pens, p: prob });
    }
    out.sort((x, y) => y.p - x.p);
    return out.slice(0, limit || 6);
  }

  function topScorers(ds, lg, season) {
    const map = new Map();
    for (const m of ds.byLeague[lg] || []) {
      if (m.season !== season || !m.fin) continue;
      for (const g of m.goals) {
        if (g.og || !g.n || !g.s) continue;
        const key = g.p || g.n;
        let pl = map.get(key);
        if (!pl) { pl = { id: key, name: g.n, goals: 0, pens: 0, team: null, lastT: 0 }; map.set(key, pl); }
        pl.goals++;
        if (g.pen) pl.pens++;
        if (m.t >= pl.lastT) { pl.lastT = m.t; pl.team = g.s === 'h' ? m.h : m.a; }
      }
    }
    return Array.from(map.values()).sort((a, b) => b.goals - a.goals || a.pens - b.pens || a.name.localeCompare(b.name));
  }

  /* ---------- Tabelle ---------- */

  function leagueTable(ds, lg, season, cutoff) {
    const rows = new Map();
    const get = (tid) => {
      if (!rows.has(tid)) rows.set(tid, { team: tid, sp: 0, s: 0, u: 0, n: 0, tf: 0, tg: 0, pts: 0, o25: 0, btts: 0, cs: 0, results: [] });
      return rows.get(tid);
    };
    for (const m of ds.byLeague[lg] || []) {
      if (m.season !== season) continue;
      get(m.h); get(m.a);
      if (!m.fin || (cutoff && m.t >= cutoff)) continue;
      for (const side of ['h', 'a']) {
        const r = get(side === 'h' ? m.h : m.a);
        const f = side === 'h' ? m.hg : m.ag, a = side === 'h' ? m.ag : m.hg;
        r.sp++; r.tf += f; r.tg += a;
        if (f > a) { r.s++; r.pts += 3; r.results.push('S'); }
        else if (f === a) { r.u++; r.pts += 1; r.results.push('U'); }
        else { r.n++; r.results.push('N'); }
        if (m.hg + m.ag > 2.5) r.o25++;
        if (m.hg > 0 && m.ag > 0) r.btts++;
        if (a === 0) r.cs++;
      }
    }
    const list = Array.from(rows.values());
    list.sort((x, y) => y.pts - x.pts || (y.tf - y.tg) - (x.tf - x.tg) || y.tf - x.tf);
    list.forEach((r, i) => { r.pos = i + 1; r.form = r.results.slice(-5); });
    return list;
  }

  /* ---------- Rückblick (Walk-forward) ---------- */

  function weekStart(ts) {
    const d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    const day = (d.getDay() + 6) % 7; // Montag = 0
    return d.getTime() - day * DAY;
  }

  const CHECK_MARKETS = ['o15', 'o25', 'o35', 'btts', 'hs', 'as'];

  function backtestLeague(ds, lg, fromSeason, cutoffNow, options) {
    const list = (ds.byLeague[lg] || []).filter((m) => m.fin && m.season >= fromSeason && m.t < cutoffNow);
    const weeks = new Map();
    for (const m of list) {
      const ws = weekStart(m.t);
      if (!weeks.has(ws)) weeks.set(ws, []);
      weeks.get(ws).push(m);
    }
    const preds = [];
    const allLg = ds.byLeague[lg] || [];
    for (const [ws, games] of Array.from(weeks.entries()).sort((a, b) => a[0] - b[0])) {
      const model = fitLeague(ds, lg, ws, options);
      if (model.nMatches < 30) continue;
      // Basisrate: Anteil im Jahr vor dem Stichtag
      const base = {}; const cnt = {};
      for (const k of CHECK_MARKETS) { base[k] = 0; cnt[k] = 0; }
      let b1 = 0, bX = 0, b2 = 0, bn = 0;
      for (const m of allLg) {
        if (!m.fin || m.t >= ws || ws - m.t > 365 * DAY) continue;
        for (const k of CHECK_MARKETS) { const oc = outcome(m, k); if (oc != null) { base[k] += oc ? 1 : 0; cnt[k]++; } }
        bn++; if (m.hg > m.ag) b1++; else if (m.hg === m.ag) bX++; else b2++;
      }
      for (const k of CHECK_MARKETS) base[k] = cnt[k] ? base[k] / cnt[k] : 0.5;
      const base1x2 = bn ? [b1 / bn, bX / bn, b2 / bn] : [0.45, 0.27, 0.28];
      for (const m of games) {
        const pr = predictMatch(model, m.h, m.a);
        const hist = historyMatch(teamHistory(ds, m.h, ws, 10), teamHistory(ds, m.a, ws, 10));
        preds.push({ m, p: pr.p, hist, base, base1x2 });
      }
    }
    return preds;
  }

  function evaluate(preds) {
    const markets = {};
    for (const k of CHECK_MARKETS) markets[k] = { n: 0, model: 0, hist: 0, histN: 0, histModel: 0, base: 0, rate: 0, buckets: Array.from({ length: 10 }, () => ({ n: 0, p: 0, hit: 0 })) };
    const x12 = { n: 0, model: 0, base: 0, hist: 0, histN: 0, histModel: 0, correct: 0 };
    for (const r of preds) {
      for (const k of CHECK_MARKETS) {
        const oc = outcome(r.m, k);
        if (oc == null) continue;
        const y = oc ? 1 : 0;
        const e = markets[k];
        const pm = r.p[k];
        e.n++; e.rate += y;
        e.model += (pm - y) ** 2;
        e.base += (r.base[k] - y) ** 2;
        if (r.hist && r.hist[k] != null) {
          e.histN++;
          e.hist += (r.hist[k] - y) ** 2;
          e.histModel += (pm - y) ** 2;
        }
        const b = e.buckets[Math.min(9, Math.floor(pm * 10))];
        b.n++; b.p += pm; b.hit += y;
      }
      const y = [r.m.hg > r.m.ag ? 1 : 0, r.m.hg === r.m.ag ? 1 : 0, r.m.hg < r.m.ag ? 1 : 0];
      const pm = [r.p['1'], r.p.X, r.p['2']];
      x12.n++;
      x12.model += pm.reduce((s, v, i) => s + (v - y[i]) ** 2, 0);
      x12.base += r.base1x2.reduce((s, v, i) => s + (v - y[i]) ** 2, 0);
      if (r.hist && r.hist['1'] != null) {
        const ph = [r.hist['1'], r.hist.X, r.hist['2']];
        const sum = ph[0] + ph[1] + ph[2] || 1;
        x12.histN++;
        x12.hist += ph.reduce((s, v, i) => s + (v / sum - y[i]) ** 2, 0);
        x12.histModel += pm.reduce((s, v, i) => s + (v - y[i]) ** 2, 0);
      }
      const arg = pm.indexOf(Math.max(...pm));
      if (y[arg]) x12.correct++;
    }
    for (const k of CHECK_MARKETS) {
      const e = markets[k];
      if (e.n) { e.model /= e.n; e.base /= e.n; e.rate /= e.n; }
      if (e.histN) { e.hist /= e.histN; e.histModel /= e.histN; }
    }
    if (x12.n) { x12.model /= x12.n; x12.base /= x12.n; x12.correct /= x12.n; }
    if (x12.histN) { x12.hist /= x12.histN; x12.histModel /= x12.histN; }
    return { markets, x12, n: preds.length };
  }

  const api = {
    DAY, LEAGUES, RANK, DEFAULTS, PRIORS, CHECK_MARKETS,
    normalizeMatch, extractTeams, buildDataset, seasonAt,
    fitLeague, predictMatch, teamRating,
    teamHistory, historyMatch, outcome,
    scorerCandidates, topScorers, leagueTable,
    backtestLeague, evaluate, weekStart
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SchnockstatsModel = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Schnockstats – Oberfläche */
(function () {
  'use strict';

  const M = window.SchnockstatsModel;
  const DAY = M.DAY;
  const API = 'https://api.openligadb.de';
  const CACHE = 'schnockstats:v1:';
  const PREFS = 'schnockstats:prefs';
  const CURRENT_TTL = 20 * 60 * 1000;
  const PAST_TTL = 7 * DAY;

  const MARKETS = [
    { id: 'o15', label: 'Über 1.5 Tore', col: 'Ü 1.5', group: 'Tore' },
    { id: 'o25', label: 'Über 2.5 Tore', col: 'Ü 2.5', group: 'Tore' },
    { id: 'o35', label: 'Über 3.5 Tore', col: 'Ü 3.5', group: 'Tore' },
    { id: 'u15', label: 'Unter 1.5 Tore', col: 'U 1.5', group: 'Tore' },
    { id: 'u25', label: 'Unter 2.5 Tore', col: 'U 2.5', group: 'Tore' },
    { id: 'u35', label: 'Unter 3.5 Tore', col: 'U 3.5', group: 'Tore' },
    { id: 'g13', label: '1 bis 3 Tore', col: '1–3 Tore', group: 'Tore' },
    { id: 'btts', label: 'Beide Teams treffen', col: 'BTTS', group: 'Tore' },
    { id: 'avg', label: 'Erwartete Tore (⌀)', col: '⌀ Tore', group: 'Tore', value: true },
    { id: 'hs', label: 'Heimteam trifft', col: 'Heim trifft', group: 'Teams' },
    { id: 'hc', label: 'Heimteam kassiert', col: 'Heim kassiert', group: 'Teams' },
    { id: 'as', label: 'Auswärtsteam trifft', col: 'Ausw. trifft', group: 'Teams' },
    { id: 'ac', label: 'Auswärtsteam kassiert', col: 'Ausw. kassiert', group: 'Teams' },
    { id: '1', label: 'Heimsieg', col: 'Heimsieg', group: 'Ergebnis' },
    { id: 'X', label: 'Unentschieden', col: 'Remis', group: 'Ergebnis' },
    { id: '2', label: 'Auswärtssieg', col: 'Auswärtssieg', group: 'Ergebnis' },
    { id: '1X', label: 'Heimteam verliert nicht', col: '1X', group: 'Ergebnis' },
    { id: 'X2', label: 'Auswärtsteam verliert nicht', col: 'X2', group: 'Ergebnis' },
    { id: 'ht05', label: 'Tor in der 1. Halbzeit', col: 'Tor 1. HZ', group: 'Halbzeit' },
    { id: 'ht15', label: 'Über 1.5 Tore in der 1. Halbzeit', col: 'Ü 1.5 HZ', group: 'Halbzeit' }
  ];
  const MARKET = Object.fromEntries(MARKETS.map((m) => [m.id, m]));
  const LEAGUE = Object.fromEntries(M.LEAGUES.map((l) => [l.id, l]));

  const S = {
    view: 'spiele',
    ds: null,
    dataTime: 0,
    stale: false,
    loadError: null,
    day: null,
    allDays: false,
    leagues: new Set(['bl1', 'bl2', 'bl3']),
    stat1: 'o25',
    stat2: 'btts',
    mode: 'model',
    open: new Set(),
    models: new Map(),
    analyses: new Map(),
    h2h: new Map(),
    statMarket: 'o25',
    tableLeague: 'bl1',
    tableSort: { key: 'pos', dir: 1 },
    scorerLeague: 'bl1',
    check: null,
    checkRunning: false,
    checkProgress: ''
  };

  /* ---------- Hilfen ---------- */

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const pct = (p) => (p == null || isNaN(p) ? '–' : Math.round(p * 100) + '\u202F%');
  const dec = (x, d) => (x == null || isNaN(x) ? '–' : x.toFixed(d == null ? 2 : d).replace('.', ','));
  const fairOdds = (p) => (p == null || p <= 0.001 ? '–' : dec(1 / p, 2));
  const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

  function dayStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function addDays(ts, n) { const d = new Date(ts); d.setDate(d.getDate() + n); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function fmtTime(ts) { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function fmtDate(ts, withYear) {
    const d = new Date(ts);
    const s = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.';
    return withYear ? s + String(d.getFullYear()).slice(2) : s;
  }
  function fmtDay(ts) { return WD[new Date(ts).getDay()] + ' ' + fmtDate(ts); }
  function seasonLabel(y) { return y + '/' + String(y + 1).slice(2); }
  function currentSeason() { const d = new Date(); return d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1; }

  function team(id) { return (S.ds && S.ds.teams[id]) || { n: 'Team ' + id, s: 'Team ' + id, i: '' }; }
  function teamName(id, cls) {
    const t = team(id);
    const icon = t.i ? `<img class="crest" src="${esc(t.i)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<span class="crest crest-empty" aria-hidden="true"></span>';
    return `<span class="team-name ${cls || ''}">${icon}<span class="full">${esc(t.n)}</span><span class="short">${esc(t.s)}</span></span>`;
  }

  function readJSON(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function writeJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } }

  function savePrefs() {
    writeJSON(PREFS, { stat1: S.stat1, stat2: S.stat2, mode: S.mode, leagues: Array.from(S.leagues), allDays: S.allDays, statMarket: S.statMarket });
  }
  function loadPrefs() {
    const p = readJSON(PREFS);
    if (!p) return;
    if (MARKET[p.stat1]) S.stat1 = p.stat1;
    if (MARKET[p.stat2]) S.stat2 = p.stat2;
    if (MARKET[p.statMarket]) S.statMarket = p.statMarket;
    if (p.mode === 'model' || p.mode === 'hist') S.mode = p.mode;
    if (Array.isArray(p.leagues) && p.leagues.length) S.leagues = new Set(p.leagues.filter((l) => LEAGUE[l]));
    if (!S.leagues.size) S.leagues = new Set(['bl1', 'bl2', 'bl3']);
    S.allDays = !!p.allDays;
  }

  /* ---------- Daten laden ---------- */

  async function fetchJSON(url) {
    const res = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function loadSeason(lg, season, force) {
    const key = CACHE + lg + ':' + season;
    const cached = readJSON(key);
    const ttl = season >= currentSeason() ? CURRENT_TTL : PAST_TTL;
    if (cached && !force && Date.now() - cached.at < ttl) return cached;
    try {
      const raw = await fetchJSON(`${API}/getmatchdata/${lg}/${season}`);
      const list = Array.isArray(raw) ? raw : [];
      const data = { at: Date.now(), teams: M.extractTeams(list), matches: list.map(M.normalizeMatch) };
      writeJSON(key, data);
      return data;
    } catch (err) {
      if (cached) { cached.stale = true; return cached; }
      throw err;
    }
  }

  async function loadAll(force) {
    const cur = currentSeason();
    const jobs = [];
    for (const lg of ['bl1', 'bl2', 'bl3']) for (const s of [cur - 2, cur - 1, cur]) jobs.push({ lg, s });
    let done = 0;
    setLoading(`Lade Spieldaten (0 von ${jobs.length})`);
    const results = [];
    let failures = 0, stale = false;
    const queue = jobs.slice();
    async function worker() {
      while (queue.length) {
        const job = queue.shift();
        try {
          const d = await loadSeason(job.lg, job.s, force && job.s === cur);
          if (d.stale) stale = true;
          results.push(d);
        } catch (e) {
          failures++;
        }
        done++;
        setLoading(`Lade Spieldaten (${done} von ${jobs.length})`);
      }
    }
    await Promise.all([worker(), worker(), worker()]);
    if (!results.length) throw new Error('keine Daten');
    const teams = {};
    const matches = [];
    let newest = 0;
    for (const r of results) {
      Object.assign(teams, r.teams);
      for (const m of r.matches) matches.push(m);
      newest = Math.max(newest, r.at);
    }
    S.ds = M.buildDataset(matches, teams);
    S.dataTime = Date.now();
    S.stale = stale || failures > 0;
    S.models.clear();
    S.analyses.clear();
    S.check = null;
  }

  function setLoading(text) {
    const el = $('#status');
    if (el) el.textContent = text;
  }

  /* ---------- Analyse ---------- */

  function cutoffFor(ts) { return Math.min(dayStart(ts), S.dataTime); }

  function getModel(lg, cutoff) {
    const key = lg + '|' + cutoff;
    if (!S.models.has(key)) S.models.set(key, M.fitLeague(S.ds, lg, cutoff));
    return S.models.get(key);
  }

  function analyze(m) {
    if (S.analyses.has(m.id)) return S.analyses.get(m.id);
    const cutoff = cutoffFor(m.t);
    const model = getModel(m.lg, cutoff);
    const pred = M.predictMatch(model, m.h, m.a);
    const hH = M.teamHistory(S.ds, m.h, cutoff, 10);
    const hA = M.teamHistory(S.ds, m.a, cutoff, 10);
    const an = { cutoff, model, pred, hH, hA, hist: M.historyMatch(hH, hA) };
    S.analyses.set(m.id, an);
    return an;
  }

  function valueOf(an, id, mode) {
    const src = (mode || S.mode) === 'model' ? an.pred.p : an.hist;
    return src ? src[id] : null;
  }

  /* ---------- Bausteine ---------- */

  function heatStyle(v, market) {
    if (v == null) return '';
    const x = market && market.value ? clamp((v - 2) / 2, 0, 1) : clamp((v - 0.3) / 0.65, 0, 1);
    const pctHeat = Math.round(Math.pow(x, 1.15) * 88);
    return ` style="--heat:${pctHeat}%" data-hot="${pctHeat > 52 ? 1 : 0}"`;
  }

  function statPill(an, m, id, mode) {
    const market = MARKET[id];
    const v = valueOf(an, id, mode);
    if (v == null) return '<span class="pill pill-empty">–</span>';
    const text = market.value ? dec(v, 2) : pct(v);
    let mark = '';
    if (m.fin && !market.value) {
      const oc = M.outcome(m, id);
      if (oc === true) mark = '<span class="mark hit" title="Eingetreten" aria-label="eingetreten">✓</span>';
      else if (oc === false) mark = '<span class="mark miss" title="Nicht eingetreten" aria-label="nicht eingetreten">✗</span>';
    }
    return `<span class="pill"${heatStyle(v, market)}>${text}${mark}</span>`;
  }

  function formDots(form) {
    return `<span class="dots" aria-hidden="true">${form.map((f) => `<i class="r-${f.r}"></i>`).join('')}</span>`;
  }

  function formCell(h) {
    if (!h.n) return '<td class="form"><span class="muted">–</span></td>';
    const label = h.form.map((f) => ({ S: 'Sieg', U: 'Remis', N: 'Niederlage' }[f.r])).join(', ');
    return `<td class="form" title="Letzte Spiele: ${esc(label)}"><b>${dec(h.ppg, 2)}</b>${formDots(h.form)}</td>`;
  }

  function chips(selected, onAttr) {
    return M.LEAGUES.map((l) => `<button class="chip" ${onAttr}="${l.id}" aria-pressed="${selected.has(l.id)}">${esc(l.name)}</button>`).join('');
  }

  function marketSelect(id, value, label) {
    const groups = {};
    for (const mk of MARKETS) (groups[mk.group] = groups[mk.group] || []).push(mk);
    const opts = Object.entries(groups).map(([g, list]) =>
      `<optgroup label="${esc(g)}">${list.map((mk) => `<option value="${mk.id}"${mk.id === value ? ' selected' : ''}>${esc(mk.label)}</option>`).join('')}</optgroup>`).join('');
    return `<label class="select"><span>${esc(label)}</span><select id="${id}">${opts}</select></label>`;
  }

  function modeSwitch() {
    return `<div class="segmented" role="group" aria-label="Berechnung">
      <button data-mode="model" aria-pressed="${S.mode === 'model'}" title="Poisson-Modell mit Teamstärken, Heimvorteil und Form">Modell</button>
      <button data-mode="hist" aria-pressed="${S.mode === 'hist'}" title="Anteil in den letzten 10 Spielen beider Teams">Letzte 10</button>
    </div>`;
  }

  /* ---------- Ansicht: Spiele ---------- */

  function matchesInRange(from, to) {
    return S.ds.matches.filter((m) => S.leagues.has(m.lg) && m.t >= from && m.t < to);
  }

  function pickDefaultDay() {
    const today = dayStart(Date.now());
    for (let off = 0; off <= 5; off++) {
      if (matchesInRange(addDays(today, off), addDays(today, off + 1)).length) return off;
    }
    return 0;
  }

  function renderSpiele() {
    const today = dayStart(Date.now());
    if (S.day == null) S.day = pickDefaultDay();
    const tabs = [];
    for (let off = -1; off <= 5; off++) {
      const start = addDays(today, off);
      const count = matchesInRange(start, addDays(today, off + 1)).length;
      const label = off === -1 ? 'Gestern' : off === 0 ? 'Heute' : off === 1 ? 'Morgen' : fmtDay(start);
      tabs.push(`<button class="day" data-day="${off}" aria-pressed="${!S.allDays && S.day === off}"${count ? '' : ' data-empty="1"'}>
        <span>${esc(label)}</span><small>${count ? count + ' Spiele' : 'keine Spiele'}</small></button>`);
    }

    let from, to;
    if (S.allDays) { from = addDays(today, -1); to = addDays(today, 6); }
    else { from = addDays(today, S.day); to = addDays(today, S.day + 1); }
    const list = matchesInRange(from, to).sort((a, b) => a.t - b.t || M.RANK[a.lg] - M.RANK[b.lg]);

    const groups = new Map();
    for (const m of list) {
      const key = (S.allDays ? dayStart(m.t) + '|' : '') + m.lg;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(m);
    }
    const orderedKeys = Array.from(groups.keys()).sort((a, b) => {
      const [da, la] = S.allDays ? a.split('|') : [0, a];
      const [db, lb] = S.allDays ? b.split('|') : [0, b];
      return (+da - +db) || (M.RANK[la] - M.RANK[lb]);
    });

    const c1 = MARKET[S.stat1], c2 = MARKET[S.stat2];
    let body = '';
    for (const key of orderedKeys) {
      const ms = groups.get(key);
      const lg = ms[0].lg;
      const mds = Array.from(new Set(ms.map((m) => m.mdName).filter(Boolean)));
      const dayLabel = S.allDays ? fmtDay(ms[0].t) + ', ' : '';
      body += `<tbody class="league-group"><tr class="group-row"><th colspan="7" scope="colgroup">
        <span class="lg-badge lg-${lg}">${esc(LEAGUE[lg].short)}</span>${esc(dayLabel)}${esc(LEAGUE[lg].name)}<span class="muted">${esc(mds.join(', '))}</span></th></tr>`;
      for (const m of ms) body += matchRow(m);
      body += '</tbody>';
    }

    const empty = !list.length
      ? `<div class="empty"><p>Für diesen Tag sind in den gewählten Ligen keine Spiele angesetzt.</p>
         <button class="btn" data-action="next-day">Nächsten Spieltag anzeigen</button></div>`
      : '';

    return `
      <div class="daybar" role="group" aria-label="Tag wählen">${tabs.join('')}</div>
      <div class="toolbar">
        <div class="chips" role="group" aria-label="Ligen">${chips(S.leagues, 'data-league')}</div>
        <div class="toolbar-right">
          ${marketSelect('stat1', S.stat1, '1. Statistik')}
          ${marketSelect('stat2', S.stat2, '2. Statistik')}
          ${modeSwitch()}
          <label class="check"><input type="checkbox" id="allDays"${S.allDays ? ' checked' : ''}> Alle Tage zusammen</label>
        </div>
      </div>
      ${list.length ? `<div class="table-wrap"><table class="matches">
        <colgroup><col class="c-time"><col class="c-team"><col class="c-form"><col class="c-stat"><col class="c-stat"><col class="c-form"><col class="c-team"></colgroup>
        <thead><tr>
          <th scope="col">Zeit</th><th scope="col" class="t-right">Heim</th><th scope="col" class="form">Form</th>
          <th scope="col" class="stat">${esc(c1.col)}</th><th scope="col" class="stat">${esc(c2.col)}</th>
          <th scope="col" class="form">Form</th><th scope="col">Auswärts</th>
        </tr></thead>${body}</table></div>` : empty}
      <p class="legend">Form = Punkte pro Spiel aus den letzten 5 Partien. ${S.mode === 'model'
        ? 'Werte aus dem Modell: Teamstärke in Angriff und Abwehr, Heimvorteil, jüngere Spiele zählen stärker.'
        : 'Werte aus den letzten 10 Spielen beider Teams, ohne Gewichtung nach Gegner.'} Ein Klick auf ein Spiel zeigt alle Details.</p>`;
  }

  function matchRow(m) {
    const an = analyze(m);
    const open = S.open.has(m.id);
    const time = m.fin
      ? `<span class="score">${m.hg}:${m.ag}</span><small>Ende</small>`
      : (m.t < Date.now() - 3 * 3600000 ? `<span class="time">${fmtTime(m.t)}</span><small>kein Ergebnis</small>` : m.t < Date.now() ? `<span class="time">${fmtTime(m.t)}</span><small>läuft</small>` : `<span class="time">${fmtTime(m.t)}</span>`);
    const row = `<tr class="match${open ? ' is-open' : ''}" data-match="${m.id}" tabindex="0" aria-expanded="${open}">
      <td class="kick">${time}</td>
      <td class="home">${teamName(m.h, 'home')}</td>
      ${formCell(an.hH)}
      <td class="stat">${statPill(an, m, S.stat1)}</td>
      <td class="stat">${statPill(an, m, S.stat2)}</td>
      ${formCell(an.hA)}
      <td class="away">${teamName(m.a, 'away')}</td>
    </tr>`;
    return open ? row + `<tr class="detail-row"><td colspan="7">${renderDetail(m, an)}</td></tr>` : row;
  }

  /* ---------- Spieldetails ---------- */

  function renderDetail(m, an) {
    const p = an.pred.p, h = an.hist || {};
    const th = team(m.h), ta = team(m.a);

    const threeWay = `<div class="threeway" role="img" aria-label="Heimsieg ${pct(p['1'])}, Unentschieden ${pct(p.X)}, Auswärtssieg ${pct(p['2'])}">
      <span class="tw-1" style="flex:${p['1']}"><b>${pct(p['1'])}</b></span>
      <span class="tw-x" style="flex:${p.X}"><b>${pct(p.X)}</b></span>
      <span class="tw-2" style="flex:${p['2']}"><b>${pct(p['2'])}</b></span>
    </div>
    <div class="tw-labels"><span>${esc(th.s)}</span><span>Remis</span><span>${esc(ta.s)}</span></div>`;

    const rows = ['o05', 'o15', 'o25', 'o35', 'o45', 'u15', 'u25', 'u35', 'g13', 'btts', 'hs', 'as', 'ht05', 'ht15', '1X', 'X2'];
    const labels = { o05: 'Über 0.5 Tore', o45: 'Über 4.5 Tore' };
    const mkTable = `<table class="mini">
      <thead><tr><th scope="col">Ereignis</th><th scope="col" class="num">Modell</th><th scope="col" class="num">Letzte 10</th><th scope="col" class="num">Faire Quote</th></tr></thead>
      <tbody>${rows.map((id) => {
        const lab = labels[id] || MARKET[id].label;
        const oc = m.fin ? M.outcome(m, id) : null;
        const mark = oc === true ? ' <span class="mark hit" aria-label="eingetreten">✓</span>' : oc === false ? ' <span class="mark miss" aria-label="nicht eingetreten">✗</span>' : '';
        return `<tr><th scope="row">${esc(lab)}${mark}</th>
          <td class="num"><span class="bar" style="--w:${Math.round(p[id] * 100)}%"></span>${pct(p[id])}</td>
          <td class="num muted-num">${pct(h[id])}</td><td class="num">${fairOdds(p[id])}</td></tr>`;
      }).join('')}</tbody></table>`;

    const top = `<ol class="scores">${an.pred.top.map((c) => `<li><b>${c.h}:${c.a}</b><span>${pct(c.p)}</span></li>`).join('')}</ol>`;

    const formList = (hist, tid) => {
      if (!hist.n) return '<p class="muted">Keine früheren Spiele in den Daten.</p>';
      return `<ul class="formlist">${hist.form.slice().reverse().map((f) => {
        const opp = f.home ? f.m.a : f.m.h;
        return `<li><span class="res r-${f.r}">${f.r}</span><span class="fl-date">${fmtDate(f.m.t, true)}</span>
          <span class="fl-opp">${f.home ? 'vs.' : 'bei'} ${esc(team(opp).s)}</span><b>${f.f}:${f.a}</b></li>`;
      }).join('')}</ul>
      <p class="small">Letzte 10: ${dec(hist.gf, 1)} Tore erzielt, ${dec(hist.ga, 1)} kassiert pro Spiel, Zu Null ${pct(hist.cs)}</p>`;
    };

    const curSeason = an.model.season;
    const scH = M.scorerCandidates(S.ds, m.h, an.cutoff, an.pred.lh, an.model.ogRate, curSeason, 6);
    const scA = M.scorerCandidates(S.ds, m.a, an.cutoff, an.pred.la, an.model.ogRate, curSeason, 6);
    const scorerList = (list, tid) => {
      if (!list.length) return '<p class="muted">Keine Torschützendaten vorhanden.</p>';
      const scorers = new Set(m.fin ? m.goals.filter((g) => !g.og).map((g) => g.p || g.n) : []);
      return `<ul class="scorers">${list.map((s) => `<li><span class="sc-name">${esc(s.name)}${scorers.has(s.id) ? ' <span class="mark hit" aria-label="hat getroffen">✓</span>' : ''}</span>
        <span class="sc-meta">${s.season} ${s.season === 1 ? 'Saisontor' : 'Saisontore'}</span>
        <span class="bar-inline"><span style="width:${Math.round(s.p * 100)}%"></span></span><b>${pct(s.p)}</b></li>`).join('')}</ul>`;
    };

    const goalsLine = m.fin && m.goals.length
      ? `<p class="goals-line">${m.goals.map((g) => `${g.m != null ? g.m + '.' : ''} ${esc(g.n || 'unbekannt')}${g.og ? ' (ET)' : g.pen ? ' (11m)' : ''}`).join(', ')}</p>`
      : '';

    const result = m.fin
      ? `<p class="result-line">Endstand <b>${m.hg}:${m.ag}</b>${m.hh != null ? ` (Halbzeit ${m.hh}:${m.ha})` : ''}. Die Prognose nutzt nur Spiele vor diesem Tag.</p>${goalsLine}`
      : '';

    const h2hKey = Math.min(m.h, m.a) + '-' + Math.max(m.h, m.a);
    const h2h = S.h2h.get(h2hKey);
    let h2hHtml;
    if (!h2h) { h2hHtml = '<p class="muted">Wird geladen …</p>'; loadH2H(m, h2hKey); }
    else if (h2h.error) h2hHtml = '<p class="muted">Der direkte Vergleich konnte nicht geladen werden.</p>';
    else if (!h2h.list.length) h2hHtml = '<p class="muted">Keine früheren Duelle gefunden.</p>';
    else {
      h2hHtml = `<ul class="formlist">${h2h.list.map((x) => `<li><span class="fl-date">${fmtDate(x.t, true)}</span>
        <span class="fl-opp">${esc(team(x.h).s)} – ${esc(team(x.a).s)}</span><b>${x.hg}:${x.ag}</b></li>`).join('')}</ul>
        <p class="small">${h2h.summary}</p>`;
    }

    return `<div class="detail">
      <div class="detail-head">
        <div><h3>${esc(th.n)} – ${esc(ta.n)}</h3>
          <p class="small">${esc(LEAGUE[m.lg].name)}, ${esc(m.mdName || '')}, ${fmtDay(m.t)} ${fmtTime(m.t)} Uhr</p>
          ${result}</div>
        <div class="xg"><span class="xg-num">${dec(an.pred.lh, 2)}</span><span class="xg-sep">:</span><span class="xg-num">${dec(an.pred.la, 2)}</span>
          <small>erwartete Tore</small></div>
      </div>
      <div class="detail-grid">
        <section class="d-result"><h4>Ausgang</h4>${threeWay}<h4>Wahrscheinlichste Ergebnisse</h4>${top}</section>
        <section class="d-markets"><h4>Ereignisse</h4><div class="table-wrap">${mkTable}</div></section>
        <section class="d-form"><h4>Form ${esc(th.s)}</h4>${formList(an.hH, m.h)}<h4>Form ${esc(ta.s)}</h4>${formList(an.hA, m.a)}</section>
        <section class="d-scorers"><h4>Mögliche Torschützen ${esc(th.s)}</h4>${scorerList(scH, m.h)}<h4>Mögliche Torschützen ${esc(ta.s)}</h4>${scorerList(scA, m.a)}
          <p class="small">Aus dem Toranteil der letzten Monate. Aufstellungen und Verletzungen sind nicht berücksichtigt.</p></section>
        <section class="d-h2h"><h4>Direkter Vergleich</h4><div data-h2h="${h2hKey}">${h2hHtml}</div></section>
      </div>
    </div>`;
  }

  async function loadH2H(m, key) {
    if (S.h2h.has(key)) return;
    S.h2h.set(key, null);
    try {
      const raw = await fetchJSON(`${API}/getmatchdata/${m.h}/${m.a}`);
      const list = (Array.isArray(raw) ? raw : []).map(M.normalizeMatch).filter((x) => x.fin).sort((a, b) => b.t - a.t).slice(0, 8);
      let wh = 0, d = 0, wa = 0;
      for (const x of list) {
        const gh = x.h === m.h ? x.hg : x.ag, ga = x.h === m.h ? x.ag : x.hg;
        if (gh > ga) wh++; else if (gh === ga) d++; else wa++;
      }
      const siege = (n) => n + (n === 1 ? ' Sieg' : ' Siege');
      const summary = list.length ? `${esc(team(m.h).s)} ${siege(wh)}, ${d} Remis, ${esc(team(m.a).s)} ${siege(wa)}` : '';
      S.h2h.set(key, { list, summary });
    } catch (e) {
      S.h2h.set(key, { error: true });
    }
    render();
  }

  /* ---------- Ansicht: Statistiken ---------- */

  function renderStatistiken() {
    const now = Date.now();
    const list = matchesInRange(now - 2 * 3600000, addDays(now, 8)).filter((m) => !m.fin);
    const mk = MARKET[S.statMarket];
    const rows = list.map((m) => ({ m, an: analyze(m) })).map((r) => ({ ...r, v: r.an.pred.p[mk.id], hv: r.an.hist ? r.an.hist[mk.id] : null }));
    rows.sort((a, b) => b.v - a.v);
    const body = rows.map(({ m, an, v, hv }) => `<tr class="linkrow" data-goto="${m.id}" tabindex="0">
      <td class="nowrap">${fmtDay(m.t)} <span class="muted">${fmtTime(m.t)}</span></td>
      <td><span class="lg-badge lg-${m.lg}">${esc(LEAGUE[m.lg].short)}</span></td>
      <td class="pairing">${teamName(m.h)}<span class="vs">–</span>${teamName(m.a)}</td>
      <td class="num">${statPill(an, m, mk.id, 'model')}</td>
      <td class="num muted-num">${mk.value ? dec(hv, 2) : pct(hv)}</td>
      <td class="num">${mk.value ? '–' : fairOdds(v)}</td>
    </tr>`).join('');
    return `
      <div class="page-head"><h2>Statistiken</h2><p>Alle anstehenden Spiele der nächsten 7 Tage, sortiert nach Wahrscheinlichkeit.</p></div>
      <div class="toolbar">
        <div class="chips" role="group" aria-label="Ligen">${chips(S.leagues, 'data-league')}</div>
        <div class="toolbar-right">${marketSelect('statMarket', S.statMarket, 'Ereignis')}</div>
      </div>
      ${rows.length ? `<div class="table-wrap"><table class="list">
        <thead><tr><th scope="col">Anstoß</th><th scope="col">Liga</th><th scope="col">Begegnung</th>
        <th scope="col" class="num">Modell</th><th scope="col" class="num">Letzte 10</th><th scope="col" class="num">Faire Quote</th></tr></thead>
        <tbody>${body}</tbody></table></div>`
      : '<div class="empty"><p>In den nächsten 7 Tagen sind in den gewählten Ligen keine Spiele angesetzt.</p></div>'}
      <p class="legend">Faire Quote = 1 geteilt durch die Wahrscheinlichkeit, also die Quote ohne Buchmacher-Marge.</p>`;
  }

  /* ---------- Ansicht: Ligen ---------- */

  function leagueTabs(active, attr) {
    return `<div class="tabs" role="group" aria-label="Liga">${M.LEAGUES.map((l) =>
      `<button class="tab" ${attr}="${l.id}" aria-pressed="${active === l.id}">${esc(l.name)}</button>`).join('')}</div>`;
  }

  function renderLigen() {
    const lg = S.tableLeague;
    const season = M.seasonAt(S.ds, lg, S.dataTime);
    if (season == null) return leagueTabs(lg, 'data-table') + '<div class="empty"><p>Für diese Liga liegen keine Daten vor.</p></div>';
    const model = getModel(lg, S.dataTime);
    const rows = M.leagueTable(S.ds, lg, season).map((r) => {
      const rt = M.teamRating(model, r.team);
      return { ...r, diff: r.tf - r.tg, avg: r.sp ? (r.tf + r.tg) / r.sp : null, o25p: r.sp ? r.o25 / r.sp : null, bttsp: r.sp ? r.btts / r.sp : null, csp: r.sp ? r.cs / r.sp : null, att: rt.A * 100, def: 100 / rt.D, name: team(r.team).n };
    });
    const { key, dir } = S.tableSort;
    rows.sort((a, b) => {
      const x = a[key], y = b[key];
      if (typeof x === 'string') return dir * x.localeCompare(y);
      return dir * ((x == null ? -1e9 : x) - (y == null ? -1e9 : y)) || a.pos - b.pos;
    });
    const cols = [
      ['pos', '#', 1], ['name', 'Verein', 1], ['sp', 'Sp', -1], ['s', 'S', -1], ['u', 'U', -1], ['n', 'N', -1],
      ['tf', 'Tore', -1], ['diff', 'Diff', -1], ['pts', 'Pkt', -1], [null, 'Form'],
      ['avg', '⌀ Tore', -1], ['o25p', 'Ü 2.5', -1], ['bttsp', 'BTTS', -1], ['csp', 'Zu Null', -1], ['att', 'Angriff', -1], ['def', 'Abwehr', -1]
    ];
    const head = cols.map(([k, label, d]) => {
      if (!k) return `<th scope="col">${label}</th>`;
      const active = key === k;
      const sort = active ? (dir === 1 ? 'ascending' : 'descending') : 'none';
      return `<th scope="col" aria-sort="${sort}" class="${k === 'name' ? '' : 'num'}"><button class="sort" data-sort="${k}" data-dir="${d}">${label}${active ? (dir === 1 ? ' ▲' : ' ▼') : ''}</button></th>`;
    }).join('');
    const rate = (v) => `<span class="rating" style="--r:${Math.round(clamp((v - 60) / 80, 0, 1) * 55)}%">${Math.round(v)}</span>`;
    const body = rows.map((r) => `<tr>
      <td class="num">${r.pos}</td><td>${teamName(r.team)}</td>
      <td class="num">${r.sp}</td><td class="num">${r.s}</td><td class="num">${r.u}</td><td class="num">${r.n}</td>
      <td class="num nowrap">${r.tf}:${r.tg}</td><td class="num">${r.diff > 0 ? '+' : ''}${r.diff}</td><td class="num"><b>${r.pts}</b></td>
      <td>${formDots(r.form.map((x) => ({ r: x })))}</td>
      <td class="num">${dec(r.avg, 2)}</td><td class="num">${pct(r.o25p)}</td><td class="num">${pct(r.bttsp)}</td><td class="num">${pct(r.csp)}</td>
      <td class="num">${rate(r.att)}</td><td class="num">${rate(r.def)}</td>
    </tr>`).join('');
    return `
      <div class="page-head"><h2>Ligen</h2><p>Tabelle ${seasonLabel(season)} mit Teamkennzahlen. Angriff und Abwehr: 100 = Ligaschnitt, höher ist besser.</p></div>
      ${leagueTabs(lg, 'data-table')}
      <div class="table-wrap"><table class="list table-league"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
      <p class="legend">Die Tabelle wird aus den Ergebnissen berechnet. Punktabzüge oder Sonderwertungen sind nicht enthalten.</p>`;
  }

  /* ---------- Ansicht: Torschützen ---------- */

  function renderTorschuetzen() {
    const lg = S.scorerLeague;
    const season = M.seasonAt(S.ds, lg, S.dataTime);
    const top = season == null ? [] : M.topScorers(S.ds, lg, season).slice(0, 25);

    let totalGoals = 0, namedGoals = 0;
    for (const m of S.ds.byLeague[lg] || []) {
      if (m.season !== season || !m.fin) continue;
      totalGoals += m.hg + m.ag;
      namedGoals += m.goals.filter((g) => g.n).length;
    }
    const coverage = totalGoals ? namedGoals / totalGoals : 1;

    const now = Date.now();
    const upcoming = (S.ds.byLeague[lg] || []).filter((m) => !m.fin && m.t >= now - 2 * 3600000 && m.t < addDays(now, 8));
    const cands = [];
    for (const m of upcoming) {
      const an = analyze(m);
      for (const side of ['h', 'a']) {
        const tid = side === 'h' ? m.h : m.a;
        const lam = side === 'h' ? an.pred.lh : an.pred.la;
        for (const c of M.scorerCandidates(S.ds, tid, an.cutoff, lam, an.model.ogRate, an.model.season, 5)) {
          cands.push({ ...c, tid, opp: side === 'h' ? m.a : m.h, home: side === 'h', m });
        }
      }
    }
    cands.sort((a, b) => b.p - a.p);

    const topHtml = top.length ? `<table class="list"><thead><tr><th scope="col" class="num">#</th><th scope="col">Spieler</th><th scope="col">Verein</th><th scope="col" class="num">Tore</th><th scope="col" class="num">davon 11m</th></tr></thead>
      <tbody>${top.map((p, i) => `<tr><td class="num">${i + 1}</td><td>${esc(p.name)}</td><td>${teamName(p.team)}</td><td class="num"><b>${p.goals}</b></td><td class="num">${p.pens}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty"><p>In dieser Saison sind noch keine Torschützen eingetragen.</p></div>';

    const candHtml = cands.length ? `<table class="list"><thead><tr><th scope="col">Spieler</th><th scope="col">Spiel</th><th scope="col" class="num">Saisontore</th><th scope="col" class="num">Trifft</th></tr></thead>
      <tbody>${cands.slice(0, 30).map((c) => `<tr class="linkrow" data-goto="${c.m.id}" tabindex="0">
        <td><b>${esc(c.name)}</b><div class="small">${esc(team(c.tid).s)}</div></td>
        <td class="nowrap">${c.home ? 'vs.' : 'bei'} ${esc(team(c.opp).s)}<div class="small">${fmtDay(c.m.t)} ${fmtTime(c.m.t)}</div></td>
        <td class="num">${c.season}</td>
        <td class="num"><span class="pill"${heatStyle(clamp(c.p + 0.35, 0, 1))}>${pct(c.p)}</span></td></tr>`).join('')}</tbody></table>`
      : '<div class="empty"><p>In den nächsten 7 Tagen sind keine Spiele angesetzt.</p></div>';

    return `
      <div class="page-head"><h2>Torschützen</h2><p>Torjägerliste ${season != null ? seasonLabel(season) : ''} und die wahrscheinlichsten Torschützen der kommenden Spiele.</p></div>
      ${leagueTabs(lg, 'data-scorers')}
      ${coverage < 0.8 ? `<p class="notice">Für diese Liga sind in OpenLigaDB nur ${pct(coverage)} der Tore mit Torschütze eingetragen. Die Werte sind deshalb weniger verlässlich.</p>` : ''}
      <div class="two-col">
        <section><h3>Wahrscheinliche Torschützen, nächste 7 Tage</h3><div class="table-wrap">${candHtml}</div></section>
        <section><h3>Torjäger der Saison</h3><div class="table-wrap">${topHtml}</div></section>
      </div>
      <p class="legend">Die Chance „trifft“ ergibt sich aus den erwarteten Toren des Teams und dem Anteil des Spielers an den Toren der letzten Monate. Ob er spielt, weiß das Modell nicht.</p>`;
  }

  /* ---------- Ansicht: Modell-Check ---------- */

  const CHECK_LABEL = { o15: 'Über 1.5 Tore', o25: 'Über 2.5 Tore', o35: 'Über 3.5 Tore', btts: 'Beide treffen', hs: 'Heimteam trifft', as: 'Auswärtsteam trifft' };

  async function runCheck() {
    if (S.checkRunning) return;
    S.checkRunning = true;
    const from = M.seasonAt(S.ds, 'bl1', S.dataTime) - 1;
    const res = { leagues: {}, all: [] };
    for (const l of M.LEAGUES) {
      S.checkProgress = `Rechne ${l.name} …`;
      render();
      await new Promise((r) => setTimeout(r, 30));
      const preds = M.backtestLeague(S.ds, l.id, from, S.dataTime);
      res.leagues[l.id] = M.evaluate(preds);
      res.all = res.all.concat(preds);
    }
    res.total = M.evaluate(res.all);
    res.from = from;
    delete res.all;
    S.check = res;
    S.checkRunning = false;
    render();
  }

  function renderCheck() {
    const intro = `<div class="page-head"><h2>Modell-Check</h2>
      <p>Hier rechnet die Seite die letzten Spieltage nach, als wären sie noch nicht gespielt: Für jede Woche wird das Modell nur mit den Spielen davor trainiert. So siehst du, wie gut die Prozentwerte wirklich treffen.</p></div>`;
    if (S.checkRunning) return intro + `<div class="empty"><p>${esc(S.checkProgress)}</p></div>`;
    if (!S.check) return intro + '<div class="empty"><button class="btn" data-action="run-check">Rückblick berechnen</button></div>';

    const ev = S.check.total;
    const brierRow = (label, e, histKey) => {
      const vals = [e.model, e.hist ? e.hist : null, e.base];
      const best = Math.min(...vals.filter((v) => v));
      const cell = (v) => `<td class="num${v && Math.abs(v - best) < 1e-9 ? ' best' : ''}">${v ? dec(v, 3) : '–'}</td>`;
      return `<tr><th scope="row">${esc(label)}</th><td class="num">${e.n}</td><td class="num">${e.rate != null ? pct(e.rate) : '–'}</td>${cell(e.model)}${cell(e.hist)}${cell(e.base)}</tr>`;
    };
    const table = (evl) => `<table class="list"><thead><tr><th scope="col">Ereignis</th><th scope="col" class="num">Spiele</th><th scope="col" class="num">Eingetreten</th>
      <th scope="col" class="num">Modell</th><th scope="col" class="num">Letzte 10</th><th scope="col" class="num">Ligaschnitt</th></tr></thead>
      <tbody>${Object.entries(evl.markets).map(([k, e]) => brierRow(CHECK_LABEL[k], e)).join('')}
      ${brierRow('Sieg, Remis, Niederlage', { n: evl.x12.n, rate: null, model: evl.x12.model, hist: evl.x12.hist, base: evl.x12.base })}</tbody></table>`;

    const calib = (k) => {
      const b = ev.markets[k].buckets;
      return `<div class="calib"><h4>${esc(CHECK_LABEL[k])}</h4>
        <table class="list"><thead><tr><th scope="col">Prognose</th><th scope="col" class="num">Spiele</th><th scope="col">Vorhergesagt und tatsächlich</th></tr></thead><tbody>
        ${b.map((x, i) => x.n < 5 ? '' : `<tr><th scope="row" class="nowrap">${i * 10}–${i * 10 + 10}\u202F%</th><td class="num">${x.n}</td>
          <td><div class="cal"><span class="cal-pred" style="--w:${Math.round(x.p / x.n * 100)}%"></span><span class="cal-real" style="--w:${Math.round(x.hit / x.n * 100)}%"></span></div>
          <span class="small">${pct(x.p / x.n)} vorhergesagt, ${pct(x.hit / x.n)} eingetreten</span></td></tr>`).join('')}
        </tbody></table></div>`;
    };

    return intro + `
