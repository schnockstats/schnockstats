<footer>
  <p id="source-note"></p>
</footer>
<script>
/* Schnockstats – Statistikmodell
 * Datenaufbereitung (OpenLigaDB), gewichtetes Poisson-Modell mit Dixon-Coles-Korrektur,
 * Markt-Wahrscheinlichkeiten, historische Quoten, Torschützen, Tabellen und Rückblick.
 */
(function (root) {
  'use strict';

  const DAY = 86400000;
  const LN2 = Math.log(2);

  const LEAGUES = [
    { id: 'bl1', name: '1. Bundesliga', short: '1. BL', rank: 1 },
    { id: 'bl2', name: '2. Bundesliga', short: '2. BL', rank: 2 },
    { id: 'bl3', name: '3. Liga', short: '3. Liga', rank: 3 }
  ];
  const RANK = { bl1: 1, bl2: 2, bl3: 3 };
  // Liga-Steckbriefe: Land und Spielklasse. Wird zur Laufzeit ergänzt.
  const META = {
    bl1: { country: 'Deutschland', tier: 1 },
    bl2: { country: 'Deutschland', tier: 2 },
    bl3: { country: 'Deutschland', tier: 3 }
  };
  function setLeagueMeta(map) { Object.assign(META, map || {}); }

  /* Länderspiele: Nations League, Testspiele, Qualifikationen usw. sind nur
     verschiedene Anlässe für dieselben Teams. Sie werden gemeinsam gerechnet
     (ein "Pool"), mit längerem Gedächtnis, weil Nationalteams selten spielen. */
  const POOL_OPTIONS = { INT: { halfLife: 300, window: 1100, prior: 4 } };
  const poolOf = (lg) => (META[lg] && META[lg].pool) || null;
  function leagueMatches(ds, lg) {
    const pool = poolOf(lg);
    if (!pool) return ds.byLeague[lg] || [];
    if (!ds.byPool) ds.byPool = {};
    if (!ds.byPool[pool]) {
      const list = [];
      for (const [id, arr] of Object.entries(ds.byLeague)) if (poolOf(id) === pool) for (const m of arr) list.push(m);
      list.sort((x, y) => x.t - y.t);
      ds.byPool[pool] = list;
    }
    return ds.byPool[pool];
  }

  const DEFAULTS = {
    dixonColes: true,   // Korrektur für knappe Ergebnisse (nur Fußball)
    halfLife: 90,       // Tage, nach denen ein Spiel nur noch halb zählt: die laufende
                        // Saison und die letzten Monate bestimmen das Bild, nicht alte Spielzeiten
    window: 330,        // Tage Datenfenster
    prior: 5,           // Gewicht der Vorannahme in "Spielen"
    iters: 40,
    maxGoals: 10
  };

  // Vorannahmen für Teams ohne (ausreichende) Daten in dieser Liga
  const PRIORS = {
    neutral: { A: 1.0, D: 1.0 },
    promoted: { A: 0.84, D: 1.16 },
    relegated: { A: 1.1, D: 0.91 },
    newTeam: { A: 0.88, D: 1.12 }
  };

  /* ---------- Datenaufbereitung ---------- */

  function pickResult(results, typeId, namePattern) {
    if (!results || !results.length) return null;
    let r = results.find((x) => x.resultTypeID === typeId);
    if (!r) r = results.find((x) => namePattern.test(x.resultName || ''));
    return r || null;
  }

  function normalizeMatch(m) {
    const t1 = m.team1 || {};
    const t2 = m.team2 || {};
    const results = m.matchResults || [];
    let end = pickResult(results, 2, /end/i);
    if (!end && results.length) {
      end = results.reduce((a, b) => ((b.resultOrderID || 0) > (a.resultOrderID || 0) ? b : a));
    }
    let half = pickResult(results, 1, /halb/i);
    if (half === end) half = null;

    const ts = Date.parse(m.matchDateTimeUTC || '') || Date.parse(m.matchDateTime || '') || 0;

    const goals = [];
    const raw = (m.goals || []).slice().sort((a, b) =>
      ((a.scoreTeam1 || 0) + (a.scoreTeam2 || 0)) - ((b.scoreTeam1 || 0) + (b.scoreTeam2 || 0)) ||
      (a.matchMinute || 0) - (b.matchMinute || 0));
    let p1 = 0, p2 = 0;
    for (const g of raw) {
      const s1 = g.scoreTeam1 == null ? p1 : g.scoreTeam1;
      const s2 = g.scoreTeam2 == null ? p2 : g.scoreTeam2;
      let side = null;
      if (s1 > p1 && s2 === p2) side = 'h';
      else if (s2 > p2 && s1 === p1) side = 'a';
      else if (g.scoringTeamId === t1.teamId) side = 'h';
      else if (g.scoringTeamId === t2.teamId) side = 'a';
      p1 = s1; p2 = s2;
      goals.push({
        m: g.matchMinute == null ? null : g.matchMinute,
        p: g.goalGetterID || 0,
        n: (g.goalGetterName || '').trim(),
        s: side,
        pen: !!g.isPenalty,
        og: !!g.isOwnGoal
      });
    }

    const fin = !!m.matchIsFinished && !!end;
    return {
      id: m.matchID,
      lg: (m.leagueShortcut || '').toLowerCase(),
      season: m.leagueSeason,
      t: ts,
      md: m.group ? m.group.groupOrderID : null,
      mdName: m.group ? m.group.groupName : '',
      h: t1.teamId,
      a: t2.teamId,
      fin,
      hg: fin ? end.pointsTeam1 : null,
      ag: fin ? end.pointsTeam2 : null,
      hh: fin && half ? half.pointsTeam1 : null,
      ha: fin && half ? half.pointsTeam2 : null,
      goals: fin ? goals : []
    };
  }

  function extractTeams(rawMatches, into) {
    const teams = into || {};
    for (const m of rawMatches) {
      for (const t of [m.team1, m.team2]) {
        if (!t || t.teamId == null) continue;
        teams[t.teamId] = {
          n: t.teamName || t.shortName || String(t.teamId),
          s: t.shortName || t.teamName || String(t.teamId),
          i: t.teamIconUrl || ''
        };
      }
    }
    return teams;
  }

  function buildDataset(matches, teams) {
    const seen = new Set();
    const list = [];
    for (const m of matches) {
      if (!m || seen.has(m.id) || !m.t || m.h == null || m.a == null) continue;
      seen.add(m.id);
      list.push(m);
    }
    list.sort((x, y) => x.t - y.t);
    const byTeam = new Map();
    const byLeague = {};
    for (const m of list) {
      if (!byLeague[m.lg]) byLeague[m.lg] = [];
      byLeague[m.lg].push(m);
      for (const tid of [m.h, m.a]) {
        if (!byTeam.has(tid)) byTeam.set(tid, []);
        byTeam.get(tid).push(m);
      }
    }
    return { matches: list, teams: teams || {}, byTeam, byLeague };
  }

  /* ---------- Hilfsfunktionen ---------- */

  function poissonVector(lambda, max) {
    const v = new Array(max + 1);
    v[0] = Math.exp(-lambda);
    for (let k = 1; k <= max; k++) v[k] = v[k - 1] * lambda / k;
    return v;
  }

  function tau(i, j, lh, la, rho) {
    if (i === 0 && j === 0) return 1 - lh * la * rho;
    if (i === 0 && j === 1) return 1 + lh * rho;
    if (i === 1 && j === 0) return 1 + la * rho;
    if (i === 1 && j === 1) return 1 - rho;
    return 1;
  }

  function seasonAt(ds, lg, cutoff) {
    const list = leagueMatches(ds, lg);
    if (!list.length) return null;
    for (const m of list) if (m.t >= cutoff) return m.season;
    return list[list.length - 1].season;
  }

  function priorFor(ds, teamId, lg, cutoff, curSeason) {
    const list = ds.byTeam.get(teamId) || [];
    let last = null;
    for (let i = list.length - 1; i >= 0; i--) {
      const m = list[i];
      if (m.t < cutoff && m.season < curSeason) { last = m; break; }
    }
    if (!last) {
      const anyBefore = list.some((m) => m.t < cutoff);
      return anyBefore ? PRIORS.neutral : PRIORS.newTeam;
    }
    const from = META[last.lg], to = META[lg];
    // Auf- und Abstieg nur innerhalb desselben Landes bewerten
    if (!from || !to || from.country !== to.country || from.tier === to.tier) return PRIORS.neutral;
    return from.tier > to.tier ? PRIORS.promoted : PRIORS.relegated;
  }

  /* ---------- Modell ---------- */

  function fitLeague(ds, lg, cutoff, options) {
    const o = Object.assign({}, DEFAULTS, POOL_OPTIONS[poolOf(lg)] || {}, options || {});
    const all = leagueMatches(ds, lg);
    const curSeason = seasonAt(ds, lg, cutoff);

    const train = [];
    for (const m of all) {
      if (m.fin && m.t < cutoff && cutoff - m.t < o.window * DAY) train.push(m);
    }

    // Teams: Trainingsdaten + alle Teams der aktuellen Saison
    const idx = new Map();
    const ids = [];
    const addTeam = (tid) => { if (!idx.has(tid)) { idx.set(tid, ids.length); ids.push(tid); } };
    const activeSet = new Set();
    for (const m of all) {
      if (m.season === curSeason) { addTeam(m.h); addTeam(m.a); activeSet.add(m.h); activeSet.add(m.a); }
    }
    for (const m of train) { addTeam(m.h); addTeam(m.a); }

    const n = ids.length;
    const A = new Float64Array(n), D = new Float64Array(n);
    const A0 = new Float64Array(n), D0 = new Float64Array(n);
    const games = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const pr = priorFor(ds, ids[i], lg, cutoff, curSeason);
      A0[i] = A[i] = pr.A;
      D0[i] = D[i] = pr.D;
    }
    const active = [];
    for (let i = 0; i < n; i++) if (activeSet.has(ids[i])) active.push(i);
    const normIdx = active.length ? active : Array.from({ length: n }, (_, i) => i);

    const M = train.length;
    const hi = new Int32Array(M), ai = new Int32Array(M);
    const hg = new Float64Array(M), ag = new Float64Array(M), w = new Float64Array(M);
    // Neutraler Platz: beide Teams mit dem mittleren Torniveau, ohne Heimvorteil
    const neu = new Uint8Array(M);
    let sw = 0, sGoals = 0, sHt = 0, sFt = 0, sOg = 0, sAllGoals = 0;
    for (let k = 0; k < M; k++) {
      const m = train[k];
      hi[k] = idx.get(m.h); ai[k] = idx.get(m.a);
      hg[k] = m.hg; ag[k] = m.ag; neu[k] = m.neu ? 1 : 0;
      const age = (cutoff - m.t) / DAY;
      w[k] = Math.exp(-LN2 * age / o.halfLife);
      sw += w[k];
      sGoals += w[k] * (m.hg + m.ag);
      games[hi[k]] += w[k]; games[ai[k]] += w[k];
      if (m.hh != null) { sHt += w[k] * (m.hh + m.ha); sFt += w[k] * (m.hg + m.ag); }
      if (m.goals.length) { for (const g of m.goals) { if (g.og) sOg += w[k]; } sAllGoals += w[k] * m.goals.length; }
    }
    const eBar = sw > 0 ? sGoals / (2 * sw) : 1.4;
    let bh = 1.6, ba = 1.3, bn = Math.sqrt(bh * ba);

    const numA = new Float64Array(n), denA = new Float64Array(n);
    const numD = new Float64Array(n), denD = new Float64Array(n);
    const k0 = o.prior * eBar;

    const updateBases = () => {
      let nh = 0, dh = 0, na = 0, da = 0;
      for (let k = 0; k < M; k++) {
        if (neu[k]) continue;
        nh += w[k] * hg[k]; dh += w[k] * A[hi[k]] * D[ai[k]];
        na += w[k] * ag[k]; da += w[k] * A[ai[k]] * D[hi[k]];
      }
      if (dh > 0 && nh > 0) bh = nh / dh;
      if (da > 0 && na > 0) ba = na / da;
      bn = Math.sqrt(bh * ba);
    };

    if (M > 0) {
      for (let it = 0; it < o.iters; it++) {
        updateBases();
        numA.fill(0); denA.fill(0);
        for (let k = 0; k < M; k++) {
          const b1 = neu[k] ? bn : bh, b2 = neu[k] ? bn : ba;
          numA[hi[k]] += w[k] * hg[k]; denA[hi[k]] += w[k] * b1 * D[ai[k]];
          numA[ai[k]] += w[k] * ag[k]; denA[ai[k]] += w[k] * b2 * D[hi[k]];
        }
        for (let i = 0; i < n; i++) A[i] = (numA[i] + k0 * A0[i]) / (denA[i] + k0);
        numD.fill(0); denD.fill(0);
        for (let k = 0; k < M; k++) {
          const b1 = neu[k] ? bn : bh, b2 = neu[k] ? bn : ba;
          numD[ai[k]] += w[k] * hg[k]; denD[ai[k]] += w[k] * b1 * A[hi[k]];
          numD[hi[k]] += w[k] * ag[k]; denD[hi[k]] += w[k] * b2 * A[ai[k]];
        }
        for (let i = 0; i < n; i++) D[i] = (numD[i] + k0 * D0[i]) / (denD[i] + k0);
        let la = 0, ld = 0;
        for (const i of normIdx) { la += Math.log(A[i]); ld += Math.log(D[i]); }
        const ga = Math.exp(la / normIdx.length), gd = Math.exp(ld / normIdx.length);
        for (let i = 0; i < n; i++) { A[i] /= ga; D[i] /= gd; }
      }
      updateBases();
    }

    // Dixon-Coles rho per Rastersuche (im Eishockey abgeschaltet)
    let rho = 0;
    if (M > 50 && o.dixonColes !== false) {
      let best = -Infinity;
      for (let r = -0.2; r <= 0.1001; r += 0.01) {
        let ll = 0, ok = true;
        for (let k = 0; k < M; k++) {
          if (hg[k] > 1 || ag[k] > 1) continue;
          const lh = (neu[k] ? bn : bh) * A[hi[k]] * D[ai[k]], lA = (neu[k] ? bn : ba) * A[ai[k]] * D[hi[k]];
          const t = tau(hg[k], ag[k], lh, lA, r);
          if (t <= 0) { ok = false; break; }
          ll += w[k] * Math.log(t);
        }
        if (ok && ll > best) { best = ll; rho = r; }
      }
      rho = Math.round(rho * 100) / 100;
    }

    return {
      lg, cutoff, season: curSeason, bh, ba, bn, rho, idx, ids, A, D, A0, D0, games,
      nMatches: M,
      htFrac: sFt > 0 ? Math.min(0.6, Math.max(0.3, sHt / sFt)) : 0.44,
      ogRate: sAllGoals > 0 ? Math.min(0.1, sOg / sAllGoals) : 0.03,
      avgGoals: sw > 0 ? sGoals / sw : 2.9,
      options: o
    };
  }

  function teamRating(model, teamId) {
    const i = model.idx.get(teamId);
    if (i == null) return { A: PRIORS.newTeam.A, D: PRIORS.newTeam.D, games: 0 };
    return { A: model.A[i], D: model.D[i], games: model.games[i] };
  }

  function predictMatch(model, homeId, awayId, neutral) {
    const rh = teamRating(model, homeId), ra = teamRating(model, awayId);
    const bn = model.bn || Math.sqrt(model.bh * model.ba);
    const lh = Math.min(5, Math.max(0.15, (neutral ? bn : model.bh) * rh.A * ra.D));
    const la = Math.min(5, Math.max(0.15, (neutral ? bn : model.ba) * ra.A * rh.D));
    const N = model.options.maxGoals;
    const ph = poissonVector(lh, N), pa = poissonVector(la, N);
    const mat = [];
    let sum = 0;
    for (let i = 0; i <= N; i++) {
      const row = new Array(N + 1);
      for (let j = 0; j <= N; j++) {
        row[j] = Math.max(0, ph[i] * pa[j] * tau(i, j, lh, la, model.rho));
        sum += row[j];
      }
      mat.push(row);
    }
    const tot = new Array(2 * N + 1).fill(0);
    let pH = 0, pX = 0, pA = 0, btts = 0, hs = 0, as = 0, h15 = 0, a15 = 0, avg = 0;
    const cells = [];
    for (let i = 0; i <= N; i++) {
      for (let j = 0; j <= N; j++) {
        const p = mat[i][j] / sum;
        if (i > j) pH += p; else if (i === j) pX += p; else pA += p;
        tot[i + j] += p;
        if (i > 0 && j > 0) btts += p;
        if (i > 0) hs += p;
        if (j > 0) as += p;
        if (i > 1) h15 += p;
        if (j > 1) a15 += p;
        avg += (i + j) * p;
        if (i <= 6 && j <= 6) cells.push([i, j, p]);
      }
    }
    const under = (k) => { let s = 0; for (let t = 0; t <= k; t++) s += tot[t]; return s; };
    const x = (lh + la) * model.htFrac;
    const ht05 = 1 - Math.exp(-x);
    const ht15 = 1 - Math.exp(-x) * (1 + x);
    cells.sort((u, v) => v[2] - u[2]);
    const p = {
      '1': pH, X: pX, '2': pA,
      '1X': pH + pX, X2: pX + pA,
      o05: 1 - under(0), o15: 1 - under(1), o25: 1 - under(2), o35: 1 - under(3), o45: 1 - under(4),
      u05: under(0), u15: under(1), u25: under(2), u35: under(3), u45: under(4),
      btts, bttsNo: 1 - btts,
      hs, hc: as, as, ac: hs, h15, a15,
      g13: tot[1] + tot[2] + tot[3],
      ht05, ht15,
      avg
    };
    return { lh, la, p, top: cells.slice(0, 6).map((c) => ({ h: c[0], a: c[1], p: c[2] })) };
  }

  /* ---------- Historische Quoten ---------- */

  function teamHistory(ds, teamId, cutoff, n) {
    const size = n || 10;
    const list = ds.byTeam.get(teamId) || [];
    const recent = [];
    for (let i = list.length - 1; i >= 0 && recent.length < size; i--) {
      const m = list[i];
      if (m.fin && m.t < cutoff) recent.push(m);
    }
    const out = {
      n: recent.length, o05: 0, o15: 0, o25: 0, o35: 0, o45: 0,
      btts: 0, scored: 0, conceded: 0, win: 0, draw: 0, loss: 0, g13: 0,
      ht05: 0, ht15: 0, htN: 0, avg: 0, gf: 0, ga: 0, cs: 0,
      s15: 0, c15: 0,
      form: [], ppg: null
    };
    if (!recent.length) return out;
    let pts5 = 0, n5 = 0;
    recent.forEach((m, k) => {
      const home = m.h === teamId;
      const f = home ? m.hg : m.ag, a = home ? m.ag : m.hg;
      const total = m.hg + m.ag;
      if (total > 0.5) out.o05++;
      if (total > 1.5) out.o15++;
      if (total > 2.5) out.o25++;
      if (total > 3.5) out.o35++;
      if (total > 4.5) out.o45++;
      if (m.hg > 0 && m.ag > 0) out.btts++;
      if (f > 0) out.scored++;
      if (a > 0) out.conceded++; else out.cs++;
      if (total >= 1 && total <= 3) out.g13++;
      const r = f > a ? 'S' : f === a ? 'U' : 'N';
      if (r === 'S') out.win++; else if (r === 'U') out.draw++; else out.loss++;
      if (m.hh != null) {
        out.htN++;
        const ht = m.hh + m.ha;
        if (ht > 0.5) out.ht05++;
        if (ht > 1.5) out.ht15++;
      }
      out.avg += total; out.gf += f; out.ga += a;
      if (f > 1.5) out.s15++;
      if (a > 1.5) out.c15++;
      if (k < 5) {
        n5++; pts5 += r === 'S' ? 3 : r === 'U' ? 1 : 0;
        out.form.push({ r, m, home, f, a });
      }
    });
    const c = recent.length;
    for (const key of ['o05', 'o15', 'o25', 'o35', 'o45', 'btts', 'scored', 'conceded', 'win', 'draw', 'loss', 'g13', 'cs', 's15', 'c15']) out[key] /= c;
    out.ht05 = out.htN ? out.ht05 / out.htN : null;
    out.ht15 = out.htN ? out.ht15 / out.htN : null;
    out.avg /= c; out.gf /= c; out.ga /= c;
    out.ppg = n5 ? pts5 / n5 : null;
    out.form.reverse();
    return out;
  }

  function historyMatch(hH, hA) {
    if (!hH.n || !hA.n) return null;
    const mean = (x, y) => (x == null || y == null ? null : (x + y) / 2);
    return {
      '1': mean(hH.win, hA.loss), X: mean(hH.draw, hA.draw), '2': mean(hA.win, hH.loss),
      '1X': mean(hH.win + hH.draw, hA.loss + hA.draw), X2: mean(hA.win + hA.draw, hH.loss + hH.draw),
      o05: mean(hH.o05, hA.o05), o15: mean(hH.o15, hA.o15), o25: mean(hH.o25, hA.o25),
      o35: mean(hH.o35, hA.o35), o45: mean(hH.o45, hA.o45),
      u05: mean(1 - hH.o05, 1 - hA.o05), u15: mean(1 - hH.o15, 1 - hA.o15), u25: mean(1 - hH.o25, 1 - hA.o25),
      u35: mean(1 - hH.o35, 1 - hA.o35), u45: mean(1 - hH.o45, 1 - hA.o45),
      btts: mean(hH.btts, hA.btts), bttsNo: mean(1 - hH.btts, 1 - hA.btts),
      hs: hH.scored, hc: hH.conceded, as: hA.scored, ac: hA.conceded,
      g13: mean(hH.g13, hA.g13),
      ht05: mean(hH.ht05, hA.ht05), ht15: mean(hH.ht15, hA.ht15),
      avg: mean(hH.avg, hA.avg),
      // Team über 1.5 Tore: eigene Offensive und Defensive des Gegners zu gleichen Teilen
      h15: mean(hH.s15, hA.c15), a15: mean(hA.s15, hH.c15)
    };
  }

  function outcome(m, key) {
    if (!m.fin) return null;
    const t = m.hg + m.ag;
    switch (key) {
      case '1': return m.hg > m.ag;
      case 'X': return m.hg === m.ag;
      case '2': return m.hg < m.ag;
      case '1X': return m.hg >= m.ag;
      case 'X2': return m.hg <= m.ag;
      case 'o05': return t > 0.5; case 'o15': return t > 1.5; case 'o25': return t > 2.5;
      case 'o35': return t > 3.5; case 'o45': return t > 4.5;
      case 'u05': return t < 0.5; case 'u15': return t < 1.5; case 'u25': return t < 2.5;
      case 'u35': return t < 3.5; case 'u45': return t < 4.5;
      case 'btts': return m.hg > 0 && m.ag > 0;
      case 'bttsNo': return !(m.hg > 0 && m.ag > 0);
      case 'hs': case 'ac': return m.hg > 0;
      case 'hc': case 'as': return m.ag > 0;
      case 'g13': return t >= 1 && t <= 3;
      case 'ht05': return m.hh == null ? null : m.hh + m.ha > 0.5;
      case 'ht15': return m.hh == null ? null : m.hh + m.ha > 1.5;
      case 'h15': return m.hg > 1.5;
      case 'a15': return m.ag > 1.5;
      default: return null;
    }
  }

  function leagueTable(ds, lg, season, cutoff) {
    const rows = new Map();
    const get = (tid) => {
      if (!rows.has(tid)) rows.set(tid, { team: tid, sp: 0, s: 0, u: 0, n: 0, tf: 0, tg: 0, pts: 0, o25: 0, btts: 0, cs: 0, results: [] });
      return rows.get(tid);
    };
    for (const m of ds.byLeague[lg] || []) {
      if (m.season !== season) continue;
      get(m.h); get(m.a);
      if (!m.fin || (cutoff && m.t >= cutoff)) continue;
      for (const side of ['h', 'a']) {
        const r = get(side === 'h' ? m.h : m.a);
        const f = side === 'h' ? m.hg : m.ag, a = side === 'h' ? m.ag : m.hg;
        r.sp++; r.tf += f; r.tg += a;
        if (f > a) { r.s++; r.pts += 3; r.results.push('S'); }
        else if (f === a) { r.u++; r.pts += 1; r.results.push('U'); }
        else { r.n++; r.results.push('N'); }
        if (m.hg + m.ag > 2.5) r.o25++;
        if (m.hg > 0 && m.ag > 0) r.btts++;
        if (a === 0) r.cs++;
      }
    }
    const list = Array.from(rows.values());
    list.sort((x, y) => y.pts - x.pts || (y.tf - y.tg) - (x.tf - x.tg) || y.tf - x.tf);
    list.forEach((r, i) => { r.pos = i + 1; r.form = r.results.slice(-5); });
    return list;
  }

  /* ---------- Rückblick (Walk-forward) ---------- */

  function weekStart(ts) {
    const d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    const day = (d.getDay() + 6) % 7; // Montag = 0
    return d.getTime() - day * DAY;
  }

  const CHECK_MARKETS = ['o15', 'o25', 'o35', 'btts', 'h15', 'a15'];

  function backtestLeague(ds, lg, fromSeason, cutoffNow, options) {
    const list = (ds.byLeague[lg] || []).filter((m) => m.fin && m.season >= fromSeason && m.t < cutoffNow);
    const weeks = new Map();
    for (const m of list) {
      const ws = weekStart(m.t);
      if (!weeks.has(ws)) weeks.set(ws, []);
      weeks.get(ws).push(m);
    }
    const preds = [];
    const allLg = ds.byLeague[lg] || [];
    for (const [ws, games] of Array.from(weeks.entries()).sort((a, b) => a[0] - b[0])) {
      const model = fitLeague(ds, lg, ws, options);
      if (model.nMatches < 30) continue;
      // Basisrate: Anteil im Jahr vor dem Stichtag
      const base = {}; const cnt = {};
      for (const k of CHECK_MARKETS) { base[k] = 0; cnt[k] = 0; }
      let b1 = 0, bX = 0, b2 = 0, bn = 0;
      for (const m of allLg) {
        if (!m.fin || m.t >= ws || ws - m.t > 365 * DAY) continue;
        for (const k of CHECK_MARKETS) { const oc = outcome(m, k); if (oc != null) { base[k] += oc ? 1 : 0; cnt[k]++; } }
        bn++; if (m.hg > m.ag) b1++; else if (m.hg === m.ag) bX++; else b2++;
      }
      for (const k of CHECK_MARKETS) base[k] = cnt[k] ? base[k] / cnt[k] : null;
      const base1x2 = bn ? [b1 / bn, bX / bn, b2 / bn] : [0.45, 0.27, 0.28];
      for (const m of games) {
        const pr = predictMatch(model, m.h, m.a, m.neu);
        const hist = historyMatch(teamHistory(ds, m.h, ws, 10), teamHistory(ds, m.a, ws, 10));
        preds.push({ m, p: pr.p, hist, base, base1x2 });
      }
    }
    return preds;
  }

  function evaluate(preds) {
    const markets = {};
    for (const k of CHECK_MARKETS) markets[k] = { n: 0, model: 0, hist: 0, histN: 0, histModel: 0, base: 0, rate: 0, buckets: Array.from({ length: 10 }, () => ({ n: 0, p: 0, hit: 0 })) };
    const x12 = { n: 0, model: 0, base: 0, hist: 0, histN: 0, histModel: 0, correct: 0 };
    for (const r of preds) {
      for (const k of CHECK_MARKETS) {
        const oc = outcome(r.m, k);
        if (oc == null) continue;
        const y = oc ? 1 : 0;
        const e = markets[k];
        const pm = r.p[k];
        if (pm == null || isNaN(pm)) continue;
        e.n++; e.rate += y;
        e.model += (pm - y) ** 2;
        e.base += ((r.base[k] == null ? pm : r.base[k]) - y) ** 2;
        if (r.hist && r.hist[k] != null) {
          e.histN++;
          e.hist += (r.hist[k] - y) ** 2;
          e.histModel += (pm - y) ** 2;
        }
        const b = e.buckets[Math.min(9, Math.floor(pm * 10))];
        b.n++; b.p += pm; b.hit += y;
      }
      const y = [r.m.hg > r.m.ag ? 1 : 0, r.m.hg === r.m.ag ? 1 : 0, r.m.hg < r.m.ag ? 1 : 0];
      const pm = [r.p['1'], r.p.X, r.p['2']];
      x12.n++;
      x12.model += pm.reduce((s, v, i) => s + (v - y[i]) ** 2, 0);
      x12.base += r.base1x2.reduce((s, v, i) => s + (v - y[i]) ** 2, 0);
      if (r.hist && r.hist['1'] != null) {
        const ph = [r.hist['1'], r.hist.X, r.hist['2']];
        const sum = ph[0] + ph[1] + ph[2] || 1;
        x12.histN++;
        x12.hist += ph.reduce((s, v, i) => s + (v / sum - y[i]) ** 2, 0);
        x12.histModel += pm.reduce((s, v, i) => s + (v - y[i]) ** 2, 0);
      }
      const arg = pm.indexOf(Math.max(...pm));
      if (y[arg]) x12.correct++;
    }
    for (const k of CHECK_MARKETS) {
      const e = markets[k];
      if (e.n) { e.model /= e.n; e.base /= e.n; e.rate /= e.n; }
      if (e.histN) { e.hist /= e.histN; e.histModel /= e.histN; }
    }
    if (x12.n) { x12.model /= x12.n; x12.base /= x12.n; x12.correct /= x12.n; }
    if (x12.histN) { x12.hist /= x12.histN; x12.histModel /= x12.histN; }
    return { markets, x12, n: preds.length };
  }

  const api = {
    DAY, LEAGUES, RANK, META, setLeagueMeta, DEFAULTS, PRIORS, CHECK_MARKETS,
    normalizeMatch, extractTeams, buildDataset, seasonAt,
    fitLeague, predictMatch, teamRating, poolOf,
    teamHistory, historyMatch, outcome,
    leagueTable,
    backtestLeague, evaluate, weekStart
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SchnockstatsModel = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* SchnockHockey – Eishockey-Modell (NHL und die großen europäischen Ligen)
 * Besonderheiten gegenüber Fußball:
 *  - Modelliert wird die reguläre Spielzeit. Verlängerung und Penaltyschießen
 *    erzeugen genau ein Zusatztor, das getrennt behandelt wird.
 *  - Keine Dixon-Coles-Korrektur, dafür mehr Tore pro Spiel.
 *  - Jede Liga wird für sich gerechnet, mit kurzem Gedächtnis (laufende Saison).
 */
(function (root) {
  'use strict';

  const M = root.SchnockstatsModel;
  const DAY = M.DAY;
  const LN2 = Math.log(2);

  const LEAGUE = { id: 'nhl', name: 'NHL', short: 'NHL', rank: 1 };
  const FIT = { halfLife: 75, window: 300, prior: 6, iters: 40, maxGoals: 14, dixonColes: false };

  const MARKETS = [
    { id: 'o45', label: 'Über 4.5 Tore', col: 'Ü 4.5', group: 'Tore' },
    { id: 'o55', label: 'Über 5.5 Tore', col: 'Ü 5.5', group: 'Tore' },
    { id: 'o65', label: 'Über 6.5 Tore', col: 'Ü 6.5', group: 'Tore' },
    { id: 'btts', label: 'Beide Teams treffen', col: 'BTTS', group: 'Tore' },
    { id: 'avg', label: 'Erwartete Tore (⌀)', col: '⌀ Tore', group: 'Tore', value: true },
    { id: 'h25', label: 'Heimteam über 2.5 Tore', col: 'Heim Ü 2.5', group: 'Teams' },
    { id: 'h35', label: 'Heimteam über 3.5 Tore', col: 'Heim Ü 3.5', group: 'Teams' },
    { id: 'a25', label: 'Auswärtsteam über 2.5 Tore', col: 'Ausw. Ü 2.5', group: 'Teams' },
    { id: 'a35', label: 'Auswärtsteam über 3.5 Tore', col: 'Ausw. Ü 3.5', group: 'Teams' },
    { id: 'win1', label: 'Heimsieg (inkl. Verlängerung)', col: 'Heimsieg', group: 'Ergebnis' },
    { id: 'win2', label: 'Auswärtssieg (inkl. Verlängerung)', col: 'Auswärtssieg', group: 'Ergebnis' },
    { id: 'reg1', label: 'Heimsieg in regulärer Zeit', col: 'Heim reg.', group: 'Ergebnis' },
    { id: 'reg2', label: 'Auswärtssieg in regulärer Zeit', col: 'Ausw. reg.', group: 'Ergebnis' },
    { id: 'ot', label: 'Spiel geht in die Verlängerung', col: 'Verlängerung', group: 'Ergebnis' },
    { id: 'hpl', label: 'Heimsieg mit 2 Toren Abstand', col: 'Heim −1.5', group: 'Ergebnis' },
    { id: 'apl', label: 'Auswärtssieg mit 2 Toren Abstand', col: 'Ausw. −1.5', group: 'Ergebnis' }
  ];

  /* ---------- Daten ---------- */

  // Eingabe: kompakte Spiele aus dem Abrufjob (siehe tools/nhl_fetch.py)
  function normalizeGames(list, lg) {
    const out = [];
    for (const g of list || []) {
      const fin = !!g.fin;
      const ot = g.ot && g.ot !== 'REG';
      let hg = null, ag = null;
      if (fin) {
        hg = g.hg; ag = g.ag;
        if (ot) { if (hg > ag) hg -= 1; else if (ag > hg) ag -= 1; } // Zusatztor entfernen
      }
      out.push({
        id: g.id, lg: g.lg || lg || 'nhl', season: g.season, t: g.t,
        md: null, mdName: g.gt === 3 ? 'Playoffs' : '',
        h: g.h, a: g.a, fin,
        hg, ag,                     // reguläre Spielzeit (Modellgrundlage)
        hgF: fin ? g.hg : null,     // Endstand
        agF: fin ? g.ag : null,
        otType: fin ? (g.ot || 'REG') : null,
        hh: null, ha: null, goals: []
      });
    }
    return out;
  }

  function fit(ds, cutoff, options, lg) {
    return M.fitLeague(ds, lg || 'nhl', cutoff, Object.assign({}, FIT, options || {}));
  }

  /* ---------- Prognose ---------- */

  function predict(model, homeId, awayId) {
    const rh = M.teamRating(model, homeId), ra = M.teamRating(model, awayId);
    const lh = Math.min(8, Math.max(0.6, model.bh * rh.A * ra.D));
    const la = Math.min(8, Math.max(0.6, model.ba * ra.A * rh.D));
    const N = FIT.maxGoals;
    const ph = poisson(lh, N), pa = poisson(la, N);

    // Endstand-Verteilung: Unentschieden nach regulärer Zeit -> ein Zusatztor
    const fin = new Map();
    const add = (i, j, p) => { const k = i + ':' + j; fin.set(k, (fin.get(k) || 0) + p); };
    let pOT = 0, reg1 = 0, reg2 = 0, sum = 0;
    for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) sum += ph[i] * pa[j];
    for (let i = 0; i <= N; i++) {
      for (let j = 0; j <= N; j++) {
        const p = ph[i] * pa[j] / sum;
        if (i > j) { reg1 += p; add(i, j, p); }
        else if (i < j) { reg2 += p; add(i, j, p); }
        else { pOT += p; add(i + 1, j, p / 2); add(i, j + 1, p / 2); }
      }
    }

    let o = { o45: 0, o55: 0, o65: 0, btts: 0, h25: 0, h35: 0, a25: 0, a35: 0, win1: 0, win2: 0, hpl: 0, apl: 0, avg: 0 };
    const cells = [];
    for (const [key, p] of fin) {
      const [i, j] = key.split(':').map(Number);
      const tot = i + j;
      if (tot > 4.5) o.o45 += p;
      if (tot > 5.5) o.o55 += p;
      if (tot > 6.5) o.o65 += p;
      if (i > 0 && j > 0) o.btts += p;
      if (i > 2.5) o.h25 += p;
      if (i > 3.5) o.h35 += p;
      if (j > 2.5) o.a25 += p;
      if (j > 3.5) o.a35 += p;
      if (i > j) { o.win1 += p; if (i - j >= 2) o.hpl += p; }
      if (j > i) { o.win2 += p; if (j - i >= 2) o.apl += p; }
      o.avg += tot * p;
      cells.push([i, j, p]);
    }
    cells.sort((x, y) => y[2] - x[2]);
    const p = Object.assign(o, {
      u45: 1 - o.o45, u55: 1 - o.o55, u65: 1 - o.o65,
      reg1, reg2, ot: pOT
    });
    return { lh, la, p, pOT, top: cells.slice(0, 6).map((c) => ({ h: c[0], a: c[1], p: c[2] })) };
  }

  function poisson(lambda, max) {
    const v = new Array(max + 1);
    v[0] = Math.exp(-lambda);
    for (let k = 1; k <= max; k++) v[k] = v[k - 1] * lambda / k;
    return v;
  }

  function outcome(m, key) {
    if (!m.fin) return null;
    const h = m.hgF, a = m.agF, t = h + a, ot = m.otType && m.otType !== 'REG';
    switch (key) {
      case 'o45': return t > 4.5; case 'o55': return t > 5.5; case 'o65': return t > 6.5;
      case 'u45': return t < 4.5; case 'u55': return t < 5.5; case 'u65': return t < 6.5;
      case 'btts': return h > 0 && a > 0;
      case 'h25': return h > 2.5; case 'h35': return h > 3.5;
      case 'a25': return a > 2.5; case 'a35': return a > 3.5;
      case 'win1': return h > a; case 'win2': return a > h;
      case 'reg1': return h > a && !ot; case 'reg2': return a > h && !ot;
      case 'ot': return !!ot;
      case 'hpl': return h - a >= 2; case 'apl': return a - h >= 2;
      default: return null;
    }
  }

  /* ---------- Historie ---------- */

  function teamHistory(ds, teamId, cutoff, n) {
    const size = n || 10;
    const list = ds.byTeam.get(teamId) || [];
    const recent = [];
    for (let i = list.length - 1; i >= 0 && recent.length < size; i--) {
      const m = list[i];
      if (m.fin && m.t < cutoff) recent.push(m);
    }
    const out = { n: recent.length, form: [], ppg: null, gf: 0, ga: 0, avg: 0, keys: {} };
    const keys = ['o45', 'o55', 'o65', 'btts', 'ot', 'win1', 'win2', 'hpl', 'apl', 'h25', 'h35', 'a25', 'a35', 'reg1', 'reg2'];
    for (const k of keys) out.keys[k] = 0;
    if (!recent.length) return out;
    let pts = 0, n5 = 0;
    recent.forEach((m, k) => {
      const home = m.h === teamId;
      const f = home ? m.hgF : m.agF, ag = home ? m.agF : m.hgF;
      const ot = m.otType && m.otType !== 'REG';
      for (const key of keys) {
        let val = outcome(m, key);
        // Teambezogene Marktwerte auf die Sicht dieses Teams drehen
        if (key === 'h25') val = f > 2.5;
        else if (key === 'h35') val = f > 3.5;
        else if (key === 'a25') val = ag > 2.5;
        else if (key === 'a35') val = ag > 3.5;
        else if (key === 'win1') val = f > ag;
        else if (key === 'win2') val = ag > f;
        else if (key === 'reg1') val = f > ag && !ot;
        else if (key === 'reg2') val = ag > f && !ot;
        else if (key === 'hpl') val = f - ag >= 2;
        else if (key === 'apl') val = ag - f >= 2;
        if (val) out.keys[key]++;
      }
      out.gf += f; out.ga += ag; out.avg += f + ag;
      const r = f > ag ? 'S' : ot ? 'U' : 'N';
      if (k < 5) { n5++; pts += f > ag ? 2 : ot ? 1 : 0; out.form.push({ r, m, home, f, a: ag }); }
    });
    const c = recent.length;
    for (const k of keys) out.keys[k] /= c;
    out.gf /= c; out.ga /= c; out.avg /= c;
    out.ppg = n5 ? pts / n5 : null;
    out.form.reverse();
    return out;
  }

  function historyMatch(hH, hA) {
    if (!hH.n || !hA.n) return null;
    const mean = (x, y) => (x + y) / 2;
    const H = hH.keys, A = hA.keys;
    return {
      o45: mean(H.o45, A.o45), o55: mean(H.o55, A.o55), o65: mean(H.o65, A.o65),
      u45: 1 - mean(H.o45, A.o45), u55: 1 - mean(H.o55, A.o55), u65: 1 - mean(H.o65, A.o65),
      btts: mean(H.btts, A.btts), ot: mean(H.ot, A.ot),
      h25: H.h25, h35: H.h35, a25: A.h25, a35: A.h35,
      win1: mean(H.win1, A.win2), win2: mean(H.win2, A.win1),
      reg1: mean(H.reg1, A.reg2), reg2: mean(H.reg2, A.reg1),
      hpl: mean(H.hpl, A.apl), apl: mean(H.apl, A.hpl),
      avg: mean(hH.avg, hA.avg)
    };
  }

  /* ---------- Tabelle ---------- */

  function table(ds, season, cutoff, lg) {
    const rows = new Map();
    const get = (tid) => {
      if (!rows.has(tid)) rows.set(tid, { team: tid, sp: 0, s: 0, n: 0, otl: 0, otw: 0, tf: 0, tg: 0, pts: 0, o55: 0, results: [] });
      return rows.get(tid);
    };
    const L = lg || 'nhl';
    for (const m of ds.byLeague[L] || []) {
      if (m.season !== season) continue;
      get(m.h); get(m.a);
      if (!m.fin || (cutoff && m.t >= cutoff)) continue;
      const ot = m.otType && m.otType !== 'REG';
      for (const side of ['h', 'a']) {
        const r = get(side === 'h' ? m.h : m.a);
        const f = side === 'h' ? m.hgF : m.agF, a = side === 'h' ? m.agF : m.hgF;
        r.sp++; r.tf += f; r.tg += a;
        // NHL: Sieg 2 Punkte; europäische Ligen: 3 nach regulärer Zeit, 2 nach Verlängerung
        if (f > a) { r.s++; r.pts += L === 'nhl' ? 2 : ot ? 2 : 3; if (ot) r.otw++; r.results.push('S'); }
        else if (ot) { r.otl++; r.pts += 1; r.results.push('U'); }
        else { r.n++; r.results.push('N'); }
        if (m.hgF + m.agF > 5.5) r.o55++;
      }
    }
    const list = Array.from(rows.values());
    list.sort((x, y) => y.pts - x.pts || (y.tf - y.tg) - (x.tf - x.tg) || y.tf - x.tf);
    list.forEach((r, i) => { r.pos = i + 1; r.form = r.results.slice(-5); });
    return list;
  }

  /* ---------- Rückblick ---------- */

  const CHECK = ['o55', 'o45', 'btts', 'h25', 'a25', 'ot'];

  function backtest(ds, fromSeason, cutoffNow, options, lg) {
    const L = lg || 'nhl';
    const list = (ds.byLeague[L] || []).filter((m) => m.fin && m.season >= fromSeason && m.t < cutoffNow);
    const weeks = new Map();
    for (const m of list) {
      const ws = M.weekStart(m.t);
      if (!weeks.has(ws)) weeks.set(ws, []);
      weeks.get(ws).push(m);
    }
    const preds = [];
    for (const [ws, games] of Array.from(weeks.entries()).sort((a, b) => a[0] - b[0])) {
      const model = fit(ds, ws, options, L);
      if (model.nMatches < 40) continue;
      const base = {}, cnt = {};
      for (const k of CHECK) { base[k] = 0; cnt[k] = 0; }
      for (const m of ds.byLeague[L]) {
        if (!m.fin || m.t >= ws || ws - m.t > 365 * DAY) continue;
        for (const k of CHECK) { const oc = outcome(m, k); if (oc != null) { base[k] += oc ? 1 : 0; cnt[k]++; } }
      }
      for (const k of CHECK) base[k] = cnt[k] ? base[k] / cnt[k] : 0.5;
      for (const m of games) {
        const pr = predict(model, m.h, m.a);
        const hist = historyMatch(teamHistory(ds, m.h, ws, 10), teamHistory(ds, m.a, ws, 10));
        preds.push({ m, p: pr.p, hist, base });
      }
    }
    return preds;
  }

  function evaluate(preds) {
    const markets = {};
    for (const k of CHECK) markets[k] = { n: 0, model: 0, hist: 0, histN: 0, base: 0, rate: 0, buckets: Array.from({ length: 10 }, () => ({ n: 0, p: 0, hit: 0 })) };
    let winN = 0, winCorrect = 0;
    for (const r of preds) {
      for (const k of CHECK) {
        const oc = outcome(r.m, k);
        if (oc == null) continue;
        const y = oc ? 1 : 0, e = markets[k], pm = r.p[k];
        e.n++; e.rate += y;
        e.model += (pm - y) ** 2;
        e.base += (r.base[k] - y) ** 2;
        if (r.hist && r.hist[k] != null) { e.histN++; e.hist += (r.hist[k] - y) ** 2; }
        const b = e.buckets[Math.min(9, Math.floor(pm * 10))];
        b.n++; b.p += pm; b.hit += y;
      }
      winN++;
      if ((r.p.win1 >= 0.5) === (r.m.hgF > r.m.agF)) winCorrect++;
    }
    for (const k of CHECK) {
      const e = markets[k];
      if (e.n) { e.model /= e.n; e.base /= e.n; e.rate /= e.n; }
      if (e.histN) e.hist /= e.histN;
    }
    return { markets, n: preds.length, correct: winN ? winCorrect / winN : null };
  }

  root.SchnockHockey = {
    LEAGUE, MARKETS, FIT, CHECK,
    normalizeGames, fit, predict, outcome,
    teamHistory, historyMatch, table,
    backtest, evaluate
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.SchnockHockey;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Schnockstats / SchnockHockey – Oberfläche */
(function () {
  'use strict';

  const M = window.SchnockstatsModel;
  const H = window.SchnockHockey;
  const DAY = M.DAY;
  const OLDB = 'https://api.openligadb.de';
  const NHL_DIR = 'data/nhl';
  const FUSS_DIR = 'data/fussball';
  const HOCKEY_DIR = 'data/hockey';
  const CACHE = 'schnockstats:v1:';
  const PREFS = 'schnockstats:prefs:v2';
  const CURRENT_TTL = 20 * 60 * 1000;

  const FOOT_MARKETS = [
    { id: 'o15', label: 'Über 1.5 Tore', col: 'Ü 1.5', group: 'Tore' },
    { id: 'o25', label: 'Über 2.5 Tore', col: 'Ü 2.5', group: 'Tore' },
    { id: 'o35', label: 'Über 3.5 Tore', col: 'Ü 3.5', group: 'Tore' },

    { id: 'btts', label: 'Beide Teams treffen', col: 'BTTS', group: 'Tore' },
    { id: 'avg', label: 'Erwartete Tore (⌀)', col: '⌀ Tore', group: 'Tore', value: true },
    { id: 'hs', label: 'Heimteam trifft', col: 'Heim trifft', group: 'Teams' },
    { id: 'h15', label: 'Heimteam über 1.5 Tore', col: 'Heim Ü 1.5', group: 'Teams' },
    { id: 'hc', label: 'Heimteam kassiert', col: 'Heim kassiert', group: 'Teams' },
    { id: 'as', label: 'Auswärtsteam trifft', col: 'Ausw. trifft', group: 'Teams' },
    { id: 'a15', label: 'Auswärtsteam über 1.5 Tore', col: 'Ausw. Ü 1.5', group: 'Teams' },
    { id: 'ac', label: 'Auswärtsteam kassiert', col: 'Ausw. kassiert', group: 'Teams' },
