  async function loadHockey() {
    const st = S.stores.eishockey;
    setLoading('Lade NHL-Daten');
    const meta = await fetchJSON(`${NHL_DIR}/meta.json`, { cache: 'no-cache' });
    const v = encodeURIComponent(meta.generated || '');
    const teams = await fetchJSON(`${NHL_DIR}/teams.json?v=${v}`);
    const matches = [];
    const scorers = {};
    let done = 0;
    for (const season of meta.seasons) {
      setLoading(`Lade NHL-Daten (${++done} von ${meta.seasons.length})`);
      const games = await fetchJSON(`${NHL_DIR}/season-${season}.json?v=${v}`);
      for (const m of H.normalizeGames(games)) matches.push(m);
      try { scorers[season] = await fetchJSON(`${NHL_DIR}/scorers-${season}.json?v=${v}`); } catch (e) { scorers[season] = []; }
    }
    st.ds = M.buildDataset(matches, teams);
    st.meta = meta;
    st.scorers = scorers;
    st.scorerIndex = H.buildScorerIndex(scorers, meta.current);
    st.dataTime = Date.now();
    st.stale = false;
    st.models.clear(); st.analyses.clear();
  }

  function setLoading(text) { const el = $('#status'); if (el) el.textContent = text; }

  /* ---------- Analyse ---------- */

  function cutoffFor(ts) { return Math.min(dayStart(ts), store().dataTime); }

  function getModel(lg, cutoff) {
    const st = store();
    const key = lg + '|' + cutoff;
    if (!st.models.has(key)) st.models.set(key, isHockey() ? H.fit(st.ds, cutoff) : M.fitLeague(st.ds, lg, cutoff));
    return st.models.get(key);
  }

  function analyze(m) {
    const st = store();
    if (st.analyses.has(m.id)) return st.analyses.get(m.id);
    const cutoff = cutoffFor(m.t);
    const model = getModel(m.lg, cutoff);
    let an;
    if (isHockey()) {
      const pred = H.predict(model, m.h, m.a);
      const hH = H.teamHistory(st.ds, m.h, cutoff, 10);
      const hA = H.teamHistory(st.ds, m.a, cutoff, 10);
      an = { cutoff, model, pred, hH, hA, hist: H.historyMatch(hH, hA) };
    } else {
      const pred = M.predictMatch(model, m.h, m.a);
      const hH = M.teamHistory(st.ds, m.h, cutoff, 10);
      const hA = M.teamHistory(st.ds, m.a, cutoff, 10);
      an = { cutoff, model, pred, hH, hA, hist: M.historyMatch(hH, hA) };
    }
    st.analyses.set(m.id, an);
    return an;
  }

  const outcomeOf = (m, id) => (isHockey() ? H.outcome(m, id) : M.outcome(m, id));
  const finalScore = (m) => (isHockey() ? [m.hgF, m.agF] : [m.hg, m.ag]);

  function valueOf(an, id, mode) {
    const src = (mode || S.mode) === 'model' ? an.pred.p : an.hist;
    return src ? src[id] : null;
  }

  /* ---------- Bausteine ---------- */

  function heatStyle(v, market) {
    if (v == null) return '';
    const x = market && market.value
      ? clamp((v - (isHockey() ? 4.5 : 2)) / 2.5, 0, 1)
      : clamp((v - 0.3) / 0.65, 0, 1);
    const p = Math.round(Math.pow(x, 1.15) * 88);
    return ` style="--heat:${p}%" data-hot="${p > 52 ? 1 : 0}"`;
  }

  function statPill(an, m, id, mode) {
    const market = sport().market[id];
    const v = valueOf(an, id, mode);
    if (v == null || !market) return '<span class="pill pill-empty">–</span>';
    const text = market.value ? dec(v, 2) : pct(v);
    let mark = '';
    if (m.fin && !market.value) {
      const oc = outcomeOf(m, id);
      if (oc === true) mark = '<span class="mark hit" title="Eingetreten">✓</span>';
      else if (oc === false) mark = '<span class="mark miss" title="Nicht eingetreten">✗</span>';
    }
    return `<span class="pill"${heatStyle(v, market)}>${text}${mark}</span>`;
  }

  function formDots(form) {
    return `<span class="dots" aria-hidden="true">${form.map((f) => `<i class="r-${f.r}"></i>`).join('')}</span>`;
  }

  function formCell(h) {
    if (!h.n) return '<td class="form"><span class="muted">–</span></td>';
    return `<td class="form"><b>${dec(h.ppg, 2)}</b>${formDots(h.form)}</td>`;
  }

  function marketSelect(id, value, label) {
    const groups = {};
    for (const mk of sport().markets) (groups[mk.group] = groups[mk.group] || []).push(mk);
    const opts = Object.entries(groups).map(([g, list]) =>
      `<optgroup label="${esc(g)}">${list.map((mk) => `<option value="${mk.id}"${mk.id === value ? ' selected' : ''}>${esc(mk.label)}</option>`).join('')}</optgroup>`).join('');
    return `<label class="select"><span>${esc(label)}</span><select id="${id}">${opts}</select></label>`;
  }

  function modeSwitch() {
    return `<div class="segmented" role="group" aria-label="Berechnung">
      <button data-mode="model" aria-pressed="${S.mode === 'model'}">Modell</button>
      <button data-mode="hist" aria-pressed="${S.mode === 'hist'}">Letzte 10</button>
    </div>`;
  }

  function leagueChips() {
    if (!sport().multiLeague) return `<div class="chips"><span class="chip chip-static">NHL</span></div>`;
    const all = footballLeagues();
    const byCountry = new Map();
    for (const l of all) {
      if (!byCountry.has(l.country)) byCountry.set(l.country, []);
      byCountry.get(l.country).push(l);
    }
    const groups = Array.from(byCountry.entries()).map(([country, list]) =>
      `<fieldset><legend>${esc(country)}</legend>${list.map((l) => `<label class="lg-opt">
        <input type="checkbox" data-league="${l.id}"${S.leagues.has(l.id) ? ' checked' : ''}>
        <span>${esc(l.name.replace(country + ' – ', ''))}</span></label>`).join('')}</fieldset>`).join('');
    const picked = all.filter((l) => S.leagues.has(l.id));
    const label = picked.length === 1 ? picked[0].name : `${picked.length} von ${all.length} Ligen`;
    return `<details class="leaguepicker"${S.pickerOpen ? ' open' : ''}>
      <summary><span class="lp-label">${esc(label)}</span></summary>
      <div class="lp-panel">
        <div class="lp-actions">
          <button class="btn-quiet btn-sm" data-pick="de">Nur Deutschland</button>
          <button class="btn-quiet btn-sm" data-pick="top">Große Ligen</button>
          <button class="btn-quiet btn-sm" data-pick="all">Alle</button>
        </div>
        <div class="lp-groups">${groups}</div>
      </div></details>`;
  }
  const TOP_LEAGUES = ['bl1', 'bl2', 'bl3', 'E0', 'SP1', 'I1', 'F1', 'N1'];

  const activeLeagues = () => (sport().multiLeague ? (S.leagues || new Set(footballLeagues().map((l) => l.id))) : new Set(['nhl']));

  function dataNotice() {
    if (isHockey()) return '';
    const st = store();
    if (!st.meta) {
      return `<p class="notice">Zurzeit sind nur die deutschen Ligen geladen. Die internationalen Ligen liegen im Ordner <code>data/fussball</code> und werden vom Actions-Job „Fußball-Daten aktualisieren“ erzeugt. Starte ihn einmal von Hand, dann erscheinen sie hier automatisch.</p>`;
    }
    const now = Date.now();
    const lgs = activeLeagues();
    const missing = [];
    for (const l of footballLeagues()) {
      if (!lgs.has(l.id) || isGerman(l.id)) continue;
      // Nur Ligen melden, die gerade laufen: zuletzt gespielt, aber ohne Ansetzungen
      let recent = false, upcoming = false;
      for (const m of st.ds.matches) {
        if (m.lg !== l.id) continue;
        if (m.fin && now - m.t < 21 * DAY) recent = true;
        else if (!m.fin && m.t > now && m.t < addDays(now, 21)) { upcoming = true; break; }
      }
      if (recent && !upcoming) missing.push(l.name);
    }
    if (!missing.length) return '';
    const names = missing.length > 5 ? `${missing.length} Ligen` : missing.join(', ');
    const fx = st.meta.fixtures || {};
    let why = '';
    if (typeof fx.main === 'number') {
      why = fx.main > 0
        ? ` Die wöchentliche Spielplan-Datei hat zuletzt ${fx.main} Partien geliefert.`
        : ' Die wöchentliche Spielplan-Datei der Quelle kam beim letzten Lauf leer an, deshalb fehlen die Ansetzungen.';
    }
    return `<p class="notice">Für ${esc(names)} liegt gerade kein Spielplan vor, dort siehst du nur gespielte Partien. Ergebnisse, Tabellen und Statistiken sind vorhanden.${why} Ligen in der Saisonpause sind nicht mitgezählt.</p>`;
  }

  /* ---------- Ansicht: Spiele ---------- */

  function matchesInRange(from, to) {
    const ds = store().ds;
    const lgs = activeLeagues();
    return ds.matches.filter((m) => lgs.has(m.lg) && m.t >= from && m.t < to);
  }

  function pickDefaultDay() {
    const today = dayStart(Date.now());
    for (let off = 0; off <= 5; off++) if (matchesInRange(addDays(today, off), addDays(today, off + 1)).length) return off;
    return 0;
  }

  function renderSpiele() {
    const today = dayStart(Date.now());
    if (S.day == null) S.day = pickDefaultDay();
    const tabs = [];
    for (let off = -1; off <= 5; off++) {
      const start = addDays(today, off);
      const count = matchesInRange(start, addDays(today, off + 1)).length;
      const label = off === -1 ? 'Gestern' : off === 0 ? 'Heute' : off === 1 ? 'Morgen' : fmtDay(start);
      tabs.push(`<button class="day" data-day="${off}" aria-pressed="${!S.allDays && S.day === off}"${count ? '' : ' data-empty="1"'}>
        <span>${esc(label)}</span><small>${count ? count + ' Spiele' : 'keine Spiele'}</small></button>`);
    }

    let from, to;
    if (S.allDays) { from = addDays(today, -1); to = addDays(today, 6); }
    else { from = addDays(today, S.day); to = addDays(today, S.day + 1); }
    const list = matchesInRange(from, to).sort((a, b) => a.t - b.t || (leagueOrder(a.lg) - leagueOrder(b.lg)));

    const groups = new Map();
    for (const m of list) {
      const key = (S.allDays ? dayStart(m.t) + '|' : '') + m.lg;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(m);
    }

    const s = stat();
    const c1 = sport().market[s.s1], c2 = sport().market[s.s2];
    let body = '';
    for (const key of Array.from(groups.keys())) {
      const ms = groups.get(key);
      const lg = ms[0].lg;
      const mds = Array.from(new Set(ms.map((m) => m.mdName).filter(Boolean)));
      const dayLabel = S.allDays ? fmtDay(ms[0].t) + ', ' : '';
      body += `<tbody class="league-group"><tr class="group-row"><th colspan="7" scope="colgroup">
        <span class="lg-badge lg-${lg}">${esc(LEAGUE[lg].short)}</span>${esc(dayLabel)}${esc(LEAGUE[lg].name)}<span class="muted">${esc(mds.join(', '))}</span></th></tr>`;
      for (const m of ms) body += matchRow(m);
      body += '</tbody>';
    }

    const lgs = activeLeagues();
    const next = store().ds.matches.find((m) => lgs.has(m.lg) && !m.fin && m.t >= Date.now());
    const empty = `<div class="empty"><p>Für diesen Tag sind keine Spiele angesetzt.${next
      ? ` Das nächste Spiel ist am ${fmtDay(next.t)} um ${fmtTime(next.t)} Uhr.`
      : ''}</p>${next && dayStart(next.t) <= addDays(today, 5) ? '<button class="btn" data-action="next-day">Nächsten Spieltag anzeigen</button>' : ''}</div>`;

    return `
      ${dataNotice()}
      <div class="daybar" role="group" aria-label="Tag wählen">${tabs.join('')}</div>
      <div class="toolbar">
        ${leagueChips()}
        <div class="toolbar-right">
          ${marketSelect('stat1', s.s1, '1. Statistik')}
          ${marketSelect('stat2', s.s2, '2. Statistik')}
          ${modeSwitch()}
          <label class="check"><input type="checkbox" id="allDays"${S.allDays ? ' checked' : ''}> Alle Tage zusammen</label>
        </div>
      </div>
      ${list.length ? `<div class="table-wrap"><table class="matches">
        <colgroup><col class="c-time"><col class="c-team"><col class="c-form"><col class="c-stat"><col class="c-stat"><col class="c-form"><col class="c-team"></colgroup>
        <thead><tr>
          <th scope="col">Zeit</th><th scope="col" class="t-right">Heim</th><th scope="col" class="form">Form</th>
          <th scope="col" class="stat">${esc(c1.col)}</th><th scope="col" class="stat">${esc(c2.col)}</th>
          <th scope="col" class="form">Form</th><th scope="col">Auswärts</th>
        </tr></thead>${body}</table></div>` : empty}
      <p class="legend">Form = Punkte pro Spiel aus den letzten 5 Partien${isHockey() ? ' (Sieg 2, Niederlage nach Verlängerung 1)' : ''}. ${S.mode === 'model'
        ? 'Werte aus dem Modell: Teamstärke in Angriff und Abwehr, Heimvorteil, jüngere Spiele zählen stärker.'
        : 'Werte aus den letzten 10 Spielen beider Teams, ohne Gewichtung nach Gegner.'} Ein Klick auf ein Spiel zeigt alle Details.</p>`;
  }

  function matchRow(m) {
    const an = analyze(m);
    const open = S.open.has(m.id);
    const s = stat();
    const [hg, ag] = finalScore(m);
    const otTag = isHockey() && m.otType && m.otType !== 'REG' ? (m.otType === 'SO' ? 'n. P.' : 'n. V.') : 'Ende';
    const time = m.fin
      ? `<span class="score">${hg}:${ag}</span><small>${otTag}</small>`
      : (m.t < Date.now() - 3 * 3600000 ? `<span class="time">${fmtTime(m.t)}</span><small>kein Ergebnis</small>`
        : m.t < Date.now() ? `<span class="time">${fmtTime(m.t)}</span><small>läuft</small>`
          : `<span class="time">${fmtTime(m.t)}</span>`);
    const row = `<tr class="match${open ? ' is-open' : ''}" data-match="${m.id}" tabindex="0" aria-expanded="${open}">
      <td class="kick">${time}</td>
      <td class="home">${teamName(m.h, 'home')}</td>
      ${formCell(an.hH)}
      <td class="stat">${statPill(an, m, s.s1)}</td>
      <td class="stat">${statPill(an, m, s.s2)}</td>
      ${formCell(an.hA)}
      <td class="away">${teamName(m.a, 'away')}</td>
    </tr>`;
    return open ? row + `<tr class="detail-row"><td colspan="7">${renderDetail(m, an)}</td></tr>` : row;
  }

  /* ---------- Spieldetails ---------- */

  function renderDetail(m, an) {
    const p = an.pred.p, h = an.hist || {};
    const th = team(m.h), ta = team(m.a);
    const mk = sport().market;

    const three = isHockey()
      ? [[p.reg1, 'tw-1', th.s], [p.ot, 'tw-x', 'Verlängerung'], [p.reg2, 'tw-2', ta.s]]
      : [[p['1'], 'tw-1', th.s], [p.X, 'tw-x', 'Remis'], [p['2'], 'tw-2', ta.s]];
    const threeWay = `<div class="threeway">${three.map(([v, cls]) => `<span class="${cls}" style="flex:${v}"><b>${pct(v)}</b></span>`).join('')}</div>
      <div class="tw-labels">${three.map(([, , lab]) => `<span>${esc(lab)}</span>`).join('')}</div>
      ${isHockey() ? `<p class="small">Inklusive Verlängerung und Penaltyschießen: ${esc(th.s)} ${pct(p.win1)}, ${esc(ta.s)} ${pct(p.win2)}</p>` : ''}`;

    const mkTable = `<table class="mini">
      <thead><tr><th scope="col">Ereignis</th><th scope="col" class="num">Modell</th><th scope="col" class="num">Letzte 10</th><th scope="col" class="num">Faire Quote</th></tr></thead>
      <tbody>${sport().detail.map((id) => {
        const label = mk[id] ? mk[id].label : id === 'o05' ? 'Über 0.5 Tore' : id === 'o45' ? 'Über 4.5 Tore' : id;
        const oc = m.fin ? outcomeOf(m, id) : null;
        const mark = oc === true ? ' <span class="mark hit">✓</span>' : oc === false ? ' <span class="mark miss">✗</span>' : '';
        return `<tr><th scope="row">${esc(label)}${mark}</th>
          <td class="num"><span class="bar" style="--w:${Math.round((p[id] || 0) * 100)}%"></span>${pct(p[id])}</td>
          <td class="num muted-num">${pct(h[id])}</td><td class="num">${fairOdds(p[id])}</td></tr>`;
      }).join('')}</tbody></table>`;

    const top = `<ol class="scores">${an.pred.top.map((c) => `<li><b>${c.h}:${c.a}</b><span>${pct(c.p)}</span></li>`).join('')}</ol>`;

    const formList = (hist) => {
      if (!hist.n) return '<p class="muted">Keine früheren Spiele in den Daten.</p>';
      return `<ul class="formlist">${hist.form.slice().reverse().map((f) => {
        const opp = f.home ? f.m.a : f.m.h;
        return `<li><span class="res r-${f.r}">${f.r}</span><span class="fl-date">${fmtDate(f.m.t, true)}</span>
          <span class="fl-opp">${f.home ? 'vs.' : 'bei'} ${esc(team(opp).s)}</span><b>${f.f}:${f.a}</b></li>`;
      }).join('')}</ul>
      <p class="small">Letzte 10: ${dec(hist.gf, 1)} Tore erzielt, ${dec(hist.ga, 1)} kassiert pro Spiel</p>`;
    };

    let scH, scA, scorerNote;
    if (isHockey()) {
      const avg = (an.model.bh + an.model.ba) / 2;
      scH = H.scorerCandidates(store().scorerIndex, m.h, an.pred.lh, avg, 6);
      scA = H.scorerCandidates(store().scorerIndex, m.a, an.pred.la, avg, 6);
      scorerNote = 'Aus Toren je Spiel der laufenden und der vergangenen Saison, skaliert auf die erwarteten Teamtore. Aufstellungen und Verletzungen sind nicht berücksichtigt.';
    } else if (!isGerman(m.lg)) {
      scH = []; scA = [];
      scorerNote = 'Für diese Liga gibt es in der kostenlosen Quelle keine Torschützen.';
    } else {
      scH = M.scorerCandidates(store().ds, m.h, an.cutoff, an.pred.lh, an.model.ogRate, an.model.season, 6);
      scA = M.scorerCandidates(store().ds, m.a, an.cutoff, an.pred.la, an.model.ogRate, an.model.season, 6);
      scorerNote = 'Aus dem Toranteil der letzten Monate. Aufstellungen und Verletzungen sind nicht berücksichtigt.';
    }
    const scorerList = (list) => {
      if (!list.length) return '<p class="muted">Keine Torschützendaten vorhanden.</p>';
      return `<ul class="scorers">${list.map((sc) => `<li><span class="sc-name">${esc(sc.name)}</span>
        <span class="sc-meta">${sc.season} ${sc.season === 1 ? 'Saisontor' : 'Saisontore'}</span>
        <span class="bar-inline"><span style="width:${Math.round(sc.p * 100)}%"></span></span><b>${pct(sc.p)}</b></li>`).join('')}</ul>`;
    };

    const [hgF, agF] = finalScore(m);
    const resultExtra = isHockey()
      ? (m.otType && m.otType !== 'REG' ? ` (${m.otType === 'SO' ? 'nach Penaltyschießen' : 'nach Verlängerung'}, regulär ${m.hg}:${m.ag})` : '')
      : (m.hh != null ? ` (Halbzeit ${m.hh}:${m.ha})` : '');
    const result = m.fin ? `<p class="result-line">Endstand <b>${hgF}:${agF}</b>${resultExtra}. Die Prognose nutzt nur Spiele vor diesem Tag.</p>` : '';

    let h2hHtml;
    if (isHockey() || !isGerman(m.lg)) {
      const list = (store().ds.byTeam.get(m.h) || []).filter((x) => x.fin && (x.h === m.a || x.a === m.a)).sort((a, b) => b.t - a.t).slice(0, 8);
      h2hHtml = list.length
        ? `<ul class="formlist">${list.map((x) => `<li><span class="fl-date">${fmtDate(x.t, true)}</span>
            <span class="fl-opp">${esc(team(x.h).s)} – ${esc(team(x.a).s)}</span><b>${isHockey() ? x.hgF : x.hg}:${isHockey() ? x.agF : x.ag}</b></li>`).join('')}</ul>`
        : '<p class="muted">Keine früheren Duelle in den geladenen Saisons.</p>';
    } else {
      const key = Math.min(m.h, m.a) + '-' + Math.max(m.h, m.a);
      const h2h = S.h2h.get(key);
      if (!h2h) { h2hHtml = '<p class="muted">Wird geladen …</p>'; loadH2H(m, key); }
      else if (h2h.error) h2hHtml = '<p class="muted">Der direkte Vergleich konnte nicht geladen werden.</p>';
      else if (!h2h.list.length) h2hHtml = '<p class="muted">Keine früheren Duelle gefunden.</p>';
      else h2hHtml = `<ul class="formlist">${h2h.list.map((x) => `<li><span class="fl-date">${fmtDate(x.t, true)}</span>
          <span class="fl-opp">${esc(team(x.h).s)} – ${esc(team(x.a).s)}</span><b>${x.hg}:${x.ag}</b></li>`).join('')}</ul>
          <p class="small">${h2h.summary}</p>`;
    }

    return `<div class="detail">
      <div class="detail-head">
        <div><h3>${esc(th.n)} – ${esc(ta.n)}</h3>
          <p class="small">${esc(LEAGUE[m.lg].name)}${m.mdName ? ', ' + esc(m.mdName) : ''}, ${fmtDay(m.t)} ${fmtTime(m.t)} Uhr</p>
          ${result}</div>
        <div class="xg"><span class="xg-num">${dec(an.pred.lh, 2)}</span><span class="xg-sep">:</span><span class="xg-num">${dec(an.pred.la, 2)}</span>
          <small>erwartete Tore${isHockey() ? ', reguläre Zeit' : ''}</small></div>
      </div>
      <div class="detail-grid">
        <section class="d-result"><h4>Ausgang</h4>${threeWay}<h4>Wahrscheinlichste Ergebnisse</h4>${top}</section>
        <section class="d-markets"><h4>Ereignisse</h4><div class="table-wrap">${mkTable}</div></section>
        <section class="d-form"><h4>Form ${esc(th.s)}</h4>${formList(an.hH)}<h4>Form ${esc(ta.s)}</h4>${formList(an.hA)}</section>
        <section class="d-scorers"><h4>Mögliche Torschützen ${esc(th.s)}</h4>${scorerList(scH)}<h4>Mögliche Torschützen ${esc(ta.s)}</h4>${scorerList(scA)}
          <p class="small">${esc(scorerNote)}</p></section>
        <section class="d-h2h"><h4>Direkter Vergleich</h4><div>${h2hHtml}</div></section>
      </div>
    </div>`;
  }

  async function loadH2H(m, key) {
    if (S.h2h.has(key)) return;
    S.h2h.set(key, null);
    try {
      const raw = await fetchJSON(`${OLDB}/getmatchdata/${m.h}/${m.a}`);
      const list = (Array.isArray(raw) ? raw : []).map(M.normalizeMatch).filter((x) => x.fin).sort((a, b) => b.t - a.t).slice(0, 8);
      let wh = 0, d = 0, wa = 0;
      for (const x of list) {
        const gh = x.h === m.h ? x.hg : x.ag, ga = x.h === m.h ? x.ag : x.hg;
        if (gh > ga) wh++; else if (gh === ga) d++; else wa++;
      }
      const siege = (n) => n + (n === 1 ? ' Sieg' : ' Siege');
      S.h2h.set(key, { list, summary: list.length ? `${esc(team(m.h).s)} ${siege(wh)}, ${d} Remis, ${esc(team(m.a).s)} ${siege(wa)}` : '' });
    } catch (e) { S.h2h.set(key, { error: true }); }
    render();
  }

  /* ---------- Ansicht: Statistiken ---------- */

  function renderStatistiken() {
    const now = Date.now();
    const mkId = stat().top;
    const mk = sport().market[mkId];
    const list = matchesInRange(now - 2 * 3600000, addDays(now, 8)).filter((m) => !m.fin);
    const rows = list.map((m) => { const an = analyze(m); return { m, an, v: an.pred.p[mkId], hv: an.hist ? an.hist[mkId] : null }; });
    rows.sort((a, b) => b.v - a.v);
    const body = rows.map(({ m, an, v, hv }) => `<tr class="linkrow" data-goto="${m.id}" tabindex="0">
      <td class="nowrap">${fmtDay(m.t)} <span class="muted">${fmtTime(m.t)}</span></td>
      ${sport().multiLeague ? `<td><span class="lg-badge lg-${m.lg}">${esc(LEAGUE[m.lg].short)}</span></td>` : ''}
      <td class="pairing">${teamName(m.h)}<span class="vs">–</span>${teamName(m.a)}</td>
      <td class="num">${statPill(an, m, mkId, 'model')}</td>
      <td class="num muted-num">${mk.value ? dec(hv, 2) : pct(hv)}</td>
      <td class="num">${mk.value ? '–' : fairOdds(v)}</td>
    </tr>`).join('');
    return `
      <div class="page-head"><h2>Statistiken</h2><p>Alle anstehenden Spiele der nächsten 7 Tage, sortiert nach Wahrscheinlichkeit.</p></div>
      <div class="toolbar">
        ${leagueChips()}
        <div class="toolbar-right">${marketSelect('statMarket', mkId, 'Ereignis')}</div>
      </div>
      ${rows.length ? `<div class="table-wrap"><table class="list">
        <thead><tr><th scope="col">Anstoß</th>${sport().multiLeague ? '<th scope="col">Liga</th>' : ''}<th scope="col">Begegnung</th>
        <th scope="col" class="num">Modell</th><th scope="col" class="num">Letzte 10</th><th scope="col" class="num">Faire Quote</th></tr></thead>
        <tbody>${body}</tbody></table></div>`
      : '<div class="empty"><p>In den nächsten 7 Tagen sind keine Spiele angesetzt.</p></div>'}
      <p class="legend">Faire Quote = 1 geteilt durch die Wahrscheinlichkeit, also die Quote ohne Buchmacher-Marge.</p>`;
  }

  /* ---------- Ansicht: Ligen ---------- */

  function leagueTabs(active, attr, only) {
    if (!sport().multiLeague) return '';
    const list = (only || footballLeagues()).filter((l) => l.id !== 'nhl');
    if (list.length <= 4) {
      return `<div class="tabs" role="group" aria-label="Liga">${list.map((l) =>
        `<button class="tab" ${attr}="${l.id}" aria-pressed="${active === l.id}">${esc(l.name)}</button>`).join('')}</div>`;
    }
    const groups = new Map();
    for (const l of list) {
      if (!groups.has(l.country)) groups.set(l.country, []);
      groups.get(l.country).push(l);
    }
    return `<label class="select select-wide"><span>Liga</span><select ${attr}-select>${
      Array.from(groups.entries()).map(([country, ls]) => `<optgroup label="${esc(country)}">${ls.map((l) =>
        `<option value="${l.id}"${l.id === active ? ' selected' : ''}>${esc(l.name.replace(country + ' – ', ''))}</option>`).join('')}</optgroup>`).join('')
    }</select></label>`;
  }

  function renderLigen() {
    const st = store();
    const lg = isHockey() ? 'nhl' : (LEAGUE[S.tableLeague] ? S.tableLeague : 'bl1');
    const season = isHockey() ? st.meta.current : M.seasonAt(st.ds, lg, st.dataTime);
    if (season == null) return leagueTabs(lg, 'data-table') + '<div class="empty"><p>Für diese Liga liegen keine Daten vor.</p></div>';
    const model = getModel(lg, st.dataTime);
    const base = isHockey() ? H.table(st.ds, season) : M.leagueTable(st.ds, lg, season);
    const rows = base.map((r) => {
      const rt = M.teamRating(model, r.team);
      return Object.assign({}, r, {
        diff: r.tf - r.tg,
        avg: r.sp ? (r.tf + r.tg) / r.sp : null,
        rate1: r.sp ? (isHockey() ? r.o55 : r.o25) / r.sp : null,
        rate2: r.sp && !isHockey() ? r.btts / r.sp : null,
        csp: r.sp && !isHockey() ? r.cs / r.sp : null,
        att: rt.A * 100, def: 100 / rt.D, name: team(r.team).n
      });
    });
    const { key, dir } = S.tableSort;
    rows.sort((a, b) => {
      const x = a[key], y = b[key];
      if (typeof x === 'string') return dir * x.localeCompare(y);
      return dir * ((x == null ? -1e9 : x) - (y == null ? -1e9 : y)) || a.pos - b.pos;
    });
    const cols = isHockey()
      ? [['pos', '#', 1], ['name', 'Team', 1], ['sp', 'Sp', -1], ['s', 'S', -1], ['otl', 'N n.V.', -1], ['n', 'N', -1],
      ['tf', 'Tore', -1], ['diff', 'Diff', -1], ['pts', 'Pkt', -1], [null, 'Form'],
      ['avg', '⌀ Tore', -1], ['rate1', 'Ü 5.5', -1], ['att', 'Angriff', -1], ['def', 'Abwehr', -1]]
      : [['pos', '#', 1], ['name', 'Verein', 1], ['sp', 'Sp', -1], ['s', 'S', -1], ['u', 'U', -1], ['n', 'N', -1],
      ['tf', 'Tore', -1], ['diff', 'Diff', -1], ['pts', 'Pkt', -1], [null, 'Form'],
      ['avg', '⌀ Tore', -1], ['rate1', 'Ü 2.5', -1], ['rate2', 'BTTS', -1], ['csp', 'Zu Null', -1], ['att', 'Angriff', -1], ['def', 'Abwehr', -1]];
    const head = cols.map(([k, label, d]) => {
      if (!k) return `<th scope="col">${label}</th>`;
      const active = key === k;
      return `<th scope="col" aria-sort="${active ? (dir === 1 ? 'ascending' : 'descending') : 'none'}" class="${k === 'name' ? '' : 'num'}">
        <button class="sort" data-sort="${k}" data-dir="${d}">${label}${active ? (dir === 1 ? ' ▲' : ' ▼') : ''}</button></th>`;
    }).join('');
    const rate = (v) => `<span class="rating" style="--r:${Math.round(clamp((v - 60) / 80, 0, 1) * 55)}%">${Math.round(v)}</span>`;
    const body = rows.map((r) => `<tr>
      <td class="num">${r.pos}</td><td>${teamName(r.team)}</td>
      <td class="num">${r.sp}</td><td class="num">${r.s}</td><td class="num">${isHockey() ? r.otl : r.u}</td><td class="num">${r.n}</td>
      <td class="num nowrap">${r.tf}:${r.tg}</td><td class="num">${r.diff > 0 ? '+' : ''}${r.diff}</td><td class="num"><b>${r.pts}</b></td>
      <td>${formDots(r.form.map((x) => ({ r: x })))}</td>
      <td class="num">${dec(r.avg, 2)}</td><td class="num">${pct(r.rate1)}</td>
      ${isHockey() ? '' : `<td class="num">${pct(r.rate2)}</td><td class="num">${pct(r.csp)}</td>`}
      <td class="num">${rate(r.att)}</td><td class="num">${rate(r.def)}</td>
    </tr>`).join('');
    return `
      <div class="page-head"><h2>${isHockey() ? 'NHL-Tabelle' : 'Ligen'}</h2>
        <p>Saison ${seasonLabel(season)}. Angriff und Abwehr: 100 = Ligaschnitt, höher ist besser.${isHockey() ? ' Punkte: Sieg 2, Niederlage nach Verlängerung 1.' : ''}</p></div>
      ${leagueTabs(lg, 'data-table')}
      <div class="table-wrap"><table class="list table-league"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
      <p class="legend">${isHockey() ? 'Eine Gesamttabelle über die ganze Liga, ohne Divisions- und Conference-Einteilung.' : 'Die Tabelle wird aus den Ergebnissen berechnet. Punktabzüge sind nicht enthalten.'}</p>`;
  }

  /* ---------- Ansicht: Torschützen ---------- */

  function renderTorschuetzen() {
    const st = store();
    if (!isHockey() && !isGerman(S.scorerLeague)) S.scorerLeague = 'bl1';
    const lg = isHockey() ? 'nhl' : S.scorerLeague;
    const season = isHockey() ? st.meta.current : M.seasonAt(st.ds, lg, st.dataTime);
    const now = Date.now();
    const upcoming = (st.ds.byLeague[lg] || []).filter((m) => !m.fin && m.t >= now - 2 * 3600000 && m.t < addDays(now, 8));

    let top = [], cands = [], note = '';
    if (isHockey()) {
      top = H.topScorers(st.scorers, season).slice(0, 25).map((p) => ({ name: p.n, team: p.team, goals: p.g, games: p.gp, pens: p.pp }));
      for (const m of upcoming) {
        const an = analyze(m);
        const avg = (an.model.bh + an.model.ba) / 2;
        for (const side of ['h', 'a']) {
          const tid = side === 'h' ? m.h : m.a;
          const lam = side === 'h' ? an.pred.lh : an.pred.la;
          for (const c of H.scorerCandidates(st.scorerIndex, tid, lam, avg, 5)) cands.push(Object.assign({ tid, opp: side === 'h' ? m.a : m.h, home: side === 'h', m }, c));
        }
      }
      if (!top.length) note = 'Für die laufende Saison sind noch keine Tore erfasst. Die Kandidaten beruhen dann auf der Vorsaison.';
    } else {
      top = M.topScorers(st.ds, lg, season).slice(0, 25).map((p) => ({ name: p.name, team: p.team, goals: p.goals, pens: p.pens }));
      for (const m of upcoming) {
        const an = analyze(m);
        for (const side of ['h', 'a']) {
          const tid = side === 'h' ? m.h : m.a;
          const lam = side === 'h' ? an.pred.lh : an.pred.la;
          for (const c of M.scorerCandidates(st.ds, tid, an.cutoff, lam, an.model.ogRate, an.model.season, 5)) cands.push(Object.assign({ tid, opp: side === 'h' ? m.a : m.h, home: side === 'h', m }, c));
        }
      }
      let totalGoals = 0, namedGoals = 0;
      for (const m of st.ds.byLeague[lg] || []) {
        if (m.season !== season || !m.fin) continue;
        totalGoals += m.hg + m.ag;
        namedGoals += m.goals.filter((g) => g.n).length;
      }
      if (totalGoals && namedGoals / totalGoals < 0.8) note = `Für diese Liga sind nur ${pct(namedGoals / totalGoals)} der Tore mit Torschütze eingetragen. Die Werte sind deshalb weniger verlässlich.`;
    }
    cands.sort((a, b) => b.p - a.p);

    const topHtml = top.length ? `<table class="list"><thead><tr><th scope="col" class="num">#</th><th scope="col">Spieler</th><th scope="col">Team</th>
      <th scope="col" class="num">Tore</th>${isHockey() ? '<th scope="col" class="num">Spiele</th>' : ''}<th scope="col" class="num">${isHockey() ? 'PP' : 'davon 11m'}</th></tr></thead>
      <tbody>${top.map((p, i) => `<tr><td class="num">${i + 1}</td><td>${esc(p.name)}</td><td>${teamName(p.team)}</td>
        <td class="num"><b>${p.goals}</b></td>${isHockey() ? `<td class="num">${p.games}</td>` : ''}<td class="num">${p.pens}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty"><p>In dieser Saison sind noch keine Tore erfasst.</p></div>';

    const candHtml = cands.length ? `<table class="list"><thead><tr><th scope="col">Spieler</th><th scope="col">Spiel</th><th scope="col" class="num">Saisontore</th><th scope="col" class="num">Trifft</th></tr></thead>
      <tbody>${cands.slice(0, 30).map((c) => `<tr class="linkrow" data-goto="${c.m.id}" tabindex="0">
        <td><b>${esc(c.name)}</b><div class="small">${esc(team(c.tid).s)}</div></td>
        <td class="nowrap">${c.home ? 'vs.' : 'bei'} ${esc(team(c.opp).s)}<div class="small">${fmtDay(c.m.t)} ${fmtTime(c.m.t)}</div></td>
        <td class="num">${c.season}</td>
        <td class="num"><span class="pill"${heatStyle(clamp(c.p + 0.3, 0, 1))}>${pct(c.p)}</span></td></tr>`).join('')}</tbody></table>`
      : '<div class="empty"><p>In den nächsten 7 Tagen sind keine Spiele angesetzt.</p></div>';

    return `
      <div class="page-head"><h2>Torschützen</h2><p>Torjägerliste ${season != null ? seasonLabel(season) : ''} und die wahrscheinlichsten Torschützen der kommenden Spiele.</p></div>
      ${leagueTabs(lg, 'data-scorers', GERMAN.map((id) => LEAGUE[id]))}
      ${!isHockey() ? '<p class="notice">Torschützen liegen nur für die deutschen Ligen vor. Die internationalen Ligen liefern kostenlos nur Ergebnisse.</p>' : ''}
      ${note ? `<p class="notice">${esc(note)}</p>` : ''}
      <div class="two-col">
        <section><h3>Wahrscheinliche Torschützen, nächste 7 Tage</h3><div class="table-wrap">${candHtml}</div></section>
        <section><h3>Torjäger der Saison</h3><div class="table-wrap">${topHtml}</div></section>
      </div>
      <p class="legend">Die Chance „trifft“ ergibt sich aus den erwarteten Toren des Teams und dem Toranteil des Spielers. Ob er spielt, weiß das Modell nicht.</p>`;
  }

  /* ---------- Ansicht: Schürfkombi ---------- */

  function highlightCandidates() {
    const now = Date.now();
    const today = dayStart(now);
    let from, to, label;
    if (S.kombi.scope === 'tag') {
      // Heute, oder der nächste Tag mit Spielen
      let off = 0;
      while (off <= 6 && !matchesInRange(addDays(today, off), addDays(today, off + 1)).length) off++;
      from = addDays(today, Math.min(off, 6));
      to = addDays(today, Math.min(off, 6) + 1);
      label = off === 0 ? 'Heute' : off === 1 ? 'Morgen' : fmtDay(from);
    } else if (S.kombi.scope === 'morgen') {
      from = addDays(today, 1); to = addDays(today, 2); label = 'Morgen';
    } else {
      from = today; to = addDays(today, 7); label = 'Nächste 7 Tage';
    }
    const list = matchesInRange(from, to).filter((m) => !m.fin || m.t > now - 4 * 3600000);
    const out = [];
    for (const m of list) {
      const an = analyze(m);
      for (const id of sport().high) {
        const v = an.pred.p[id];
        if (v == null || isNaN(v)) continue;
        out.push({ m, an, id, p: v, hist: an.hist ? an.hist[id] : null });
      }
    }
    out.sort((a, b) => b.p - a.p);
    const min = S.kombi.minOdds || 1;
    const filtered = min > 1 ? out.filter((r) => r.p > 0 && 1 / r.p >= min) : out;
    return { rows: filtered, label, from, to, games: list.length, total: out.length };
  }

  const ODDS_STEPS = [
    [1, 'Alle Quoten'], [1.15, 'ab 1,15'], [1.3, 'ab 1,30'], [1.5, 'ab 1,50'],
    [1.75, 'ab 1,75'], [2, 'ab 2,00'], [2.5, 'ab 2,50'], [3, 'ab 3,00']
  ];

  function oddsSelect() {
    return `<label class="select"><span>Faire Quote</span><select id="kombiOdds">${ODDS_STEPS.map(([v, lab]) =>
      `<option value="${v}"${v === (S.kombi.minOdds || 1) ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select></label>`;
  }

  function renderKombi() {
    const { rows, label, games, total } = highlightCandidates();
    const min = S.kombi.minOdds || 1;
    const head = `<div class="page-head"><h2>Schürfkombi</h2>
      <p>Die Ereignisse mit den höchsten Wahrscheinlichkeiten aus ${games} ${games === 1 ? 'Spiel' : 'Spielen'}, ${esc(label.toLowerCase())}${min > 1 ? `, gefiltert auf eine faire Quote ab ${dec(min, 2)}` : ''}.</p></div>`;
    const controls = `<div class="toolbar">
        ${leagueChips()}
        <div class="toolbar-right">
          <div class="segmented" role="group" aria-label="Zeitraum">
            <button data-scope="tag" aria-pressed="${S.kombi.scope === 'tag'}">Nächster Spieltag</button>
            <button data-scope="morgen" aria-pressed="${S.kombi.scope === 'morgen'}">Morgen</button>
            <button data-scope="woche" aria-pressed="${S.kombi.scope === 'woche'}">7 Tage</button>
          </div>
          ${oddsSelect()}
          <label class="select"><span>Kombi-Größe</span><select id="kombiLegs">${[2, 3, 4, 5, 6, 8].map((n) =>
            `<option value="${n}"${n === S.kombi.legs ? ' selected' : ''}>${n} Ereignisse</option>`).join('')}</select></label>
        </div>
      </div>`;
    if (!rows.length) {
      return head + controls + `<div class="empty"><p>${total
        ? `Kein Ereignis erreicht eine faire Quote von ${dec(min, 2)} oder mehr. Wähle eine kleinere Quote.`
        : 'Für diesen Zeitraum sind keine Spiele angesetzt.'}</p></div>`;
    }
    const mk = sport().market;

    // Kombi: nur ein Ereignis je Spiel, damit die Werte nicht voneinander abhängen
    const used = new Set();
    const perMarket = new Map();
    const cap = Math.max(2, Math.ceil(S.kombi.legs / 3));
    const legs = [];
    for (let pass = 0; pass < 2 && legs.length < S.kombi.legs; pass++) {
      for (const r of rows) {
        if (legs.length >= S.kombi.legs) break;
        if (used.has(r.m.id)) continue;
        // Im ersten Durchgang für Abwechslung sorgen, im zweiten auffüllen
        if (pass === 0 && (perMarket.get(r.id) || 0) >= cap) continue;
        used.add(r.m.id);
        perMarket.set(r.id, (perMarket.get(r.id) || 0) + 1);
        legs.push(r);
      }
    }
    const combo = legs.reduce((acc, r) => acc * r.p, 1);

    const legRows = legs.map((r) => `<li>
      <span class="kl-event">${esc(mk[r.id].label)}</span>
      <span class="kl-match">${esc(team(r.m.h).s)} – ${esc(team(r.m.a).s)}<span class="muted"> ${fmtTime(r.m.t)}, Quote ${fairOdds(r.p)}</span></span>
      <span class="kl-p"${heatStyle(r.p)}>${pct(r.p)}</span></li>`).join('');

    const body = rows.slice(0, 40).map((r) => `<tr class="linkrow" data-goto="${r.m.id}" tabindex="0">
      <td class="nowrap">${fmtTime(r.m.t)}${S.kombi.scope === 'woche' ? `<div class="small">${fmtDay(r.m.t)}</div>` : ''}</td>
      ${sport().multiLeague ? `<td><span class="lg-badge lg-${r.m.lg}">${esc(LEAGUE[r.m.lg].short)}</span></td>` : ''}
      <td class="pairing">${teamName(r.m.h)}<span class="vs">–</span>${teamName(r.m.a)}</td>
      <td>${esc(mk[r.id].label)}</td>
      <td class="num">${statPill(r.an, r.m, r.id, 'model')}</td>
      <td class="num muted-num">${pct(r.hist)}</td>
      <td class="num">${fairOdds(r.p)}</td>
    </tr>`).join('');

    return head + controls + `
      <section class="combo">
        <div class="combo-head">
          <h3>Die Kombi ${esc(label.toLowerCase())}</h3>
          <div class="combo-num"><b>${pct(combo)}</b><small>alle ${legs.length} treffen zusammen</small></div>
        </div>
        <ol class="combo-list">${legRows}</ol>
        <p class="small">Rechnerisch: ${legs.map((r) => pct(r.p)).join(' × ')} = ${pct(combo)}. Faire Gesamtquote ${fairOdds(combo)}. Aus jedem Spiel steckt nur ein Ereignis in der Kombi, denn Ereignisse aus derselben Partie hängen voneinander ab.</p>
      </section>

      <section><h3>Alle Highlights</h3>
      <div class="table-wrap"><table class="list">
        <thead><tr><th scope="col">Zeit</th>${sport().multiLeague ? '<th scope="col">Liga</th>' : ''}<th scope="col">Begegnung</th>
        <th scope="col">Ereignis</th><th scope="col" class="num">Modell</th><th scope="col" class="num">Letzte 10</th><th scope="col" class="num">Faire Quote</th></tr></thead>
        <tbody>${body}</tbody></table></div></section>
      <p class="legend">Hohe Wahrscheinlichkeiten heißen kleine Quoten. Ein Wert von 90 Prozent bedeutet auch, dass so ein Ereignis in etwa jedem zehnten Fall ausbleibt.</p>`;
  }

  /* ---------- Ansicht: Modell-Check ---------- */

  const CHECK_LABEL = {
    o15: 'Über 1.5 Tore', o25: 'Über 2.5 Tore', o35: 'Über 3.5 Tore', btts: 'Beide treffen',
    hs: 'Heimteam trifft', as: 'Auswärtsteam trifft',
    o45: 'Über 4.5 Tore', o55: 'Über 5.5 Tore', h25: 'Heim über 2.5 Tore', a25: 'Auswärts über 2.5 Tore', ot: 'Verlängerung'
  };

  async function runCheck() {
    if (S.checkRunning) return;
    S.checkRunning = true;
    const st = store();
    if (isHockey()) {
      S.checkProgress = 'Rechne NHL …';
      render();
      await new Promise((r) => setTimeout(r, 30));
      const from = st.meta.seasons[Math.max(0, st.meta.seasons.length - 2)];
      const preds = H.backtest(st.ds, from, st.dataTime);
      S.check.eishockey = { total: H.evaluate(preds), leagues: null, from };
    } else {
      const from = M.seasonAt(st.ds, 'bl1', st.dataTime) - 1;
      const ids = Array.from(S.leagues).filter((id) => LEAGUE[id]).sort((a, b) => leagueOrder(a) - leagueOrder(b)).slice(0, 8);
      const res = { leagues: {}, ids, from };
      let all = [];
      for (const id of ids) {
        S.checkProgress = `Rechne ${LEAGUE[id].name} …`;
        render();
        await new Promise((r) => setTimeout(r, 30));
        const preds = M.backtestLeague(st.ds, id, from, st.dataTime);
        res.leagues[id] = M.evaluate(preds);
        all = all.concat(preds);
      }
      res.total = M.evaluate(all);
      S.check.fussball = res;
    }
    S.checkRunning = false;
    render();
  }

  function renderCheck() {
    const intro = `<div class="page-head"><h2>Modell-Check</h2>
      <p>Hier rechnet die Seite die letzten Spieltage nach, als wären sie noch nicht gespielt: Für jede Woche wird das Modell nur mit den Spielen davor trainiert. So siehst du, wie gut die Prozentwerte wirklich treffen.${isHockey() ? '' : ' Gerechnet werden die gewählten Ligen, höchstens acht auf einmal.'}</p></div>`;
    if (S.checkRunning) return intro + `<div class="empty"><p>${esc(S.checkProgress)}</p></div>`;
    const check = S.check[S.sport];
    if (!check) return intro + '<div class="empty"><button class="btn" data-action="run-check">Rückblick berechnen</button></div>';

    const ev = check.total;
    const row = (label, e) => {
      const vals = [e.model, e.hist || null, e.base];
      const best = Math.min(...vals.filter((v) => v));
      const cell = (v) => `<td class="num${v && Math.abs(v - best) < 1e-9 ? ' best' : ''}">${v ? dec(v, 3) : '–'}</td>`;
      return `<tr><th scope="row">${esc(label)}</th><td class="num">${e.n}</td><td class="num">${e.rate != null ? pct(e.rate) : '–'}</td>${cell(e.model)}${cell(e.hist)}${cell(e.base)}</tr>`;
    };
    const table = (evl) => `<table class="list"><thead><tr><th scope="col">Ereignis</th><th scope="col" class="num">Spiele</th><th scope="col" class="num">Eingetreten</th>
      <th scope="col" class="num">Modell</th><th scope="col" class="num">Letzte 10</th><th scope="col" class="num">Ligaschnitt</th></tr></thead>
      <tbody>${Object.entries(evl.markets).map(([k, e]) => row(CHECK_LABEL[k] || k, e)).join('')}
      ${evl.x12 ? row('Sieg, Remis, Niederlage', { n: evl.x12.n, rate: null, model: evl.x12.model, hist: evl.x12.hist, base: evl.x12.base }) : ''}</tbody></table>`;

    const calib = (k) => {
      const e = ev.markets[k];
      if (!e) return '';
      return `<div class="calib"><h4>${esc(CHECK_LABEL[k] || k)}</h4>
        <table class="list"><thead><tr><th scope="col">Prognose</th><th scope="col" class="num">Spiele</th><th scope="col">Vorhergesagt und tatsächlich</th></tr></thead><tbody>
        ${e.buckets.map((x, i) => x.n < 5 ? '' : `<tr><th scope="row" class="nowrap">${i * 10}–${i * 10 + 10}\u202F%</th><td class="num">${x.n}</td>
          <td><div class="cal"><span class="cal-pred" style="--w:${Math.round(x.p / x.n * 100)}%"></span><span class="cal-real" style="--w:${Math.round(x.hit / x.n * 100)}%"></span></div>
          <span class="small">${pct(x.p / x.n)} vorhergesagt, ${pct(x.hit / x.n)} eingetreten</span></td></tr>`).join('')}
        </tbody></table></div>`;
    };

    const accuracy = isHockey() ? ev.correct : (ev.x12 && ev.x12.correct);
    const perLeague = check.leagues ? `<section><h3>Nach Liga</h3><div class="three-col">${(check.ids || []).map((id) =>
      `<div><h4>${esc(LEAGUE[id] ? LEAGUE[id].name : id)}</h4><div class="table-wrap">${table(check.leagues[id])}</div></div>`).join('')}</div></section>` : '';

    return intro + `
      <p class="notice">Zeitraum: Saison ${seasonLabel(check.from)} bis heute, ${ev.n} Spiele. Gezeigt wird der Brier-Score: Je kleiner, desto besser. Der beste Wert pro Zeile ist markiert.${accuracy != null ? ` Treffsicherheit beim Sieger: ${pct(accuracy)}.` : ''}</p>
      <section><h3>${isHockey() ? 'NHL' : 'Alle gewählten Ligen zusammen'}</h3><div class="table-wrap">${table(ev)}</div></section>
      <section><h3>Kalibrierung</h3><p class="small">Wenn das Modell gut kalibriert ist, liegen beide Balken etwa gleich lang.</p>
        <div class="two-col">${calib(isHockey() ? 'o55' : 'o25')}${calib('btts')}</div></section>
      ${perLeague}
      <div class="empty"><button class="btn btn-quiet" data-action="run-check">Neu berechnen</button></div>`;
  }

  /* ---------- Rahmen ---------- */

  const VIEWS = {
    spiele: ['Spiele', renderSpiele],
    kombi: ['Schürfkombi', renderKombi],
    statistiken: ['Statistiken', renderStatistiken],
    ligen: ['Ligen', renderLigen],
    torschuetzen: ['Torschützen', renderTorschuetzen],
    check: ['Modell-Check', renderCheck]
  };

  function renderChrome() {
    const sp = sport();
    document.documentElement.dataset.sport = S.sport;
    $('#brand-mark').innerHTML = BRAND_MARK[S.sport];
    $('#brand-name').textContent = sp.brand;
    document.title = sp.title;
    const fav = $('#favicon');
    if (fav) fav.setAttribute('href', `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>${FAVICON[S.sport]}</text></svg>`);
    $('#sportswitch').innerHTML = Object.values(SPORTS).map((x) =>
      `<button data-sport="${x.id}" aria-pressed="${x.id === S.sport}">${esc(x.label)}</button>`).join('');
    $('#nav').innerHTML = Object.entries(VIEWS).map(([id, [label]]) =>
      `<a href="#${id}" ${S.view === id ? 'aria-current="page"' : ''}>${esc(label)}</a>`).join('');
    const st = store();
    const el = $('#status');
    if (el && st.ds) {
      const gen = isHockey() && st.meta ? Date.parse(st.meta.generated) : null;
      el.textContent = gen
        ? `Daten: ${fmtDate(gen, true)} ${fmtTime(gen)} Uhr`
        : `Stand ${fmtTime(st.dataTime)} Uhr${st.stale ? ', teils aus dem Zwischenspeicher' : ''}`;
    }
    $('#source-note').innerHTML = isHockey()
      ? 'Spieldaten: <a href="https://www.nhl.com" rel="noopener">NHL</a>, über die öffentliche Schnittstelle der Liga. Alle Werte sind statistische Schätzungen aus vergangenen Spielen und keine Garantie für den Ausgang.'
      : 'Spieldaten: <a href="https://www.openligadb.de" rel="noopener">OpenLigaDB</a>, von einer Community gepflegt. Alle Werte sind statistische Schätzungen aus vergangenen Spielen und keine Garantie für den Ausgang.';
  }

  function render() {
    renderChrome();
    const main = $('#main');
    const st = store();
    if (st.error) {
      main.innerHTML = isHockey()
        ? `<div class="empty error"><p>Die NHL-Daten konnten nicht geladen werden. Sie liegen im Ordner <code>data/nhl</code> und werden vom GitHub-Actions-Job „NHL-Daten aktualisieren“ erzeugt. Starte den Job einmal von Hand (Reiter Actions, dann „Run workflow“).</p>
          <p class="small">${location.protocol === 'file:' ? 'Hinweis: Beim Öffnen per Doppelklick sperrt der Browser lokale Dateien. Der Eishockey-Modus braucht die Seite über GitHub Pages oder einen lokalen Server.' : ''}</p>
          <button class="btn" data-action="reload">Erneut versuchen</button></div>`
        : `<div class="empty error"><p>OpenLigaDB ist gerade nicht erreichbar, deshalb konnten keine Spieldaten geladen werden. Prüfe die Internetverbindung und lade die Daten neu.</p>
          <button class="btn" data-action="reload">Daten neu laden</button></div>`;
      return;
    }
    if (!st.ds) { main.innerHTML = '<div class="empty loading"><div class="ball" aria-hidden="true"></div><p>Daten werden geladen …</p></div>'; return; }
    const scroll = window.scrollY;
    main.innerHTML = VIEWS[S.view][1]();
    window.scrollTo(0, scroll);
  }

  /* ---------- Ereignisse ---------- */

  function onClick(e) {
    const t = e.target.closest('button, tr.match, tr.linkrow, a');
    if (!t) return;
    if (t.matches('[data-sport]')) { switchSport(t.dataset.sport); return; }
    if (t.closest && t.closest('summary')) { S.pickerOpen = !S.pickerOpen; return; }
    if (t.matches('[data-day]')) { S.day = +t.dataset.day; S.allDays = false; S.open.clear(); savePrefs(); render(); return; }
    if (t.matches('[data-league]')) {
      const lg = t.dataset.league;
      if (S.leagues.has(lg) && S.leagues.size > 1) S.leagues.delete(lg); else S.leagues.add(lg);
      S.leaguesPref = true;
      savePrefs(); render(); return;
    }
    if (t.matches('[data-pick]')) {
      const mode = t.dataset.pick;
      S.leagues = new Set(mode === 'de' ? GERMAN : mode === 'top' ? TOP_LEAGUES.filter((id) => LEAGUE[id]) : footballLeagues().map((l) => l.id));
      if (!S.leagues.size) S.leagues = new Set(GERMAN);
      S.leaguesPref = true;
      S.pickerOpen = true;
      savePrefs(); render(); return;
    }
    if (t.matches('[data-scope]')) { S.kombi.scope = t.dataset.scope; savePrefs(); render(); return; }
    if (t.matches('[data-mode]')) { S.mode = t.dataset.mode; savePrefs(); render(); return; }
    if (t.matches('[data-table]')) { S.tableLeague = t.dataset.table; S.tableSort = { key: 'pos', dir: 1 }; render(); return; }
    if (t.matches('[data-scorers]')) { S.scorerLeague = t.dataset.scorers; render(); return; }
    if (t.matches('[data-sort]')) {
      const k = t.dataset.sort;
      S.tableSort = S.tableSort.key === k ? { key: k, dir: -S.tableSort.dir } : { key: k, dir: +t.dataset.dir };
      render(); return;
    }
    if (t.matches('[data-action="next-day"]')) {
      const today = dayStart(Date.now());
      const lgs = activeLeagues();
      const next = store().ds.matches.find((m) => lgs.has(m.lg) && m.t >= addDays(today, S.day + 1));
      if (next) {
        const off = Math.round((dayStart(next.t) - today) / DAY);
        if (off <= 5) { S.day = off; render(); }
        else $('#main').insertAdjacentHTML('afterbegin', `<p class="notice">Das nächste Spiel ist am ${fmtDay(next.t)}.</p>`);
      }
      return;
    }
    if (t.matches('[data-action="reload"]') || t.matches('[data-action="refresh"]')) { start(true); return; }
    if (t.matches('[data-action="run-check"]')) { runCheck(); return; }
    if (t.matches('tr.match')) { toggleMatch(+t.dataset.match); return; }
    if (t.matches('tr.linkrow')) gotoMatch(+t.dataset.goto);
  }

  function switchSport(id) {
    if (!SPORTS[id] || id === S.sport) return;
    S.sport = id;
    S.day = null;
    S.open.clear();
    S.tableSort = { key: 'pos', dir: 1 };
    savePrefs();
    if (!store().ds && !store().loading) start(false);
    else render();
  }

  function toggleMatch(id) {
    if (S.open.has(id)) S.open.delete(id); else S.open.add(id);
    render();
  }

  function gotoMatch(id) {
    const m = store().ds.matches.find((x) => x.id === id);
    if (!m) return;
    const off = Math.round((dayStart(m.t) - dayStart(Date.now())) / DAY);
    S.allDays = off < -1 || off > 5;
    S.day = clamp(off, -1, 5);
    S.open.add(id);
    const scrollToRow = () => {
      const row = document.querySelector(`tr.match[data-match="${id}"]`);
      if (row) { row.scrollIntoView({ block: 'start' }); row.focus({ preventScroll: true }); }
    };
    if (location.hash === '#spiele') { render(); scrollToRow(); }
    else {
      window.addEventListener('hashchange', () => setTimeout(scrollToRow, 0), { once: true });
      location.hash = '#spiele';
    }
  }

  function onChange(e) {
    const t = e.target, s = stat();
    if (t.matches && t.matches('input[type="checkbox"][data-league]')) {
      const lg = t.dataset.league;
      if (t.checked) S.leagues.add(lg); else S.leagues.delete(lg);
      if (!S.leagues.size) { S.leagues.add(lg); t.checked = true; }
      S.leaguesPref = true;
      S.pickerOpen = true;
      savePrefs(); render(); return;
    }
    if (t.matches && t.matches('[data-table-select]')) { S.tableLeague = t.value; S.tableSort = { key: 'pos', dir: 1 }; render(); return; }
    if (t.matches && t.matches('[data-scorers-select]')) { S.scorerLeague = t.value; render(); return; }
    if (t.id === 'stat1') { s.s1 = t.value; savePrefs(); render(); }
    if (t.id === 'stat2') { s.s2 = t.value; savePrefs(); render(); }
    if (t.id === 'statMarket') { s.top = t.value; savePrefs(); render(); }
    if (t.id === 'allDays') { S.allDays = t.checked; savePrefs(); render(); }
    if (t.id === 'kombiLegs') { S.kombi.legs = +t.value; savePrefs(); render(); }
    if (t.id === 'kombiOdds') { S.kombi.minOdds = +t.value; savePrefs(); render(); }
  }

  function onKey(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const t = e.target;
    if (t.matches && t.matches('tr.match')) {
      e.preventDefault();
      const id = +t.dataset.match;
      toggleMatch(id);
      const row = document.querySelector(`tr.match[data-match="${id}"]`);
      if (row) row.focus({ preventScroll: true });
    } else if (t.matches && t.matches('tr.linkrow')) {
      e.preventDefault();
      gotoMatch(+t.dataset.goto);
    }
  }

  function onHash() {
    const v = location.hash.replace('#', '');
    S.view = VIEWS[v] ? v : 'spiele';
    render();
  }

  async function start(force) {
    const st = store();
    st.error = null;
    st.loading = true;
    render();
    const btn = $('#refresh');
    if (btn) btn.disabled = true;
    try {
      if (isHockey()) await loadHockey();
      else await loadFootball(force);
    } catch (err) {
      if (!st.ds) st.error = err;
    }
    st.loading = false;
    if (btn) btn.disabled = false;
    render();
  }

  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  document.addEventListener('error', (e) => {
    if (e.target && e.target.classList && e.target.classList.contains('crest')) {
      e.target.replaceWith(Object.assign(document.createElement('span'), { className: 'crest crest-empty' }));
    }
  }, true);
  window.addEventListener('hashchange', onHash);

  loadPrefs();
  const v0 = location.hash.replace('#', '');
  S.view = VIEWS[v0] ? v0 : 'spiele';
  start(false);
  setInterval(() => {
    const st = store();
    if (document.visibilityState === 'visible' && st.ds && !st.loading && Date.now() - st.dataTime > CURRENT_TTL) start(false);
  }, 60000);
})();

</script>
</body>
</html>
