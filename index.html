  /* ---------- Backtest ----------
     Friert Tore-Kombi, Tageskombi und Kassenzettel an dem Kalendertag ein, an dem
     sie zum ersten Mal angezeigt werden (lokale Zeit), und wertet später aus jeder
     Momentaufnahme aus, ob die einzelnen Tipps eingetroffen sind. Die Historie liegt
     nur in diesem Browser, es gibt keinen Server, der das speichert. */
  const BACKTEST_KEY = 'schnockstats:backtest:v1';
  const BT_KIND = { tore: 'Tore-Kombi', haus: 'Tageskombi', bon: 'Kassenzettel', tbon: 'Tagesbon', bbon: 'Boost-Bon', sieg: 'Siegerkombi', get batt() { return 'Batterie ' + lineTag(); }, battb: 'Batterie Boost' };
  const BT_KINDS = ['tore', 'haus', 'bon', 'tbon', 'bbon', 'sieg', 'batt', 'battb'];
  // Aufbewahrung: Der Speicher des Browsers ist klein (meist rund 5 MB für die
  // ganze Seite) und wird hier mit Spieldaten geteilt. Darum fliegen alte
  // Einträge automatisch raus: alles älter als ein halbes Jahr, und je Sportart
  // und Art bleiben höchstens 120 Kombis stehen (die jüngsten).
  const BT_KEEP_DAYS = 183;
  const BT_KEEP_MAX = 120;

  function dateKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function loadBacktest() { return readJSON(BACKTEST_KEY) || {}; }
  function saveBacktest(all) { return writeJSON(BACKTEST_KEY, all); }

  // Räumt alte Einträge weg. Gibt zurück, wie viele entfernt wurden.
  function pruneBacktest(all) {
    const cutoff = dateKey(Date.now() - BT_KEEP_DAYS * DAY);
    let removed = 0;
    for (const sp of Object.keys(all)) {
      for (const kind of Object.keys(all[sp])) {
        const bucket = all[sp][kind];
        for (const key of Object.keys(bucket)) if (key < cutoff) { delete bucket[key]; removed++; }
        const keys = Object.keys(bucket).sort();
        for (const key of keys.slice(0, Math.max(0, keys.length - BT_KEEP_MAX))) { delete bucket[key]; removed++; }
        if (!Object.keys(bucket).length) delete all[sp][kind];
      }
      if (!Object.keys(all[sp]).length) delete all[sp];
    }
    return removed;
  }

  function btSavedToday(kind, suffix) {
    const all = loadBacktest();
    const bucket = (all[S.sport] && all[S.sport][kind]) || {};
    return bucket[dateKey(Date.now()) + (suffix ? '#' + suffix : '')] || null;
  }

  // Legt je Sportart, Art und Kalendertag eine Momentaufnahme an. Speicherst du
  // am selben Tag erneut, ersetzt die neue Einstellung die alte, solange die
  // Spiele noch nicht gelaufen sind.
  function snapshotCombo(kind, legs, extra, suffix) {
    if (!legs || !legs.length) return false;
    const all = loadBacktest();
    const spBucket = all[S.sport] || (all[S.sport] = {});
    const bucket = spBucket[kind] || (spBucket[kind] = {});
    const product = legs.reduce((a, r) => a / r.p, 1);
    const prob = legs.reduce((a, r) => a * r.p, 1);
    bucket[dateKey(Date.now()) + (suffix ? '#' + suffix : '')] = Object.assign({
      savedAt: Date.now(), product, prob,
      legs: legs.map((r) => {
        const o = { mid: r.m.id, lg: r.m.lg, h: r.m.h, a: r.m.a, t: r.m.t, id: r.id, p: r.p };
        if (r.pm != null && !isNaN(r.pm)) o.pm = Math.round(r.pm * 10000) / 10000;   // Rohwert des Modells, zum späteren Vergleich
        if (r.pk != null) o.pk = Math.round(r.pk * 10000) / 10000;                    // Marktwert, falls vorhanden
        if (r.odds != null) o.o = r.odds;                                              // geschätzte Buchmacherquote (Boost-Bon)
        return o;
      })
    }, extra || {});
    pruneBacktest(all);
    return saveBacktest(all);
  }

  // Stellt die aktuell gezeigte Kombi noch einmal zusammen, damit beim Tippen
  // genau das gespeichert wird, was gerade auf dem Schirm steht.
  function currentCombo(kind, suffix) {
    if (kind === 'battb') {
      const { packs, label } = battBPacks();
      const pack = packs[(+suffix || 1) - 1], B = S.kasseBoost;
      return pack && pack.length
        ? { legs: pack.map((r) => ({ m: r.m, id: r.id, p: r.p, pm: r.pm, pk: r.pk, odds: r.odds })),
            extra: { label, nr: +suffix || 1, range: S.battB.range, order: S.battB.order, cal: S.kasseTag.cal, qodds: B.odds, min: B.min, margin: B.margin, boost: B.boost,
              product: pack.reduce((a, r) => a * r.odds, 1) } }
        : null;
    }
    if (kind === 'batt') {
      const { packs, label } = battPacks();
      const pack = packs[(+suffix || 1) - 1];
      return pack && pack.length
        ? { legs: pack.map((r) => ({ m: r.m, id: r.id, p: r.p, pm: r.pm, pk: r.pk })), extra: { label, nr: +suffix || 1, range: S.batt.range, min: S.batt.min, order: S.batt.order, cal: S.kasseTag.cal } }
        : null;
    }
    if (kind === 'tore') {
      const g = goalCombo();
      return g ? { legs: g.legs, extra: { label: g.label } } : null;
    }
    if (kind === 'haus') {
      const h = houseCombo();
      return h ? { legs: h.legs, extra: { label: h.label } } : null;
    }
    if (kind === 'sieg') {
      const { combo, label } = siegerList();
      return combo.length
        ? { legs: combo.map((r) => ({ m: r.m, id: r.id, p: r.p, pm: r.pm, pk: r.pk })), extra: { label, range: S.sieger.range, min: S.sieger.min, n: S.sieger.n, cal: S.kasseTag.cal } }
        : null;
    }
    if (kind === 'bbon') {
      const { posten, label } = boostPosten();
      const B = S.kasseBoost;
      return posten.length
        ? { legs: posten.map((r) => ({ m: r.m, id: r.id, p: r.p, pm: r.pm, pk: r.pk, odds: r.odds })),
            extra: { label, range: S.kasseTag.range, cal: S.kasseTag.cal, qodds: B.odds, min: B.min, margin: B.margin, boost: B.boost, sel: B.sel, goal: B.goal,
              product: posten.reduce((a, r) => a * r.odds, 1) } }
        : null;
    }
    if (kind === 'tbon') {
      const { posten, label } = tagesbonPosten();
      return posten.length
        ? { legs: posten.map((r) => ({ m: r.m, id: r.id, p: r.p, pm: r.pm, pk: r.pk })), extra: { label, range: S.kasseTag.range, min: S.kasseTag.min, ev: S.kasseTag.ev, sel: S.kasseTag.sel, goal: S.kasseTag.goal, cal: S.kasseTag.cal } }
        : null;
    }
    const L = KASSE_LINE[S.sport];
    const { posten, label } = kassePosten();
    return posten.length
      ? { legs: posten.map((r) => ({ m: r.m, id: L.id, p: r.p })), extra: { label, range: S.kasse.range, min: S.kasse.min } }
      : null;
  }

  function btSaveButton(kind, suffix, compact) {
    const saved = btSavedToday(kind, suffix);
    const label = saved ? 'Für heute gespeichert · mit dieser Einstellung ersetzen' : 'Für Backtest speichern';
    return `<div class="bt-save">
      <button type="button" class="btn btn-quiet bt-save-btn${saved ? ' is-saved' : ''}" data-bt-save="${kind}"${suffix ? ` data-bt-suffix="${suffix}"` : ''}>
        <span class="bt-save-ic" aria-hidden="true">${saved ? '✓' : '＋'}</span>${esc(compact ? (saved ? 'Im Backtest gespeichert · ersetzen' : 'Für Backtest speichern') : label)}
      </button>
      ${compact ? '' : `<span class="bt-save-hint">${saved
        ? `Gespeichert um ${fmtTime(saved.savedAt)} Uhr. Im <a href="#backtest">Backtest</a> siehst du später, was getroffen hat.`
        : 'Erst alles wie gewünscht einstellen, dann ablegen. Die Kombi wird genau so eingefroren.'}</span>`}
    </div>`;
  }

  // Ergebnis eines einzelnen Tipps: Das Spiel wird in den aktuell geladenen Daten
  // gesucht (die laufen unabhängig von der Liga-Auswahl immer vollständig mit).
  function legOutcome(leg) {
    const list = store().ds && store().ds.matches;
    const m = list && list.find((x) => x.id === leg.mid);
    if (!m) return { state: 'unknown', leg };
    if (!m.fin) return { state: 'pending', leg, m };
    const oc = outcomeOf(m, leg.id);
    return { state: oc == null ? 'unknown' : oc ? 'hit' : 'miss', leg, m };
  }

  // Eine Kombi gilt als Ganzes schon als daneben, sobald ein einziges Bein kippt,
  // auch wenn andere Spiele dieser Kombi noch laufen. Erst wenn kein Bein daneben
  // liegt und alle durch sind, gilt die ganze Kombi als Treffer.
  function comboStatus(entry) {
    const details = (entry.legs || []).map(legOutcome);
    let hit = 0, miss = 0, pending = 0, unknown = 0;
    for (const d of details) {
      if (d.state === 'hit') hit++;
      else if (d.state === 'miss') miss++;
      else if (d.state === 'pending') pending++;
      else unknown++;
    }
    const state = miss > 0 ? 'miss' : pending > 0 ? 'pending' : unknown > 0 ? 'unknown' : 'hit';
    return { details, hit, miss, pending, unknown, state, total: details.length };
  }

  function btSummary(kind) {
    const all = loadBacktest();
    const bucket = (all[S.sport] && all[S.sport][kind]) || {};
    const keys = Object.keys(bucket).sort();
    const resolved = [];
    // Einzelne Posten: Wie viele sind eingetroffen, und was war angesagt?
    let legN = 0, legHit = 0, legP = 0, rawN = 0, rawHit = 0, rawP = 0;
    for (const k of keys) {
      const st = comboStatus(bucket[k]);
      if (st.state === 'hit' || st.state === 'miss') resolved.push(st.state);
      for (const d of st.details) {
        if (d.state !== 'hit' && d.state !== 'miss') continue;
        const y = d.state === 'hit' ? 1 : 0;
        legN++; legHit += y; legP += d.leg.p;
        if (d.leg.pm != null) { rawN++; rawHit += y; rawP += d.leg.pm; }
      }
    }
    let streak = 0;
    for (let i = resolved.length - 1; i >= 0 && resolved[i] === 'hit'; i--) streak++;
    const hit = resolved.filter((s) => s === 'hit').length;
    return { total: keys.length, resolved: resolved.length, hit, streak, rate: resolved.length ? hit / resolved.length : null,
      legN, legHit, legAvg: legN ? legP / legN : null, rawN, rawAvg: rawN ? rawP / rawN : null, rawRate: rawN ? rawHit / rawN : null };
  }

  function btCard(kind) {
    const s = btSummary(kind);
    return `<div class="bt-card">
      <div class="bt-card-head">${esc(BT_KIND[kind])}</div>
      <div class="bt-card-num">${s.rate != null ? pct(s.rate) : '–'}</div>
      <div class="bt-card-sub">${s.resolved ? `${s.hit} von ${s.resolved} ausgewerteten Tagen getroffen` : (s.total ? 'noch keine davon ausgewertet' : 'noch keine gesichert')}</div>
      ${s.streak > 1 ? `<div class="bt-card-streak">${s.streak}\u00d7 in Folge getroffen</div>` : ''}
      ${s.legN ? `<div class="bt-card-legs">Einzelne Posten: <b>${s.legHit} von ${s.legN}</b> getroffen (${pct(s.legHit / s.legN)}), angesagt Ø ${pct(s.legAvg)}${s.rawN >= 10 ? `, Modell roh Ø ${pct(s.rawAvg)}` : ''}</div>` : ''}
    </div>`;
  }

  const BT_STATE_LABEL = { hit: 'Getroffen', miss: 'Daneben', pending: 'Läuft noch', unknown: 'Unklar' };

  function btLegLine(d) {
    const { leg, state, m } = d;
    const market = sport().market[leg.id];
    const label = (market && market.label) || tbLabel(leg.id);
    const th = m ? team(m.h).s : team(leg.h).s;
    const ta = m ? team(m.a).s : team(leg.a).s;
    const lg = LEAGUE[leg.lg] ? LEAGUE[leg.lg].short : '';
    const mark = state === 'hit' ? '<span class="mark hit">✓</span>' : state === 'miss' ? '<span class="mark miss">✗</span>' : '<span class="muted">…</span>';
    return `<li class="bt-leg bt-leg-${state}">
      <span class="bt-leg-mk">${mark}</span>
      <span class="bt-leg-ev">${esc(label)}</span>
      <span class="bt-leg-match">${esc(th)} – ${esc(ta)}<span class="muted"> ${esc(lg)}, ${fmtDay(leg.t)}</span></span>
      <span class="bt-leg-p">${pct(leg.p)}${leg.o ? ` · ≈${dec(leg.o, 2)}` : ''}</span>
    </li>`;
  }

  function btDay(row) {
    const { kind, key, entry } = row;
    const st = comboStatus(entry);
    const d = new Date(key.slice(0, 10) + 'T00:00:00');
    const prodTxt = entry.product != null && isFinite(entry.product) ? dec(entry.product, 2) : null;
    return `<details class="bt-day bt-day-${st.state}">
      <summary>
        <span class="bt-badge">${esc(BT_KIND[kind])}${key.length > 10 ? ' ' + esc(key.slice(11)) : ''}</span>
        <span class="bt-date">${esc(fmtDay(d.getTime()))}</span>
        <span class="bt-state bt-state-${st.state}">${esc(BT_STATE_LABEL[st.state])}</span>
        ${prodTxt ? `<span class="bt-odds">Quote ${prodTxt}</span>` : ''}
        <span class="bt-count">${st.hit}/${st.total}</span>
      </summary>
      <ul class="bt-legs">${st.details.map(btLegLine).join('')}</ul>
      <div class="bt-day-foot">
        <span>Gespeichert am ${esc(fmtDay(entry.savedAt))} um ${fmtTime(entry.savedAt)} Uhr</span>
        <button type="button" class="btn btn-quiet bt-del" data-bt-del="${kind}|${key}">Eintrag löschen</button>
      </div>
    </details>`;
  }

  function btHistory() {
    const all = loadBacktest();
    const sp = all[S.sport] || {};
    const kinds = S.btKind === 'alle' ? BT_KINDS : [S.btKind];
    const rows = [];
    for (const kind of kinds) {
      const bucket = sp[kind] || {};
      for (const key of Object.keys(bucket)) rows.push({ kind, key, entry: bucket[key] });
    }
    if (!rows.length) {
      return '<div class="empty"><p>Für diese Auswahl liegt noch keine gesicherte Kombi vor. Schau dir Tore-Kombi, Tageskombi oder Kassenzettel an, dann merkt sich die Seite die jeweils erste Ansicht des Tages von selbst.</p></div>';
    }
    // Neueste Tage zuerst, innerhalb eines Tages Batterie 1, 2, 3 in dieser Reihenfolge
    rows.sort((a, b) => b.key.slice(0, 10).localeCompare(a.key.slice(0, 10)) || (parseInt(a.key.slice(11), 10) || 0) - (parseInt(b.key.slice(11), 10) || 0) || a.kind.localeCompare(b.kind));
    return `<div class="bt-list">${rows.map(btDay).join('')}</div>`;
  }

  function renderBacktest() {
    const head = `<div class="page-head"><h2>Backtest</h2>
      <p>Bei Tore-Kombi, Tageskombi und Kassenzettel legst du mit dem Knopf „Für Backtest speichern“ die Kombi ab, die gerade auf dem Schirm steht. Stell also erst alles ein, wie du es möchtest. Sobald die Spiele durch sind, siehst du hier, was getroffen hat. Eine Kombi gilt als Ganzes erst dann als Treffer, wenn kein einziges Bein daneben lag.</p></div>`;
    const cards = `<div class="bt-cards">${BT_KINDS.map(btCard).join('')}</div>`;
    const toolbar = `<div class="toolbar"><div class="segmented bt-filter" role="group" aria-label="Art">
      <button data-bt-kind="alle" aria-pressed="${S.btKind === 'alle'}">Alle</button>

  // Große Kennzahlen zählen beim ersten Erscheinen einmal hoch.
  function runCountUps() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (const el of document.querySelectorAll('[data-count]:not([data-counted])')) {
      const target = parseFloat(el.dataset.count);
      if (isNaN(target)) continue;
      el.dataset.counted = '1';
      const dec2 = el.dataset.count.indexOf('.') >= 0;
      const start = performance.now();
      const dur = 620;
      const step = (now) => {
        const t = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - t, 3);
        const v = target * eased;
        el.textContent = dec2 ? dec(v, 2) : String(Math.round(v));
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
  }

  /* Kleine Aufmerksamkeiten: Zahlen zählen beim ersten Erscheinen hoch,
     Listen bauen sich gestaffelt auf. Beides läuft nur einmal je Element. */
  function animateNumbers() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('[data-countup]').forEach((el) => {
      if (el.dataset.counted) return;
      el.dataset.counted = '1';
      const target = parseFloat(el.dataset.countup);
      if (isNaN(target)) return;
      const decimals = (el.dataset.countupDecimals | 0);
      const suffix = el.dataset.countupSuffix || '';
      const start = performance.now();
      const dur = 620;
      const step = (now) => {
        const t = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - t, 3);
        const v = target * eased;
        el.textContent = (decimals ? v.toFixed(decimals).replace('.', ',') : String(Math.round(v))) + suffix;
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }

  function staggerRows() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const rows = document.querySelectorAll('tbody tr.match:not([data-seen])');
    let i = 0;
    rows.forEach((row) => {
      row.dataset.seen = '1';
      if (i < 14) {
        row.style.animation = `rowIn 320ms ease-out ${i * 22}ms backwards`;
        i++;
      }
    });
  }

  function mountTorShow() {
    const host = document.getElementById('torshow');
    if (!host || !S.torShow || !window.TorShow) return;
    const { g, autoplay } = S.torShow;
    S.torShow.autoplay = false; // bei jedem weiteren Neuzeichnen gleich den Endstand zeigen
    const items = () => document.querySelectorAll('.gc-list li');
    window.TorShow.mount(host, {
      sport: S.sport, autoplay, sound: !!S.tsSound,
      legs: g.legs.map((r) => ({
        label: sport().market[r.id].label, match: `${team(r.m.h).s} – ${team(r.m.a).s}`,
        odds: fairOdds(r.p), oddsNum: 1 / r.p
      })),
      onGoal: (k, instant) => {
        const li = items()[k];
        if (!li) return;
        li.classList.add('scored');
        if (!instant) { li.classList.add('goal-now'); setTimeout(() => li.classList.remove('goal-now'), 1200); }
      },
      onReset: () => items().forEach((li) => li.classList.remove('scored', 'goal-now')),
      onSound: (on) => { S.tsSound = on; savePrefs(); }
    });
  }

  function render() {
    renderChrome();
    const main = $('#main');
    const st = store();
    if (st.error) {
      main.innerHTML = isHockey()
        ? `<div class="empty error"><p>Die NHL-Daten konnten nicht geladen werden. Sie liegen im Ordner <code>data/nhl</code> und werden vom GitHub-Actions-Job „NHL-Daten aktualisieren“ erzeugt. Starte den Job einmal von Hand (Reiter Actions, dann „Run workflow“).</p>
          <p class="small">${location.protocol === 'file:' ? 'Hinweis: Beim Öffnen per Doppelklick sperrt der Browser lokale Dateien. Der Eishockey-Modus braucht die Seite über GitHub Pages oder einen lokalen Server.' : ''}</p>
          <button class="btn" data-action="reload">Erneut versuchen</button></div>`
        : `<div class="empty error"><p>Die Spieldaten konnten gerade nicht geladen werden. Prüfe die Internetverbindung und lade die Daten neu.</p>
          <button class="btn" data-action="reload">Daten neu laden</button></div>`;
      return;
    }
    if (!st.ds) { main.innerHTML = '<div class="empty loading"><div class="ball" aria-hidden="true"></div><p>Daten werden geladen …</p></div>'; return; }
    const scroll = window.scrollY;
    // Scrollstand der offenen Ligaauswahl merken, sonst springt sie nach jedem Haken nach oben
    const lp = main.querySelector('.leaguepicker[open] .lp-panel');
    const lpScroll = lp ? lp.scrollTop : 0;
    main.innerHTML = VIEWS[S.view][1]();
    window.scrollTo(0, scroll);
    const lp2 = main.querySelector('.leaguepicker[open] .lp-panel');
    if (lp2 && lp) { lp2.style.animation = 'none'; lp2.scrollTop = lpScroll; }
    mountTorShow();
    runCountUps();
    animateNumbers();
    staggerRows();
  }

  /* ---------- Ereignisse ---------- */

  // Kurze Rückmeldung direkt am Knopf, damit man sieht, dass etwas passiert ist
  function flash(el, text) {
    if (!el) return;
    const old = el.querySelector('.bt-flash');
    if (old) old.remove();
    const tag = document.createElement('span');
    tag.className = 'bt-flash';
    tag.textContent = text;
    el.appendChild(tag);
    setTimeout(() => tag.remove(), 2200);
  }

  function onClick(e) {
    // Ligaauswahl schließen: Fertig-Knopf oder Tipp auf den abgedunkelten Hintergrund
    const pick = e.target.closest('.leaguepicker');
    if (pick && (e.target === pick || e.target.closest('[data-action="picker-close"]'))) {
      e.preventDefault();
      S.pickerOpen = false; pick.open = false;
      return;
    }
    const act = e.target.closest('[data-action]');
    if (act && act.dataset.action === 'b365') {
      S.b365 = !S.b365; savePrefs(); applyB365();
      document.querySelectorAll('.bon-b365-toggle').forEach((b) => b.setAttribute('aria-pressed', String(S.b365)));
      return;
    }
    if (act && act.dataset.action === 'bwin') {
      S.bwin = !S.bwin; savePrefs(); applyBwin();
      document.querySelectorAll('.bon-bwin-toggle').forEach((b) => b.setAttribute('aria-pressed', String(S.bwin)));
      return;
    }
    if (act && act.dataset.action === 'bwin-copy') {
      const done = (txt) => { act.textContent = txt; };
      if (navigator.clipboard) navigator.clipboard.writeText(BWIN_BOOKMARKLET).then(() => done('Kopiert ✓'), () => done('Kopieren ging nicht'));
      else done('Kopieren ging nicht');
      return;
    }
    // Der Lesezeichen-Knopf wird nur gezogen oder kopiert; hier angetippt hätte er nichts zu tun
    if (e.target.closest('.bon-bwin-bm')) { e.preventDefault(); return; }
    if (e.target.closest('.bon-bwin-box')) return;
    if (act && act.dataset.action === 'theme') {
      S.theme = S.theme === 'light' ? 'dark' : 'light';
      savePrefs(); applyTheme();
      const sheet = document.querySelector('.more-sheet'); if (sheet) sheet.remove();
      return;
    }
    if (act && act.dataset.action === 'more') { openMore(); return; }
    const sheet = e.target.closest('.more-sheet');
    if (sheet) {
      if (!e.target.closest('a, button')) { if (!e.target.closest('.more-panel')) sheet.remove(); return; }
      sheet.remove();
    }
    if (e.target.closest('.bon-b365')) return;
    const tip = e.target.closest('[data-tip]');
    if (tip) { gotoMatch(+tip.dataset.tip); return; }
    const t = e.target.closest('button, tr.match, tr.linkrow, a');
    if (!t) return;
    if (t.matches('[data-sport]')) { switchSport(t.dataset.sport); return; }
    if (t.closest && t.closest('summary')) { S.pickerOpen = !S.pickerOpen; return; }
    if (t.matches('[data-day]')) { S.day = +t.dataset.day; S.allDays = false; S.open.clear(); savePrefs(); render(); return; }
    if (t.matches('[data-league]')) {
      const lg = t.dataset.league, set = new Set(activeLeagues());
      if (set.has(lg) && set.size > 1) set.delete(lg); else set.add(lg);
      setSel(set);
      savePrefs(); render(); return;
    }
    if (t.matches('[data-pick]')) {
      const mode = t.dataset.pick;
      let ids = mode === 'de' ? GERMAN : mode === 'top' ? TOP_LEAGUES.filter((id) => LEAGUE[id])
        : mode === 'nhl' ? ['nhl'] : mode === 'eu' ? hockeyLeagues().map((l) => l.id).filter((id) => id !== 'nhl')
        : sportLeagues().map((l) => l.id);
      if (!ids.length) ids = sportLeagues().map((l) => l.id);
      setSel(new Set(ids));
      S.pickerOpen = true;
      savePrefs(); render(); return;
    }
    if (t.matches('[data-scope]')) { S.kombi.scope = t.dataset.scope; savePrefs(); render(); return; }
    if (t.matches('[data-goal-set]')) { S.goalSet = t.dataset.goalSet; savePrefs(); render(); return; }
    if (t.matches('[data-kasse-mode]')) { S.kasse.mode = t.dataset.kasseMode; S.kasseShown = false; savePrefs(); render(); return; }
    if (t.matches('[data-kasse-sel]')) { S.kasseTag.sel = t.dataset.kasseSel; S.kasseShown = false; savePrefs(); render(); return; }
    if (t.matches('[data-batt-range]')) { S.batt.range = t.dataset.battRange; S.kasseShown = false; savePrefs(); render(); return; }
    if (t.matches('[data-batt-played]')) {
      const scope = t.dataset.battScope || '';
      const { packs } = scope === 'boost' ? battBPacks() : battPacks(), pack = packs[+t.dataset.battPlayed - 1];
      if (!pack) return;
      const list = loadPlayed(scope);
      list.push({ ts: Date.now(), n: pack.length, keys: pack.map((r) => playedKey(scope, r)) });
      savePlayed(list, scope);
      render();
      return;
    }
    if (t.matches('[data-batt-undo]')) { const sc = t.dataset.battScope || ''; savePlayed(loadPlayed(sc).filter((g) => g.ts !== +t.dataset.battUndo), sc); render(); return; }
    if (t.matches('[data-batt-reset]')) { savePlayed([], t.dataset.battScope || ''); render(); return; }
    if (t.matches('[data-battb-range]')) { S.battB.range = t.dataset.battbRange; S.kasseShown = false; savePrefs(); render(); return; }
    if (t.matches('[data-sieger-range]')) { S.sieger.range = t.dataset.siegerRange; savePrefs(); render(); return; }
    if (t.matches('[data-boost-sel]')) { S.kasseBoost.sel = t.dataset.boostSel; S.kasseShown = false; savePrefs(); render(); return; }
    if (t.matches('[data-calib-run]')) { runCalibration(); return; }
    if (t.matches('[data-tag-range]')) { S.kasseTag.range = t.dataset.tagRange; S.kasseShown = false; savePrefs(); render(); return; }
    if (t.matches('[data-kasse-range]')) { S.kasse.range = t.dataset.kasseRange; savePrefs(); render(); return; }
    if (t.matches('[data-bt-kind]')) { S.btKind = t.dataset.btKind; savePrefs(); render(); return; }
    if (t.matches('[data-bt-save]')) {
      const kind = t.dataset.btSave, suffix = t.dataset.btSuffix || '';
      const combo = currentCombo(kind, suffix);
      if (!combo) { flash(t, 'Gerade nichts zum Speichern da'); return; }
      const ok = snapshotCombo(kind, combo.legs, combo.extra, suffix);
      if (!ok) { flash(t, 'Speicher voll, bitte im Backtest aufräumen'); return; }
      render();
      const again = document.querySelector(`[data-bt-save="${kind}"]${suffix ? `[data-bt-suffix="${suffix}"]` : ''}`);
      if (again) flash(again, 'Gespeichert');
      return;
    }
    if (t.matches('[data-bt-del]')) {
      const [kind, key] = t.dataset.btDel.split('|');
      const all = loadBacktest();
      if (all[S.sport] && all[S.sport][kind]) { delete all[S.sport][kind][key]; saveBacktest(all); render(); }
      return;
    }
    if (t.matches('[data-mode]')) { S.mode = t.dataset.mode; savePrefs(); render(); return; }
    if (t.matches('[data-table]')) { if (isHockey()) S.hTableLeague = t.dataset.table; else S.tableLeague = t.dataset.table; S.tableSort = { key: 'pos', dir: 1 }; render(); return; }
    if (t.matches('[data-sort]')) {
      const k = t.dataset.sort;
      S.tableSort = S.tableSort.key === k ? { key: k, dir: -S.tableSort.dir } : { key: k, dir: +t.dataset.dir };
      render(); return;
    }
    if (t.matches('[data-action="next-day"]')) {
      const today = dayStart(Date.now());
      const lgs = activeLeagues();
      const next = store().ds.matches.find((m) => lgs.has(m.lg) && m.t >= addDays(today, S.day + 1) && bettable(m));
      if (next) {
        const off = Math.round((dayStart(next.t) - today) / DAY);
        if (off <= 5) { S.day = off; render(); }
        else $('#main').insertAdjacentHTML('afterbegin', `<p class="notice">Das nächste Spiel ist am ${fmtDay(next.t)}.</p>`);
      }
      return;
    }
    if (t.matches('[data-action="reload"]') || t.matches('[data-action="refresh"]')) { start(true); return; }
    if (t.matches('[data-action="run-check"]')) { runCheck(); return; }
    if (t.matches('tr.match')) { toggleMatch(+t.dataset.match); return; }
    if (t.matches('tr.linkrow')) gotoMatch(+t.dataset.goto);
  }

  function switchSport(id) {
    if (!SPORTS[id] || id === S.sport) return;
    S.sport = id;
    S.day = null;
    S.open.clear();
    S.tableSort = { key: 'pos', dir: 1 };
    savePrefs();
    if (!store().ds && !store().loading) start(false);
    else { render(); maybeAutoCalib(); }
  }

  function toggleMatch(id) {
    if (S.open.has(id)) S.open.delete(id); else S.open.add(id);
    render();
  }

  function gotoMatch(id) {
    const m = store().ds.matches.find((x) => x.id === id);
    if (!m) return;
    const off = Math.round((dayStart(m.t) - dayStart(Date.now())) / DAY);
    S.allDays = off < -1 || off > 5;
    S.day = clamp(off, -1, 5);
    S.open.add(id);
    const scrollToRow = () => {
      const row = document.querySelector(`tr.match[data-match="${id}"]`);
      if (row) { row.scrollIntoView({ block: 'start' }); row.focus({ preventScroll: true }); }
    };
    if (location.hash === '#spiele') { render(); scrollToRow(); }
    else {
      window.addEventListener('hashchange', () => setTimeout(scrollToRow, 0), { once: true });
      location.hash = '#spiele';
    }
  }

  function onChange(e) {
    const t = e.target, s = stat();
    if (t.matches && t.matches('input[type="checkbox"][data-league]')) {
      const lg = t.dataset.league, set = new Set(activeLeagues());
      if (t.checked) set.add(lg); else set.delete(lg);
      if (!set.size) { set.add(lg); t.checked = true; }
      setSel(set);
      S.pickerOpen = true;
      savePrefs(); render(); return;
    }
    if (t.matches && t.matches('[data-table-select]')) { if (isHockey()) S.hTableLeague = t.value; else S.tableLeague = t.value; S.tableSort = { key: 'pos', dir: 1 }; render(); return; }
    if (t.id === 'stat1') { s.s1 = t.value; savePrefs(); render(); }
    if (t.id === 'stat2') { s.s2 = t.value; savePrefs(); render(); }
    if (t.id === 'statMarket') { s.top = t.value; savePrefs(); render(); }
    if (t.id === 'allDays') { S.allDays = t.checked; savePrefs(); render(); }
    if (t.id === 'kombiLegs') { S.kombi.legs = +t.value; savePrefs(); render(); }
    if (t.id === 'kombiOdds') { S.kombi.minOdds = +t.value; savePrefs(); render(); }
    if (t.id === 'kasseMin') { S.kasse.min = +t.value; savePrefs(); render(); }
    if (t.id === 'kasseTagMin') { S.kasseTag.min = +t.value; savePrefs(); render(); }
    if (t.id === 'kasseTagEv') { S.kasseTag.ev = t.value; savePrefs(); render(); }
    if (t.id === 'kasseGoal') { S.kasseTag.goal = +t.value; savePrefs(); render(); }
    if (t.id === 'kasseCal') { S.kasseTag.cal = t.value; savePrefs(); render(); }
    if (t.id === 'battBOrder') { S.battB.order = t.value; savePrefs(); render(); }
    if (t.id === 'battMin') { S.batt.min = +t.value; savePrefs(); render(); }
    if (t.id === 'battOrder') { S.batt.order = t.value; savePrefs(); render(); }
    if (t.id === 'siegerMin') { S.sieger.min = +t.value; savePrefs(); render(); }
    if (t.id === 'siegerN') { S.sieger.n = +t.value; savePrefs(); render(); }
    if (t.id === 'siegerBuffer') { S.sieger.buffer = +t.value; savePrefs(); render(); }
    if (t.id === 'boostOdds') { S.kasseBoost.odds = +t.value; savePrefs(); render(); }
    if (t.id === 'boostMin') { S.kasseBoost.min = +t.value; savePrefs(); render(); }
    if (t.id === 'boostMargin') { S.kasseBoost.margin = +t.value; savePrefs(); render(); }
    if (t.id === 'boostPct') { S.kasseBoost.boost = +t.value; savePrefs(); render(); }
    if (t.id === 'boostGoal') { S.kasseBoost.goal = +t.value; savePrefs(); render(); }
    if (t.id === 'goalLegs') { S.goalLegs = +t.value; savePrefs(); render(); }
    if (t.id === 'goalDays') { S.goalDays = t.value; savePrefs(); render(); }
    if (t.id === 'goalOdds') { S.goalMinOdds = +t.value; savePrefs(); render(); }
  }

  function onKey(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const t = e.target;
    if (t.matches && t.matches('tr.match')) {
      e.preventDefault();
      const id = +t.dataset.match;
      toggleMatch(id);
      const row = document.querySelector(`tr.match[data-match="${id}"]`);
      if (row) row.focus({ preventScroll: true });
    } else if (t.matches && t.matches('tr.linkrow')) {
      e.preventDefault();
      gotoMatch(+t.dataset.goto);
    }
  }

  function onHash() {
    const v = location.hash.replace('#', '');
    const prev = S.view;
    S.view = VIEWS[v] ? v : 'spiele';
    render();
    if (prev !== S.view) {
      const main = $('#main');
      main.classList.remove('view-enter'); void main.offsetWidth; main.classList.add('view-enter');
      window.scrollTo(0, 0);
    }
  }

  async function start(force) {
    const st = store();
    st.error = null;
    st.loading = true;
    render();
    const btn = $('#refresh');
    if (btn) { btn.disabled = true; btn.classList.add('is-busy'); }
    try {
      if (isHockey()) await loadHockey();
      else await loadFootball(force);
    } catch (err) {
      if (!st.ds) st.error = err;
    }
    st.loading = false;
    if (btn) { btn.disabled = false; btn.classList.remove('is-busy'); }
    render();
    maybeAutoCalib();
  }

  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  document.addEventListener('error', (e) => {
    if (e.target && e.target.classList && e.target.classList.contains('crest')) {
      e.target.replaceWith(Object.assign(document.createElement('span'), { className: 'crest crest-empty' }));
    }
  }, true);
  window.addEventListener('hashchange', onHash);

  loadPrefs();
  applyTheme();
  applyB365();
  applyBwin();
  // Als App vom Homebildschirm: kurzer Startbildschirm
  if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
    let shown = false;
    try { shown = sessionStorage.getItem('ss:splash') === '1'; sessionStorage.setItem('ss:splash', '1'); } catch (e) {}
    if (!shown) {
      const sp = document.createElement('div');
      sp.className = 'app-splash';
      sp.innerHTML = '<img src="schnockstats-icon-192.png?v=2a5decd8" alt=""><b>Schnockstats</b>';
      document.body.appendChild(sp);
      const t0 = Date.now();
      const hide = () => setTimeout(() => { sp.classList.add('is-leaving'); setTimeout(() => sp.remove(), 450); }, Math.max(0, 900 - (Date.now() - t0)));
      const wait = setInterval(() => { if (store().ds || store().error || Date.now() - t0 > 4000) { clearInterval(wait); hide(); } }, 150);
    }
  }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  const v0 = location.hash.replace('#', '');
  S.view = VIEWS[v0] ? v0 : 'spiele';
  start(false);
  setInterval(() => {
    const st = store();
    if (document.visibilityState === 'visible' && st.ds && !st.loading && Date.now() - st.dataTime > CURRENT_TTL) start(false);
  }, 60000);
})();

</script>
</body>
</html>
