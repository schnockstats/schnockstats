<html lang="de">

<title>Schnockstats – Fußballstatistik</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Schnockstats / SchnockHockey
   Ruhige Fläche, klare Kanten, Farbe nur dort, wo sie Information trägt:
   ein Signalton für Interaktion und fünf feste Ereignisfarben für die Tipps. */

:root {
  color-scheme: light;

  --canvas: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --raised: #ffffff;

  --line: #e3e6eb;
  --line-strong: #cbd1da;

  --ink: #0d1117;
  --ink-dim: #525b6b;
  --ink-faint: #7d8697;

  --accent: #2f6bff;
  --accent-soft: #5b8aff;
  --accent-ink: #ffffff;

  --win: #0f9d58;
  --draw: #aeb5c0;
  --loss: #e5484d;

  --c-goals: #e08700;
  --c-btts: #e5484d;
  --c-team: #0a9aa8;
  --c-half: #6b4dff;
  --c-range: #0f9d58;

  --bl1: #2f6bff;
  --bl2: #0a9aa8;
  --bl3: #6b4dff;
  --nhl: #00a3ad;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-full: 999px;

  --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Sora", "Archivo", system-ui, sans-serif;
  --shell: 1240px;
}

html[data-sport="eishockey"] {
  --accent: #00929c;
  --accent-soft: #00b0bc;
  --bl1: #00929c;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --canvas: #0e1114;
    --surface: #171b21;
    --surface-2: #1d222a;
    --raised: #1d222a;
    --line: #272d36;
    --line-strong: #3b434f;
    --ink: #edf0f4;
    --ink-dim: #9aa3b0;
    --ink-faint: #767f8c;
    --accent: #5b8aff;
    --accent-soft: #86a9ff;
    --accent-ink: #0b0f16;
    --draw: #49515f;
    --c-goals: #f5a524;
    --c-btts: #ff6369;
    --c-team: #21c7d4;
    --c-half: #9b85ff;
    --c-range: #3ecf8e;
  }
  :root[data-sport="eishockey"]:not([data-theme="light"]) {
    --accent: #21c7d4;
    --accent-soft: #5adbe4;
    --accent-ink: #04222b;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
/* Kein Nachfedern der ganzen Seite: auf dem iPhone zieht das Federn sonst die
   feste Leiste unten mit */
html, body { overscroll-behavior-y: none; }

body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* ---------- Kopfleiste ---------- */

.masthead {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--line);
}
.masthead-inner {
  max-width: var(--shell);
  margin: 0 auto;
  padding: 11px 22px;
  display: flex;
  align-items: center;
  gap: 10px 22px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -.035em;
  line-height: 1;
  color: var(--ink);
}
#brand-mark { display: flex; color: var(--accent); }
.brand svg { width: 24px; height: 24px; display: block; }

#nav { display: flex; gap: 2px; flex-wrap: wrap; }
#nav a {
  text-decoration: none;
  padding: 7px 12px;
  border-radius: var(--r-sm);
  font-size: 14.5px;
  font-weight: 500;
  color: var(--ink-dim);
}
#nav a:hover { color: var(--ink); background: var(--surface-2); }
#nav a[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); font-weight: 600; }

.masthead-status { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12.5px; }
#status { color: var(--ink-faint); }
#refresh {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  border-radius: var(--r-sm);
  padding: 6px 13px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
#refresh::before {
  content: "";
  width: 11px; height: 11px;
  border-radius: 50%;
  border: 2px solid currentColor;
  border-top-color: transparent;
  opacity: .45;
}
#refresh:hover { border-color: var(--accent); color: var(--accent); }
#refresh:disabled { opacity: .55; cursor: progress; }
#refresh.is-busy::before { animation: spin 700ms linear infinite; opacity: 1; }

.segmented {
  display: inline-flex;
  padding: 2px;
  gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
}
.segmented button {
  border: 0;
  background: transparent;
  color: var(--ink-dim);
  padding: 5px 12px;
  border-radius: 4px;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.segmented button:hover { color: var(--ink); }
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

main { max-width: var(--shell); margin: 0 auto; padding: 22px 22px 56px; }

/* ---------- Tagesleiste ---------- */

.daybar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.day {
  flex: 1 0 auto;
  min-width: 100px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 9px 13px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--ink-dim);
  cursor: pointer;
  text-align: left;
}
.day span { font-family: var(--font-display); font-weight: 600; font-size: 14.5px; color: var(--ink); white-space: nowrap; letter-spacing: -.02em; }
.day small { font-size: 11.5px; white-space: nowrap; }
.day[data-empty] span { color: var(--ink-faint); }
.day:hover { border-color: var(--line-strong); }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.day[aria-pressed="true"] span, .day[aria-pressed="true"] small { color: var(--accent-ink); }

/* ---------- Werkzeugleiste ---------- */

.toolbar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; justify-content: space-between; margin: 18px 0 14px; }
.toolbar-right { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-dim);
  border-radius: var(--r-sm);
  padding: 6px 13px;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
}
.chip:hover { color: var(--ink); border-color: var(--line-strong); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip-static { cursor: default; color: var(--ink); }

.select { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-faint); }
.select select {
  font-size: 14px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  min-width: 180px;
}
.select select:hover { border-color: var(--line-strong); }
.select-wide select { min-width: 240px; }

.check { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink-dim); padding-bottom: 8px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

.tabs { display: flex; gap: 6px; margin: 4px 0 16px; overflow-x: auto; }
.tab {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-dim);
  padding: 7px 14px;
  border-radius: var(--r-sm);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* ---------- Ligenauswahl ---------- */

.leaguepicker { position: relative; }
.leaguepicker > summary {
  list-style: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-sm);
  padding: 7px 15px;
  font-weight: 500;
  font-size: 13.5px;
}
.leaguepicker > summary::-webkit-details-marker { display: none; }
.leaguepicker > summary::after { content: "▾"; color: var(--ink-faint); }
.leaguepicker[open] > summary { border-color: var(--accent); color: var(--accent); }
.lp-panel {
  position: absolute;
  z-index: 30;
  margin-top: 8px;
  width: min(700px, 92vw);
  background: var(--raised);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  box-shadow: 0 18px 44px rgba(13, 17, 23, .14);
  padding: 16px 18px;
  max-height: 62vh;
  overflow-y: auto;
}
.lp-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.lp-head { display: none; }
@media (max-width: 900px) {
  .lp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: 0; z-index: 1; margin: 0 -14px 12px; padding: 14px 14px 10px; background: var(--raised); border-bottom: 1px solid var(--line); }
  .lp-head b { font-family: var(--font-display); font-size: 17px; }
  .lp-head .btn { padding: 8px 16px; }
  .lg-opt { padding: 8px 0; font-size: 15px; }
  .lg-opt input { width: 20px; height: 20px; }
}
.btn-sm { padding: 5px 12px; font-size: 12.5px; border-radius: var(--r-sm); cursor: pointer; }
.lp-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 20px; }
.lp-groups fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.lp-groups legend { font-size: 12px; font-weight: 600; color: var(--accent); padding: 0 0 4px; }
.lg-opt { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; font-size: 13.5px; color: var(--ink-dim); }
.lg-opt:hover { color: var(--ink); }
.lg-opt input { accent-color: var(--accent); width: 15px; height: 15px; flex: none; }

/* ---------- Tabellen ---------- */

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; }

.matches {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  border-collapse: separate;
  border-spacing: 0;
  overflow: hidden;
  min-width: 660px;
}
.matches col.c-time { width: 84px; }
.matches col.c-form { width: 80px; }
.matches col.c-stat { width: 104px; }
.matches thead th {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-faint);
  text-align: left;
  padding: 11px 12px;
  border-bottom: 1px solid var(--line);
}
.matches th.stat, .matches td.stat, .matches th.form, .matches td.form { text-align: center; }
.t-right { text-align: right !important; }

.group-row th {
  text-align: left;
  font-weight: 600;
  font-size: 13.5px;
  padding: 14px 12px 8px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  color: var(--ink);
}
.group-row th .muted { margin-left: 10px; font-weight: 400; font-size: 12.5px; }

.lg-badge {
  display: inline-block;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: var(--r-sm);
  margin-right: 10px;
  color: var(--ink-dim);
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line-strong);
}
.lg-bl1 { color: var(--bl1); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bl1) 45%, transparent); }
.lg-bl2 { color: var(--bl2); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bl2) 45%, transparent); }
.lg-bl3 { color: var(--bl3); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bl3) 45%, transparent); }
.lg-nhl { color: var(--nhl); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--nhl) 45%, transparent); }

tr.match { cursor: pointer; }
tr.match td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; transition: background 140ms ease; }
tr.match:hover td { background: var(--surface-2); }
tr.match.is-open td { background: color-mix(in srgb, var(--accent) 7%, var(--surface)); border-bottom-color: transparent; }

td.kick { white-space: nowrap; position: relative; }
td.kick::before {
  content: "";
  position: absolute;
  left: 0; top: 7px; bottom: 7px;
  width: 3px;
  border-radius: var(--r-full);
  background: var(--accent);
  transform: scaleY(0);
  transition: transform 150ms ease;
}
tr.match:hover td.kick::before, tr.match.is-open td.kick::before { transform: scaleY(1); }
td.kick .time, td.kick .score {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 16px;
  display: block;
  line-height: 1.15;
  letter-spacing: -.02em;
}
td.kick small { font-size: 10.5px; color: var(--ink-faint); }
td.kick small.live, td.kick small.soon { display: inline-flex; align-items: center; gap: 5px; }
td.kick small.live { color: var(--win); }
td.kick small.soon { color: var(--accent); }
td.kick small i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: beat 1.6s ease-in-out infinite; }

td.home { text-align: right; }
.team-name { display: inline-flex; align-items: center; gap: 9px; font-weight: 500; font-size: 14.5px; min-width: 0; }
.team-name.home { flex-direction: row-reverse; }
.team-name .short { display: none; }
.crest { width: 21px; height: 21px; object-fit: contain; flex: none; }
.crest-empty { display: inline-block; border-radius: 50%; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }

td.form b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 14px; line-height: 1.1; color: var(--ink-dim); }
.dots { display: inline-flex; gap: 3px; margin-top: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--draw); display: block; }
.dots i.r-S { background: var(--win); }
.dots i.r-N { background: var(--loss); }

/* Messfeld: ein Farbton, Stärke zeigt die Höhe */
.pill {
  --heat: 0%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-width: 74px;
  padding: 7px 10px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -.02em;
  line-height: 1;
  border-radius: var(--r-sm);
  color: var(--ink);
  background: color-mix(in srgb, var(--accent) var(--heat), var(--surface-2));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) calc(var(--heat) * .6), var(--line));
  transition: background 180ms ease;
}
.pill[data-hot="1"] { color: var(--accent-ink); }
.pill-empty { color: var(--ink-faint); background: none; box-shadow: inset 0 0 0 1px var(--line); }
.mark { font-family: var(--font); font-size: 11px; font-weight: 700; }
.mark.hit { color: var(--win); }
.mark.miss { color: var(--loss); }
.pill[data-hot="1"] .mark.hit, .pill[data-hot="1"] .mark.miss { color: var(--accent-ink); }

/* ---------- Spieldetails ---------- */

.detail-row > td { padding: 0; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.detail { padding: 10px 20px 22px; animation: reveal 200ms ease-out; }
.detail-head { display: flex; justify-content: space-between; gap: 22px; align-items: flex-start; padding: 10px 0 14px; border-bottom: 1px solid var(--line); }
.detail-head h3 { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 600; letter-spacing: -.03em; }
.xg { text-align: right; font-family: var(--font-display); letter-spacing: -.03em; }
.xg-num { font-size: 30px; font-weight: 700; color: var(--accent); }
.xg-sep { font-size: 24px; margin: 0 5px; color: var(--ink-faint); }
.xg small { display: block; font-family: var(--font); font-size: 11.5px; color: var(--ink-faint); letter-spacing: 0; margin-top: 2px; }

.detail-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 22px 26px; padding-top: 16px; }
.detail-grid section { min-width: 0; }
.d-result { grid-column: span 4; }
.d-markets { grid-column: span 8; }
.d-form { grid-column: span 7; }
.d-h2h { grid-column: span 5; }
.detail h4 { margin: 16px 0 8px; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
.detail h4:first-child { margin-top: 0; }
.result-line { margin: 8px 0 0; font-size: 14px; }
.goals-line { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-faint); }

.threeway { display: flex; height: 34px; border-radius: var(--r-sm); overflow: hidden; gap: 2px; }
.threeway span { display: flex; align-items: center; justify-content: center; min-width: 42px; font-family: var(--font-display); font-size: 14px; font-weight: 600; color: #fff; }
.tw-1 { background: var(--accent); }
.tw-x { background: var(--surface); color: var(--ink) !important; box-shadow: inset 0 0 0 1px var(--line); }
.tw-2 { background: var(--ink-dim); }
.tw-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-faint); margin-top: 5px; }

.scores { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.scores li { background: var(--surface); border-radius: var(--r-sm); box-shadow: inset 0 0 0 1px var(--line); padding: 7px 9px; display: flex; justify-content: space-between; align-items: baseline; }
.scores b { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
.scores span { font-size: 12px; color: var(--ink-faint); }

.mini { background: var(--surface); border-radius: var(--r-md); border-collapse: separate; border-spacing: 0; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.mini th, .mini td { padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.mini tbody tr:last-child th, .mini tbody tr:last-child td { border-bottom: 0; }
.mini thead th { font-size: 11.5px; font-weight: 600; color: var(--ink-faint); text-align: left; }
.mini tbody th { text-align: left; font-weight: 400; color: var(--ink-dim); }
.mini tbody tr:hover th, .mini tbody tr:hover td { background: var(--surface-2); }
.num { text-align: right !important; white-space: nowrap; font-family: var(--font-display); font-weight: 500; letter-spacing: -.01em; }
.mini td.num { position: relative; padding-left: 74px; }
.mini .bar {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 54px;
  height: 5px;
  border-radius: var(--r-full);
  background: linear-gradient(90deg, var(--accent) 0 var(--w), transparent var(--w)), var(--surface-2);
}
.muted-num { color: var(--ink-faint); font-weight: 400; }

.formlist { list-style: none; margin: 0; padding: 0; }
.formlist li { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.formlist li:last-child { border-bottom: 0; }
.formlist b { margin-left: auto; font-family: var(--font-display); font-size: 14px; font-weight: 600; }
.res { width: 20px; height: 20px; border-radius: var(--r-sm); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 700; flex: none; }
.res.r-S { background: var(--win); }
.res.r-U { background: var(--draw); }
.res.r-N { background: var(--loss); }
.fl-date { color: var(--ink-faint); font-size: 12.5px; width: 62px; flex: none; }
.fl-opp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-dim); }


/* ---------- Seitenköpfe und Listen ---------- */

.page-head { margin: 6px 0 14px; }
.page-head h2 { font-family: var(--font-display); font-size: 32px; font-weight: 700; letter-spacing: -.04em; margin: 0; line-height: 1.05; }
.page-head p { margin: 7px 0 0; color: var(--ink-dim); max-width: 70ch; font-size: 14.5px; }
/* Neuigkeiten */
.news { display: grid; gap: 14px; max-width: 760px; }
.news-entry { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.news-entry time { font-size: 12.5px; color: var(--ink-faint); }
.news-entry h3 { margin: 2px 0 8px; font-size: 17px; }
.news-entry ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.news-entry li { color: var(--ink-dim); font-size: 14.5px; line-height: 1.5; }
.news-entry li b { color: var(--ink); }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); border-collapse: separate; border-spacing: 0; overflow: hidden; }
.list th, .list td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.list tbody tr:last-child th, .list tbody tr:last-child td { border-bottom: 0; }
.list thead th { font-size: 11.5px; font-weight: 600; color: var(--ink-faint); }
.list tbody th { font-weight: 400; color: var(--ink-dim); }
.linkrow { cursor: pointer; }
.linkrow td { transition: background 140ms ease; }
.linkrow:hover td { background: var(--surface-2); }
.pairing { white-space: nowrap; }
.pairing .vs { margin: 0 10px; color: var(--ink-faint); }
.nowrap { white-space: nowrap; }
.sort { border: 0; background: transparent; padding: 0; font-weight: 600; font-size: 11.5px; color: var(--ink-faint); cursor: pointer; white-space: nowrap; }
.sort:hover { color: var(--ink); }
.table-league { min-width: 1000px; }
.rating {
  --r: 25%;
  display: inline-block;
  min-width: 42px;
  padding: 3px 8px;
  border-radius: var(--r-sm);
  text-align: center;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  background: color-mix(in srgb, var(--accent) var(--r), var(--surface-2));
  box-shadow: inset 0 0 0 1px var(--line);
}
td.best { font-weight: 700; color: var(--accent); }

.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px; }
.three-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 22px; }
.two-col > *, .three-col > * { min-width: 0; }
section h3 { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -.02em; margin: 24px 0 10px; }

.cal { position: relative; height: 16px; width: 100%; min-width: 170px; }
.cal span { position: absolute; left: 0; height: 6px; width: var(--w); border-radius: var(--r-full); }
.cal-pred { top: 1px; background: var(--line-strong); }
.cal-real { top: 9px; background: var(--accent); }

.small { font-size: 12.5px; color: var(--ink-faint); margin: 8px 0 0; }
.muted { color: var(--ink-faint); }
.legend { font-size: 13px; color: var(--ink-faint); margin: 16px 0 0; max-width: 86ch; }
.notice {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  border-radius: var(--r-sm);
  max-width: 88ch;
  font-size: 13.5px;
  margin: 0 0 16px;
}
.notice code { background: var(--surface-2); padding: 1px 6px; border-radius: 4px; font-size: 12.5px; }

.empty { text-align: center; padding: 44px 22px; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--r-md); margin-top: 14px; color: var(--ink-dim); }
.empty p { margin: 0 auto 14px; max-width: 58ch; }
.empty.error { border-style: solid; border-color: color-mix(in srgb, var(--loss) 55%, transparent); }

.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--r-sm); padding: 10px 18px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn:hover { background: var(--accent-soft); }
.btn-quiet { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); }
.btn-quiet:hover { border-color: var(--accent); color: var(--accent); }

.loading .ball { width: 28px; height: 28px; margin: 0 auto 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 800ms linear infinite; }

footer { max-width: var(--shell); margin: 0 auto; padding: 0 22px 40px; font-size: 12.5px; color: var(--ink-faint); }
footer p { margin: 5px 0; max-width: 96ch; }
footer a { color: var(--ink-dim); }

/* ---------- Schürfkombi ---------- */

.combo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px 20px 20px; margin: 6px 0 12px; }
.combo-house { border-left: 3px solid var(--accent); margin-bottom: 20px; }
.house-badge { display: inline-block; font-size: 11.5px; font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: var(--r-sm); padding: 3px 10px; margin-bottom: 7px; }
.combo-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
.combo-head h3 { margin: 0; font-size: 20px; }
.combo-num { text-align: right; font-family: var(--font-display); line-height: 1; }
.combo-num b { font-size: 36px; font-weight: 700; display: block; letter-spacing: -.04em; }
.combo-house .combo-num b { color: var(--accent); }
.combo-num small { font-family: var(--font); font-size: 11.5px; color: var(--ink-faint); }
.combo-list { list-style: none; counter-reset: leg; margin: 14px 0 0; padding: 0; }
.combo-list li { counter-increment: leg; display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 2px 14px; padding: 9px 0; border-top: 1px solid var(--line); }
.combo-list li::before { content: counter(leg); font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--ink-faint); grid-row: span 2; align-self: center; }
.kl-event { font-weight: 500; font-size: 14.5px; }
.kl-match { grid-column: 2; grid-row: 2; font-size: 12.5px; color: var(--ink-faint); }
.kl-p {
  --heat: 0%;
  grid-column: 3;
  grid-row: span 2;
  align-self: center;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -.02em;
  min-width: 72px;
  text-align: center;
  padding: 7px 10px;
  border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--accent) var(--heat), var(--surface-2));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) calc(var(--heat) * .6), var(--line));
}
.kl-p[data-hot="1"] { color: var(--accent-ink); }

/* ---------- Tore-Kombi ---------- */

.tore-hero {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap-reverse;
  padding: 24px 26px;
  margin: 4px 0 20px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
}
.tore-hero-text { flex: 1 1 340px; min-width: 0; }
.tore-hero h2 { margin: 0; font-family: var(--font-display); font-size: clamp(32px, 5.5vw, 48px); font-weight: 700; letter-spacing: -.05em; line-height: 1; color: var(--ink); }
.tore-hero p { margin: 10px 0 0; color: var(--ink-dim); max-width: 56ch; font-size: 14.5px; }

/* Stadion-Bühne der Tore-Kombi (Canvas plus LED-Anzeigetafel) */
.torshow { flex: 1 1 100%; min-width: 0; border-radius: 18px; overflow: hidden; background: #03060d; box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08); }
.ts-board {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  padding: 8px 14px; background: #020409; border-bottom: 1px solid rgba(255,255,255,.08);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; color: #ffcf5a;
  text-shadow: 0 0 6px rgba(255,190,60,.85), 0 0 18px rgba(255,150,30,.35);
  position: relative;
}
.ts-board::after { /* LED-Punktraster */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35;
  background: radial-gradient(circle, transparent 55%, rgba(0,0,0,.9) 60%) 0 0 / 3px 3px;
}
.ts-cell { display: flex; flex-direction: column; line-height: 1; }
.ts-cell small { font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; opacity: .7; margin-bottom: 3px; }
.ts-cell b { font-size: 24px; font-weight: 700; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.ts-right { text-align: right; align-items: flex-end; }
.ts-right b { color: #5dffb0; text-shadow: 0 0 6px rgba(60,255,160,.85), 0 0 18px rgba(20,220,120,.35); }
.ts-cell.pop b { animation: tsPop 520ms cubic-bezier(.2, 1.6, .4, 1); }
@keyframes tsPop { 0% { transform: scale(1.7); } 100% { transform: scale(1); } }
.ts-ticker { overflow: hidden; white-space: nowrap; font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.ts-ticker-text { display: inline-block; padding-left: 100%; animation: tsTicker 9s linear infinite; }
@keyframes tsTicker { to { transform: translateX(-100%); } }
.torshow.is-done .ts-ticker-text { color: #5dffb0; }
.ts-stage { position: relative; }
.ts-canvas { display: block; width: 100%; }
.ts-caption {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: 92%;
  display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; pointer-events: none;
  padding: 6px 14px; border-radius: 12px; background: rgba(3,6,13,.72); backdrop-filter: blur(6px);
  color: #fff; font-size: 13px; opacity: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
}
.ts-caption:empty { display: none; }
.ts-caption b { font-family: var(--font-display); font-size: 15px; letter-spacing: -.01em; }
.ts-caption span { color: rgba(255,255,255,.7); font-size: 12px; }
.ts-caption.is-in { animation: tsCap 1.7s ease both; }
@keyframes tsCap { 0% { opacity: 0; transform: translate(-50%, -8px) scale(.94); } 15%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -4px); } }
.ts-controls { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.ts-btn {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; border: 0; cursor: pointer;
  background: rgba(3,6,13,.66); color: #fff; font: 600 12px/1 var(--font); backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); transition: background 140ms ease, transform 120ms ease;
}
.ts-btn:hover { background: rgba(34,211,143,.35); }
.ts-btn:active { transform: scale(.95); }
@media (max-width: 520px) { .ts-btn span { display: none; } .ts-cell b { font-size: 19px; } .ts-ticker { font-size: 12.5px; } }

.goalcombo { position: relative; overflow: hidden; border-radius: var(--r-md); padding: 20px 22px; margin: 6px 0 22px; background: var(--surface); border: 1px solid var(--line); }
.gc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
.gc-shout { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 4.4vw, 34px); letter-spacing: -.045em; line-height: 1; color: var(--ink); }
/* Tipp-Karten leuchten auf, sobald ihr Tor gefallen ist */
.gc-stamp {
  position: absolute; right: 86px; top: 50%; transform: translateY(-50%) rotate(-12deg) scale(.4); opacity: 0;
  font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--leg, var(--accent)); border: 3px solid currentColor; border-radius: 8px; padding: 1px 8px; pointer-events: none;
}
.gc-list li.scored { border-color: color-mix(in srgb, var(--leg, var(--accent)) 55%, var(--line)); background: color-mix(in srgb, var(--leg, var(--accent)) 7%, var(--surface)); }
.gc-list li.scored .gc-stamp { opacity: .9; transform: translateY(-50%) rotate(-12deg) scale(1); transition: transform 380ms cubic-bezier(.2, 1.8, .4, 1), opacity 200ms ease; }
.gc-list li.goal-now { animation: legGoal 1.1s ease; }
@keyframes legGoal { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--leg, var(--accent)) 70%, transparent); transform: scale(1.02); } 100% { box-shadow: 0 0 0 18px transparent; transform: none; } }
@media (max-width: 900px) { .gc-stamp { right: 12px; top: 14px; transform: rotate(-12deg) scale(.4); font-size: 15px; } .gc-list li.scored .gc-stamp { transform: rotate(-12deg) scale(1); } }

.gc-total { text-align: right; font-family: var(--font-display); line-height: 1.1; }
.gc-total b { display: block; font-size: 38px; font-weight: 700; letter-spacing: -.045em; color: var(--accent); }
.gc-total small { font-family: var(--font); font-size: 12px; color: var(--ink-dim); }
.gc-title { margin: 6px 0 14px; font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--ink-dim); }

.gc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.gc-list li {
  position: relative;
  padding: 13px 96px 13px 16px;
  border-radius: var(--r-sm);
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--leg, var(--accent));
  transition: transform 160ms ease, box-shadow 160ms ease;
}
.gc-list li:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(13, 17, 23, .08); }
.goalcombo.is-new .gc-list li { animation: legIn 400ms ease-out backwards; }
.goalcombo.is-new .gc-list li:nth-child(1) { animation-delay: 300ms; }
.goalcombo.is-new .gc-list li:nth-child(2) { animation-delay: 370ms; }
.goalcombo.is-new .gc-list li:nth-child(3) { animation-delay: 440ms; }
.goalcombo.is-new .gc-list li:nth-child(4) { animation-delay: 510ms; }
.goalcombo.is-new .gc-list li:nth-child(5) { animation-delay: 580ms; }
.goalcombo.is-new .gc-list li:nth-child(6) { animation-delay: 650ms; }
@keyframes legIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.gc-top { display: flex; align-items: baseline; gap: 10px; }
.gc-event { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: -.02em; color: var(--ink); }
.gc-odds { font-family: var(--font-display); font-size: 12.5px; font-weight: 600; color: var(--leg, var(--accent)); background: color-mix(in srgb, var(--leg, var(--accent)) 12%, transparent); border-radius: var(--r-sm); padding: 2px 9px; }
.gc-match { font-size: 13.5px; color: var(--ink-dim); margin-top: 2px; }
.gc-bar { height: 4px; border-radius: var(--r-full); background: var(--surface-2); margin: 10px 0 8px; overflow: hidden; }
.gc-bar span { display: block; height: 100%; background: var(--leg, var(--accent)); border-radius: inherit; }
.goalcombo.is-new .gc-bar span { animation: fill 700ms ease-out 480ms backwards; }
@keyframes fill { from { width: 0 !important; } }
.gc-why { margin: 0; font-size: 12.5px; color: var(--ink-faint); line-height: 1.55; max-width: 74ch; }
.gc-p { position: absolute; top: 13px; right: 16px; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.03em; color: var(--leg, var(--accent)); }
.leg-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--leg, var(--accent)); margin-right: 9px; vertical-align: middle; }

/* ---------- Bewegung ---------- */

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes beat { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.72); } }
@keyframes reveal { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
@keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.chip, .tab, .day, .btn, .segmented button, #nav a { transition: background 140ms ease, color 140ms ease, border-color 140ms ease, transform 120ms ease; }
.chip:active, .tab:active, .btn:active, .day:active { transform: scale(.97); }
body, .masthead, .matches, .list, .goalcombo, .tore-hero, .combo { transition: background-color 240ms ease, border-color 240ms ease; }

@media (prefers-reduced-motion: reduce) {
  .loading .ball, #refresh.is-busy::before, td.kick small i,
  .goalcombo.is-new .gc-shout span, .goalcombo.is-new .gc-list li, .goalcombo.is-new .gc-bar span,
  .tore-hero.is-new .gs-ballwrap, .tore-hero.is-new .gs-path, .tore-hero.is-new .gs-goal,
  .detail { animation: none; }
  .chip, .tab, .day, .btn, .segmented button, #nav a, tr.match td, td.kick::before,
  body, .masthead, .matches, .list, .goalcombo, .tore-hero, .combo { transition: none; }
}

/* ---------- Schmale Bildschirme ---------- */

@media (max-width: 1000px) {
  .d-result, .d-markets, .d-form, .d-h2h { grid-column: span 12; }
  .d-form, .d-h2h { grid-column: span 6; }
}

@media (max-width: 740px) {
  body { font-size: 14px; }
  .masthead-inner { padding: 10px 14px; gap: 8px 14px; }
  .brand { font-size: 19px; }
  #nav { order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; }
  #nav a { white-space: nowrap; padding: 6px 10px; font-size: 13.5px; }
  .masthead-status { margin-left: auto; }
  #status { display: none; }
  main { padding: 16px 12px 40px; }
  .page-head h2 { font-size: 26px; }
  .day { min-width: 94px; padding: 8px 11px; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .select select, .select-wide select { min-width: 0; width: 100%; }
  .toolbar-right > .select { flex: 1 1 150px; }
  .matches { min-width: 0; }
  .matches col.c-form, .matches th.form, .matches td.form { display: none; }
  .matches col.c-stat { width: 76px; }
  .matches col.c-time { width: 62px; }
  tr.match td { padding: 8px 6px; }
  .pill { min-width: 62px; font-size: 14px; padding: 6px 6px; }
  .team-name .full { display: none; }
  .team-name .short { display: inline; }
  .team-name { gap: 6px; font-size: 13.5px; }
  .crest { width: 18px; height: 18px; }
  .detail { padding: 8px 12px 18px; }
  .detail-head { flex-direction: column; gap: 8px; }
  .xg { text-align: left; }
  .d-form, .d-h2h { grid-column: span 12; }
  .two-col { grid-template-columns: 1fr; }
  .scores { grid-template-columns: repeat(2, 1fr); }
  /* Auf dem Handy als Blatt über der unteren Leiste, mit eigenem Scrollbereich */
  .leaguepicker[open]::before { content: ""; position: fixed; inset: 0; z-index: 94; background: rgba(0,0,0,.5); backdrop-filter: blur(2px); }
  .lp-panel {
    position: fixed; z-index: 95; left: 10px; right: 10px; top: auto; width: auto; margin: 0;
    bottom: calc(88px + env(safe-area-inset-bottom)); max-height: min(70vh, calc(100vh - 150px));
    border-radius: 22px; padding: 0 14px 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
    overscroll-behavior: contain; animation: sheetUp 240ms cubic-bezier(.2, .8, .3, 1);
  }
  .lp-groups { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); }
  .combo-num b, .gc-total b { font-size: 28px; }
  .combo-list li { grid-template-columns: 18px 1fr auto; gap: 2px 10px; }
  .tore-hero { padding: 18px 16px; gap: 14px; }
  .goalstage { flex-basis: 100%; max-width: 270px; }
  .gc-list li { padding: 12px 12px 12px 14px; }
  .gc-p { position: static; display: block; margin-top: 8px; font-size: 20px; }
}


/* =====================================================================
   Schnockstats 2: "Flutlicht"
   Dunkler Stadion-Look als Standard, "Tageslicht" als helle Variante.
   Fußball in Rasengrün, Eishockey in Eisblau. Auf dem Handy wie eine App:
   Leiste unten, Spielkarten statt breiter Tabellen, sanfte Übergänge.
   ===================================================================== */
:root, :root:not([data-theme="light"]) {
  color-scheme: dark;
  --canvas: #070b14;
  --surface: #0f1522;
  --surface-2: #151d2e;
  --raised: #1a2336;
  --line: #1f2a40;
  --line-strong: #2e3c58;
  --ink: #eaf0fb;
  --ink-dim: #9aa8c2;
  --ink-faint: #6b7a96;
  --accent: #18e08a;
  --accent-soft: #6ff0b5;
  --accent-ink: #03170d;
  --glow: rgba(24, 224, 138, .35);
  --pitch-1: #0c2a1c;
  --pitch-2: #0f3322;
  --floodlight: #f6ffcf;
  --win: #18e08a;
  --draw: #53607a;
  --loss: #ff5a67;
  --c-goals: #ffb020;
  --c-btts: #ff5a67;
  --c-team: #2ad1e0;
  --c-half: #a48bff;
  --c-range: #18e08a;
  --r-md: 14px;
  --r-lg: 20px;
  --font-display: "Sora", "Archivo", system-ui, sans-serif;
}
:root[data-sport="eishockey"]:not([data-theme="light"]) {
  --accent: #3fc8ff; --accent-soft: #8adfff; --accent-ink: #021a26; --glow: rgba(63, 200, 255, .35);
  --pitch-1: #0b2233; --pitch-2: #0e2b40;
}
:root[data-theme="light"] {
  color-scheme: light;
  --canvas: #eef2f0;
  --surface: #ffffff;
  --surface-2: #f3f6f4;
  --raised: #ffffff;
  --line: #dde4e0;
  --line-strong: #c5d0ca;
  --ink: #0b1510;
  --ink-dim: #4d5c55;
  --ink-faint: #7d8b84;
  --accent: #0a9a57;
  --accent-soft: #19c273;
  --accent-ink: #ffffff;
  --glow: rgba(10, 154, 87, .25);
  --pitch-1: #1c7a45;
  --pitch-2: #22884e;
  --floodlight: #fffbe0;
  --win: #0a9a57; --loss: #e5484d; --draw: #aeb5c0;
}
:root[data-theme="light"][data-sport="eishockey"] { --accent: #0a7fb8; --accent-soft: #2aa6e0; --accent-ink: #fff; --glow: rgba(10, 127, 184, .25); --pitch-1: #1a6a96; --pitch-2: #2079a8; }

body {
  background:
    radial-gradient(900px 500px at 85% -120px, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
    radial-gradient(700px 420px at 0% -80px, color-mix(in srgb, var(--floodlight) 5%, transparent), transparent 70%),
    var(--canvas);
  background-attachment: fixed;
  padding-bottom: env(safe-area-inset-bottom);
}

/* ---------- Kopf ---------- */
.masthead {
  background: color-mix(in srgb, var(--canvas) 72%, transparent);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
  padding-top: env(safe-area-inset-top);
}
.masthead-inner { padding: 10px 22px; gap: 10px 18px; flex-wrap: nowrap; }
.brand { gap: 10px; }
#brand-mark { width: 30px; height: 30px; color: var(--accent); filter: drop-shadow(0 0 8px var(--glow)); }
#brand-mark svg { width: 30px; height: 30px; animation: brandSpin 14s linear infinite; }
@keyframes brandSpin { to { transform: rotate(360deg); } }
#brand-name { font-family: var(--font-display); font-weight: 700; letter-spacing: -.04em; font-size: 21px; }
#brand-name::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 3px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); vertical-align: 2px; animation: livePulse 2.4s ease-in-out infinite; }
@keyframes livePulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
#nav { flex: 1; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
#nav::-webkit-scrollbar { display: none; }
#nav a { border-radius: 999px; padding: 8px 14px; color: var(--ink-dim); font-weight: 600; white-space: nowrap; transition: background 200ms ease, color 200ms ease; }
#nav a:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 6%, transparent); }
#nav a[aria-current="page"] { color: var(--accent-ink); background: var(--accent); box-shadow: 0 4px 18px var(--glow); }
.masthead-status { margin-left: auto; display: flex; align-items: center; gap: 8px; }
#status { font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
#refresh { border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); }
.theme-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; }
.segmented { border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); padding: 3px; }
.segmented button { border-radius: 999px; }
.segmented button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 12px var(--glow); }

/* ---------- Bühne auf der Startseite ---------- */
.stage {
  position: relative; overflow: hidden; margin: 6px 0 18px; border-radius: var(--r-lg);
  padding: 22px 24px 20px; min-height: 176px; color: #fff;
  background:
    repeating-linear-gradient(90deg, var(--pitch-1) 0 60px, var(--pitch-2) 60px 120px);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 18px 40px rgba(0,0,0,.25);
  isolation: isolate;
}
.stage::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(60% 90% at 88% 0%, rgba(255,255,230,.28), transparent 60%), radial-gradient(50% 80% at 5% 0%, rgba(255,255,230,.16), transparent 60%), linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.45)); }
.stage-lines { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; opacity: .55; }
.stage-lines path, .stage-lines circle, .stage-lines rect { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 2; stroke-dasharray: 900; stroke-dashoffset: 900; animation: drawLine 1.8s ease-out forwards; }
.stage-lines .l2 { animation-delay: .3s; } .stage-lines .l3 { animation-delay: .6s; }
@keyframes drawLine { to { stroke-dashoffset: 0; } }
.stage-ball { position: absolute; right: 18%; top: 22px; width: 30px; height: 30px; z-index: 0; animation: ballArc 5.5s cubic-bezier(.45, 0, .55, 1) infinite; filter: drop-shadow(0 8px 6px rgba(0,0,0,.35)); }
.stage-ball svg { width: 100%; height: 100%; animation: spin 1.2s linear infinite; }
@keyframes ballArc { 0% { transform: translate(-160px, 90px) scale(.8); } 40% { transform: translate(0, -6px) scale(1); } 80% { transform: translate(140px, 80px) scale(.85); } 100% { transform: translate(-160px, 90px) scale(.8); } }
.stage-beam { position: absolute; top: -40px; width: 30%; height: 160%; z-index: -1; background: linear-gradient(180deg, rgba(255,255,220,.22), transparent 70%); filter: blur(6px); transform-origin: 50% 0; animation: beam 7s ease-in-out infinite alternate; }
.stage-beam.b1 { left: 4%; transform: rotate(-18deg); } .stage-beam.b2 { right: 4%; transform: rotate(18deg); animation-delay: -3s; }
@keyframes beam { from { opacity: .55; } to { opacity: 1; } }
.stage h2 { margin: 0; font-family: var(--font-display); font-size: clamp(24px, 4vw, 36px); letter-spacing: -.04em; line-height: 1.05; }
.stage h2 em { font-style: normal; color: var(--floodlight); text-shadow: 0 0 22px rgba(255,255,200,.45); }
.stage-sub { margin: 6px 0 0; font-size: 14px; color: rgba(255,255,255,.8); }
.stage-kpis { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.kpi { min-width: 92px; padding: 9px 12px; border-radius: 14px; background: rgba(0,0,0,.28); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.kpi b { display: block; font-family: var(--font-display); font-size: 22px; letter-spacing: -.03em; line-height: 1.1; }
.kpi small { font-size: 11.5px; color: rgba(255,255,255,.75); }
.tip-card { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 11px 14px; border-radius: 14px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); cursor: pointer; max-width: 560px; transition: transform 160ms ease, background 160ms ease; }
.tip-card:hover { transform: translateY(-2px); background: rgba(0,0,0,.45); }
.tip-card .tip-p { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -.04em; color: var(--floodlight); min-width: 64px; }
.tip-card .tip-t { font-size: 13.5px; line-height: 1.35; }
.tip-card .tip-t b { display: block; font-size: 14.5px; }
.tip-card .tip-t span { color: rgba(255,255,255,.72); }
.tip-card .tip-tag { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
:root[data-sport="eishockey"] .stage { background: linear-gradient(180deg, #dff3ff 0%, #bfe6ff 100%); color: #06263a; }
:root[data-sport="eishockey"] .stage::before { background: radial-gradient(60% 90% at 88% 0%, rgba(255,255,255,.8), transparent 60%), linear-gradient(180deg, transparent, rgba(0,60,100,.18)); }
:root[data-sport="eishockey"] .stage-lines path, :root[data-sport="eishockey"] .stage-lines circle, :root[data-sport="eishockey"] .stage-lines rect { stroke: rgba(200,20,40,.55); }
:root[data-sport="eishockey"] .stage .stage-sub, :root[data-sport="eishockey"] .kpi small { color: rgba(6,38,58,.7); }
:root[data-sport="eishockey"] .kpi, :root[data-sport="eishockey"] .tip-card { background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px rgba(6,38,58,.12); }
:root[data-sport="eishockey"] .tip-card .tip-t span { color: rgba(6,38,58,.7); }
:root[data-sport="eishockey"] .tip-card .tip-p, :root[data-sport="eishockey"] .stage h2 em { color: #0a7fb8; text-shadow: none; }
:root[data-sport="eishockey"] .tip-card .tip-tag { background: rgba(6,38,58,.1); color: #06263a; }

/* ---------- Tage, Werkzeuge ---------- */
.daybar { gap: 8px; scrollbar-width: none; padding: 2px 2px 6px; scroll-snap-type: x mandatory; }
.daybar::-webkit-scrollbar { display: none; }
.day { border-radius: 16px; background: var(--surface); border-color: var(--line); scroll-snap-align: start; transition: transform 160ms ease, background 200ms ease; }
.day:hover { transform: translateY(-1px); }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); box-shadow: 0 6px 22px var(--glow); }
.select select, .leaguepicker > summary, .chip, .btn-quiet { border-radius: 12px; background: var(--surface); border-color: var(--line); }
.select select:hover { border-color: var(--line-strong); }
.btn { border-radius: 999px; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 20px var(--glow); }
.notice { border-radius: var(--r-md); background: color-mix(in srgb, var(--c-goals) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c-goals) 30%, transparent); }

/* ---------- Tabellen und Karten ---------- */
.table-wrap { border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); box-shadow: 0 10px 30px rgba(0,0,0,.18); }
table { background: transparent; }
.matches thead th, .list thead th { background: var(--surface-2); color: var(--ink-faint); }
.group-row th { background: color-mix(in srgb, var(--accent) 5%, var(--surface-2)); border-top: 1px solid var(--line); }
.lg-badge { border-radius: 8px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); border: 0; font-weight: 700; }
tr.match td { border-bottom-color: var(--line); transition: background 160ms ease; }
tr.match:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
tr.match.is-open td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
td.kick .score { font-family: var(--font-display); font-weight: 700; }
.crest-empty { background: color-mix(in srgb, var(--ink) 10%, transparent); }
.pill {
  border-radius: 12px;
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--accent) 85%, transparent) var(--heat), color-mix(in srgb, var(--accent) 12%, transparent) var(--heat));
  background-size: 100% 100%;
  color: var(--ink);
  transition: transform 160ms ease;
}
.pill[data-hot="1"] { color: var(--accent-ink); box-shadow: 0 4px 16px var(--glow); }
tr.match:hover .pill { transform: scale(1.04); }
.dots i.r-S { background: var(--win); } .dots i.r-N { background: var(--loss); }
.detail-row > td { background: var(--surface-2); }
.detail { animation: detailIn 260ms cubic-bezier(.2, .8, .3, 1); }
@keyframes detailIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.detail-grid section, .combo, .goalcombo, .tore-hero { border-radius: var(--r-md); }
.threeway { border-radius: 999px; overflow: hidden; }
.threeway span { animation: growX 700ms cubic-bezier(.2, .8, .3, 1) backwards; transform-origin: left; }
@keyframes growX { from { transform: scaleX(0); } }
.mini .bar, .bar-inline span { animation: growX 700ms cubic-bezier(.2, .8, .3, 1) backwards; transform-origin: left; }
.empty { border-radius: var(--r-lg); background: var(--surface); border-color: var(--line); }
footer { color: var(--ink-faint); padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

/* ---------- Begründung der Tor-Prognose ---------- */
.d-why { grid-column: 1 / -1; padding: 16px 18px; border-radius: 18px; background: color-mix(in srgb, var(--accent) 6%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); }
.why-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px 26px; align-items: start; }
.why-steps { margin: 0; padding-left: 20px; display: grid; gap: 9px; font-size: 14px; line-height: 1.45; }
.why-steps li::marker { color: var(--accent); font-weight: 700; }
.why-steps b { color: var(--ink); }
.why-table td { white-space: nowrap; }
.mini.why-table td.num { padding-left: 12px; }
.gl-row { display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.gl { display: inline-block; min-width: 30px; padding: 2px 5px; border-radius: 6px; font-size: 11.5px; font-weight: 600; text-align: center; background: var(--surface-2); }
.gl.w { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.gl.l { background: color-mix(in srgb, #ff4d6d 22%, transparent); }
@media (max-width: 900px) { .why-grid { grid-template-columns: 1fr; } .d-why { padding: 14px 12px; } }


/* Steuerung der Tore-Kombi */
.tore-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
@media (max-width: 900px) {
  .tore-controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
  .tore-controls .goal-set { grid-column: 1 / -1; display: flex; width: 100%; }
  .tore-controls .goal-set button { flex: 1; padding-left: 6px; padding-right: 6px; font-size: 13px; white-space: nowrap; }
  .tore-controls .select select { width: 100%; }
}

/* ---------- Kassenzettel ---------- */
.kasse { position: relative; max-width: 440px; margin: 8px auto 30px; }
.printer {
  position: relative; z-index: 2; height: 34px; margin: 0 -14px; border-radius: 14px;
  background: linear-gradient(180deg, #2b3345, #121826); box-shadow: 0 10px 26px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
}
.printer-slot { position: absolute; left: 18px; right: 18px; bottom: 7px; height: 6px; border-radius: 4px; background: #03060c; box-shadow: inset 0 2px 4px rgba(0,0,0,.8); }
.printer-led { position: absolute; right: 16px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: #22d38f; box-shadow: 0 0 8px #22d38f; }
.kasse.is-new .printer-led { animation: ledBlink .35s steps(2) 6; }
@keyframes ledBlink { 50% { opacity: .2; } }
.bon-wrap { position: relative; margin-top: -10px; overflow: hidden; padding: 10px 0 18px; }
.bon {
  position: relative; background: #fbfaf4; color: #1d1c19;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; line-height: 1.45;
  padding: 26px 22px 30px; box-shadow: 0 16px 36px rgba(0,0,0,.35);
  background-image: linear-gradient(180deg, rgba(0,0,0,.06), transparent 30px), repeating-linear-gradient(0deg, transparent 0 22px, rgba(0,0,0,.012) 22px 23px);
  -webkit-mask: radial-gradient(circle 6px at 50% 100%, transparent 97%, #000) 0 100% / 13px 51% repeat-x, linear-gradient(#000, #000) 0 0 / 100% 51% no-repeat;
          mask: radial-gradient(circle 6px at 50% 100%, transparent 97%, #000) 0 100% / 13px 51% repeat-x, linear-gradient(#000, #000) 0 0 / 100% 51% no-repeat;
}
.kasse.is-new .bon { animation: bonPrint 1.6s cubic-bezier(.3, .7, .2, 1) both; }
@keyframes bonPrint { 0% { transform: translateY(-100%); } 70% { transform: translateY(2%); } 85% { transform: translateY(-1%); } 100% { transform: none; } }
.kasse.is-new .bon > * { animation: bonInk .35s ease both; animation-delay: calc(.9s + var(--i, 0) * 45ms); }
@keyframes bonInk { from { opacity: 0; } }
.bon-head { text-align: center; display: flex; flex-direction: column; gap: 1px; }
.bon-head b { font-size: 20px; letter-spacing: .18em; }
.bon-head span { font-size: 12px; color: #5a5850; }
.bon-sep { height: 0; border-top: 2px dashed #9b988b; margin: 10px 0; }
.bon-sep.dbl { border-top: 4px double #55534b; }
.bon-sub { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
.bon-day { margin: 12px 0 4px; font-weight: 800; letter-spacing: .08em; border-bottom: 1px dashed #b9b5a6; }
.bon-item { padding: 5px 6px; margin: 0 -6px; border-radius: 6px; cursor: pointer; transition: background 120ms ease; }
.bon-item:hover, .bon-item:focus-visible { background: rgba(34, 211, 143, .14); outline: none; }
.bon-l1 { display: flex; gap: 10px; font-size: 12px; color: #5a5850; }
.bon-lg { font-weight: 700; color: #1d1c19; }
.bon-b365 { margin-left: auto; font-weight: 700; color: #126e4c; text-decoration: none; padding: 0 4px; border-radius: 4px; }
.bon-b365:hover, .bon-b365:focus-visible { background: rgba(18, 110, 76, .14); outline: none; text-decoration: underline; }
html:not([data-b365]) .bon-b365 { display: none; }
.bon-b365-toggle, .bon-bwin-toggle { display: block; margin: 8px auto 0; font: inherit; font-size: 12px; font-weight: 700; color: #5a5850; background: none; border: 1px dashed #b9b5a6; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.bon-b365-toggle::before, .bon-bwin-toggle::before { content: "☐ "; }
.bon-b365-toggle[aria-pressed="true"], .bon-bwin-toggle[aria-pressed="true"] { color: #126e4c; border-color: #126e4c; }
.bon-b365-toggle[aria-pressed="true"]::before, .bon-bwin-toggle[aria-pressed="true"]::before { content: "☑ "; }
.bon-b365-toggle:hover, .bon-b365-toggle:focus-visible, .bon-bwin-toggle:hover, .bon-bwin-toggle:focus-visible { background: rgba(18, 110, 76, .1); outline: none; }
.bon-toggles { display: flex; justify-content: center; flex-wrap: wrap; gap: 0 8px; }
.bon-toggles > button { margin-left: 0; margin-right: 0; }
.bon-bwin-box { margin-top: 8px; text-align: center; font-size: 12px; color: #5a5850; }
html:not([data-bwin]) .bon-bwin-box { display: none; }
.bon-bwin { display: inline-block; font-weight: 800; color: #fff; background: #126e4c; text-decoration: none; border-radius: 6px; padding: 5px 12px; }
.bon-bwin:hover, .bon-bwin:focus-visible { background: #0d5539; outline: 2px solid #126e4c; outline-offset: 2px; }
.bon-bwin-help { margin-top: 6px; text-align: left; }
.bon-bwin-help summary { cursor: pointer; text-align: center; font-weight: 700; }
.bon-bwin-help ol { margin: 6px 0 0; padding-left: 18px; }
.bon-bwin-help li { margin: 3px 0; }
.bon-bwin-bm { font-weight: 700; color: #126e4c; border: 1px dashed #126e4c; border-radius: 4px; padding: 0 4px; text-decoration: none; cursor: grab; }
.bon-bwin-copy { font: inherit; font-size: 12px; font-weight: 700; color: #126e4c; background: none; border: 1px solid #126e4c; border-radius: 4px; padding: 0 6px; cursor: pointer; }
.bon-l2 { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bon-l3, .bon-sum div { white-space: nowrap; overflow: hidden; }
.bon-row { display: flex; align-items: baseline; gap: 6px; }
.bon-row i { flex: 1; min-width: 12px; border-bottom: 2px dotted #b3af9f; transform: translateY(-4px); }
.bon-l3 { padding-left: 12px; }
.bon-sum { margin-top: 2px; }
.bon-total { font-size: 16px; font-weight: 800; margin: 4px 0; }
.bon-empty { text-align: center; padding: 18px 0; color: #5a5850; }
.bon-bar { display: flex; justify-content: center; align-items: stretch; gap: 2px; height: 46px; margin: 12px 0 8px; }
.bon-bar i { display: block; background: #1d1c19; }
.bon-foot { text-align: center; font-size: 12px; color: #5a5850; }
@media (max-width: 480px) { .bon { font-size: 12.5px; padding: 22px 16px 28px; } .printer { margin: 0 -6px; } }
@media (prefers-reduced-motion: reduce) { .kasse.is-new .bon, .kasse.is-new .bon > *, .kasse.is-new .printer-led { animation: none !important; } }

/* ---------- Leiste unten (Handy) und Mehr-Blatt ---------- */
#tabbar { display: none; }
.more-sheet { position: fixed; inset: 0; z-index: 90; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.45); backdrop-filter: blur(3px); animation: fadeIn 200ms ease; }
.more-panel { width: min(520px, 100%); margin: 0 10px calc(90px + env(safe-area-inset-bottom)); padding: 14px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(0,0,0,.4); animation: sheetUp 260ms cubic-bezier(.2, .8, .3, 1); }
.more-panel a, .more-panel button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 12px; border: 0; border-radius: 14px; background: none; color: var(--ink); font-weight: 600; text-decoration: none; text-align: left; cursor: pointer; }
.more-panel a:hover, .more-panel button:hover { background: var(--surface-2); }
.more-panel svg { width: 22px; height: 22px; color: var(--accent); }
.more-panel small { margin-left: auto; color: var(--ink-faint); font-weight: 500; }
@keyframes sheetUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } }

/* Übergang beim Wechsel der Ansicht */
main.view-enter { animation: viewIn 320ms cubic-bezier(.2, .8, .3, 1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Startbildschirm als App */
.app-splash { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #070b14; color: #fff; transition: opacity 420ms ease, transform 420ms ease; }
.app-splash.is-leaving { opacity: 0; transform: scale(1.05); pointer-events: none; }
.app-splash img { width: 108px; height: 108px; border-radius: 26px; box-shadow: 0 0 60px rgba(24, 224, 138, .35); animation: splashPop 700ms cubic-bezier(.2, 1.3, .3, 1) both; }
.app-splash b { font-family: var(--font-display); font-size: 26px; letter-spacing: -.04em; animation: splashPop 600ms ease 200ms both; }
@keyframes splashPop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.offline-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--c-goals); }
.offline-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c-goals); }

@media (max-width: 900px) {
  #nav { display: none; }
  .masthead-inner { padding: 8px 14px; }
  #status { display: none; }
  #refresh { font-size: 0; width: 38px; height: 38px; padding: 0; justify-content: center; }
  #refresh::before { margin: 0; }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  #tabbar {
    display: flex; position: fixed; z-index: 60; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom));
    justify-content: space-around; padding: 6px; border-radius: 24px;
    background: color-mix(in srgb, var(--surface) 86%, transparent); border: 1px solid var(--line);
    backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%);
    box-shadow: 0 14px 40px rgba(0,0,0,.35);
    /* eigene Ebene: bleibt beim Scrollen ruhig stehen statt mitzuruckeln */
    transform: translate3d(0, 0, 0); will-change: transform; -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  /* iOS kennt kein festes Hintergrundbild und zeichnet sonst bei jedem Scrollschritt neu */
  body { background-attachment: scroll; }
  .masthead { transform: translate3d(0, 0, 0); -webkit-backface-visibility: hidden; }
  #tabbar a, #tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px 6px; border: 0; background: none; border-radius: 18px; color: var(--ink-faint); font: 600 10.5px/1 var(--font); text-decoration: none; cursor: pointer; transition: color 200ms ease, background 200ms ease; }
  #tabbar svg { width: 23px; height: 23px; transition: transform 250ms cubic-bezier(.2, 1.4, .3, 1); }
  #tabbar [aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  #tabbar [aria-current="page"] svg { transform: translateY(-2px) scale(1.12); filter: drop-shadow(0 0 8px var(--glow)); }
  .stage { margin: 0 -2px 16px; padding: 18px 16px; min-height: 150px; }
  .stage-ball { right: 10%; width: 24px; height: 24px; }
  .kpi { min-width: 0; flex: 1; padding: 8px 10px; }
  .kpi b { font-size: 19px; }
  .tip-card .tip-p { font-size: 22px; min-width: 54px; }
  .toolbar { gap: 10px; }
  .toolbar-right { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .toolbar-right .select select { width: 100%; }
  .toolbar-right .segmented { justify-self: start; }

  /* Spiele als Karten: Zeit links, Teams untereinander, zwei Werte rechts */
  .table-wrap:has(.matches) { border: 0; background: none; box-shadow: none; overflow: visible; }
  table.matches, .matches tbody, .matches tr, .matches td, .matches th { display: block; }
  .matches colgroup, .matches thead { display: none; }
  .matches tbody.league-group { margin-bottom: 12px; border-radius: 18px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
  .matches .group-row th { padding: 10px 14px; font-size: 13px; }
  .matches tr.match { display: grid; grid-template-columns: 50px 1fr auto auto; grid-template-areas: "kick home s1 s2" "kick away s1 s2"; align-items: center; column-gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .matches tr.match:last-child { border-bottom: 0; }
  .matches tr.match td { padding: 0; border: 0; background: none !important; }
  .matches td.kick { grid-area: kick; }
  .matches td.home { grid-area: home; text-align: left; }
  .matches td.away { grid-area: away; }
  .matches td.form { display: none; }
  .matches td.stat:nth-of-type(4) { grid-area: s1; }
  .matches td.stat:nth-of-type(5) { grid-area: s2; }
  .matches .team-name.home { flex-direction: row-reverse; justify-content: flex-end; }
  .matches .team-name { gap: 8px; font-size: 14.5px; font-weight: 600; }
  .matches .pill { min-width: 56px; padding: 8px 6px; font-size: 14px; }
  .matches tr.match.is-open { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .matches tr.detail-row > td { border-bottom: 1px solid var(--line); }
  .detail { padding: 8px 12px 16px; }
  /* Tabellen in den Details bleiben Tabellen (die Kartenregeln oben gelten nur der Spieleliste) */
  .matches .detail table { display: table; width: 100%; }
  .matches .detail thead { display: table-header-group; }
  .matches .detail tbody { display: table-row-group; }
  .matches .detail tr { display: table-row; }
  .matches .detail td, .matches .detail th { display: table-cell; }
  .why-table th, .why-table td { font-size: 12.5px; padding: 7px 6px; }
  .why-table td { white-space: nowrap; }
  .why-table td .muted { display: none; }
}
