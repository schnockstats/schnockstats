<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1430"/><stop offset=".62" stop-color="#070b14"/><stop offset="1" stop-color="#05080f"/></linearGradient>
 <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f5a36"/><stop offset="1" stop-color="#083a24"/></linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6cc" stop-opacity=".55"/><stop offset="1" stop-color="#fff6cc" stop-opacity="0"/></linearGradient>
 <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7cf7c2" stop-opacity=".55"/><stop offset="1" stop-color="#7cf7c2" stop-opacity="0"/></radialGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#facc15"/></linearGradient>
 <radialGradient id="ball" cx=".38" cy=".34" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#e6ebf2"/><stop offset="1" stop-color="#aab4c3"/></radialGradient>
</defs>
<rect width="512" height="512" fill="url(#sky)"/>
<!-- Flutlichtmasten -->
<polygon points="70,40 30,40 0,330 170,330" fill="url(#beam)" opacity=".7"/>
<polygon points="482,40 442,40 342,330 512,330" fill="url(#beam)" opacity=".7"/>
