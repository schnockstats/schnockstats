 <g stroke="#111827" stroke-width="3.5" stroke-linecap="round"><line x1="0" y1="-13" x2="0" y2="-31"/><line x1="12.4" y1="-4" x2="29.5" y2="-9.6"/><line x1="7.6" y1="10.5" x2="18.2" y2="25"/><line x1="-7.6" y1="10.5" x2="-18.2" y2="25"/><line x1="-12.4" y1="-4" x2="-29.5" y2="-9.6"/></g>
