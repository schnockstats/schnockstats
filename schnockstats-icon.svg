<g fill="#ffffff" opacity=".9"><circle cx="38" cy="35" r="4"/><circle cx="50" cy="35" r="4"/><circle cx="62" cy="35" r="4"/><circle cx="450" cy="35" r="4"/><circle cx="462" cy="35" r="4"/><circle cx="474" cy="35" r="4"/></g>
