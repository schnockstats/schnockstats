<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05070a">
<script>
  (function () {
    try {
      var mr = localStorage.getItem('monsterradar:theme');
      if (mr === 'ultra') {
        document.documentElement.setAttribute('data-mr', 'ultra');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#eef1f4');
      }
    } catch (e) {}
  })();
</script>
<title>Monster Radar</title>
<meta name="description" content="Wo es Monster Energy gerade im Angebot gibt, mit Preis, Laufzeit und Filialen in der Nähe.">
<meta property="og:title" content="Monster Radar">
<meta property="og:description" content="Wo es Monster Energy gerade im Angebot gibt, mit Preis, Laufzeit und Filialen in der Nähe.">
<meta property="og:type" content="website">
<!-- App-Einbindung: eigenes Symbol, Start im Vollbild ohne Browserleisten -->
<link rel="icon" type="image/png" sizes="192x192" href="monster-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="monster-icon-180.png">
<link rel="manifest" href="monster.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monster Radar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Monster Radar – eigenständige Seite */
/* ---------- Farbwelten: Original (dunkel) und Ultra White (hell) ---------- */
:root {
  --mr-bg: #05070a;
  --mr-panel: #0a0e13;
  --mr-panel-2: #11161e;
  --mr-card-a: #10161d;
  --mr-line: #1e2732;
  --mr-line-strong: #2c3846;
  --mr-fg: #eaffdf;
  --mr-strong: #ffffff;
  --mr-dim: #93a68c;
  --mr-faint: #6d7d68;
  --mr-claim: #cfe6c2;
  --mr-desc: #b9cdb0;
  --mr-street: #dcf3d2;
  --mr-accent: #9dff2e;
  --mr-accent-soft: #c4ff7a;
  --mr-on-accent: #05070a;
  --mr-tiles: invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.6);
}
/* Ultra White: Weiß, Silbergrau, Babyblau */
html[data-mr="ultra"] {
  color-scheme: light;
  --mr-bg: #eef1f4;
  --mr-panel: #ffffff;
  --mr-panel-2: #f2f4f7;
  --mr-card-a: #ffffff;
  --mr-line: #d6dce2;
  --mr-line-strong: #bfc7cf;
  --mr-fg: #1a1f25;
  --mr-strong: #0d1014;
  --mr-dim: #56606b;
  --mr-faint: #8a939d;
  --mr-claim: #3b444e;
  --mr-desc: #4a535d;
  --mr-street: #1d232a;
  --mr-accent: #34b3e4;
  --mr-accent-soft: #7fd0f0;
  --mr-on-accent: #0b1b24;
  --mr-tiles: grayscale(.85) brightness(1.04) contrast(.96);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--mr-bg); color-scheme: dark; }
body {
  margin: 0;
  background: var(--mr-bg);
  color: var(--mr-fg);
  font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--mr-accent); outline-offset: 2px; }
main { max-width: 1240px; margin: 0 auto; padding: 0 22px 56px; }
.nrg-footer { max-width: 1240px; margin: 0 auto; padding: 0 22px 40px; font-size: 12px; color: var(--mr-faint); }
@keyframes spin { to { transform: rotate(360deg); } }
.nrg-hero { margin-top: 0 !important; }
/* Freie Kartenkacheln dunkel einfärben, Markierungen bleiben grün */
.nrg-tiles { filter: var(--mr-tiles); }
.leaflet-container { background: var(--mr-panel) !important; font: inherit; }
.leaflet-control-attribution { background: color-mix(in srgb, var(--mr-bg) 75%, transparent) !important; color: var(--mr-faint) !important; }
.leaflet-control-attribution a { color: var(--mr-accent) !important; }

/* ==========================================================================
   Monster-Radar: eigene Welt. Schwarz, Säuregrün, Diagonalen, Bewegung.
   Greift nur, solange dieser Reiter offen ist.
   ========================================================================== */

html.__unused {
  --canvas: var(--mr-bg);
  --surface: var(--mr-panel);
  --surface-2: var(--mr-panel-2);
  --line: var(--mr-line);
  --line-strong: var(--mr-line-strong);
  --ink: var(--mr-fg);
  --ink-dim: var(--mr-dim);
  --ink-faint: var(--mr-faint);
  --accent: var(--mr-accent);
  --accent-soft: var(--mr-accent-soft);
  --accent-ink: var(--mr-bg);
  color-scheme: dark;
}
html.__unused .masthead { background: color-mix(in srgb, var(--mr-bg) 88%, transparent); border-bottom-color: var(--mr-line); }
html.__unused #nav a[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--mr-accent) 12%, transparent); }

.energy { --nrg: var(--mr-accent); color: var(--mr-fg); }

/* Kopf: schräge Gitterstruktur, riesige kursive Versalien */
.nrg-hero {
  position: relative;
  overflow: hidden;
  margin: -22px -22px 0;
  padding: 64px 26px 52px;
  background: var(--mr-bg);
  border-bottom: 2px solid var(--nrg);
}
.nrg-grid {
  position: absolute;
  inset: -40% -10%;
  background:
    repeating-linear-gradient(115deg, color-mix(in srgb, var(--mr-accent) 16%, transparent) 0 2px, transparent 2px 46px),
    radial-gradient(60% 80% at 20% 0%, color-mix(in srgb, var(--mr-accent) 22%, transparent), transparent 70%);
  transform: skewY(-6deg);
  animation: nrgDrift 14s linear infinite;
}
@keyframes nrgDrift { from { background-position: 0 0, 0 0; } to { background-position: 460px 0, 0 0; } }

.nrg-title {
  position: relative;
  margin: 0;
  font-family: "Anton", "Archivo", system-ui, sans-serif;
  font-size: clamp(48px, 13vw, 132px);
  line-height: .84;
  letter-spacing: -.02em;
  text-transform: uppercase;
  font-style: italic;
  display: flex;
  flex-direction: column;
}
.nrg-title span:first-child { color: var(--mr-strong); }
.nrg-title span:last-child {
  color: var(--nrg);
  text-shadow: 0 0 28px color-mix(in srgb, var(--mr-accent) 55%, transparent);
  margin-left: .12em;
}
.energy .nrg-title span { animation: slamIn 520ms cubic-bezier(.16,1.1,.3,1) backwards; }
.energy .nrg-title span:last-child { animation-delay: 130ms; }
@keyframes slamIn { from { opacity: 0; transform: translateX(-44px) skewX(-12deg); } to { opacity: 1; transform: none; } }

.nrg-claim { position: relative; margin: 20px 0 0; font-size: clamp(15px, 2.4vw, 20px); color: var(--mr-claim); }
.nrg-claim b { color: var(--nrg); }
.nrg-bigprice {
  position: absolute;
  right: 26px;
  bottom: 18px;
  font-family: "Anton", system-ui, sans-serif;
  font-style: italic;
  font-size: clamp(70px, 15vw, 190px);
  line-height: .8;
  color: transparent;
  -webkit-text-stroke: 2px color-mix(in srgb, var(--mr-accent) 50%, transparent);
  pointer-events: none;
  animation: pulseGlow 2.8s ease-in-out infinite;
}
.nrg-bigprice span { font-size: .4em; }
@keyframes pulseGlow { 0%, 100% { opacity: .5; } 50% { opacity: .95; } }

/* Laufband */
.nrg-ticker {
  margin: 0 -22px;
  background: var(--nrg);
  color: var(--mr-on-accent);
  overflow: hidden;
  white-space: nowrap;
  border-bottom: 2px solid var(--mr-on-accent);
}
.nrg-ticker span {
  display: inline-block;
  padding: 9px 0;
  font-family: "Anton", system-ui, sans-serif;
  font-style: italic;
  font-size: 15px;
  letter-spacing: .06em;
  text-transform: uppercase;
  animation: slide 26s linear infinite;
}
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(-33.33%); } }

.nrg-section { margin: 34px 0; }
.nrg-section h3 {
  font-family: "Anton", system-ui, sans-serif;
  font-style: italic;
  text-transform: uppercase;
  font-size: clamp(22px, 4vw, 34px);
  letter-spacing: .01em;
  color: var(--mr-strong);
  margin: 0 0 16px;
  padding-left: 14px;
  border-left: 5px solid var(--nrg);
}

/* Angebote als Dosen-Karten mit Kratzspuren */
.cans { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.can {
  position: relative;
  overflow: hidden;
  padding: 20px 20px 22px;
  background: linear-gradient(160deg, var(--mr-card-a) 0%, var(--mr-panel) 100%);
  border: 1px solid var(--mr-line);
  border-radius: 2px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
  animation: canIn 420ms ease-out backwards;
  animation-delay: calc(var(--i, 0) * 70ms);
  transition: transform 180ms ease, border-color 180ms ease;
}
@keyframes canIn { from { opacity: 0; transform: translateY(16px) skewY(1.5deg); } to { opacity: 1; transform: none; } }
.can:hover { transform: translateY(-4px) scale(1.01); border-color: var(--nrg); }
.can.is-top { border-color: var(--nrg); box-shadow: 0 0 0 1px color-mix(in srgb, var(--mr-accent) 35%, transparent), 0 18px 40px color-mix(in srgb, var(--mr-accent) 12%, transparent); }
.can-claw { position: absolute; top: -10px; right: 12px; display: flex; gap: 7px; opacity: .5; }
.can-claw i {
  display: block;
  width: 3px;
  height: 58px;
  background: linear-gradient(180deg, var(--nrg), transparent);
  transform: skewX(-16deg);
}
.can-claw i:nth-child(2) { height: 74px; }
.can-claw i:nth-child(3) { height: 46px; }
.can.is-top .can-claw { opacity: 1; }
.can-shop {
  font-family: "Anton", system-ui, sans-serif;
  font-style: italic;
  text-transform: uppercase;
  font-size: 19px;
  letter-spacing: .03em;
  color: var(--mr-strong);
}
.can-price {
  font-family: "Anton", system-ui, sans-serif;
  font-style: italic;
  font-size: 52px;
  line-height: 1;
  color: var(--nrg);
  margin: 6px 0 2px;
  text-shadow: 0 0 22px color-mix(in srgb, var(--mr-accent) 35%, transparent);
}
.can-price small { font-size: .42em; margin-left: 4px; }
.can-litre { font-size: 12.5px; color: var(--nrg); opacity: .8; letter-spacing: .04em; text-transform: uppercase; }
.can-desc { margin-top: 10px; font-size: 13.5px; color: var(--mr-desc); line-height: 1.45; }
.can-clock {
  margin-top: 14px;
  display: inline-block;
  font-family: "Anton", system-ui, sans-serif;
  font-style: italic;
  font-size: 14px;
  letter-spacing: .06em;
  color: var(--mr-on-accent);
  background: var(--nrg);
  padding: 3px 10px;
  clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
}
.can-soon { margin-top: 12px; font-size: 12.5px; color: var(--nrg); text-transform: uppercase; letter-spacing: .06em; }

.nrg-map { height: 420px; border: 1px solid var(--mr-line); border-radius: 2px; overflow: hidden; background: var(--mr-panel); }
.nrg-note { font-size: 12px; color: var(--mr-faint); margin: 12px 0 0; letter-spacing: .02em; }
.nrg-empty {
  border: 1px dashed var(--mr-line-strong);
  border-radius: 2px;
  padding: 44px 22px;
  text-align: center;
  color: var(--mr-dim);
}
.nrg-empty code { background: var(--mr-panel-2); padding: 2px 7px; color: var(--nrg); }
.nrg-bolt {
  width: 34px; height: 52px; margin: 0 auto 16px;
  background: var(--nrg);
  clip-path: polygon(58% 0, 20% 54%, 46% 54%, 34% 100%, 82% 40%, 52% 40%);
  animation: flicker 1.1s ease-in-out infinite;
}
@keyframes flicker { 0%, 100% { opacity: 1; transform: scale(1); } 45% { opacity: .35; transform: scale(.94); } }

@media (max-width: 740px) {
  .nrg-hero { margin: -16px -12px 0; padding: 44px 16px 38px; }
  .nrg-ticker { margin: 0 -12px; }
  .nrg-bigprice { display: none; }   /* würde auf schmalen Schirmen den Text überlagern */
  .cans { grid-template-columns: 1fr; }
  .nrg-map { height: 320px; }
}

@media (prefers-reduced-motion: reduce) {
  .nrg-grid, .nrg-ticker span, .nrg-bigprice, .can, .nrg-bolt, .energy .nrg-title span { animation: none; }
  .can:hover { transform: none; }
}

/* Filialliste in den Angebotskarten */
.can-stores { margin-top: 16px; border-top: 1px solid var(--mr-line); padding-top: 12px; }
.cs-head {
  font-family: "Anton", system-ui, sans-serif;
  font-style: italic;
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: .08em;
  color: var(--nrg);
  margin-bottom: 8px;
}
.cs-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.cs-list li { display: flex; align-items: baseline; gap: 10px; font-size: 13px; }
.cs-list a { text-decoration: none; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cs-list a:hover .cs-street { color: var(--nrg); }
.cs-street { color: var(--mr-street); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cs-city { color: var(--mr-faint); font-size: 11.5px; }
.cs-dist {
  font-family: "Anton", system-ui, sans-serif;
  font-style: italic;
  font-size: 12.5px;
  color: var(--nrg);
  opacity: .85;
  white-space: nowrap;
}
.cs-more { margin-top: 7px; font-size: 11.5px; color: var(--mr-faint); }
.cs-none { margin: 0; font-size: 12.5px; color: var(--mr-dim); line-height: 1.5; }
.cs-none a { color: var(--nrg); }
.nrg-sub { margin: -8px 0 16px; color: var(--mr-dim); font-size: 13.5px; }

/* Gesamtliste aller Märkte im Umkreis */
.nrg-all { border: 1px solid var(--mr-line); border-radius: 2px; background: var(--mr-panel); }
.nrg-all > summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  font-family: "Anton", system-ui, sans-serif;
  font-style: italic;
  text-transform: uppercase;
  letter-spacing: .05em;
  font-size: 15px;
  color: var(--mr-strong);
}
.nrg-all > summary::-webkit-details-marker { display: none; }
.nrg-all > summary b { color: var(--nrg); }
.nrg-all[open] > summary { border-bottom: 1px solid var(--mr-line); }
.nrg-all-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px 22px; padding: 18px; }
.nas-group { min-width: 0; }
.nas-name {
  font-family: "Anton", system-ui, sans-serif;
  font-style: italic;
  text-transform: uppercase;
  font-size: 13px;
  letter-spacing: .06em;
  color: var(--nrg);
  margin-bottom: 8px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.nas-name span { color: var(--mr-faint); font-size: 11.5px; }
.nrg-empty-soft { padding: 22px 20px; text-align: left; }
.nrg-empty-soft p { margin: 0; line-height: 1.6; }

/* Eigenständige Seite: Kopf und Laufband über die volle Breite */
.nrg-hero, .nrg-ticker {
  margin-left: calc(50% - 50vw) !important;
  margin-right: calc(50% - 50vw) !important;
}
.nrg-hero { padding-left: max(26px, calc(50vw - 620px + 22px)); padding-right: max(26px, calc(50vw - 620px + 22px)); }
.nrg-bigprice { right: max(26px, calc(50vw - 620px + 22px)); }
body { overflow-x: hidden; }
@media (max-width: 740px) {
  main { padding: 0 12px 40px; }
  .nrg-hero { padding-left: 16px; padding-right: 16px; }
}

/* Als App vom Homebildschirm: Inhalt nicht unter Statusleiste und Home-Balken */
.nrg-hero { padding-top: max(64px, calc(env(safe-area-inset-top) + 40px)); }
main { padding-bottom: max(56px, calc(env(safe-area-inset-bottom) + 24px)); }
@media (max-width: 740px) {
  .nrg-hero { padding-top: max(44px, calc(env(safe-area-inset-top) + 28px)); }
}

/* ---------- Designschalter ---------- */
.mr-switch {
  position: fixed;
  z-index: 50;
  top: calc(env(safe-area-inset-top) + 14px);
  right: calc(env(safe-area-inset-right) + 14px);
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--mr-panel) 78%, transparent);
  border: 1px solid var(--mr-line-strong);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 6px 20px color-mix(in srgb, var(--mr-bg) 40%, transparent);
}
.mr-switch button {
  border: 0;
  background: transparent;
  color: var(--mr-dim);
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .02em;
  padding: 6px 13px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 200ms ease, color 200ms ease;
}
.mr-switch button:hover { color: var(--mr-strong); }
.mr-switch button[aria-pressed="true"] { background: var(--mr-accent); color: var(--mr-on-accent); }
.mr-switch button[data-mr-theme="ultra"][aria-pressed="true"] {
  background: linear-gradient(135deg, #ffffff, #dfe5ea);
  color: #0d1014;
  box-shadow: inset 0 0 0 1px #c3cbd3, 0 0 0 2px color-mix(in srgb, #34b3e4 45%, transparent);
}

/* Farben gleiten beim Umschalten, statt zu springen */
html, body, .nrg-hero, .nrg-ticker, .can, .nrg-all, .nrg-empty, .nrg-map, .nrg-section h3, .can-price, .can-shop, .mr-switch {
  transition: background-color 360ms ease, color 360ms ease, border-color 360ms ease, box-shadow 360ms ease;
}

/* Glanz über die ganze Seite, wie Licht auf einer Dose */
html.mr-switching::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 60;
  pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 48%, rgba(180,225,245,.35) 52%, transparent 65%);
  transform: translateX(-100%);
  animation: mrSheen 760ms ease-out forwards;
}
@keyframes mrSheen { to { transform: translateX(100%); } }

/* Ultra White: helle Oberfläche, silberne Kanten, babyblaue Akzente */
html[data-mr="ultra"] .nrg-hero {
  background:
    radial-gradient(70% 90% at 85% 10%, rgba(52,179,228,.14), transparent 70%),
    linear-gradient(180deg, #ffffff 0%, #f1f4f7 100%);
  border-bottom-color: #c3cbd3;
}
html[data-mr="ultra"] .nrg-grid {
  background:
    repeating-linear-gradient(115deg, rgba(120,132,145,.14) 0 2px, transparent 2px 46px),
    radial-gradient(60% 80% at 20% 0%, rgba(52,179,228,.14), transparent 70%);
}
html[data-mr="ultra"] .nrg-title span:last-child { text-shadow: 0 0 22px rgba(52,179,228,.35); }
html[data-mr="ultra"] .nrg-bigprice { -webkit-text-stroke-color: rgba(120,132,145,.35); }
html[data-mr="ultra"] .can { box-shadow: 0 1px 0 #ffffff inset, 0 8px 24px rgba(20,30,40,.06); }
html[data-mr="ultra"] .can.is-top { box-shadow: 0 0 0 1px rgba(52,179,228,.45), 0 16px 36px rgba(52,179,228,.14); }
html[data-mr="ultra"] .can-price { text-shadow: none; }
html[data-mr="ultra"] .can-claw i { background: linear-gradient(180deg, #9aa4ae, transparent); }
html[data-mr="ultra"] .can.is-top .can-claw i { background: linear-gradient(180deg, var(--mr-accent), transparent); }
html[data-mr="ultra"] .nrg-ticker { background: linear-gradient(90deg, #d9e0e6, #ffffff 30%, #cfe9f5 60%, #ffffff 80%, #d9e0e6); }
/* Auf dem iPhone als App ist die Statuszeile weiß beschriftet:
   darunter ein silberner Dosenrand, damit Uhrzeit und Akku lesbar bleiben */
html[data-mr="ultra"] .nrg-hero::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: env(safe-area-inset-top);
  background: linear-gradient(180deg, #4d555d, #8d959c);
  z-index: 1;
}

@media (max-width: 740px) {
  .mr-switch { top: calc(env(safe-area-inset-top) + 10px); right: calc(env(safe-area-inset-right) + 10px); }
  .mr-switch button { font-size: 11.5px; padding: 5px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  html.mr-switching::after { display: none; }
  html, body, .nrg-hero, .nrg-ticker, .can, .nrg-all, .nrg-empty, .nrg-map, .nrg-section h3, .can-price, .can-shop, .mr-switch { transition: none; }
}

/* Ultra White: kleine Beschriftungen in kräftigerem Blau, damit sie auf Weiß gut lesbar sind */
html[data-mr="ultra"] .can-litre,
html[data-mr="ultra"] .cs-head,
html[data-mr="ultra"] .cs-dist,
html[data-mr="ultra"] .can-soon,
html[data-mr="ultra"] .nas-name,
html[data-mr="ultra"] .nrg-claim b,
html[data-mr="ultra"] .nrg-all > summary b,
html[data-mr="ultra"] .cs-none a { color: #1782b3; opacity: 1; }

</style>
</head>
<body>
<div class="mr-switch" role="group" aria-label="Design wählen">
  <button type="button" data-mr-theme="original">Original</button>
  <button type="button" data-mr-theme="ultra">Ultra White</button>
</div>
<main id="app"></main>
<script>
/* Monster Radar – eigenständige Seite */
(function () {
  'use strict';

  const DAY = 86400000;
  const ANGEBOTE_DIR = 'data/angebote';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dec = (x, d) => (x == null || isNaN(x) ? '–' : x.toFixed(d == null ? 2 : d).replace('.', ','));
  function fmtTime(ts) { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function fmtDate(ts, withYear) {
    const d = new Date(ts);
    const s = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.';
    return withYear ? s + String(d.getFullYear()).slice(2) : s;
  }
  async function fetchJSON(url, opts) {
    const res = await fetch(url, Object.assign({ headers: { Accept: 'application/json' } }, opts || {}));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  /* ---------- Monster: Angebote im Umkreis ---------- */

  const MONSTER = { data: null, error: null, loading: false, map: null, clock: null };

  async function loadMonster() {
    if (MONSTER.data || MONSTER.loading) return;
    MONSTER.loading = true;
    try {
      MONSTER.data = await fetchJSON(`${ANGEBOTE_DIR}/monster.json`, { cache: 'no-cache' });
      for (const o of MONSTER.data.offers || []) {
        if (o.description) o.description = o.description.replace(/\u00ad\s*/g, '');
      }
      MONSTER.error = null;
    } catch (e) {
      MONSTER.error = e;
    }
    MONSTER.loading = false;
    draw();
  }

  function daysLeft(to) {
    if (!to) return null;
    const end = new Date(to + 'T23:59:59').getTime();
    return Math.ceil((end - Date.now()) / DAY);
  }

  function countdownText(to) {
    if (!to) return null;
    const end = new Date(to + 'T23:59:59').getTime();
    let diff = end - Date.now();
    if (diff <= 0) return 'abgelaufen';
    const d = Math.floor(diff / DAY); diff -= d * DAY;
    const h = Math.floor(diff / 3600000); diff -= h * 3600000;
    const m = Math.floor(diff / 60000);
    const sec = Math.floor((diff - m * 60000) / 1000);
    return d > 0 ? `${d} T ${h} Std ${m} Min` : `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  const NORM = (x) => (x || '').toLowerCase().replace(/[^a-zäöüß]/g, '');
  const GENERIC_SHOP = /^(getränkemarkt|getraenkemarkt|getränke|supermarkt|verbrauchermarkt|discounter|markt)$/i;

  function storesFor(retailer) {
    const all = (MONSTER.data && MONSTER.data.stores) || [];
    const key = NORM(retailer);
    if (!key) return [];
    // Sammelname wie "Getränkemarkt": alle Getränkemärkte der Umgebung zeigen
    if (GENERIC_SHOP.test((retailer || '').trim())) {
      return all.filter((st) => /getränke|trinkgut|fristo|dursty|hol ab/i.test(st.name + ' ' + st.retailer));
    }
    const hit = all.filter((st) => {
      const a = NORM(st.retailer), b = NORM(st.name);
      return a === key || b === key || (key.length >= 4 && (a.indexOf(key) >= 0 || b.indexOf(key) >= 0 || key.indexOf(a) >= 0));
    });
    return hit;
  }

  function storeList(o) {
    const list = storesFor(o.retailer);
    const mapSearch = (q) => `https://www.google.com/maps/search/${encodeURIComponent(q)}`;
    if (!list.length) {
      return `<div class="can-stores">
        <div class="cs-head">Filiale finden</div>
        <p class="cs-none">${((MONSTER.data && MONSTER.data.stores) || []).length
          ? `Zu ${esc(o.retailer)} ist in den Kartendaten kein Markt im Umkreis eingetragen.`
          : 'Die Filialdaten fehlen beim letzten Lauf.'}
          <a href="${mapSearch(o.retailer + ' Monheim am Rhein')}" target="_blank" rel="noopener">In Monheim suchen</a> ·
          <a href="${mapSearch(o.retailer + ' Langenfeld')}" target="_blank" rel="noopener">In Langenfeld suchen</a></p>
      </div>`;
    }
    const shown = list.slice(0, 4);
    return `<div class="can-stores">
      <div class="cs-head">${list.length} ${list.length === 1 ? 'Filiale' : 'Filialen'} in der Nähe</div>
      <ul class="cs-list">${shown.map((st) => `<li>
        <a href="https://www.google.com/maps/search/?api=1&query=${st.lat},${st.lon}" target="_blank" rel="noopener">
          <span class="cs-street">${esc(st.street || st.name)}</span>
          <span class="cs-city">${esc(st.zip ? st.zip + ' ' : '')}${esc(st.city || st.near)}</span>
        </a>
        <span class="cs-dist">${dec(st.dist, 1)} km</span>
      </li>`).join('')}</ul>
      ${list.length > shown.length ? `<div class="cs-more">und ${list.length - shown.length} weitere</div>` : ''}
    </div>`;
  }

  function allStoresBlock() {
    const all = (MONSTER.data && MONSTER.data.stores) || [];
    if (!all.length) {
      return `<section class="nrg-section"><h3>Alle Märkte im Umkreis</h3>
        <div class="nrg-empty nrg-empty-soft"><p>Die Filialdaten konnten beim letzten Lauf nicht geladen werden.
        Der Kartendienst hat die Anfrage abgelehnt. Mit dem nächsten Lauf des Jobs „Monster-Angebote“ sollte die Liste wieder da sein.</p></div></section>`;
    }
    const groups = new Map();
    for (const st of all) {
      const key = st.retailer || st.name;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(st);
    }
    const ordered = Array.from(groups.entries()).sort((a, b) => a[1][0].dist - b[1][0].dist);
    return `<section class="nrg-section"><h3>Alle Märkte im Umkreis</h3>
      <p class="nrg-sub">${all.length} Supermärkte und Getränkemärkte rund um beide Orte, nach Kette sortiert, mit Adresse und Entfernung.</p>
      <details class="nrg-all">
        <summary><span>Alle Märkte anzeigen</span><b>${all.length}</b></summary>
        <div class="nrg-all-grid">${ordered.map(([name, list]) => `<div class="nas-group">
          <div class="nas-name">${esc(name)}<span>${list.length}</span></div>
          <ul class="cs-list">${list.slice(0, 8).map((st) => `<li>
            <a href="https://www.google.com/maps/search/?api=1&query=${st.lat},${st.lon}" target="_blank" rel="noopener">
              <span class="cs-street">${esc(st.street || st.name)}</span>
              <span class="cs-city">${esc(st.zip ? st.zip + ' ' : '')}${esc(st.city || st.near)}</span>
            </a><span class="cs-dist">${dec(st.dist, 1)} km</span></li>`).join('')}</ul>
          ${list.length > 8 ? `<div class="cs-more">und ${list.length - 8} weitere</div>` : ''}
        </div>`).join('')}</div>
      </details>
    </section>`;
  }

  function renderMonster() {
    if (MONSTER.error) {
      return `<div class="energy"><header class="nrg-hero"><h2 class="nrg-title"><span>Monster</span><span>Radar</span></h2></header>
        <div class="nrg-empty"><p>Die Angebotsdaten fehlen noch. Sie liegen unter <code>data/angebote/monster.json</code> und werden vom Actions-Job „Monster-Angebote" erzeugt. Starte ihn einmal von Hand.</p></div></div>`;
    }
    if (!MONSTER.data) {
      loadMonster();
      return '<div class="energy"><div class="nrg-empty"><div class="nrg-bolt" aria-hidden="true"></div><p>Prospekte werden durchsucht …</p></div></div>';
    }

    const d = MONSTER.data;
    const today = new Date().toISOString().slice(0, 10);
    const live = d.offers.filter((o) => (!o.to || o.to >= today) && (!o.from || o.from <= today));
    const soon = d.offers.filter((o) => o.from && o.from > today);
    const best = live.length ? live[0] : null;
    const gen = Date.parse(d.generated);

    const ticker = (live.length ? live : soon).map((o) =>
      `${esc(o.retailer)} ${o.price != null ? dec(o.price, 2) + ' €' : ''}${o.pricePerLitre ? ' · ' + dec(o.pricePerLitre, 2) + ' €/l' : ''}`);
    const tickerLine = ticker.length
      ? (ticker.join('   ///   ') + '   ///   ').repeat(3)
      : 'Kein Angebot in Sicht   ///   '.repeat(6);

    const can = (o, idx) => `<article class="can${idx === 0 && live.includes(o) ? ' is-top' : ''}" style="--i:${idx}">
      <div class="can-claw" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="can-shop">${esc(o.retailer)}</div>
      <div class="can-price">${o.price != null ? dec(o.price, 2) : '?'}<small>€</small></div>
      ${o.pricePerLitre ? `<div class="can-litre">${dec(o.pricePerLitre, 2)} € je Liter</div>` : ''}
      <div class="can-desc">${esc(o.description || 'Monster Energy')}</div>
      ${o.to ? `<div class="can-clock" data-until="${esc(o.to)}">${esc(countdownText(o.to) || '')}</div>` : ''}
      ${o.from && o.from > today ? `<div class="can-soon">ab ${fmtDate(Date.parse(o.from + 'T12:00:00'), true)}</div>` : ''}
      ${storeList(o)}
    </article>`;

    const shopsWithDeal = new Set(live.map((o) => o.retailer));
    const stores = (d.stores || []).filter((st) => shopsWithDeal.has(st.retailer));

    return `<div class="energy">
      <header class="nrg-hero">
        <div class="nrg-grid" aria-hidden="true"></div>
        <h2 class="nrg-title"><span>Monster</span><span>Radar</span></h2>
        <p class="nrg-claim">${best
          ? `Gerade am günstigsten: <b>${esc(best.retailer)}</b> für <b>${dec(best.price, 2)} €</b>`
          : 'Gerade zahlt niemand weniger. Nirgends ein Angebot.'}</p>
        ${best ? `<div class="nrg-bigprice" aria-hidden="true">${dec(best.price, 2)}<span>€</span></div>` : ''}
      </header>

      <div class="nrg-ticker" aria-hidden="true"><span>${esc(tickerLine)}</span></div>

      ${live.length ? `<section class="nrg-section"><h3>Aktuelle Angebote</h3>
        <div class="cans">${live.map(can).join('')}</div></section>`
      : '<section class="nrg-section"><div class="nrg-empty"><p>Aktuell ist nirgends Monster im Angebot. Der Radar schaut täglich neu.</p></div></section>'}

      <section class="nrg-section"><h3>Bevorstehende Angebote</h3>
        ${soon.length
          ? `<p class="nrg-sub">Schon in den Prospekten angekündigt, starten aber erst noch.</p>
             <div class="cans">${soon.map((o, i) => can(o, i + 10)).join('')}</div>`
          : `<div class="nrg-empty nrg-empty-soft"><p>Noch keine Aktion für die kommenden Tage angekündigt.
             Die Prospekte für die nächste Woche erscheinen meist ab Samstag; der Radar schaut jeden Morgen nach.
             ${live.length && live[0].to ? `Die aktuellen Angebote laufen bis ${fmtDate(Date.parse(live[0].to + 'T12:00:00'), true)}.` : ''}</p></div>`}
      </section>

      ${allStoresBlock()}

      ${stores.length ? `<section class="nrg-section"><h3>Wo genau</h3>
        <div id="monster-map" class="nrg-map" data-stores='${esc(JSON.stringify(stores))}'></div>
        <p class="nrg-note">${stores.length} Filialen der Ketten mit laufendem Angebot. Karte: OpenStreetMap.</p></section>` : ''}

      <p class="nrg-note">Angebote von marktguru.de, Stand ${gen ? fmtDate(gen, true) + ', ' + fmtTime(gen) + ' Uhr' : 'unbekannt'}. Prospekte können sich ändern, es gilt der Aushang im Markt.</p>
    </div>`;
  }

  function startMonsterClock() {
    if (MONSTER.clock) return;
    MONSTER.clock = setInterval(() => {
      const els = document.querySelectorAll('[data-until]');
      if (!els.length) { clearInterval(MONSTER.clock); MONSTER.clock = null; return; }
      els.forEach((el) => { el.textContent = countdownText(el.dataset.until) || ''; });
    }, 1000);
  }

  /* Karte erst laden, wenn sie gebraucht wird */
  function mountMonsterMap() {
    const el = document.getElementById('monster-map');
    if (!el || el.dataset.ready) return;
    el.dataset.ready = '1';
    const stores = JSON.parse(el.dataset.stores || '[]');
    const start = () => {
      if (!window.L) {
        el.style.height = 'auto';
        el.innerHTML = '<p class="muted" style="padding:16px;margin:0">Die Karte konnte nicht geladen werden. Die Liste oben zeigt alle Angebote.</p>';
        return;
      }
      const map = L.map(el, { scrollWheelZoom: false }).setView([51.10, 6.92], 12);
      // Freie OpenStreetMap-Kacheln, kein Schlüssel nötig. Dunkel werden sie per CSS-Filter.
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap-Mitwirkende', className: 'nrg-tiles'
      }).addTo(map);
      const group = [];
      for (const st of stores) {
        const accent = getComputedStyle(document.documentElement).getPropertyValue('--mr-accent').trim() || '#9dff2e';
        const m = L.circleMarker([st.lat, st.lon], {
          radius: 9, color: accent, fillColor: accent, fillOpacity: .8, weight: 2
        }).addTo(map);
        m.bindPopup(`<b>${esc(st.name)}</b><br>${esc(st.street || '')} ${esc(st.city || '')}`);
        group.push([st.lat, st.lon]);
      }
      if (group.length) map.fitBounds(group, { padding: [30, 30] });
    };
    if (window.L) { start(); return; }
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    js.onload = start;
    js.onerror = start;
    document.head.appendChild(js);
  }


  /* Kein Aktualisieren-Knopf nötig: Beim Zurückkehren in die App wird still
     nachgeladen, wenn die Daten älter als 20 Minuten sind. Das zählt vor allem
     vom Homebildschirm aus, wo es keinen Neu-laden-Knopf des Browsers gibt. */
  const STALE_MS = 20 * 60 * 1000;
  let loadedAt = Date.now();
  async function refreshQuietly() {
    if (Date.now() - loadedAt < STALE_MS) return;
    try {
      const fresh = await fetchJSON(`${ANGEBOTE_DIR}/monster.json`, { cache: 'no-cache' });
      for (const o of fresh.offers || []) {
        if (o.description) o.description = o.description.replace(/\u00ad\s*/g, '');
      }
      MONSTER.data = fresh;
      MONSTER.error = null;
      loadedAt = Date.now();
      draw();
    } catch (e) { /* offline: alte Daten bleiben stehen */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshQuietly(); });
  window.addEventListener('online', refreshQuietly);
  window.addEventListener('pageshow', (e) => { if (e.persisted) refreshQuietly(); });

  /* Designschalter: Original (dunkel) oder Ultra White (hell) */
  const THEME_KEY = 'monsterradar:theme';
  function currentTheme() { return document.documentElement.getAttribute('data-mr') === 'ultra' ? 'ultra' : 'original'; }
  function syncSwitch() {
    document.querySelectorAll('[data-mr-theme]').forEach((b) =>
      b.setAttribute('aria-pressed', String(b.dataset.mrTheme === currentTheme())));
  }
  function setTheme(theme, animate) {
    if (theme === currentTheme()) return;
    const root = document.documentElement;
    if (animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      root.classList.remove('mr-switching');
      void root.offsetWidth;
      root.classList.add('mr-switching');
      setTimeout(() => root.classList.remove('mr-switching'), 800);
    }
    if (theme === 'ultra') root.setAttribute('data-mr', 'ultra'); else root.removeAttribute('data-mr');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'ultra' ? '#eef1f4' : '#05070a');
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    syncSwitch();
    draw();   // Karte mit passender Markierungsfarbe neu aufbauen
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-mr-theme]');
    if (b) setTheme(b.dataset.mrTheme, true);
  });

  function draw() {
    const app = document.getElementById('app');
    app.innerHTML = renderMonster();
    mountMonsterMap();
    startMonsterClock();
    syncSwitch();
  }

  document.addEventListener('DOMContentLoaded', draw);
  if (document.readyState !== 'loading') draw();
})();

</script>
</body>
</html>
